/* ═══ 운영시간·휴관 판독 (festival/index.html 코스 기능과 같은 규칙) ═══ */
    const CT_D = '[월화수목금토일]';

    // 열리는 요일만 돌려준다(예: ['토']). 읽을 수 없으면 null.
    function openOnlyDaysFromText(text) {
        const t = String(text || '').replace(/<[^>]*>/g, ' ');
        if (!t.trim()) return null;

        const re = /매주\s*((?:[월화수목금토일]\s*요일|[월화수목금토일])(?:\s*(?:[·,\/~]|및|와|과)\s*(?:[월화수목금토일]\s*요일|[월화수목금토일]))*)/g;

        while ((m = re.exec(t)) !== null) {

    // playTime이 비어 있는 축제의 상세 페이지 "프로그램" 문구(페이지를 열 때 몇 건만 읽어 둔다).
    const festivalDayTextExtra = {};
    // [ADD] 2026-11-02: "매월 N째 X요일"처럼 TourAPI 운영시간에는 없고 공식 안내로만 확인된 개최 요일(contentid 기준).
    //  - 2786391 광안리 M(Marvelous) 드론 라이트쇼: 매월 첫째·셋째 토요일 (공식 홈페이지 해상 통제 안내 기준)
    const FESTIVAL_NTH_WEEKDAY_RULES = { '2786391': { dow: '토', nth: [1, 3] } };
    // [ADD] 2026-11-03: "프로그램별 상이"처럼 시각 없이 일정이 정해져 있지 않다고만 적힌 행사는 그날 열리는지 알 수 없다.

    // [ADD] 2026-11-03: "14:00 / 17:00 / 20:00", "- 1회차: 10:30 - 2회차: 14:30"처럼 범위 없이 공연 시작 시각만 적힌 행사.

        const times = [];
        let m;
        while ((m = re.exec(t)) !== null) {

    // [ADD] 2026-11-11: 시간을 숫자로 읽지 못한 장소도 "시간 확인 필요"만 띄우지 않고, 적혀 있는 운영 안내를 그대로 보여준다.
    // "- 하절기 20:00, 22:00- 동절기 19:00※ 월요일 휴무"처럼 붙어 있는 글을 " · "로 나눠 읽기 좋게 정리한다(없는 시간을 만들지 않는다).
    function ctCleanInfo(text) {
        let t = String(text || '').replace(/<[^>]*>/g, ' ');

    // 공식 안내로 확인된 소요 시간·요금·회차 등(contentid 기준). TourAPI 운영시간에는 없는 정보만 적는다.
    //  - 3113265 APAP 작품투어: 안양문화예술재단 안내 — 1일 2회(10:30·14:00), 소요 60~90분, 성인 3,000원·청소년 1,000원, ~11/30

    function ctExtraInfo(item) {

    // 회차가 있는 행사는 도착 시각 이후 가장 가까운 회차 시작에 맞춘다(없으면 도착 시각 그대로 — 마감 판정에서 걸러진다).

    function festivalNthWeekdayAllows(item, dowChar, dateObj) {

    function ctDaysOf(s) {

        const clean = String(s).replace(/요일/g, '');   // '월요일'의 '일'을 요일 '일'로 읽지 않도록 먼저 지운다
        for (let i = 0; i < clean.length; i++) if (CT_DAYS.indexOf(clean.charAt(i)) >= 0) out.push(clean.charAt(i));

    // 반환: { closed: ['월', ...], known: true/false }. known=false 면 휴관 요일을 판단할 수 없다는 뜻.
    function closedDaysFromHours(hours) {

    // [ADD] 2026-11-03: 기간 단위 휴관("전시관 리모델링으로 2026-10-19~2027-01-04 임시휴관", "임시휴관 10월19일~27년1월4일")을 읽는다.

    // 날짜 범위(시작~끝, 둘 다 월·일 포함)가 휴관/휴무/휴장/공사/리모델링/보수 말과 바로 붙어 있을 때만 휴관 기간으로 본다.

    //   - 연도가 없으면(예: "12월 24일~26일" 형태는 읽지 않고, "12월 24일~1월 2일"은 읽음) 해마다 반복되는 휴관으로 본다.

    // [ADD] 2026-11-04: 계절 한정 시설(겨울 스케이트장·눈썰매장 등)은 운영 기간 밖의 날짜에는 코스에서 뺀다.

        .then(function (data) { if (timer) clearTimeout(timer); if (data && !data.error) weatherCache[key] = { at: Date.now(), data: data }; return data; })

        if (rows.length) {

}
function placeOk(it, p) {

    if (p === 'out') return t === '실외' || t === '실내외';

    if (cd.known && cd.closed.indexOf(dowChar) >= 0) return false;
    if (ctOutsideOperatingSeason(it.hours, ctx.dateStr)) return false;
    if (ctPeriodClosureOn(it.hours, ctx.dateStr)) return false;
    const win = getItemWindow(it, ctx);
    if (ctx.isToday && win.known && !win.allDay && win.close - getStayMin(it) < ctx.startMin) return false;   // 오늘 이미 문 닫는 곳

        if (String(it.overview || '').length > 80) s += 1.5;
        if (it.desc) s += 1;

function makeCourse(P) {

    const ctx = buildCtx(P.when);
    const place = (P.place === 'any' && P.rain) ? 'in' : P.place;
    let pool = poolFor(ctx, place, P);
    let widened = false;
    if (pool.length < P.n && P.place === 'any' && place === 'in') { pool = poolFor(ctx, 'any', P); widened = true; }
    const rand = mulberry32(P.seed * 7919 + parseInt(P.when.slice(4), 10) + 17);
    const chosen = pickCourse(pool, P.n, rand, ctx, widened ? 'any' : place, P);
    if (P.track && chosen.length) S.seen[chosen[0].contentid] = 1;

        h += '<li><a class="pk-np-item" href="/festival/detail/' + encodeURIComponent(p.contentid) + '.html"><div class="pk-np-top"><div class="pk-np-name">' + esc(p.title) + '</div><div class="pk-np-dist">' + fmtDist(c.km) + '</div></div>' + (p.desc ? '<div class="pk-np-desc">' + esc(p.desc) + '</div>' : '') + '<div class="pk-np-tags">' + tags + '</div></a></li>';
    });
    h += '</ul>';
    box.innerHTML = h; box.style.display = '';
}

/* ═══ 댓글 (장소 상세페이지와 같은 댓글 서버 · 이 페이지 전용 id) ═══ */
const COMMENTS_API = 'https://old-rain-16f7.lyh0929mm.workers.dev/comments';
const CMT_GAME_ID = 'festival-pick';
function cmtEscapeHtml(str) { const d = document.createElement('div'); d.innerText = str; return d.innerHTML; }
function formatCmtTime(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1) return '방금 전';
    if (min < 60) return min + '분 전';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + '시간 전';
    const day = Math.floor(hr / 24);
    if (day < 7) return day + '일 전';
    return new Date(ts).toLocaleDateString('ko-KR');
}
async function loadComments() {
    const list = document.getElementById('cmt-list');
    try {
        const res = await fetch(COMMENTS_API + '?game_id=' + CMT_GAME_ID);
        const data = await res.json();
        if (!data.comments || data.comments.length === 0) {
            list.innerHTML = '<div class="pk-cmsg">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</div>';
            return;
        }
        list.innerHTML = data.comments.map(function (c) {
            return '<div style="padding:12px 14px;background:#f8fafc;border-radius:12px">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
                '<span style="font-weight:800;font-size:13px;color:#334155">' + cmtEscapeHtml(c.nickname) + '</span>' +
                '<span style="font-size:11px;color:#94a3b8">' + formatCmtTime(c.created_at) + '</span></div>' +
                '<div style="font-size:14px;color:#475569;line-height:1.6;word-break:break-word">' + cmtEscapeHtml(c.content) + '</div></div>';
        }).join('');
    } catch (e) {
        list.innerHTML = '<div class="pk-cmsg" style="color:#f87171">댓글을 불러오지 못했어요.</div>';
    }
}
async function submitComment() {
    const nicknameEl = document.getElementById('cmt-nickname');
    const contentEl = document.getElementById('cmt-content');
    const statusEl = document.getElementById('cmt-status');
    const btn = document.getElementById('cmt-submit');
    const nickname = nicknameEl.value.trim();
    const content = contentEl.value.trim();
    if (!nickname || !content) { statusEl.textContent = '닉네임과 댓글을 모두 입력해주세요'; statusEl.style.color = '#f87171'; return; }
    btn.disabled = true; statusEl.textContent = '등록 중...'; statusEl.style.color = '#94a3b8';
    try {
        const res = await fetch(COMMENTS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game_id: CMT_GAME_ID, nickname: nickname, content: content }) });
        const data = await res.json();
        if (!res.ok) { statusEl.textContent = data.error || '등록에 실패했어요'; statusEl.style.color = '#f87171'; btn.disabled = false; return; }
        contentEl.value = ''; statusEl.textContent = '등록됐어요!'; statusEl.style.color = '#22c55e';
        await loadComments();
        setTimeout(function () { statusEl.textContent = ''; btn.disabled = false; }, 30000);
    } catch (e) {
        statusEl.textContent = '네트워크 오류가 발생했어요'; statusEl.style.color = '#f87171'; btn.disabled = false;
    }
}

/* ═══ 동작 ═══ */
function toast(msg) {
    const t = document.getElementById('pk-toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function setAnswer(step, val) {
    if (step === 'when') S.when = val;
    else if (step === 'where') S.where = { key: val };
    else if (step === 'place') S.place = val;
    else if (step === 'cost') S.cost = val;
    else if (step === 'n') S.n = parseInt(val, 10);
}
function afterAnswer(step) {
    invalidate();
    S.open = null;
    if (step === 'where' || step === 'when') { render(); refreshWeather(); return; }
    render();
    if (allAnswered()) scrollToEl('#pk-res');
}
function useMyLocation(then) {
    if (!navigator.geolocation) { toast('이 기기에서는 위치를 가져올 수 없어요. 지역을 직접 골라주세요.'); return; }
    toast('위치를 확인하는 중…');
    navigator.geolocation.getCurrentPosition(function (pos) {
        then({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    }, function () { toast('위치를 가져오지 못했어요. 지역을 직접 골라주세요.'); }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
}
function setNear(loc) {
    S.where = { near: { lat: loc.lat, lng: loc.lng } };
    afterAnswer('where');
}
function sharedCourse() {
    const ctx = buildCtx(S.shared.d);
    const list = S.shared.ids.map(itemById).filter(Boolean);
    return { sched: list.length ? scheduleCourseItems(list, ctx) : [], ctx: ctx, poolSize: list.length, place: 'any', widened: false };
}
function courseUrl() {
    const c = S.course;
    return location.origin + '/festival/pick.html?d=' + c.ctx.dateStr + '&ids=' + c.sched.map(function (r) { return encodeURIComponent(r.item.contentid); }).join(',');
}
// 지도 페이지(/festival/)가 이 코스를 번호 핀으로 바로 보여주는 주소: ?region=…&date=…&pick=id,id,…
function mapUrl() {
    const c = S.course, first = c.sched[0].item;
    return '/festival/?' + (first._rk ? 'region=' + first._rk + '&' : '') + 'date=' + c.ctx.dateStr + '&pick=' + c.sched.map(function (r) { return encodeURIComponent(r.item.contentid); }).join(',');
}
function courseText() {
    const c = S.course;
    const lines = c.sched.map(function (r, i) { return (i + 1) + '. ' + r.item.title + ' (' + ctFmtApprox(r.start) + '~)'; });
    return '[' + ctDateLabel(c.ctx.dateStr) + ' 아이랑 나들이 코스]\n' + lines.join('\n');
}
function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
    return new Promise(function (res, rej) {
        try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); ok ? res() : rej(); } catch (e) { rej(e); }
    });
}
function fallbackShare(url, text) {
    if (navigator.share) { navigator.share({ title: '오늘 아이랑 나들이 코스', text: text, url: url }).catch(function () {}); return; }
    copyText(text + '\n' + url).then(function () { toast('링크를 복사했어요. 붙여넣어 보내세요.'); }, function () { window.prompt('아래 링크를 복사해 보내세요', url); });
}
function shareKakao() {
    const url = courseUrl(), text = courseText();
    try {
        if (window.Kakao && Kakao.isInitialized() && Kakao.Share && Kakao.Share.sendDefault) {
            const first = S.course.sched[0].item;
            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: { title: '오늘 아이랑 나들이 코스', description: text.replace(/^\[[^\]]*\]\n/, '').replace(/\n/g, ' / '), imageUrl: first.image || 'https://hohoplaylab.com/data/festival-og-banner.png', link: { mobileWebUrl: url, webUrl: url } },
                buttons: [{ title: '코스 보기', link: { mobileWebUrl: url, webUrl: url } }]
            });
            return;
        }
    } catch (e) {}
    fallbackShare(url, text);
}

/* 한 줄 입력 해석 */
function parseSay(q) {
    const r = {}; let any = false;
    const t = ctKstTodayStr();
    if (/오늘/.test(q)) { r.when = t; }
    else if (/내일/.test(q)) { r.when = ctShiftDate(t, 1); }
    else if (/모레/.test(q)) { r.when = ctShiftDate(t, 2); }
    else if (/일요일|일욜/.test(q)) { r.when = ctNextDow(0); }
    else if (/토요일|토욜|주말/.test(q)) { r.when = ctNextDow(6); }
    if (/내\s*(위치|근처)|근처|주변|가까운/.test(q)) r.near = true;
    else {
        for (let i = 0; i < REGIONS.length && !r.where; i++) {
            const R = REGIONS[i];
            if (q.indexOf(R.l) >= 0 || R.kw.some(function (k) { return q.indexOf(k) >= 0; })) r.where = R.k;
        }
    }
    if (/실내|비\s*(오|와|가|올)|우천|비오/.test(q)) r.place = 'in';
    else if (/야외|밖에|산책|숲|공원/.test(q)) r.place = 'out';
    else if (/상관\s*없/.test(q)) r.place = 'any';
    if (/무료|공짜/.test(q)) r.cost = 'free'; else if (/유료/.test(q)) r.cost = 'paid';
    let m;
    if ((m = q.match(/([1-3])\s*곳/))) r.n = parseInt(m[1], 10);
    else if ((m = q.match(/(한|두|세)\s*곳/))) r.n = { '한': 1, '두': 2, '세': 3 }[m[1]];
    else if (/하루\s*종일/.test(q)) r.n = 3; else if (/반나절/.test(q)) r.n = 2; else if (/잠깐|가볍게|짧게/.test(q)) r.n = 1;
    return r;
}
function applySay(q) {
    const r = parseSay(q);
    const keys = Object.keys(r);
    if (!keys.length) { toast('이해하지 못했어요. 아래 질문으로 골라주세요.'); return; }
    invalidate();
    if (r.when) S.when = r.when;
    if (r.where) S.where = { key: r.where };
    if (r.place) S.place = r.place;
    if (r.cost) S.cost = r.cost;
    if (r.n) S.n = r.n;
    S.open = null;
    if (r.near) { useMyLocation(function (loc) { setNear(loc); }); }
    render();
    if (S.where && !S.where.near) refreshWeather();
}
function resetAll() {
    S.when = S.where = S.place = S.cost = S.n = null; S.open = null; invalidate();
    document.getElementById('pk-say-in').value = '';
    render();
    scrollToEl('.pk-sub');
}

document.addEventListener('click', function (e) {
    const b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    const act = b.getAttribute('data-act');
    if (act === 'pick') { setAnswer(b.getAttribute('data-step'), b.getAttribute('data-val')); afterAnswer(b.getAttribute('data-step')); }
    else if (act === 'toggle') { const st = b.getAttribute('data-step'); S.open = (S.open === st && S[st]) ? null : st; S.course = null; render(); }
    else if (act === 'near') { useMyLocation(setNear); }
    else if (act === 'myloc-weather') { useMyLocation(function (loc) { W.pendingWhere = { near: { lat: loc.lat, lng: loc.lng } }; refreshWeather({ pt: { lat: roundCoord(loc.lat), lng: roundCoord(loc.lng) }, label: '내 위치 근처' }); }); }
    else if (act === 'rainin') {
        if (!S.when) S.when = W.dateStr || defaultDate();
        if (!S.where && W.pt && W.pendingWhere) S.where = W.pendingWhere;
        S.place = 'in'; invalidate(); S.open = null; render(); scrollToEl('#pk-root');
    }
    else if (act === 'again') { S.seed++; S.course = makeCourse(); render(); scrollToEl('#pk-res'); }
    else if (act === 'reset') resetAll();
    else if (act === 'kakao') shareKakao();
    else if (act === 'copy') { copyText(courseText() + '\n' + courseUrl()).then(function () { toast('코스와 링크를 복사했어요.'); }, function () { window.prompt('아래 링크를 복사해 보내세요', courseUrl()); }); }
});
document.addEventListener('change', function (e) {
    const t = e.target;
    if (t && t.id === 'pk-date' && t.value) {
        const d = t.value.replace(/-/g, '');
        if (d >= ctKstTodayStr()) { setAnswer('when', d); afterAnswer('when'); }
    } else if (t && t.getAttribute && t.getAttribute('data-act') === 'rem') {
        if (t.checked) { lsSet('pk_remember', '1'); saveWhere(S.where || W.pendingWhere); toast('이 지역을 기억할게요. 끄면 바로 지워져요.'); }
        else {
            lsSet('pk_remember', '0'); lsDel('pk_w');
            if (!S.where) { weatherSeq++; W.pt = null; W.pendingWhere = null; W.state = 'none'; renderWeather(); render(); }
            toast('지역 기억을 껐어요.');
        }
    } else if (t && t.getAttribute && t.getAttribute('data-act') === 'chk') {
        const st = checkState(); st[t.getAttribute('data-key')] = t.checked ? 1 : 0; lsSet('pk_check', JSON.stringify(st));
    }
});
document.getElementById('pk-say').addEventListener('submit', function (e) { e.preventDefault(); const v = document.getElementById('pk-say-in').value.trim(); if (v) applySay(v); });

/* ═══ 시작 ═══ */
function init(list) {
    items = list.filter(function (it) { return it && it.lat && it.lng && it.title && !/^인천공항$/.test(String(it.title).trim()); }).map(function (it) { it.type = 'kids'; it._rk = regionOfAddr(it.addr); return it; });
    coordUsage = new Map();
    items.forEach(function (it) { const k = it.lat + ',' + it.lng; coordUsage.set(k, (coordUsage.get(k) || 0) + 1); });
    const qs = new URLSearchParams(location.search);
    const ids = (qs.get('ids') || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return /^[A-Za-z0-9_-]+$/.test(s); });
    if (ids.length) {
        let d = (qs.get('d') || '').replace(/\D/g, '');
        if (d.length !== 8 || d < ctKstTodayStr()) d = defaultDate();
        S.shared = { d: d, ids: ids.slice(0, 6) };
        S.when = d;
        const first = itemById(ids[0]);
        if (first && first._rk) { S.where = { key: first._rk }; }
        render();
        if (S.where) refreshWeather();
        return;
    }
    // 열자마자 날씨 알림: 저번에 고른 지역이 있으면 그 지역의 비 예보를 바로 보여준다.
    render();
    let saved = null;
    if (isRemember()) { try { saved = JSON.parse(lsGet('pk_w') || 'null'); } catch (e) {} }
    else lsDel('pk_w');   // 예전 버전이 저장해 둔 지역이 있으면 지운다(이제는 켠 사람만 기억)
    if (saved && saved.key && REGION_BY_KEY[saved.key]) {
        const pt = weatherPointOfRegion(saved.key);
        if (pt) { W.pendingWhere = { key: saved.key }; refreshWeather({ pt: pt, label: REGION_BY_KEY[saved.key].l }); }
    } else if (saved && saved.near && isFinite(saved.near.lat)) {
        W.pendingWhere = { near: saved.near };
        refreshWeather({ pt: { lat: roundCoord(saved.near.lat), lng: roundCoord(saved.near.lng) }, label: '내 위치 근처' });
    } else { renderWeather(); }
}

loadFestivals();
fetch('/data/kids_places.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function (data) { init(Array.isArray(data) ? data : (data.places || [])); })
    .catch(function () { document.getElementById('pk-root').innerHTML = '<div class="pk-empty">장소 정보를 불러오지 못했어요. 잠시 뒤 다시 열어 보시거나 <a href="/festival/">아이랑 나들이 지도</a>를 이용해 주세요.</div>'; });
</script>
