<script>
(function () {
  'use strict';

  // ---------- 설정 ----------
  var LONG_DAYS = 120;      // 이 일수보다 길게 이어지는 행사는 '상설·장기'로 따로 모은다
  var SOON_DAYS = 45;       // 시작까지 이 일수 이내면 '곧 시작', 넘으면 '이후 예정'
  var DEADLINE_DAYS = 3;    // 마감까지 이 일수 이내면 '마감 임박'
  var PAST_KEEP_DAYS = 30;  // 종료 후 이 일수까지만 '지난 행사'에 보여준다

  var REGION_SHORT = {
    '서울특별시': '서울', '서울': '서울', '경기도': '경기', '인천광역시': '인천', '부산광역시': '부산', '대구광역시': '대구',
    '대전광역시': '대전', '울산광역시': '울산', '세종특별자치시': '세종', '강원특별자치도': '강원', '강원도': '강원',
    '충청북도': '충북', '충청남도': '충남', '전북특별자치도': '전북', '전라북도': '전북', '전라남도': '전남',
    '전남광주통합특별시': '광주·전남', '광주광역시': '광주·전남', '경상북도': '경북', '경상남도': '경남', '제주특별자치도': '제주'
  };
  // 지역·주제 버튼에 쓰는 이모지. 지역은 전체 + 16곳을 항상 모두 보여주고(건수가 0이면 흐리게), 주제는 전체 + 8개를 보여준다.
  var REGIONS = [
    ['서울', '🗼'], ['경기', '🏰'], ['인천', '✈️'], ['부산', '🌊'], ['대구', '🍎'], ['대전', '🔬'], ['울산', '🐋'], ['세종', '🏛️'],
    ['강원', '⛰️'], ['충북', '🌄'], ['충남', '🌾'], ['전북', '🍚'], ['광주·전남', '🎨'], ['경북', '🏯'], ['경남', '⛵'], ['제주', '🍊']
  ];
  var THEMES = [
    { key: 'night',   emoji: '🌙', name: '야경·불빛',   re: /불꽃|드론|라이트|빛|야간|나이트|밤길|초롱|불빛|별빛|크리스마스/ },
    { key: 'food',    emoji: '🍜', name: '먹거리·마켓', re: /먹거리|푸드|디저트|떡볶이|보쌈|김치|홍탁|술|쌀|사과|마켓|누들|국수|미식|커피|맥주|와인/ },
    { key: 'show',    emoji: '🎵', name: '공연·전시',   re: /공연|연극|콘서트|음악|뮤직|라이브|마이크|국악|비엔날레|전시|사진|예술|매직|극장|아트|페인터즈/ },
    { key: 'history', emoji: '🏛️', name: '전통·역사',   re: /전통|의식|궁|역사|문화제|민속|풍물|봉수|파수|수문장|왕가|도자기|박물|문화유산/ },
    { key: 'family',  emoji: '👨‍👩‍👧', name: '가족·아이', re: /어린이|청소년|가족|키즈|쏙쏙|동물|펫|우주|피크닉|보드게임|게임|체험/ },
    { key: 'move',    emoji: '🏃', name: '걷기·러닝',   re: /러닝|마라톤|런트립|RUN|걷기|트래킹|트레킹|쉬엄쉬엄|걷는/ },
    { key: 'nature',  emoji: '🍁', name: '계절·자연',   re: /얼음|산천어|송어|눈|겨울|단풍|은행나무|꽃|정원|섬|억새|호수/ },
    { key: 'expo',    emoji: '🛍️', name: '박람회·쇼핑', re: /박람회|페어|Fair|세일|기념품|엑스포|페스타|대축제/ }
  ];
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  // ---------- 날짜 유틸 (한국 시간 기준, 'YYYYMMDD' 문자열 ↔ 일수) ----------
  function dayNum(ymd) {
    var s = String(ymd || '');
    if (!/^\d{8}$/.test(s)) return NaN;
    return Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)) / 86400000);
  }
  var kst = new Date(Date.now() + 9 * 3600 * 1000);
  var TODAY = Math.floor(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) / 86400000);
  var TODAY_YEAR = kst.getUTCFullYear();
  function dayParts(n) { var d = new Date(n * 86400000); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay() }; }
  function fmt(n) {
    var p = dayParts(n);
    return (p.y !== TODAY_YEAR ? String(p.y).slice(2) + '.' : '') + p.m + '.' + p.d + '(' + WEEK[p.w] + ')';
  }
  function fmtRange(a, b) { return a === b ? fmt(a) : fmt(a) + ' ~ ' + fmt(b); }
  // 이번 주말(토·일) 범위. 오늘이 주말이면 오늘부터 일요일까지.
  var todayW = dayParts(TODAY).w;
  var WK_START, WK_END;
  if (todayW === 0) { WK_START = TODAY; WK_END = TODAY; }
  else if (todayW === 6) { WK_START = TODAY; WK_END = TODAY + 1; }
  else { WK_START = TODAY + (6 - todayW); WK_END = WK_START + 1; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function httpsUrl(u) { u = String(u || '').trim(); if (u.indexOf('http://') === 0) u = 'https://' + u.slice(7); return u.indexOf('https://') === 0 ? u : ''; }
  function regionOf(addr) { var t = String(addr || '').trim().split(/\s+/)[0] || ''; return REGION_SHORT[t] || t || '기타'; }
  function themesOf(title) { var r = []; THEMES.forEach(function (t) { if (t.re.test(title)) r.push(t.key); }); return r; }

  // ---------- 데이터 정리 ----------
  var items = [], state = { region: '전체', theme: '전체' };

  function prepare(raw) {
    return raw.filter(function (x) { return x && x.type === 'festival' && x.title && x.contentid; }).map(function (x) {
      var s = dayNum(x.startDate), e = dayNum(x.endDate);
      if (isNaN(s) || isNaN(e)) return null;
      if (e < s) { var t = s; s = e; e = t; }
      var long = (e - s + 1) > LONG_DAYS;
      return { id: x.contentid, title: String(x.title).trim(), s: s, e: e, long: long, img: httpsUrl(x.image),
               region: regionOf(x.addr), themes: themesOf(String(x.title)) };
    }).filter(Boolean);
  }
  function status(it) { return it.e < TODAY ? 'ended' : (it.s > TODAY ? 'upcoming' : 'ongoing'); }

  function badge(it) {
    var st = status(it), left = it.e - TODAY;
    if (it.long && st === 'ongoing') return { t: '상설·장기', c: 'long' };
    if (st === 'ongoing') {
      if (left === 0) return { t: '오늘까지', c: 'hot' };
      if (left <= DEADLINE_DAYS) return { t: left + '일 남음', c: 'hot' };
      return { t: '진행 중', c: 'now' };
    }
    if (st === 'upcoming') { var d = it.s - TODAY; return { t: d === 1 ? '내일 시작' : d + '일 뒤 시작', c: 'soon' }; }
    return { t: '종료', c: '' };
  }

  // 구간 나누기: 위에서부터 처음 맞는 한 곳에만 넣는다(같은 행사가 두 번 나오지 않게).
  var SECTIONS = [
    { id: 'deadline', title: '⏰ 오늘까지! 놓치면 끝', desc: '오늘부터 ' + DEADLINE_DAYS + '일 안에 끝나는 행사예요.',
      test: function (it) { return !it.long && status(it) === 'ongoing' && it.e - TODAY <= DEADLINE_DAYS; }, sort: function (a, b) { return a.e - b.e || a.s - b.s; } },
    { id: 'weekend', title: '🎈 이번 주말', desc: function () { return fmtRange(WK_START, WK_END) + '에 만날 수 있는 행사예요.'; },
      test: function (it) { return !it.long && it.s <= WK_END && it.e >= WK_START && it.e >= TODAY; }, sort: function (a, b) { return a.e - b.e || a.s - b.s; } },
    { id: 'ongoing', title: '🟢 지금 진행 중', desc: '이미 시작해서 열리고 있는 행사예요.',
      test: function (it) { return !it.long && status(it) === 'ongoing'; }, sort: function (a, b) { return a.e - b.e || a.s - b.s; } },
    { id: 'soon', title: '🔜 곧 시작해요', desc: SOON_DAYS + '일 안에 시작하는 행사예요.',
      test: function (it) { return !it.long && status(it) === 'upcoming' && it.s - TODAY <= SOON_DAYS; }, sort: function (a, b) { return a.s - b.s || a.e - b.e; } },
    { id: 'later', title: '📅 이후 예정', desc: '시작까지 조금 더 남은 행사예요.',
      test: function (it) { return !it.long && status(it) === 'upcoming'; }, sort: function (a, b) { return a.s - b.s || a.e - b.e; } },
    { id: 'long', title: '🏷 상설·장기 운영', desc: '일정이 길게 이어지는 상설 행사나 시즌 행사예요.',
      test: function (it) { return it.long && status(it) !== 'ended'; }, sort: function (a, b) { return a.e - b.e || a.title.localeCompare(b.title, 'ko'); } }
  ];

  // ---------- 그리기 ----------
  function cardHtml(it, lazy) {
    var b = badge(it);
    var photo = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.title) + ' 사진" ' + (lazy ? 'loading="lazy" ' : '') + 'decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'pz-none\');this.remove()">'
      : '';
    return '<a class="pz-card" href="/festival/detail/' + esc(it.id) + '.html">' +
      '<div class="pz-photo' + (it.img ? '' : ' pz-none') + '">' + (b.c ? '<span class="pz-badge ' + b.c + '">' + esc(b.t) + '</span>' : '') + photo + '</div>' +
      '<div class="pz-body"><h3 class="pz-title">' + esc(it.title) + '</h3>' +
      '<p class="pz-meta"><span>' + esc(it.region) + '</span><span>' + esc(it.long && it.e - it.s > 330 ? '연중 운영' : fmtRange(it.s, it.e)) + '</span></p></div></a>';
  }
  // 원형 이모지 버튼 하나. 건수가 0이면 흐리게(눌러도 되지만 결과가 없다는 뜻).
  function optHtml(emoji, label, count, pressed, attr, val) {
    return '<button type="button" class="pz-opt' + (count === 0 && !pressed ? ' pz-zero' : '') + '" ' + attr + '="' + esc(val) + '" aria-pressed="' + pressed + '">' +
      '<span class="pz-circ" aria-hidden="true">' + emoji + '<span class="pz-ocnt">' + count + '</span></span><span class="pz-olabel">' + esc(label) + '</span></button>';
  }
  function matches(it) {
    if (state.region !== '전체' && it.region !== state.region) return false;
    if (state.theme !== '전체' && it.themes.indexOf(state.theme) < 0) return false;
    return true;
  }
  function render() {
    var live = items.filter(function (it) { return status(it) !== 'ended'; });
    // 건수: 지역은 현재 주제 선택을, 주제는 현재 지역 선택을 반영한다
    var byTheme = live.filter(function (it) { return state.theme === '전체' || it.themes.indexOf(state.theme) >= 0; });
    var rc = {}; byTheme.forEach(function (it) { rc[it.region] = (rc[it.region] || 0) + 1; });
    var known = {}; REGIONS.forEach(function (r) { known[r[0]] = 1; });
    var regionList = [['전체', '🗺️', byTheme.length, '전체']];
    REGIONS.forEach(function (r) { regionList.push([r[0], r[1], rc[r[0]] || 0, r[0]]); });
    Object.keys(rc).forEach(function (n) { if (!known[n]) regionList.push([n, '📍', rc[n], n]); });   // 목록에 없는 지역이 나오면 뒤에 덧붙임
    var rh = '';
    regionList.forEach(function (r) { rh += optHtml(r[1], r[0], r[2], state.region === r[3], 'data-region', r[3]); });
    document.getElementById('pz-regions').innerHTML = rh;

    var byRegion = live.filter(function (it) { return state.region === '전체' || it.region === state.region; });
    var th = optHtml('🎪', '전체', byRegion.length, state.theme === '전체', 'data-theme', '전체');
    THEMES.forEach(function (t) {
      var n = byRegion.filter(function (it) { return it.themes.indexOf(t.key) >= 0; }).length;
      th += optHtml(t.emoji, t.name, n, state.theme === t.key, 'data-theme', t.key);
    });
    document.getElementById('pz-themes').innerHTML = th;

    var shown = live.filter(matches), used = {}, html = '', n = 0;
    SECTIONS.forEach(function (sec) {
      var list = shown.filter(function (it) { return !used[it.id] && sec.test(it); }).sort(sec.sort);
      if (!list.length) return;
      list.forEach(function (it) { used[it.id] = 1; });
      var desc = typeof sec.desc === 'function' ? sec.desc() : sec.desc;
      html += '<section class="pz-sec" id="sec-' + sec.id + '"><h2>' + esc(sec.title) + '<small>' + list.length + '곳</small></h2><p class="pz-desc">' + esc(desc) + '</p><div class="pz-grid">' +
        list.map(function (it) { var lazy = n++ >= 6; return cardHtml(it, lazy); }).join('') + '</div></section>';
    });
    if (!html) html = '<div class="pz-empty">조건에 맞는 축제가 없어요. 지역이나 주제를 바꿔 보세요.</div>';

    var past = items.filter(function (it) { return status(it) === 'ended' && TODAY - it.e <= PAST_KEEP_DAYS && matches(it); }).sort(function (a, b) { return b.e - a.e; });
    if (past.length) {
      html += '<details class="pz-past"><summary>지난 행사 ' + past.length + '곳</summary><ul>' + past.map(function (it) {
        return '<li><a href="/festival/detail/' + esc(it.id) + '.html">' + esc(it.title) + '</a><span>' + esc(it.region) + ' · ' + esc(fmtRange(it.s, it.e)) + '</span></li>';
      }).join('') + '</ul></details>';
    }
    document.getElementById('pz-main').innerHTML = html;
    document.getElementById('pz-sub').textContent = fmt(TODAY) + ' 기준 · 진행 중이거나 예정된 축제 ' + live.length + '곳' + (shown.length !== live.length ? ' 중 ' + shown.length + '곳' : '');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.pz-opt') : null;
    if (!b) return;
    if (b.hasAttribute('data-region')) state.region = b.getAttribute('data-region');
    else if (b.hasAttribute('data-theme')) state.theme = b.getAttribute('data-theme');
    render();
  });

  fetch('/data/festivals.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function (data) { items = prepare(Array.isArray(data) ? data : []); render(); })
    .catch(function () {
      document.getElementById('pz-sub').textContent = '';
      document.getElementById('pz-main').innerHTML = '<div class="pz-empty">축제 정보를 불러오지 못했어요. 잠시 뒤 다시 열어 보시거나 <a href="/festival/list.html">전체 목록</a>을 이용해 주세요.</div>';
    });
})();
</script>

<script>
    fetch('/footer.html')
        .then(function (res) { return res.text(); })
        .then(function (html) {
            var footerEl = document.getElementById('site-footer');
            footerEl.innerHTML = html;
            footerEl.querySelectorAll('script').forEach(function (oldScript) {
                var newScript = document.createElement('script');
                if (oldScript.src) newScript.src = oldScript.src;
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        })
        .catch(function () { /* 푸터 로드 실패해도 본문 표시엔 영향 없음 */ });
</script>
</body>
</html>
