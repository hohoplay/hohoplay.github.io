<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">두여해수욕장</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 태안군 안면읍 정당리</p>

<a href="https://map.kakao.com/link/map/%EB%91%90%EC%97%AC%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,36.5419475153,126.3297105565" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">지리적 형상이 좋고 나무가 우거져 도인들이 도를 닦던 마을이라 하여 ‘도여’라고 불렀으며, 현재는 ‘두여’라 불리고 있다. 울창한 송림 앞에는 충청남도로부터 민박마을로 지정될 만큼 수많은 민박업소가 즐비하며, 넓고 고운 백사장과 왼쪽엔 종주려라는 바위섬이 있어 천혜의 해변이 펼쳐져 있다. 특히 경사가 완만하여 수영하기에 안전하고 수온이 높아 늦은 여름까지 해수욕이 가능하다.</div>
