<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">호수산장캠핑장은 경기도 여주시 가남읍에 있다. 영동고속도로 이천 IC에서 이천, 장호원 방향으로 10분 정도면 도착한다. 이곳은 조경 전문가인 캠핑장 대표가 조성한 캠핑장이다. 오토캠핑장 50면이 있는데, 사이트 간 간격이 굉장히 넓다. 일행들과 어울리기 위해 텐트를 붙여 설치하는 경우를 제외하면 프라이빗 한 캠핑이 가능하다. 여름에는 우거진 나무가 그늘을 만들어 캠핑하기 좋다.</div>
