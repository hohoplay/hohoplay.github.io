<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">도남지</h1>
<p class="detail-row"><strong>주소</strong> 대구광역시 북구 도남동</p>

<a href="https://map.kakao.com/link/map/%EB%8F%84%EB%82%A8%EC%A7%80,35.9706446156,128.5911241354" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">도남지는 대구시 북구 도남동의 작은 저수지이다. 루어낚시로 베스를 낚을 수 있어 민물낚시를 즐기는 사람들 사이에서 유명한 곳이다. 베스뿐만 아니라 많은 수의 올챙이들도 볼 수 있다. 도남지는 낚시를 목적으로 방문하는 사람들도 많지만 주변 음식점이나 카페에 들렀다가 산책 삼아 풍경을 감상하러 오는 관광객들도 많다. 도남지는 북대구 IC와 칠곡 IC에서 가까운 거리에 위치했다. 주변 관광지로는 신전 뮤지엄, 하중도 등이 있다.</div>
