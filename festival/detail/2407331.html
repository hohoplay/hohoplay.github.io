<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">백사장항</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 태안군 안면읍 창기리</p>

<a href="https://map.kakao.com/link/map/%EB%B0%B1%EC%82%AC%EC%9E%A5%ED%95%AD,36.5856477980,126.3155106953" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">안면읍 창기리에 있는 어항으로 넓게 펼쳐져 있는 포구 주변으로 횟집들이 바다를 둘러싸듯이 자리 잡고 있으며, 포구 옆으로는 백사장해수욕장이 있다. 포구 앞으로는 소규모의 어선들이 줄줄이 매달려 있어 해안마을의 정겨운 풍경을 볼 수 있다. 주로 우럭, 노래미, 농어, 대하 등의 어종이 잡히며 그중 가장 유명한 것이 대하이다. 해마다 9월 말~11월 초에 대하축제가 열리는데, 전국 각지에서 이곳 대하를 맛보기 위하여 관광객들이 많이 찾아온다.</div>
