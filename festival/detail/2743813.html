<p class="detail-row"><strong>주소</strong> 충청남도 공주시 반포면 수목원길 25</p>

<a href="https://map.kakao.com/link/map/%EC%9D%B4%EC%95%88%EC%88%B2%EC%86%8D%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,36.4231984717,127.2004409178" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">이안 숲 속 오토캠핑장은 충남 공주시 반포면 아늑한 숲 속에 위치해 있다. 피톤치드 가득한 캠핑장은 펜션과 카라반 글램핑장으로 구분돼 있고 잔디와 파쇄석 사이트까지 다양한 숙박 형태를 선택할 수 있다. 캠핑장 내부엔 공룡 체험장, 동물원, 눈썰매장, 허브마을, 폭포, 포토존, 피크닉존, 수영장 등 계절별로 즐길 거리를 마련해 뒀고 글램핑과 카라반엔 일상생활에 필요한 모든 것들이 준비돼 있다.</div>
