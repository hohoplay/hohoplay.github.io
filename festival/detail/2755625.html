<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평군에 위치한 케이 캠핑장은 삼림으로 가득한 울창한 휴양림과 자연수림 산책로가 잘 갖추어져 있으며 캠핑장 앞으로는 맑고 깨끗하고 시원한 계곡물이 흐르고 있다. 청정 가평 1급수에서 즐기는 계곡 물놀이가 특별함을 안겨준다. 주변 관광지로 남이섬, 아침고요 수목원, 자라섬, 쁘띠프랑스 등이 있다.</div>
