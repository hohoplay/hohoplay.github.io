<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">비와야폭포</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 태백시 양지길 25 (장성동)</p>

<a href="https://map.kakao.com/link/map/%EB%B9%84%EC%99%80%EC%95%BC%ED%8F%AD%ED%8F%AC,37.1066648430,129.0208308308" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">태백시 재피골 아래쪽 양지마을 끝에는 높이 약 40m의 석회암 절벽이 있다. 평소에는 깎아지른 절벽이지만, 비가 오면 힘찬 물줄기를 뿜는 폭포로 변한다. 비가 내려야만 폭포가 생기기 때문에 ‘비와야폭포’라 불린다. 장마철이나 집중호우 시에는 흰 비단을 드리운 듯한 물줄기가 곧게 낙하하며 장관을 이룬다. 겨울에는 눈이 녹았다 얼기를 반복하며 빙폭으로 변해 3~4개월간 장엄한 풍경을 선사한다.</div>
