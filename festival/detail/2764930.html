<a href="https://map.kakao.com/link/map/%EB%A7%88%EC%9E%A5%EB%A6%AC%EA%B3%84%EA%B3%A1,37.7780444801,126.8772437023" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">마장리계곡은 경기도 파주시 마장 2리에 위치한 곳으로 박달산 아래에 있다. 수원은 인근 산에서 흘러내리는 계곡물이라기보다 마장저수지로 추정된다. 문산천 구간으로 수영 금지구역이다. 수백 년 된 느티나무길이 운치 있게 자리 잡고 있다. 마장 2리 마을회관 이장을 중심으로 주민들이 주차장 등 편의를 제공하며 관리하고 있다.</div>
