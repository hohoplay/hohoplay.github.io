<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">송호리송림</h1>
<p class="detail-row"><strong>주소</strong> 충청북도 영동군 양산면 송호리</p>

<a href="https://map.kakao.com/link/map/%EC%86%A1%ED%98%B8%EB%A6%AC%EC%86%A1%EB%A6%BC,36.1300459714,127.6759202784" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">충청북도 영동군 양산면 송호리에 있는 소나무 숲으로, 100년이 넘은 소나무 1만여 그루가 심어져 있다. 숲을 포함하여 이 일대 28만㎡는 송호국민관광지로 지정되어 있어 많은 여행객들이 찾는 곳이다. 송호리 송림은 ‘양산팔경의 중심’으로 불리며 양산 8경 중 3곳이 송림 근처에 위치해 있다. 송림 옆으로는 금강의 상류인 양강이 흐르고 있어 풍광이 빼어나다. 산책로가 잘 조성돼 있고 중간중간 쉬어갈 수 있는 편의 시설이 갖추어져 있다.</div>
