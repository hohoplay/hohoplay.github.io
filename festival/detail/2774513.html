<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">하추자연휴양림</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 인제읍 하추로 686</p>

<a href="https://map.kakao.com/link/map/%ED%95%98%EC%B6%94%EC%9E%90%EC%97%B0%ED%9C%B4%EC%96%91%EB%A6%BC,38.0347496922,128.3193324547" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원특별자치도 인제군에 위치한  하추자연휴양림에서는  콘도식 객실과 회의실, 식당, 야영시설 등 부대시설을 이용할 수 있다. 
또한 6㎞ 등산로, 4㎞ 웰빙 트레킹 코스 내에 원추리, 꼬리풀, 노랑꽃창포, 용머리 등 50여 종 3만 본의 야생화를 감상할 수 있는 야생화 단지가 조성되어 있다. 인근 내린천에서는 래프팅, 리버버깅, 카약 등 다양한 레포츠도 체험할 수 있다.</div>
