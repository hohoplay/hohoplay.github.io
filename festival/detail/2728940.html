<p class="detail-row"><strong>주소</strong> 경기도 용인시 처인구 원삼면 원양로 250-23</p>

<a href="https://map.kakao.com/link/map/%EC%88%B2%EC%86%8D%EC%97%90%EC%95%88%EB%9C%B0,37.1830601757,127.3081574769" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">숲속의안뜰은 경기 용인시 처인구 외곽에 위치한 캠핑장으로 도심과 멀지 않은 곳에서 힐링할 수 있다. 2개의 캠핑구역에 16개 사이트와 3개의 펜션이 준비되어 있다. 넓은 공간에 적은 수의 사이트로 조용하고 안락한 캠핑을 즐길 수 있고, 캠핑장 바로 앞에 저수지와 산이 있어 자연을 느끼고 휴식과 재충전을 할 수 있다. 주변관광지로는 에버랜드와 용인농촌테마파크 등이 있다.</div>
