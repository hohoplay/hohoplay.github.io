<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">별이빛나는밤에 글램핑</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 무릉법흥로 1090</p>

<a href="https://map.kakao.com/link/map/%EB%B3%84%EC%9D%B4%EB%B9%9B%EB%82%98%EB%8A%94%EB%B0%A4%EC%97%90%20%EA%B8%80%EB%9E%A8%ED%95%91,37.3541305504,128.2790732538" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 영월에 위치한 별이 빛나는 밤에 펜션 캠핑은 8개의 글램핑이 있는 소규모의 캠핑장이다. 작은 규모에 사이트 수도 적어서 한적하고 조용하게 지낼 수 있다. 바로 앞에 법흥계곡이 있어서 물놀이를 하기 좋다. 글램핑 내부는 개별 화장실은 물론 냉난방시설이 되어 있어 사계절 편리하다. 밤이면 계곡의 흐르는 물소리를 들으면서 불멍을 하거나 별들을 보며 감성 캠핑을 즐길 수 있다.</div>
