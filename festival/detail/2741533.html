<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">장경리해수욕장 야영장은 영흥도의 서쪽 자락에 위치해 있다. 수도권에서 최고의 해수욕장으로 꼽히는 장경리 해변과 맞닿아 있어 야영장에서 곧바로 해수욕과 갯벌 체험 등 바다놀이를 즐길 수 있다. 해변 옆으로 길게 조성되어 있는 야영장은 덮개가 있는 원두막형 해변 데크 시설과 소나무 숲속 보도블록 데크로 나누어져 있다.</div>
