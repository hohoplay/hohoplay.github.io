<p class="detail-row"><strong>주소</strong> 경기도 남양주시 수동면 비룡로 1222</p>

<a href="https://map.kakao.com/link/map/%EB%B9%84%EA%B8%88%EA%B3%84%EA%B3%A1,37.7329212133,127.2965928246" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">비금계곡은 수동계곡에서 상류로 조금 더 올라가면 만날 수 있다. 상류라 수량이 깊지는 않지만, 그 어떤 계곡보다도 맑은 물을 자랑한다. 계곡을 따라서 540m의 시루봉을 등반할 수도 있고, 인근에 있는 비금마을에서는 고로쇠 약수도 맛볼 수 있다. 취사나 캠핑은 불가하지만 맑은 물이 흐르는 100% 천연 자연의 아름다움을 온전히 감상할 수 있는 계곡이다.

(출처 : 남양주시 문화관광 홈페이지)</div>
