<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">석산곶은 영종도 스카이 72 골프장 앞 영종 해안도로에서 돌출된 곳이며 서해의 수평선과 인천대교 위로 떠오르는 태양을 만끽할 수 있는 최고의 전망지이다. 선산곶에서 일출을 보고 국내외 토목전문가들이 선정한 세계의 3대 아름다운 다리인 인천대교와 인천대교 프로젝트의 시작부터 완공까지의 건설 과정, 국내 교량 건설의 기술력 등을 전시한 인천대교기념관을 방문해 보는 것을 추천한다.</div>
