<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 상남면 내린천로 2181</p>

<a href="https://map.kakao.com/link/map/%EC%99%80%EB%9D%BC%EC%BA%A0%ED%95%91%EC%9E%A5,37.8755674279,128.2795603630" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 인제 내린천에 위치한 캠핑장으로 민박과 함께 운영하고 있다. 사이트는 나무 그늘 아래 위치해 시원하고, 계곡과도 가깝다. 강물 흘러가는 모습을 보면서 물멍을 즐기기에도 좋다. 가족단위로 물놀이를 즐기거나 자연 속에서 조용한 캠핑을 즐기려는 캠퍼들이 많이 찾는 곳이다. 모든 사이트를 넓게 사용할 수 있으며, 공용 시설은 관리가 잘 되어있어 이용하기 편리하다.</div>
