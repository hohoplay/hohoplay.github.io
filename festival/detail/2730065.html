<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">캠프향기</h1>
<p class="detail-row"><strong>주소</strong> 대전광역시 동구 산내로 710 (상소동)</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A0%ED%94%84%ED%96%A5%EA%B8%B0,36.2362634501,127.4662499744" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">캠프향기는 대전광역시 동구에 있으며 산으로 둘러싸인 숲속에 위치해 있어 자연친화적인 캠핑을 즐길 수 있다.  개별 울타리와 개별 바베큐장으로 독립적인 사용 공간을 제공한다. 객실 내부는 침대, TV, 에어컨, 냉장고, 온수보일러 등을 갖추고 있으며 독립적인 공간을 위해 개별 울타리가 설치돼 있다. 카라반은 카페 건물 2층 옥탑에 위치해 있는 것이 특징이다. 캠핑장 주변에 만인산자연휴양림, 상소동 삼림욕장 등이 있어 연계 관광이 손쉽다.</div>
