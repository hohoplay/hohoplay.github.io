<p class="detail-row"><strong>주소</strong> 경상남도 남해군 서면 서상리 1316-6</p>

<a href="https://map.kakao.com/link/map/%EC%84%9C%EC%83%81%ED%95%AD,34.8094146597,127.8333828893" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">서상항은 경남 남해에 위치한 곳으로 서상 마을과 함께하고 있다. 남파랑길 코스로도 알려진 곳이다. 1972년 지방어항으로 지정된 후 관리되어 왔다. 서상항 방파제는 270m에 달하며 낚시 포인트로 언제나 낚시꾼들의 모습을 볼 수 있다. 그리고 서상항에서 장항 숲까지 해변 산책로가 연결되어 있어 맑고 푸른 바다와 숲을 즐기며 산책할 수 있으며, 걸으며 서상한 주변과 더불어 서상 마을, 서상숲까지 둘러볼 수 있다.</div>
