<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평군 설악면에 위치한 개울가 오토캠핑장은 야영장 근처에는 유명산 맑은 계곡이 흐르고 산책로가 있다. 숲속 식물원과 자연현장 체험관 천연림 탐방로와 숲속의 쉼터가 있어 새로운 숲속의 볼거리를 제공한다. 경치좋고 물좋은 유명산에서 편안한 휴식과 일상적인 피로에서 벗어날 수 있는 시간을 보낼 수 있다.</div>
