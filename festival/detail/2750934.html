<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">자라도선착장</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 신안군 안좌면 자라도길 1</p>

<a href="https://map.kakao.com/link/map/%EC%9E%90%EB%9D%BC%EB%8F%84%EC%84%A0%EC%B0%A9%EC%9E%A5,34.6913805191,126.1693515372" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">전남광주통합특별시 신안군 안좌도 아래 작은 섬인 자라도에 위치한 자라도선착장은 마을 주민들이 주로 이용하는 작은 어항이다. 대합실 겸 매표소가 있다. 지금은 안좌도와 자라도를 연결하는 자라대교가 만들어져 있으나, 이전까지 이 선착장을 통해 안좌도와 자라도를 왕래했다. 작은 휴식공간인 정자도 있으니 지나가는 길에 잠시 들러 바다를 바라보며 휴식을 취하기에 좋다.</div>
