<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">응회암은 화산폭발 시 공중으로 날린 화산재가 떨어져 굳은 암석을 말한다. 지장산 응회암은 중생대 백악기 시대에 생성되었으며, 계곡부에서 관찰되는 응회암은 그 종류 및 퇴적구조가 다양하게 나타나 교육 및 경관적 가치가 뛰어나다. 지장산에 위치한 지장산 계곡은 작은 폭포와 연못이 어우러져 있어 피서객들이 많이 찾는 장소이며, 계곡 안에는 옛날 궁예가 세웠다는 전설이 있는 보가산성지가 남아있다.</div>
