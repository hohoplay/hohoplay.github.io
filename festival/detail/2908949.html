<a href="https://map.kakao.com/link/map/%EB%8B%A8%EC%95%84%ED%95%9C%ED%8E%9C%EC%85%98,35.3890032532,127.0922832789" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">단아한펜션은 전북 순창군 팔덕면 산동리에 위치하고 있다. 4동의 복층 펜션이 있으며 다육식물 관련 체험이 이뤄지는 다육식물원과 방갈로 시설도 이용할 수 있다. 이 외에 카페와 매점 시설과 대형 물놀이장을 구비하고 있어 더욱 편하고 즐거운 시간을 보낼 수 있다. 가족과 친구와 함께 방문해보는 것을 추천한다.</div>
