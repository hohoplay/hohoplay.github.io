<a href="https://map.kakao.com/link/map/%EB%B6%80%EC%9E%94%EA%B5%90%EA%B0%AF%EB%B2%8C%ED%83%90%EB%B0%A9%EB%A1%9C,35.0094376462,128.0471201296" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">실안 무지개 해안도로(무지갯빛 해안도로)를 따라 걷다 보면 부잔교갯벌탐방로를 만나볼 수 있다. 알록달록한 부잔교에는 형형색색의 바람개비와 함께 다리 위에서 남해의 갯벌과 바다 풍경을 바라볼 수 있다. 부잔교 갯벌탐방로에는 하트 포토존과 자전거 포토존이 위치하여 있어 남해안의 풍경과 함께 사진을 담을 수 있다.</div>
