<p class="detail-row"><strong>주소</strong> 경기도 가평군 상면 축령로 289-146</p>

<a href="https://map.kakao.com/link/map/%EC%9E%A3%ED%96%A5%EA%B8%B0%ED%91%B8%EB%A5%B8%EC%88%B2,37.7707675416,127.3365658619" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">축령산과 서리산 자락 해발 450~600m에 위치하고 있는 잣향기푸른숲은 수령 80년 이상의 잣나무가 국내 최대로 식생하고 있는 곳이다. 또한 숲체험과 산림치유 프로그램 등 다양한 체험 프로그램을 즐길 수 있는 산림휴양공간이다. 축령백림관, 잣향기 목공방, 화전민마을, 힐링센터, 물가두기 사방댐 등의 볼거리, 즐길거리도 가득한 곳이다. 무장애 나눔길이 1km가량 조성되어 있어 누구나 편하게 잣향기푸른숲을 즐길 수 있게 했다.</div>
