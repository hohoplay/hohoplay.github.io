<p class="detail-row"><strong>주소</strong> 경상남도 양산시 원동면 원동로 1837-2</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A0%ED%94%84%EB%9D%BC%EC%9E%84,35.3919576960,128.9211667798" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청정지역 양산시 원동면 원리에 위치하고 있는 캠프라임은 약 6,600㎡ 부지에 카라반 5동, 글램핑 7동을 운영 중이다. 커피 테라스, 족구장, 간이 수영장, 매점, 샤워실을 준비하였으며, 주말 캠핑은 기본, 기업 워크숍, 체험장으로도 이용이 가능하다. 낮에는 청정 원동천에서 물놀이와 유기농 텃밭에서 신선한 채소를 먹고, 밤에는 아름다운 별이 보이는 곳이다.</div>
