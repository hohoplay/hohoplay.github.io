<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">플로레스타글램핑은 경기 가평군 가평읍에 위치하고 있다. 가평 터미널, 가평역에서 택시로 이동할 수 있는 거리이다. 아이들과 함께 지내기 좋은 개별 미온수 수영장이 설치되어 있다.개별 테라스에서 바베큐하며 불멍을 즐길 수 있으며 글램핑 텐트 바로 옆에 주차가 가능해 짐 내리기 편하다. 또한 탁구대, 배드민턴 세트, 보드게임 등이 준비되어 있고 캠프파이어도 가능하다.</div>
