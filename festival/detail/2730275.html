<p class="detail-row"><strong>주소</strong> 경기도 가평군 상면 청군로 776-22</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A1%ED%8B%B4%EC%B9%B4%EB%9D%BC%EB%B0%98,37.7810114291,127.3712540694" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">캡틴카라반 글램핑은 경기도 가평군 상면 아침고요수목원과 인접한 곳에 있다. 수영장을 운영 중이며 카라반과 글램핑 모두 바닥 난방 설치하였고 히터를 완비하였다. 사이트는 4m×6m 10개 동, 3m×6m 4개 동이 있고 전나무 숲과 연못 위의 특별한 사이트도 있다. 개인 사이트마다 최신 바비큐 그릴을 갖췄으며 관리실은 웰컴센터와 카페, 매점을 운영 중이다. 특히 공용 시설물이 넓고 깨끗하며 이용객들의 반응이 좋다.</div>
