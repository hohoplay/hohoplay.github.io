<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">늘예솔 글램핑장은 거창의 맑은 월성계곡에 위치해 자연과 함께 쉬었다 갈 수 있는 곳이다. 언제나 변함없는 소나무처럼 편안한 휴식을 제공하기 위해 노력하고 있다. 2인 기준으로 최대 5명까지 수용 가능하며 바닥에 열선으로 겨울에도 따뜻하게 지낼 수 있다.</div>
