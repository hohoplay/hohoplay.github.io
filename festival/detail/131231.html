<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">오봉저수지</h1>
<p class="detail-row"><strong>주소</strong> 전북특별자치도 임실군 성수면 왕방리</p>

<a href="https://map.kakao.com/link/map/%EC%98%A4%EB%B4%89%EC%A0%80%EC%88%98%EC%A7%80,35.6211899020,127.3595952643" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">성수산, 소충사, 상이암이 연계된 관광권이 형성되어 있다. 성수산의 수려한 경관과 기암괴석이 일품이다. 성수면 사무소에서 진안 쪽으로 가는 30번 국도로 1.2㎞가서 우측에 있는 지방도 721호를 따라 산서 방면으로 1.6㎞를 가면 오봉저수지가 있는데, 이 저수지에는 참붕어가 다량 서식하고 뱀장어 20,000마리를 군에서 유입하였으며 향어 등이 많이 서식하고 빙어, 메기, 잉어 등이 다량 서식하고 있다.</div>
