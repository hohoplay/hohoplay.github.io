<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 용인 구봉산 자락에 위치한 철이네 캠핑장은 아이들이 좋아할만한 수영장과 놀이터를 갖춘 글램핑장이다. 농구골대와 그네, 나무에는 해먹이 걸려있고, 토끼와 닭이 있는 동물농장이 있다. 수려한 주변 경치와 청정 자연 속에서 즐거운 시간을 보내기 좋은 곳이다.</div>
