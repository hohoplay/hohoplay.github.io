<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">덕동산마루오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 충청북도 제천시 백운면 덕동로 161-3</p>

<a href="https://map.kakao.com/link/map/%EB%8D%95%EB%8F%99%EC%82%B0%EB%A7%88%EB%A3%A8%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.1975347481,127.9833127995" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">충북 제천 덕동계곡 덕동산마루에 위치한 공기 맑고 자연 발생된 덕동 계곡과 함께 삼봉산 자락을 함께 품고 있는 조용하고 아늑한 캠핑장이다. 이곳은 10여 년 캠핑을 다니던 캠퍼가 만든 캠핑장이다. 자연과 계곡이 어우러져 여름에 맑고 깨끗한 계곡을, 가을엔 단풍을, 겨울에는 소복하게 쌓인 눈을 즐길 수 있다. 이곳은 사이트 간격이 넓어 쾌적한 환경을 자랑한다.</div>
