<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">아름다운 한려수도 남해 바다와 함께하는 캠핑장 남해 버드하우스는 폐교한 초등학교를 개조해서 만든 곳이다. 사이트로 변신한 운동장은 정리가 잘 되어 있고, 캠핑장 이용 캠퍼들에게 목각 공방에서 서각 1작품 무료 체험을 제공한다. 매점에서 컵라면, 스낵, 생수와 음료, 아이스크림, BBQ 숯, 모기향 등을 구매할 수 있으며 반려동물 동반은 불가능하다.</div>
