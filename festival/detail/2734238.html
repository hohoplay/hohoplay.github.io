<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">자두마을캠핑</h1>
<p class="detail-row"><strong>주소</strong> 전북특별자치도 정읍시 종황길 92 (내장동)</p>

<a href="https://map.kakao.com/link/map/%EC%9E%90%EB%91%90%EB%A7%88%EC%9D%84%EC%BA%A0%ED%95%91,35.5114947425,126.9187872029" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">전북 정읍에 위치한 자두마을 캠핑장은 35개 사이트와 카라반이 있는 캠핑장이다. 내장산 자락에 자리하고 있어 산뷰가 좋다. 캠핑장과 주차장 사이를 흐르는 계곡 물놀이장과 캠핑장 안에 큰 수영장에서 물놀이를 즐길 수 있다. 캠핑존의 경우 입실은 오후 1시부터 21시까지 완료해야 하며 부득이한 사정이 있을 경우 관리자에게 연락을 해야 한다. 또한 오후 11시부터는 매너타임이므로 소음에 유의해야 한다.</div>
