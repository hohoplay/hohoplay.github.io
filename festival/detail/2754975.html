<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">을수민박야영은 강원도 홍천군 내면에 위치하고 있다. 오대산에 둘러싸인 야영장은 계곡을 끼고 있어 여름 물놀이를 하기에 좋은 곳이다. 직접 기른 쌈 야채를 무료로 제공하고 있다. 커다란 소나무 밑에 위치하여 나무 그늘이 따가운 햇볕을 막아준다. 캠핑과 민박을 같이 운영하고 있다.</div>
