<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">솔잎향캠핑파크</h1>
<p class="detail-row"><strong>주소</strong> 경기도 시흥시 수인로2107번길 52 (조남동)</p>

<a href="https://map.kakao.com/link/map/%EC%86%94%EC%9E%8E%ED%96%A5%EC%BA%A0%ED%95%91%ED%8C%8C%ED%81%AC,37.3698973828,126.8711363245" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 시흥의 수리산 자락에 위치한 솔잎향캠핑파크는 접근성에 뛰어난 캠핑장이다. 수도권에서 20~30분 거리로 아주 편리하지만, 고속도로 옆이라는 약간의 단점은 있다. 그래서인지 밤에 귀마개를 나눠주고 있다. 총 22개의 사이트가 있는데, 글램핑 사이트가 1개 있고, 2가족용 데크 사이트와 파쇄석 사이트들이 있다. 데크 사이트는 사이트 옆에 주차가 가능하나, 글램핑과 파쇄석 사이트는 주차는 별도로 해야 한다.</div>
