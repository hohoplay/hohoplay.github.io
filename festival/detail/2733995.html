<p class="detail-row"><strong>주소</strong> 강원특별자치도 평창군 봉평면 전나무골길 224-10</p>

<a href="https://map.kakao.com/link/map/%EB%A7%88%EA%B0%80%EB%A6%AC%EC%BA%A0%ED%95%91%EC%9E%A5,37.6457874481,128.3696063861" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">메밀의 고장 평창 봉평면에 위치한 마가리캠핑장은 해발 700m에 위치한 캠핑장이다. 숲과 계곡이 쾌적하여 가족 단위로 많이 찾는 곳이다. 선착순 예약 방식으로 캠핑장에 도착한 순서대로 사이트를 선택할 수 있다. 하늘로 우뚝 솟은 전나무 아래 사이트에 텐트를 치고 맑은 계곡에서 물놀이를 즐길 수 있다.</div>
