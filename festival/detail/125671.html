<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">비룡폭포</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 속초시 설악동</p>

<a href="https://map.kakao.com/link/map/%EB%B9%84%EB%A3%A1%ED%8F%AD%ED%8F%AC,38.1611551800,128.5023258220" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">비룡폭포는 육담폭포와 토왕성폭포 중간에 위치하고 있다. 설악동에서 비룡다리를 지나 토왕성 계곡에 들어서서, 계속 위쪽으로 오르면 육담폭포에 이르는데, 이곳에서 약 500m를 더 들어가면 나타난다. 10여 m의 물기둥이 떨어지는 비룡폭포는 그 형상이 용이 물줄기를 타고 승천하는 듯하다는데서 붙여진 이름이다. 특히, 겨울철의 얼음줄기는 장관이다.

(출처 : 속초관광)</div>
