<p class="detail-row"><strong>주소</strong> 경기도 의정부시 송산로971번길 133-5 (산곡동)</p>

<a href="https://map.kakao.com/link/map/%EC%88%98%EB%9D%BD%EC%BA%A0%ED%95%91%EC%9E%A5,37.7134726728,127.0995391308" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">수락캠핑장은 서울과 의정부 그리고 남양주의 경계를 이루는 수락산 근교에 위치하고 있으면서 자연 그대로를 유지하고 있어 자연의 아름다움을 느낄 수 있는 곳이다. 서울과 의정부에서 지하철과 버스 등 대중교통을 이용하여 편리하게 갈 수 있는데, 조용한 캠핑장이고 가족 단위로 많이 찾는 곳이기 때문에 가족 4인(성인 2, 아이 2), 텐트 1, 타프 1, 차량 1 원칙으로 1자리에 텐트 2개의 설치는 불가하다.</div>
