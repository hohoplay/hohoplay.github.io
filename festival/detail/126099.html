<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">봉평해수욕장</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 울진군 죽변면 봉평리</p>

<a href="https://map.kakao.com/link/map/%EB%B4%89%ED%8F%89%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,37.0440490907,129.4132311212" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">봉평해수욕장은 울진군 죽변면에 위치한 해수욕장이다. 백사장은 길이 약 250m이며, 백사장 뒤편에는 넓은 송림이 펼쳐져 있어 야영이 가능하다. 봉평해수욕장은 1984년 해수욕장으로 문을 연 이래 매년 7월 10부터 8월 말까지 개장하고 있다. 죽변항과 울진봉평신라비 전시관이 인접해 있어 해수욕과 더불어 관광을 겸 할 수 있다.</div>
