<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 북방면 노일로310번길 4</p>

<a href="https://map.kakao.com/link/map/%ED%99%8D%EC%B2%9C%20%EC%81%98%EB%9D%A0%ED%9E%90%EB%A7%81%EC%B9%B4%EB%9D%BC%EB%B0%98,37.6861040840,127.7303269607" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">쁘띠힐링카라반 캠핑장은 홍천강에서도 아름답기로 유명한 노일 유원지 언덕에 자리잡았다. 서울에서 50분, 팔봉산 유원지에서 15분 거리다. 앞으로는 홍천강이 내려다보이고, 옆으로는 청정 계곡에 접해 있는 캠핑장으로 강에서의 낚시체험, 다슬기 체험 등을 할 수도 있다. 캠핑장 안에 큰 규모의 수영장이 있고, 카라반마다 개별 데크와 바비큐 그릴을 갖췄다.</div>
