<p class="detail-row"><strong>주소</strong> 충청남도 태안군 고남면 장곡리</p>

<a href="https://map.kakao.com/link/map/%EC%9E%A5%EB%8F%8C%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,36.4161681438,126.3654661682" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">장돌해수욕장은 해변의 폭이 그리 크지 않은 아늑하고 조용한 해변이다. 해변 길이는 1.5km, 폭은 200m 정도이며 고운 규사모래로 되어 있다. 주위가 논경지와 산으로 이루어져 있고 전형적인 농촌마을로 민박이 가능하며, 시골의 인심을 물씬 느낄 수 있는 곳이다. 해변이 안전하고 가족단위 피서 장소로 적당하며 조용한 농촌마을의 정취와 한적한 해변가의 분위기를 즐길 수 있다.</div>
