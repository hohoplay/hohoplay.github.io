<p class="detail-row"><strong>주소</strong> 경기도 포천시 이동면 성장로1289번길 155-76</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A0%ED%95%91%EB%9D%BC%EC%9A%B4%EC%A7%80,38.0474914482,127.3690436874" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">캠핑라운지는 사방이 소나무로 둘러싸인 해발 280M 위에 자리 잡고 있어 오지에서 자연을 느끼며 캠핑을 즐길 수 있다. 한여름에도 한기를 느낄 수 있는 얼음계곡이 가깝고 캠핑장을 기준으로, 위쪽에 인가가 없어 가장 깨끗한 1 급수를 만날 수 있다. 계곡엔 멍텅구리, 버들치, 메기, 다슬기 등을 볼 수 있으며 계곡을 따라 걷는 산책코스는 폭포와 연결돼 있다. 부대시설로 매점과 카페가 있어 편리하게 이용할 수 있다.</div>
