<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">두창저수지</h1>
<p class="detail-row"><strong>주소</strong> 경기도 용인시 처인구 원삼면 두창리</p>

<a href="https://map.kakao.com/link/map/%EB%91%90%EC%B0%BD%EC%A0%80%EC%88%98%EC%A7%80,37.1473509424,127.3375169386" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">용인시 처인구 원삼면에 위치한 두창저수지는 1980년대에 축조되었다. 넓고 여유로운 풍경을 즐길 수 있는 저수지이다. 저수지 주변으로는 가볍게 걸을 수 있는 둘레길이 조성되어 있다. 도보로 대략 1시간 정도 소요된다. 둘레길을 따라 걷다 보면 운동기구가 설치된 모습도 볼 수 있으며, 선사시대 선돌과 고려시대 삼층석탑을 만날 수 있다. 또한 저수지 주변으로 낚시터와 여러 카페, 펜션들이 위치해 있다.</div>
