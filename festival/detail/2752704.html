<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">별빛두레펜션</h1>
<p class="detail-row"><strong>주소</strong> 전북특별자치도 진안군 부귀면 석원로 24</p>

<a href="https://map.kakao.com/link/map/%EB%B3%84%EB%B9%9B%EB%91%90%EB%A0%88%ED%8E%9C%EC%85%98,35.8552506343,127.4279885892" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">별빛 두레 펜션 캠핑장은 별빛 두레 펜션이 함께 운영하는 캠핑장으로 전라북도 진안군 부귀면 석원로에 있다. 펜션은 6개동, 일반 야영장은 15개의 사이트로 이루어져 있으며 제법 높이가 있는 데크 사이트도 있다. 펜션 이용 고객에겐 야외에서 식사가 가능한 마루나 식탁이 제공된다. 이곳 펜션은 ‘숲속에 지어진 예쁜 오두막’같은 느낌을 주는데 구내식당에서 음식 주문을 하면 식사도 가능하다.</div>
