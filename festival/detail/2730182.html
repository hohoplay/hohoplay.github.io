<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">장항오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 서천군 장항읍 장항산단로34번길 46-33</p>

<a href="https://map.kakao.com/link/map/%EC%9E%A5%ED%95%AD%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,36.0254791309,126.6654049198" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">장항오토캠핑장은 서천군청을 기점으로 8㎞가량 떨어진 서천 해변 앞에 위치해 있다. 송림이 둘러싸고 있어 자연친화적인 캠핑장으로 유명하다. 해변을 향해 산책로도 잘 조성돼 있다. 캠핑장에는 데크 37면과 캠핑카 자리 3면이 있다. 화장실과 샤워실을 남녀를 구분해 총 2개소며, 개수대는 1개 소다. 개인 카라반과 트레일러의 동반 입장이 가능하고 관리소를 통해 릴선과 화로대를 대여할 수 있다.</div>
