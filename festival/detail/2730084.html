<p class="detail-row"><strong>주소</strong> 경기도 포천시 화현면 봉화로 400-134</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A0%ED%95%91%ED%94%8C%EB%9E%98%EB%8B%9B,37.8866391825,127.2831145899" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">명덕관광농원 캠핑장은 서울과 가까운 포천 아치산 숲 속에 위치해 있다. 33만m²의 넓은 부지에 글램핑, 카바나 캠핑장, 오토캠핑장, 단체 캠핑하우스를 갖춘 복합 캠핑장이다. 산 중턱에 위치해 있어 전망이 좋고 어린이들을 위한 트램펄린과 야외 놀이터, 유아 전용 키즈 놀이터가 있다. 특히 여름철에는 차광막과 그늘막이 쳐진 수영장을 겨울철에는 눈썰매장을 운영하고 있어 가족단위 이용객들이 많다.</div>
