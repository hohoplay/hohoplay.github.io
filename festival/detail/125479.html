<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">칠장산</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안성시 삼죽면 미장리</p>

<a href="https://map.kakao.com/link/map/%EC%B9%A0%EC%9E%A5%EC%82%B0,37.0308486914,127.3912181416" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">칠장산(492m)은 경기도 안성시 죽산면, 금광면, 삼죽면에 걸쳐 있는 산이다. 칠현산과 덕성산과 더불어 웅장한 산세를 이룬다. 칠장산의 산기슭에 있는 칠장사가 위치해 있는데, 울창한 숲과 고즈넉한 사찰의 풍경이 한적한 풍광을 연출한다. 
칠장산 등산 코스 시작점으로는 칠장사 주차장이 많이 이용되고, 어사 박문수 합격다리를 통해 칠현산과 칠장산으로 오를 수 있다. 또 다른 등산 코스도 있으니 원하는 코스를 선택해서 등산하면 된다.</div>
