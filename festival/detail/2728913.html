<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 양주시에 위치한 스톤밸리캠핑장은 칠봉산 끝자락에 위치하여 주변경관이 우수하며, 가족단위의 소규모 캠핑을 즐기기 적합한 곳으로, 찌든 일상에서 벗어나 진정한 힐링을 체험할 수 있는 캠핑장이다. 울창한 숲 속에 둘러싸여 있어 자연을 즐기며 캠핑의 즐거움을 잘 느낄 수 있는 곳이다.</div>
