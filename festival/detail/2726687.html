<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">산으로간니모캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 가평군 조종면 연인산로 670-321</p>

<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%9C%BC%EB%A1%9C%EA%B0%84%EB%8B%88%EB%AA%A8%EC%BA%A0%ED%95%91%EC%9E%A5,37.8544755716,127.3968801456" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">산으로 간 니모캠핑장은 경기도 가평군 조종면에서 가장 높은 위치한 캠핑장이다. 연인산 해발 600m에 위치한 가평 내에 숨겨진 보석 같은 위치에 있어 주변의 아무런 방해 없이 나만의 편안한 힐링을 할 수 있는 장소이다. 캠핑장 옆의 산골짜기에서 내려오는 시원한 물은 연인산 최상류의 물로 1년 내내 마르지 않고 풍부한 수원과 1급수의 맑은물을 자랑하고 있고, 캠핑장 내 저수지에서는 낚시를 하며 즐거운 시간을 보낼 수 있다.</div>
