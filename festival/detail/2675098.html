<a href="https://map.kakao.com/link/map/%ED%91%B8%EB%A5%B8%EC%88%98%EB%AA%A9%EC%9B%90,37.4830806290,126.8240846662" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">푸른수목원은 인적 없던 공터를 친환경 공간으로 탈바꿈시켜 조성된 서울시 최초의 시립 수목원이다. 2018년 서울시 제1호 공립수목원으로 지정되었으며, 다양한 식물유전자원을 수집·증식·보존하고 있다. 항동저수지 인근에 위치한 수목원에는 오색정원, 야생화원, 어린이정원 등 20개의 주제정원이 조성되어 있다. 안내센터와 숲교육센터 등에서 운영되는 생태교육 및 가드닝 프로그램을 통해 자연 속 배움의 장으로 활용되고 있다.</div>
