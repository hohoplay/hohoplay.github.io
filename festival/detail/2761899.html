<p class="detail-row"><strong>주소</strong> 강원특별자치도 평창군 봉평면 덕거길 356-12</p>

<a href="https://map.kakao.com/link/map/%EC%BF%B5%EC%BF%B5%EC%86%8C%20%EC%BA%A0%ED%95%91%EC%9E%A5,37.6640974315,128.4216400241" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">쿵쿵소 캠핑장은 강원도 평창군 봉평면에 있다. 흥정계곡 허브나라 근처에 자리 잡고 있으며 휘닉스 파크와 블루캐니언도 그리 멀지 않은 곳에 있다. 조금 더 이동하면 양떼목장과 삼양목장 방문이 가능하다. 숨겨진 명소 쿵쿵소 폭포가 있으며 50개의 각 사이트 옆으로 계곡물이 흐르고 있고, 생체 리듬에 좋다는 해발 700고지에 있다.</div>
