<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">메가오토캠핑장은 포천 일동면 수입리에 있다. 모든 사이트가 지정석이 아닌 선착순으로 오는 순서대로 맘에 드는 사이트를 이용하면 된다. 사이트는 데크와 파쇄석이 있으며, 데크 옆 파쇄석에 개인 트레일러나 카라반 주차도 가능하다. 사이트마다 소화기가 설치되어 있으며, 캠핑 사이트에 이동 동선에 따라 조명등이 설치되어 있다.</div>
