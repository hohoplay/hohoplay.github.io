<a href="https://map.kakao.com/link/map/%EC%84%A0%EB%82%A9%EC%88%B2%EA%B3%B5%EC%9B%90,37.2117504811,127.1078164769" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">동탄 선납숲공원은 저수지였던 선납지를 호수공원으로 조성한 곳이다. 우암 송시열 선생을 기리는 우암정이 있고, 호수를 따라 이어진 산책로와 산에 오를 수 있는 등산로가 있어 호수와 산을 함께 즐길 수 있다. 유아숲체험원엔 원색의 아기자기한 놀이시설과 함께 친환경으로 꾸며진 곤충 관찰터, 자연 놀이터, 모험 놀이터, 숲속 평상원등 4가지 체험 코스를 만날 수 있다. 온 가족이 함께 듣고, 보고, 만지며 걸을 수 있는 나들이 공간이다.</div>
