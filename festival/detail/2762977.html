<p class="detail-row"><strong>주소</strong> 강원특별자치도 정선군 정선읍 동강로 2914</p>

<a href="https://map.kakao.com/link/map/%EC%A0%95%EC%84%A0%EA%B5%B0%EC%83%9D%ED%83%9C%EC%B2%B4%ED%97%98%ED%95%99%EC%8A%B5%EC%9E%A5%EC%95%BC%EC%98%81%EC%9E%A5,37.3609224601,128.6257779928" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">정선의 자연과 함께 어우러져 답답한 도심을 벗어나 가족, 연인, 친구들과 함께 할 수 있는 야영지이다. 21면의 야영데크가 설치되어 있고 음수대, 화장실, 샤워장 등 편의 시설과 체육공간이 마련되어 있다. 한 폭의 그림과 같은 자연과 동식물을 볼 수 있다.  다양한 즐길 거리와 함께 쉬어갈 수 있는 곳으로 아이들과 함께 동강 주변의 생태체험을 할 수 있으며 정선 동강 유역의 레포츠 명물인 짚와이어의 도착지로도 유명하다.</div>
