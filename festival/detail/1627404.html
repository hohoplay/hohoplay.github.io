<p class="detail-row"><strong>주소</strong> 전북특별자치도 정읍시 내장산로 936</p>

<a href="https://map.kakao.com/link/map/%EC%9A%A9%EA%B5%B4,35.4868275670,126.8877683635" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">내장산국립공원 내장사에서 금선계곡을 따라 1.5km 정도 올라가다 보면 우측 산 중턱에 용굴이 나온다. 금선계곡 오른쪽에 위치한 용굴은 가파른 철재 계단을 따라 올라가면 그 모습을 볼 수 있다. 임진왜란이 당시 난을 피해 정읍의 유생들인 오희길과 손홍록은 전주의 사고［史庫］에 보관되어 있던 조선왕조실록과 태조의 영정을 내장산 용굴로 옮겨 3개월 동안 지켰다. 후에는 이곳보다 더욱 험준한 곳에 있던 비래암［飛來庵］으로 옮겨 보관하였다고 전해진다.</div>
