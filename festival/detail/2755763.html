<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">횡성 온새미로 캠핑장은 강원도 횡성군 청일면에 위치하고 있다. 가죽단위 독채, 복층형 화이트 펜션이다. 멋진 조경, 감성조명산책로, 미니동물원, 화석박물관, 큰 수영장, 작은 수영장, 방방이 등등 즐길 거리가 있다. 산에 둘러싸여 있어 공기가 맑고 밤엔 별도 잘 보여 지친 몸과 마음을 자연 속에서 힐링할 수 있다.</div>
