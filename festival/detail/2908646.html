<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">별바라기캠핑펜션</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 논산시 수락로 669-54</p>

<a href="https://map.kakao.com/link/map/%EB%B3%84%EB%B0%94%EB%9D%BC%EA%B8%B0%EC%BA%A0%ED%95%91%ED%8E%9C%EC%85%98,36.1972759207,127.2913916370" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">별바라기 캠핑 펜션은 충남 논산시 벌곡면 수락로에 자리 잡았다. 논산시청을 기점으로 25㎞가량 떨어졌다. 자동차를 타고 계백로와 황룡재로를 번갈아 달리면 닿는다. 도착까지 걸리는 시간은 40분 안팎이다. 캠핑장에는 파쇄석으로 이뤄진 오토캠핑 사이트 38면이 마련돼 있다. 사이트 크기는 가로 8m, 세로 9m 등이다. 부대시설로은 펜션과 트램펄린 등이 있다. 주변에는 탑정호수변생태공원이 있다. 
※ 반려견 동반 불가능</div>
