<p class="detail-row"><strong>주소</strong> 전북특별자치도 진안군 마령면 관마로 1248-14</p>

<a href="https://map.kakao.com/link/map/%EB%A7%88%EB%A0%B9%ED%81%B0%EC%8B%9C%EB%82%B4%EB%93%A4%EC%BA%A0%ED%95%91%EC%9E%A5,35.7382096948,127.3446157494" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">마령 큰시내들캠핑장은 진안 마령면 강정리에 있는 캠핑장 겸 글램핑장이다. 이곳은 사이트가 넓어 여유 있게 공간을 쓸 수 있고 부대시설 또한 잘 갖춰져 있다. 사이트 정비는 물론 청소 상태가 아주 훌륭하다. 사방이 산으로 둘러싸여 있어 산새가 지저귀는 소리와 개구리울음소리를 들을 수 있다. 공기가  맑아 밤에는 하늘에 펼쳐진 수많은 별을 볼 수 있다. 바로 옆에 냇물이 흐르고 있어 낚시와 물놀이를 즐길 수 있다.</div>
