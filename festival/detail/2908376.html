<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">천안밤나무골 가족캠핑장은 충남 천안시 서북구 성거읍 송남리에 자리 잡았다. 캠핑장에는 파쇄석으로 이뤄진 오토캠핑 사이트 62면이 마련돼 있다. 카라반과 트레일러 동반 입장이 가능하며 추가요금을 내야 한다. 밤나무가 우거진 산속에 위치한 덕분에 밤 수확철이면 밤 줍기 체험을 할 수 있다.</div>
