<a href="https://map.kakao.com/link/map/%EB%8D%95%EC%82%B0%EA%B3%84%EA%B3%A1,35.6021341648,127.5433850427" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">군립공원 장안산의 제일 계곡인 덕산은 울창한 원시림과 맑은 물, 기암괴석이 조화되어 절경을 이룬다. 울창한 원시림과 깊은 골짜기에서 흘러나오는 맑은물이 용이 살았다는 2개의 용소를 비롯한 크고 작은 10여 군데의 소(沼), 용바위, 신선바위, 정승바위 등 20여개의 기암괴석, 은골, 절골, 감골 등의 작은 골짜기와 어울려 절경을 이룬다.</div>
