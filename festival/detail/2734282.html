<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">충북 제천에 있는 하이락 글램핑장은 사계절 언제라도 캠핑을 즐길 수 있는 곳이다. 캠핑장비가 없더라도 글램핑장 안에 준비된 도구만 활용해도 충분히 캠핑 기분을 만끽할 수 있다. 난방시설까지 준비되어 가을, 겨울에도 따뜻하게 보낼 수 있다. 부대시설로는 개별바베큐장, 샤워장, 식기세척장 등이 있다. 오후 10시 이후로는 매너타임이며 소음에 유의해야 한다.</div>
