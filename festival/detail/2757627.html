<a href="https://map.kakao.com/link/map/%EB%8F%99%EA%B2%80%EB%8F%84%EB%85%B8%EC%9D%84%EC%BA%A0%ED%95%91%EC%9E%A5,37.5873157243,126.5097632328" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강화도에서도 더 들어가면 다리로 연결된 작은 섬, 동검도에 위치한 동검도노을캠핑장은 오토캠핑 사이트 23개와 테라스가 딸린 방갈로 2개가 있는 캠핑장이다. 탁 트인 바다와 갯벌을 조망할 수 있고, 일몰이 멋지다. 갯벌에서 맛조개나 바지락을 잡을 수 있다. 또한 반려견 동반이 가능한 곳으로 몸무게 기준 8kg 이내, 두 마리까지 예약 가능하다.</div>
