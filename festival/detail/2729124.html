<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">백미리희망캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 화성시 서신면 백미길 210-15</p>

<a href="https://map.kakao.com/link/map/%EB%B0%B1%EB%AF%B8%EB%A6%AC%ED%9D%AC%EB%A7%9D%EC%BA%A0%ED%95%91%EC%9E%A5,37.1436646910,126.6812626132" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">백미리 희망캠핑장은 바닷가 바로 앞에 있는 노을이 환상적인 캠핑장으로서, 어린이 놀이터, 텃밭, 산책로 등의 부대시설이 갖춰져 있다. 5분거리 백미리 어촌체험마을에는 갯벌체험, 낚시체험을 즐기실 수 있으며, 농구장, 축구장도 준비되어 있다. 백미리 마을은 화성시 서신면에 있는 어촌마을로 우리나라 어촌체험마을 중 가장 유명한 곳이다. 백가지의 맛이 있다고 해서 붙여진 이름이 백미리인데 그만큼 다양한 해산물이 잡히는 곳이다.</div>
