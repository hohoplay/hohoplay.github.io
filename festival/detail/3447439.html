<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">장자호수생태체험관은 경기도 구리시 장자호수공원 내에 위치한 생태 교육 및 체험 공간이다. 2012년에 개관되어, 다양한 환경 교육 프로그램과 체험 활동을 제공한다. 전시관에서는 호수의 동식물과 오염 복구 과정을 보여주며, 생태 수목 관찰장, 체험 시설, 산책로 등이 마련되어 있다.</div>
