<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">명동선착장</h1>
<p class="detail-row"><strong>주소</strong> 경상남도 창원시 진해구 명동</p>

<a href="https://map.kakao.com/link/map/%EB%AA%85%EB%8F%99%EC%84%A0%EC%B0%A9%EC%9E%A5,35.0971399061,128.7218255363" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">창원해양공원과 가까운 우도와 소쿠리섬을 오고 가는 선박들이 머무는 선착장이다. 두 대의 여객선이 하루 7회 정도 이곳을 통해 운행한다. 창원해양공원이 들어서 있는 음지도를 돌아서 그 인근에 있는 무인도인 소쿠리 섬과 유인도인 우도를 왕복한다. 주로 인근 지역 주민들이 가볍게 나들이를 하거나 타지 여행객들이 섬 캠핑을 즐기기 위해 이곳을 찾는다. 음지도에 위치한 진해해양공원 내 해양생물테마파크와 해양솔라파크는 다양한 볼거리를 제공한다.</div>
