<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">좌상바위 (한탄강 유네스코 세계지질공원)</h1>
<p class="detail-row"><strong>주소</strong> 경기도 연천군 전곡읍 신답리</p>

<a href="https://map.kakao.com/link/map/%EC%A2%8C%EC%83%81%EB%B0%94%EC%9C%84%20%28%ED%95%9C%ED%83%84%EA%B0%95%20%EC%9C%A0%EB%84%A4%EC%8A%A4%EC%BD%94%20%EC%84%B8%EA%B3%84%EC%A7%80%EC%A7%88%EA%B3%B5%EC%9B%90%29,38.0375655157,127.1034794025" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">한탄강 주변에 약 60m로 우뚝 솟아있는 좌상바위는 중생대 백악기 말의 화산활동으로 만들어진 현무암으로 경관이 압도적이다. 화산의 화구나 화도 주변에서 마그마가 분출하면서 만들어진 것으로 알려져 있다. 바위에 세로 방향으로 띠가 관찰되는 것은 빗물과 바람에 의해 풍화된 것으로 오랜시간 땅 밖으로 드러나 있음을 알 수 있다.</div>
