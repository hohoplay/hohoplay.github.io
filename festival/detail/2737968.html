<a href="https://map.kakao.com/link/map/%EB%B8%94%EB%A3%A8%ED%8C%8C%ED%81%AC,37.8732434402,127.2786903845" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">포천 명덕리 포레스트힐 골프장 앞에 위치하고 있다. 블루파크는 산 좋고 물 좋은 경기도 포천에 위치한 가족형 유원지이다. 깨끗한 야외 수영장을 운영하고 있으며, 펜션에서 숙박이 가능하다. 워터파크는 화학약품을 일절 사용하지 않는 친환경 수질관리를 하고 있다. 부대시설로 샤워실, 화장실, 탈의실, 카페, 편의점 등이 있고 의무실도 운영한다.</div>
