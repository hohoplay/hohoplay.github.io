<p class="detail-row"><strong>주소</strong> 경상북도 김천시 아포읍 회성길 177-8</p>

<a href="https://map.kakao.com/link/map/%EC%89%BC%ED%91%9C%EC%BA%A0%ED%95%91%EC%9E%A5,36.1360255456,128.2732892872" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경북 구미와 김천의 경계지점에 위치하면서 자연과 함께 쉼을 느낄 수 있는 캠핑장이다. 2013년 지자체의 영업허가를 받음으로써 개장하게 되었다. 편안하고 오붓한 환경을 조성하기 위해 최소한의 사이트만 운영하며, 캠핑장 내에는 화장실, 샤워장, 취사장, 냉장고 등 공동으로 활용할 수 있는 편의시설이 제공된다. 구미, 김천 생활권에서 멀지 않으면서 자연을 그대로 느낄 수 있는 캠핑장이다.</div>
