<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">캠핑브릿지</h1>
<p class="detail-row"><strong>주소</strong> 경기도 연천군 장남면 술이홀로63번길 41-17</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A0%ED%95%91%EB%B8%8C%EB%A6%BF%EC%A7%80,37.9707472472,126.8911313572" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 연천군 장남면의 캠핑브릿지(구 장남동산농원)는 파주와 연천을 연결하는 장남교 부근에 위치한 캠핑장으로 임진강 전경이 시원스럽게 펼쳐져 있다. 오토캠핑장 18사이트, 글램핑 6동, 단독 펜션 2동, 단체동 1동을 갖추고 있으며 바닥은 파쇄석이지만 관리동 뒤편 잔디밭에도 텐트를 펼칠 수 있다. 아이들을 위한 야외수영장과 놀이방이 있어 가족단위 캠퍼들의 편의를 도모하고 매점, 화장실, 샤워장, 개수대 등도 잘 갖춰져 있다.</div>
