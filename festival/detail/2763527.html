<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">숲 속 동키마을 캠핑장은 당나귀 농장을 운영하고 있으며, 당나귀 체험이 가능하다. 부대시설로 전기, 무선인터넷, 장작판매, 온수, 물놀이장, 운동시설을 갖추고 있다. 그리고 매점도 있어 먹거리, 캠핑용품 등 간단한 물품 구매가 가능하다. 오토캠핑장으로 운영되며 3 일반 사이트 파쇄석 20개로 구성되어 있다.</div>
