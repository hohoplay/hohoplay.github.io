<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 포천 오토캠핑장 뉴 힐링캠프는 계곡을 끼고 캠핑장이 들어서 어린이들과 물놀이하기에 좋다. 수영장과 트램펄린, 계곡 물놀이까지 즐길 수 있다. 사이트 앞뒤로 나무가 있어 그늘을 이용할 수 있다. 부대시설로는 매점과 수영장, 개수대, 방방이등이 있다. 그리고 와이파이도 설치되어 있어 인터넷 이용도 가능하다는 장점이 있다.</div>
