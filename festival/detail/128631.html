<a href="https://map.kakao.com/link/map/%EC%9E%90%EC%97%B0%EA%B3%BC%EB%B3%84%EC%B2%9C%EB%AC%B8%EB%8C%80,37.9129229664,127.4741797124" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">자연과별 천문대는 가평군 북면 명지산 자락에 위치하여 별을 관측하기에 아주 좋은 최적의 장소에 자리 잡은 천문대로 도심과 1시간 반 거리에 위치하여 접근성도 좋은 곳이다. 개인이나 가족 단위, 학생 등 단체를 위한 다양한 밤하늘 관측 프로그램이 마련되어 있으며, 숙소, 휴게실, 식당, 매점, 수영장, 강의실 등 다양한 부대시설을 갖추고 있다.</div>
