<p class="detail-row"><strong>주소</strong> 경기도 안성시 양성면 미산리</p>

<a href="https://map.kakao.com/link/map/%EB%AF%B8%EC%82%B0%EC%A0%80%EC%88%98%EC%A7%80,37.1314513260,127.2568163482" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">미산저수지는 경기도 안성시 양성면에 위치한 저수지이다. 수려한 풍경을 품고 있는 호수의 전경과 걷기 좋은 산책로는 일상에서 지친 심신을 치유해 준다. 저수지 주변에 예쁜 카페가 많아 데이트 장소로 많이 찾는다. 저수지 둘레길인 솔뫼길을 걷다 보면 미리내 성지도 만날 수 있는데, 이곳에서는 우리나라 천주교 역사를 살펴볼 수 있다.</div>
