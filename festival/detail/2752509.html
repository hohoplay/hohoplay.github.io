<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">산우물쉼터</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안성시 양성면 산정산우물길 138</p>

<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%9A%B0%EB%AC%BC%EC%89%BC%ED%84%B0,37.0820198295,127.1958288016" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">안성 산우물쉼터 캠핑장은 17만평 안성시 산림욕장안에 들어 있는 사유지에 운영되는 사설 캠핑장이다. 이곳에는 텐트를 대여해 주는 이지캠핑이 주를 이루는데, 그늘막 아래 침실용 본텐트와 작은 보조텐트까지 마련되어 있다. 또 캠핑장 바로 위에 낚시가 가능한 대형저수지가 있고 15개 코스의 산림욕길이 조성되어 있다. 주변에 한국인 최초의 신부인 김대건 신부를 모신 미리내성지, 안성맞춤 박물관, 대원군 친필 운수암 등이 있다.</div>
