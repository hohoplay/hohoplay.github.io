<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">클럽프라비다 카라반글램핑</h1>
<p class="detail-row"><strong>주소</strong> 경기도 포천시 이동면 금강로 6531</p>

<a href="https://map.kakao.com/link/map/%ED%81%B4%EB%9F%BD%ED%94%84%EB%9D%BC%EB%B9%84%EB%8B%A4%20%EC%B9%B4%EB%9D%BC%EB%B0%98%EA%B8%80%EB%9E%A8%ED%95%91,38.1080182315,127.3969754542" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">프라비다는 지구촌에서 행복지수가 가장 높은 코스타리카의 인사말이다. 운영자는 클럽 프라비다를 찾는 캠퍼들이 행복한 시간을 갖길 바라는 마음에서 프라비다라는 상호를 선택했다고 한다. 계단식 잔디 사이트로 구성된 캠핑장은 데크 식이고 그 앞으로 작은 계곡이 흐른다. 캠핑 관리동은 모든 사이트를 한눈에 내려다볼 수 있을 만큼 가장 높은 곳에 위치해있다. 관리동엔 카페시설과 휴식을 취할 수 있는 푹신한 소파와 도서들을 구비했다.</div>
