<p class="detail-row"><strong>주소</strong> 강원특별자치도 화천군 간동면 배터길 36-8</p>

<a href="https://map.kakao.com/link/map/%ED%8C%8C%EB%A1%9C%ED%98%B8%28%ED%99%94%EC%B2%9C%29,38.0993652277,127.7779270055" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">파로호는 화천댐이 만들어지면서 생겨난 인공 호수로 1944년 화천댐을 완공하면서 생겼다. 파로호는 멀리서 바라보면 마치 상상 속의 봉황이 날개를 펴고 날아가는 대붕의 모습처럼 보인다고 해서 대붕호라고 이름이 붙여졌다. 광복 이후에는 북한에 속했던 지역이였으나 한국전쟁 때 되찾아 이를 치하하기 위해 이승만 전 대통령이 화천을 직접 방문해 깨트릴 파자와 오랑캐의 노자를 써서 파로호라고 이름을 지었다.</div>
