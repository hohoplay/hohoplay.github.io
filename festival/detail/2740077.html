<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평, 명지산 깊은 계곡을 끼고 조성된 자우림 캠핑장은 캠핑과 펜션 이용이 가능한 곳이다. 캠핑의 경우 오토캠핑과 일반 캠핑 구분 없이 사이트를 이용할 수 있고, 소형 카라반이나 트레일러의 경우 출입이 허용된다. 수량이 풍부한 계곡은 여름철 물놀이에 충분하다 보니 계곡 가까이 있는 나무 데크의 경우 경쟁률이 치열하다. 캠핑장에는 족구장이 따로 마련되어 있다.</div>
