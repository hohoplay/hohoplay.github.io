<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">앵자봉</h1>
<p class="detail-row"><strong>주소</strong> 경기도 광주시 퇴촌면 우산리</p>

<a href="https://map.kakao.com/link/map/%EC%95%B5%EC%9E%90%EB%B4%89,37.4164514615,127.3978177292" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 광주시 퇴촌면 우산리에 위치한 앵자봉은 꾀꼬리가 알을 품고 있는 산세로 정상에 오르면 동쪽으로는 양자산이, 서쪽으로는 무갑산이 내려다보인다. 산은 667m로 높은 편은 아니지만 신유박해 때 가톨릭교도들이 박해를 피해 숨어들었을 만큼 산속으로 들어가면 갈수록 심산유곡에 들어선 듯한 느낌을 받는다. 한국천주교회의 발상지 천지암이 자리하고 있어 천주교인들에겐 잘 알려진 산이다.

(출처 : 경기도 광주시 문화관광)</div>
