<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%A4%91%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,35.8254384276,127.8023617292" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경남 거창에 위치한 산중오토캠핑장은 덕유산 자락 숲 속 안에 자리한 캠핑장이다. 산중오토캠핑장은 아이들이 즐겁고 부모들이 편안한 조용하고 아늑한 캠핑장을 만들어가고 있다. 숲속 사이트는 조용한 감성 캠핑을 즐기기 원하는 분들이 이용하기 좋고 계곡 사이트는 가족, 자녀와 함께 하는 분들이 이용하기 좋다. 캠핑장 내에는 매점이 있어 간단한 물품 구매가 가능하다. 또 다른 부대시설로는 화장실 및 샤워실, 개수대가 있다.</div>
