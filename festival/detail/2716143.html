<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">예천삼강문화단지는 정부의 3대 문화권 문화생태관광기반 조성사업의 일환으로 추진된 관광지 조성사업으로 기존관광자원과 연계하여 다양한 볼거리와 함께 전시, 체험, 교육이 하나의 공간에서 가능하도록 조성된 가족형 문화체험 관광지구이다. 이 단지 내에 조성된 생태공원은 춤추는 음악분수, 벽천분수, 야외 조형물, 파고라, 어린이 식물 놀이터, 어린이 실외 놀이터, 다목적 운동장, 테마숲으로 조성되어 있고 휴식공간을 제공하는 곳이다.</div>
