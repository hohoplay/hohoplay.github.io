<a href="https://map.kakao.com/link/map/%EC%96%91%ED%8F%89%EC%88%98%EB%AA%A9%EC%9B%90%EC%BA%A0%ED%95%91%EC%9E%A5,37.4486016440,127.6113502301" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">양평 수목원 캠핑장은 경기도 양평군 지평면 양평 수목원 내 위치하고 있다. 수목이 어우러진 캠프 존, 글램핑을 체험할 수 있는 스위트 카라반, 부모님과 아이들이 함께할 수 있는 호숫가 멋진 풍경의 레이크 펜션을 운영하고 있다. 아이들을 위한 부대시설로 수영장, 어린이 놀이터, 도서관이 있다. 총 140면 캠핑장 규모로 수목원에서 조성한 산책길이 으뜸이다.</div>
