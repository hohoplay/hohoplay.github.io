<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">송지호 해수욕장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 고성군 죽왕면 오호리</p>

<a href="https://map.kakao.com/link/map/%EC%86%A1%EC%A7%80%ED%98%B8%20%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,38.3307331455,128.5279598643" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">송지호 해수욕장은 백사장 길이 2㎞, 폭 100m에 물이 맑고 깊이가 얕으며, 근처에는 죽도와 설악산이 위치하고 있다. 바다 전면에는 대나무와 기암괴석이 어우러진 죽도가 놓여 있어 경관이 아름답기로 유명하다.
해수욕장 북쪽 500m 거리에 위치한 송지호는 동해안의 대표적인 천연 석호와 겨울철새인 고니의 도래지로도 유명한 곳이며, 담수와 바닷물이 만나는 곳으로 바닷물고기와 민물고기가 함께 서식하여 바다 낚시터로도 알려져 있다.</div>
