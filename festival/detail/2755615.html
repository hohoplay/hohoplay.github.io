<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">오하브는 경기 가평군 북면에 자리잡은 캠핑장이다. 야외 대형 수영장이 있어 여름 물놀이를 하기에 좋은 곳이다. 반려견과 동반 물놀이가 가능하다. 도보 1분 거리에 있는 가평천에서 물놀이도 가능하다. 보드게임을 무료로 대여하고 있으며 족구, 배드민턴, 동절기 얼음썰매장, 파동석 저온찜질방을 제공하고 있다. 유료로 이용가능한 당구/포켓볼장도 있다.</div>
