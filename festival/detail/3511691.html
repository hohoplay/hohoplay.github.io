<p class="detail-row"><strong>주소</strong> 충청북도 보은군 산외면 성암가고로 235-6</p>

<a href="https://map.kakao.com/link/map/%EC%9D%BC%EC%83%81%ED%99%94%EA%B8%80%EB%9E%A8%ED%95%91%28%EC%A3%BC%EC%8B%9D%ED%9A%8C%EC%82%AC%EC%9D%BC%EC%83%81%ED%99%94%29,36.5846305199,127.6974780845" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">주식회사일상화가 운영하는 ‘일상화글램핑’은 폐교를 활용해 조성한 공간이다. 약 3,500평 규모의 운동장에서는 계절별 꽃축제와 겨울철 대형 트리 축제가 열리며, 개별 노천스파가 마련된 글램핑장 7동과 야외 셀프 바비큐장을 운영하고 있다. 건물 내부에는 미술관과 굿즈샵 3개관, 다양한 콘셉트의 카페가 함께 마련되어 있어 숙박과 함께 문화 체험도 즐길 수 있는 공간이다.</div>
