<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원특별자치도 고성군 토성면에 위치한 도원리계곡은 많이 알려지지 않은 숨은 명소지만, 한번 찾은 사람은 꾸준히 찾게 된다는 물이 맑고 깨끗한 계곡이다. 물살이 세지 않고 깊이가 얕아 어린이들과 함께 놀기 좋다. 매년 여름휴가철에는 도원리 마을휴양지로 운영되고 있다. 주변에 도원저수지와 함께 멋진 풍광을 자랑한다.</div>
