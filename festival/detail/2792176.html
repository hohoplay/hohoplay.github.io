<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">아리힐스 글램핑</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 정선군 정선읍 병방치길 235</p>

<a href="https://map.kakao.com/link/map/%EC%95%84%EB%A6%AC%ED%9E%90%EC%8A%A4%20%EA%B8%80%EB%9E%A8%ED%95%91,37.3634334552,128.6348326604" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">스카이워크 아래쪽 치유의 숲 입구에 조성되어 있는 글램핑장으로 해발 680m의 정상에서 싱그러운 숲속의 바람과 함께 한여름 밤을 즐길 수 있도록 다양한 편의 시설들을 갖추고 있다. 에어컨, 냉장고, 바비큐 그릴 완비, 인덕션, 전기 포트, 수저 세트 등 간단한 취사도구가 준비되어 있고, 화장실과 샤워실은 실외에 마련되어 있다. 글램핑 객실마다 개별 바비큐장이 있고, 별도의 공동 바비큐장도 하나 더 있다.</div>
