<a href="https://map.kakao.com/link/map/%EC%86%94%EB%B0%94%EB%8B%A4%EC%BA%A0%ED%95%91%EC%9E%A5,37.2746816309,126.4532769940" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">17개 사이트로 규모는 크지 않지만 바다가 보이는 오션뷰 캠핑장이다. 해수욕장까지 2~3분 거리로 아이들과 물놀이하기 좋다. 해수욕장 근처 편의점, 카페 등 주변 편의시설 이용이 편하다. 캠핑 사이트는 키 큰 소나무가 많아 그늘이 적당하고, 아이들이 좋아하는 트램펄린 등 놀이시설도 갖춰져 있다.</div>
