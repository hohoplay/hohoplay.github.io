<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">홍천강이 흐르는 강변 야영장은 강원도 인제군 북면에 위치하고 있다. 뒤로는 산으로 둘러싸여 있어 아늑한 느낌을 준다. 홍천강에서 낚시도 즐길 수 있으며 계곡 물놀이가 가능하다. 에움 녹색길을 조성하여 다양한 산책로 코스를 즐길 수 있다. 개야리 종자산 복주머니 마을에서 다양한 농촌체험이 가능하다. 부대시설로는 샤워장, 개수대 등이 있으며 전기 사용이 가능하다는 장점이 있다.</div>
