<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">송포항은 변산해수욕장의 남단에 움푹 들어간 곳에 위치한 작은 어항이다. 지역 특산물로는 노랑조개, 도다리, 오징어 등이 있다. 작은 어선을 정박해 놓는 항구이며 주로 변산 마실길을 즐기는 사람들이 찾는다.
송포항은 변산 마실길 2코스인 노루목 상사화길의 시작점이다. 봄에는 송포항 앞 야산 언덕에 하얀 샤스타데이지꽃이 만발한다. 군락을 이룬 하얀 꽃밭과 푸른 바다를 배경으로 셔터를 누르는 순간 인생 사진이 탄생할 것이다.</div>
