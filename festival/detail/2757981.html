<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">상순네 오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 중동면 고장골길 76-6</p>

<a href="https://map.kakao.com/link/map/%EC%83%81%EC%88%9C%EB%84%A4%20%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.1550578902,128.6584117719" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">상순네 오토캠핑장은 영월에 위치한 캠핑장으로 탁 트인 경치와 아동용 성인용 수영장을 각각 갖춘 가족 캠핑장이다. 캠핑장 바닥은 파쇄석이고, 사이트는 바닥 데크와 함께, 대부분의 사이트에 키 높은 타프가 설치되어 있다. 덕분에 눈과 비를 피해서, 텐트 보호하고, 그늘이 확보되어 쾌적하다. 트레일러나 캠핑카도 입영 가능한 사이트도 준비되어 있다. 겨울 시즌에는 장박 이용이 가능하다.</div>
