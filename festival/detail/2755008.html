<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">캐나디언 카누클럽 캠핑장은 천혜의 카누잉 장소인 홍천강 마곡 귀퉁이에 둥지를 틀고 있다. 카누투어, 카누 아카데미등의 프로그램을 함께 운영하고 있다. 지하 150m 암반수, 온수를 제공하고 있어 카누 투어 후에 몸을 녹일 수 있다. 애견 카누투어 프로그램도 운영하고 있어 반려견과 즐거운 시간을 보낼 수 있다.</div>
