<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">임랑카라반파크</h1>
<p class="detail-row"><strong>주소</strong> 부산광역시 기장군 일광면 일광로 763</p>

<a href="https://map.kakao.com/link/map/%EC%9E%84%EB%9E%91%EC%B9%B4%EB%9D%BC%EB%B0%98%ED%8C%8C%ED%81%AC,35.3095065653,129.2593979022" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">오션뷰를 자랑하는 임랑 카라반 파크는 부산시 기장군 일광면 임랑 바닷가 앞에 위치해 있다. 사이트에 앉아 시원한 바다와 일출을 볼 수 있는 장점이 있다. 펜션과 카라반이 함께 있는 캠핑장으로 카라반은 2인 커플용과 4인, 6인용이 있다. 주차도 카라반 가까이할 수 있을 만큼 넉넉하다. 해안 도로에 서있는 빨간 풍차 모형이 임랑 카라반 파크를 알리는 오랜 조형물이다.</div>
