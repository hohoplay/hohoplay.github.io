<p class="detail-row"><strong>주소</strong> 강원특별자치도 삼척시 원덕읍 월천리 178-1</p>

<a href="https://map.kakao.com/link/map/%EC%9B%94%EC%B2%9C%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,37.1612261605,129.3533495391" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">월천해수욕장은 삼척시에서 남쪽으로 약 40㎞ 떨어진 곳에 있는 원덕읍에 있는 해변으로, 강원도에서 제일 아래쪽인 최남단에 위치하고 있다. 매년 여름에는 해수욕장으로 운영되며, 약 8,264㎡ 면적의 야영장도 개장하고 있다. 수려하고 아름다운 자연환경이 일품이기 때문에 굉장히 매력적인 해변으로 각광받고 있다. 해변 옆에는 월천유원지를 볼 수 있는데 캠핑 중심의 시설이 갖추어진 마을 관리 휴양지이다. 해변과 함께 관광하기 좋다.</div>
