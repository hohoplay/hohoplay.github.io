<a href="https://map.kakao.com/link/map/%EB%94%94%ED%81%90%EB%B8%8C%EC%8B%9C%ED%8B%B0%20%ED%95%B4%EB%B0%94%EB%9D%BC%EA%B8%B0%20%EA%B3%B5%EC%9B%90,37.5062901367,126.8854062045" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">신도림역과 직접 연결되어 있어 접근성이 우수하며, 도심 속에서 자연과 휴식을 즐길 수 있는 공간이다. 약 6,000평 규모로, 해바라기 광장, 야생화 계곡, 장미터널, 770석 규모의 야외극장 등 다양한 시설을 갖추고 있다. 특히 밤에는 화려한 조명과 분수가 어우러져 가족, 친구, 연인들에게 인기 있는 장소이다.</div>
