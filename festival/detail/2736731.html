<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">산동참생태숲</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 구미시 산동읍 인덕1길 240</p>

<a href="https://map.kakao.com/link/map/%EC%82%B0%EB%8F%99%EC%B0%B8%EC%83%9D%ED%83%9C%EC%88%B2,36.1774492960,128.4613575819" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">구미 시민들의 쾌적한 휴식처로 각광받고 있는 산동참생태숲은 숲 속에서 다양한 체험이 가능한 곳이다. 참신한 목공예작품들을 테마별로 자체제작,전시하여 다양한 볼거리를 제공하고 있으며, 유치원 및 초등학생을 대상으로 산림생태체험(목공예,곤충,야생화관찰 등) 프로그램을 운영하는등 산림문화 체험 기회를 연중 제공하고 있다.  또한 느린 우체통, 폐목재로 만든 뱃살건강검색대, 산울림 밴드, 유아모래놀이터 등을 갖추고 있다.</div>
