<p class="detail-row"><strong>주소</strong> 경기도 용인시 처인구 모현읍 초부로 215-7</p>

<a href="https://map.kakao.com/link/map/%EB%AF%B8%EB%A5%B4%ED%9E%90,37.3153857619,127.2652326262" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">용인미르힐은 경기도 용인 정광산과 용인자연휴양림 계곡 바로 옆에 위치한 오토캠핑장이다. 정광산의 피톤치드 가득한 자연을 느낄 수 있는 매력이 있다. 용인 미르힐은 자연체험장을 운영 중이며 전망 좋은 오토캠핑, 프리미엄펜션, 럭셔리 카라반을 운영하고 있다. 캠핑장에는 화장실, 샤워장, 개수대, 대피소 등의 부대시설이 갖춰져 있다.</div>
