<p class="detail-row"><strong>주소</strong> 경기도 양평군 용문면 장수길 22</p>

<a href="https://map.kakao.com/link/map/%EC%98%A4%EC%BB%A4%EB%B9%8C%EB%A6%AC%EC%A7%80,37.5090826493,127.5636361385" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">오커 빌리지는 용문산의 맑은 공기와 상원계곡 물줄기가 흐르는 청정지역에 자리 잡고 있다. 아름다운 정원과 주변에는 복숭아, 배 과수원 풍경이 펼쳐져 더욱 아늑한 공간 같은 느낌을 받을 수 있다.  부대시설로 놀이터, 야외수영장, 바비큐장, 매점, 야외무대 등이 갖추어져 있다. 주변 둘러볼만한 곳으로 지평 의병지 평리 전투 기념관, 화서 이항로 생가, 상원사, 양평 곤충 박물관, 황순원 문학촌 소나기 마을 등이 있다.</div>
