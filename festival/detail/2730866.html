<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">충주카누캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 충청북도 충주시 동량면 지등로 1276-4</p>

<a href="https://map.kakao.com/link/map/%EC%B6%A9%EC%A3%BC%EC%B9%B4%EB%88%84%EC%BA%A0%ED%95%91%EC%9E%A5,36.9758804137,128.0209852555" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">카누 캠핑장은 충주시청을 기점으로 약 15㎞ 거리의 충주호와 인접해 있다. 캠핑사이트에서 충주호가 내려다 보이는 조망권을 갖추고 있어 방문하는 손님들마다 힐링을 얻고 간다. 19면 일반 야영장은 자갈로 바닥을 이루고 있다. 사이트 크기는 가로 6m 세로 13~16m이고 겨울을 제외한 봄, 여름, 가을에만 운영한다. 반려견의 경우 소형견에 한해 동반 입장이 가능하고 캠핑장 주변의 충주 강변길이 산책로로 인기다.</div>
