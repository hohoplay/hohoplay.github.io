<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">용가리쌤 캠핑장은 강원도 홍천군 화촌면에 자리 잡고 있다. 용가리쌤캠핑장은 주변 경관이 뛰어난 홍천강 앞에 자리하여 아름다운 경치와 맑은 공기를 즐기실 수 있다. 수영장, 놀이방방 등 다양한 키즈 부대 서비스로 쾌적한 시간을 보내실 수 있다. 캠핑장 주변에는 산, 계곡 등이 가까이 위치하여 각종 놀이시설과 즐길거리들이 다양하게 있어 가족, 단체, 연인들을 막론하고 누구나 즐거운 시간을 보내실 수 있다.</div>
