<p class="detail-row"><strong>주소</strong> 전북특별자치도 진안군 부귀면 두남리 170</p>

<a href="https://map.kakao.com/link/map/%EB%91%90%EB%82%A8%EC%B2%9C,35.8430101674,127.4170787716" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">금강 상류의 한 지류로 정천면 월평계곡까지 6㎞를 흐른 뒤 용담호에 흘러든다. 오염되지 않은 맑은 물과 수려한 산세를 유지하고 있으며, 수심이 낮은 곳에서부터 깊은 곳까지 다양하게 형성되어 있고, 쉴 수 있는 그늘이 충분해 휴양지로 적합하다. 물속에는 작은 물고기에서부터 낚시가 가능한 물고기까지 살고 있고, 다슬기를 잡을 수 있어서 가족 동반 여름철 피서지로도 좋다.</div>
