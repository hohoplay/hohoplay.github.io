<a href="https://map.kakao.com/link/map/%EC%9D%98%EC%84%B1%20%EC%99%9C%EA%B0%80%EB%A6%AC%EC%83%9D%ED%83%9C%EB%A7%88%EC%9D%84,36.4846766522,128.5279818491" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">의성 왜가리생태마을은 자연생태계를 보전·관리하여 자연과 사람이 공존하기 위하여 조성되었다. 의성 청학마을은 1900년 초부터 여름철새인 왜가리(청학)와 백로(백학)가 찾아오는 곳으로 우리나라 최대 왜가리 서식지였던 곳이다. 이에 따라 민가와 떨어진 곳에 생태 체험이 가능한 관광지로 조성되었다. 또한 왜가리생태관도 자리하고 있다. 이곳은 왜가리뿐만 아니라 다양한 조류들을 보고 정보를 얻어갈 수 있는 유익한 공간이다.</div>
