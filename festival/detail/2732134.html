<a href="https://map.kakao.com/link/map/%EA%B1%B0%EC%9E%A5%EC%82%B0%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,35.4378404967,128.2612372301" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경남 의령군에 위치한 오토 캠핑장이다. 폐교가 된 의동 중학교를 리모델링하여 캠핑장으로 개발하였다. 각각의 캠핑 사이트는 야트막한 나무 담장으로 구분되어 있다. 편의 시설인 샤워장, 화장실, 관리사무실, 매점 등은 모두 건물 안에 있으며 전기 사용이 가능하고 릴선을 준비해 오면 편하다. 인근에 유학사와 찰비계곡, 자굴산 등 자연과 어우러지는 관광지를 즐길 수 있다.</div>
