<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">문암생태공원</h1>
<p class="detail-row"><strong>주소</strong> 충청북도 청주시 흥덕구 문암동</p>

<a href="https://map.kakao.com/link/map/%EB%AC%B8%EC%95%94%EC%83%9D%ED%83%9C%EA%B3%B5%EC%9B%90,36.6745490433,127.4478174154" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">문암생태공원은 1994년~2000년까지는 생활쓰레기 매립장이었지만 안정화 작업을 거친 후 2010년 도심형 테마공원으로 개장하였다. 이 공원은 생태공원, 웰빙공원, 가족공원으로 나뉘어 있으며, 생태공원에는 생태습지원, 수목원, 생태탐방로 등이, 웰빙공원에는 건강숲 체험장, 테마 웰빙숲, 농구장 등이, 가족공원에는 조깅코스, 캠핑장 등이 있다.</div>
