<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">범바위캠핑정원은 김포시 대곶면 율생리에 있다. 수도권 서부에서 접근성이 좋다. 데크와 파쇄석 사이트가 총 63면으로 조성되어 있고, 전기와 온수, 화장실, 샤워실, 취사장 등의 편의시설이 있다. 게시판 예약방식으로 예약이 가능하다. 인근에 김포 수안산성, 대명항, 대명포구 회타운 등의 관광지가 있다.</div>
