<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 남면 남노일로 1164-22</p>

<a href="https://map.kakao.com/link/map/%EC%8A%A4%ED%86%A4%EC%97%91%EC%8A%A4%EC%BA%A0%ED%95%91%EC%9E%A5,37.6813884601,127.7569857904" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">스톤엑스캠핑장은 강원도 홍천에 있다. 캠핑장 바로 앞에 홍천강이 있어 물놀이와 낚시를 즐길 수 있다. 캠핑장 뒤로는 나무가 울창한 산이 있는 자연캠핑장이다. 부대시설로 개수대 및 샤워시설, 매점이 있으며 원칙상 반려견 동반은 불가능하지만, 소형 반려견 동반은 가능하다. 주변 관광지로는 비발디파크(스키월드, 오션월드), 팔봉산, 홍천온천 등이 있다.</div>
