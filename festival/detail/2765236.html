<a href="https://map.kakao.com/link/map/%EC%99%95%EB%B0%A9%EA%B3%84%EA%B3%A1,37.8956545186,127.1155157560" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">왕방계곡은 동두천 시내에서 동쪽 8㎞ 지점에 위치한 왕방마을 일대 계곡을 말하며, 왕방산서쪽 왕방폭포에서 출원한 맑은 물줄기가 흘러내리는 청정한 계곡으로, 석벽, 암반, 기암괴석이 조화를 이룬다. 계곡 명소로는 낭바위,아들바위, 층대바위, 줄바위와 왕방폭포 등이 있고 자연 그대로의 모습이 친근감을 더해준다.

(출처 : 동두천시 문화관광)</div>
