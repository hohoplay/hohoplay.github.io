<p class="detail-row"><strong>주소</strong> 강원특별자치도 양구군 양구읍 파로호로869번길 109</p>

<a href="https://map.kakao.com/link/map/%EC%9D%B8%EB%AC%B8%ED%95%99%EB%A7%88%EC%9D%84%20%EC%BA%A0%ED%95%91%EC%9E%A5,38.1221525378,127.9822937880" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">인문학마을 캠핑장은 양구 출신의 철학자와 문학가들을 기리기 위해 개관한 양구 인문학 박물관이 있는 인문학 마을의 캠핑장이다. 마을에서 운영하는 캠핑장으로 가격이 저렴한 편인데, 용머리공원 내에 총 2개의 캠핑장이 있고, 오토캠핑장이 아니라 주차장에 주차 후에 짐을 사이트로 옮겨야 한다. 특히 1캠핑장이 같은 가격임에도 데크 사이트가 넓고 간격 또한 여유로워 인기다.</div>
