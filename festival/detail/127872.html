<p class="detail-row"><strong>주소</strong> 강원특별자치도 삼척시 근덕면 맹방해변로 228-239</p>

<a href="https://map.kakao.com/link/map/%EB%A7%B9%EB%B0%A9%ED%95%B4%EB%B3%80,37.3898030893,129.2320061341" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">삼척 시내에서 7㎞가량의 거리에 있는 시범해수욕장이며 맹방 관광지 내에 속한 지역으로서 기반 도로 시설이 잘 정비되고 관광지 조성 공사가 진행 중인 곳으로 이미 청정 해변의 이미지가 전국에 잘 알려져 있다. 개장 기간에는 명사십리 달리기대회를 비롯하여 맨손 송어 잡기 등 다양한 해변 이벤트가 개최되어 피서객의 호응도를 높이는 한편, 인접 지역의 골프 연습장이 스포츠 산실 역할을 하고 있다.</div>
