<a href="https://map.kakao.com/link/map/%EC%84%9C%ED%9B%84%EB%A6%AC%EC%BA%A0%ED%95%91%EC%9E%A5,37.5727865054,127.4193307289" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">서후리캠핑장은 경기 양평군 서종면에 위치한 곳이다. 캠핑장 바로 앞을 흐르는 계곡에서 물놀이를 하기에 좋고, 야외수영장에서 안전하게 물놀이를 즐길 수도 있다. 부대시설로는 매점, 화장실, 샤워시설, 개수대, 전기, 온수를 제공하고 있다. 나무장작, 부탄가스, 이소가스, 숯을 비롯한 간단한 먹거리들을 판매하고 있는 매점도 이용가능하다. 가까운 산으로 등산을 가기에도 좋다. 소형 반려동물은 동반이 가능하나 리드줄 착용은 필수이다.</div>
