<p class="detail-row"><strong>주소</strong> 전북특별자치도 임실군 강진면 이윤길 76</p>

<a href="https://map.kakao.com/link/map/%EC%A0%80%EC%8A%A4%ED%8A%B8%EA%B8%80%EB%9E%A8%ED%95%91,35.5633261132,127.1471267186" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">임실군에 위치한 글램핑장이다. 한국 시골의 느티나무 숲이 우거진 곳에 아름답고 아늑한 몽골 게르가 있다. 게르는 캔버스 해먹에서 휴식을 취하면서 시원한 물소리를 즐길 수 있는 작은 강을 따라 자리 잡고 있다. 또한 엠퍼러 텐트가 준비되어 있어 감성적인 소품들과 함께 사진 찍기 좋다. 그리고 버블호텔이 있어 동화 속에 온듯한 이색경험도 가능하다.</div>
