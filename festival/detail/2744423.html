<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">아시아에서 가장 어두운 밤하늘에서 즐기는 은하수 체험을 제공하는 주식회사별따는영양은 산골 오지의 깊은 자연 생태가 고스란히 보존된 곳에서, 영양수비별빛캠핑장과 수비목공방을 운영하고 있다. 은하수가 쏟아지는 국제 밤하늘공원과 반딧불이 생태공원 인근에 위치해 있으며, 청소년 스타핑 스쿨, 오지 은하수 별빛샤워 등 독창적인 체험 프로그램도 함께 운영한다.</div>
