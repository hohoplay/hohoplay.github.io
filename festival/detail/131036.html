<p class="detail-row"><strong>주소</strong> 강원특별자치도 춘천시 삼천동</p>

<a href="https://map.kakao.com/link/map/%EC%9D%98%EC%95%94%ED%98%B8,37.8911548876,127.7106199172" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">의암호는 강원도 춘천시에 위치한 인공호수로, 북한강 중류에 의암댐이 건설되면서 형성되었다. 1967년 의암댐 건설과 함께 조성되었으며, 이로 인해 춘천은 ‘호반의 도시’로 불리게 되었다. 호수 주변에는 붕어섬, 하중도, 상중도, 고구마섬 등 여러 섬이 있으며, 물레길 카누 체험, 자전거 라이딩, 윈드서핑 등 다양한 레포츠 활동이 가능하다. 또한 삼악산, 흥국사, 애니메이션박물관 등 관광 명소가 인접해 있어 사계절 내내 많은 관광객이 찾는다.</div>
