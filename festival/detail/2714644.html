<a href="https://map.kakao.com/link/map/%EC%BC%84%EC%8B%B1%ED%84%B4%ED%95%B4%EB%B3%80,38.2429470182,128.5724224583" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">고성군 최남단 해변으로 넓고 긴 백사장과 맑은 바닷물이 으뜸으로 수심이 낮아 콘도미니엄 이용자들과 일반 가족단위 피서객이 많이 찾는 곳으로 일광욕과 해수욕을 즐기기에 안성맞춤 인 곳이다. 켄싱턴해변에 위치한 켄싱턴리조트 설악비치는 바닷가에 위치해 있으며, 설악과 동해바다가 한눈에 펼쳐진다. 넓은 백사장과 아름다운 바닷가에서는 가족과 함께 깨끗하고 쾌적하게 해수욕을 즐길 수 있다.</div>
