<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">늘푸른 관광농원은 강원도 춘천시 북산면에 위치하고 있다. 테크 사이트 4를 운영하고 있는 작은 오토캠핑장이다. 산에 둘러싸여 있어 공기가 맑고 깨끗하며 추곡 약수터 바로 앞에 자리 잡고 있어 청정수를 자랑하는 계곡에서 물놀이를 하기에 좋다. 부대시설로는 개별화로대, 화장실, 샤워실, 개수대, 전기, 온수를 제공하고 있다.</div>
