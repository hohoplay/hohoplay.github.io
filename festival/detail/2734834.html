<a href="https://map.kakao.com/link/map/%EA%B3%A0%EA%B8%B8%EB%8F%99%EC%BA%A0%ED%95%91%EC%9E%A5,37.8277284586,127.8341022345" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">홍천과 춘천 경계를 이루는 대룡산 중턱의 청정지역에 위치한 고길동 캠핑장이다, 깨끗한 계곡, 새소리, 반딧불이, 쏟아지는 별 아래에서 힐링할 수 있다. 서울 양양 간 고속도로 강일 IC 기준으로 1시간 거리에 있다. 인접한 계곡에서 여름 물놀이가 가능하다. 가족과 함께 즐기기에 좋은 캠핑장이다. 주변 관광지로는 홍천 9경, 인삼 한우 명품축제, 홍천 찰옥수수축제, 연화사 수타사 등이 있다.</div>
