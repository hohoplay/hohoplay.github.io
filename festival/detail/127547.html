<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 여수시 만성리길 15-1</p>

<a href="https://map.kakao.com/link/map/%EB%A7%8C%EC%84%B1%EB%A6%AC%20%EA%B2%80%EC%9D%80%EB%AA%A8%EB%9E%98%ED%95%B4%EB%B3%80,34.7771528453,127.7447914615" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">만성리 검은모래해변의 가장 큰 특징은 보기 드문 검은 모래해변이라는 점이다. 시원스러운 경치와 검은 모래 덕분에 여름이면 관광객들이 바닷가를 가득 메운다. 이곳은 모래찜질로 유명한데, 신경통과 각종 부인병에 효험이 있는 것으로 알려져 있다. 특히 오래전 부터 음력 4월 20일은 ‘검은 모래 눈 뜨는 날’이라는 민간풍습이 있어 이날이 되면 전국에서 모래찜질을 하러 사람들이 모여든다.</div>
