<p class="detail-row"><strong>주소</strong> 강원특별자치도 삼척시 삼척로 4246-28 (오분동)</p>

<a href="https://map.kakao.com/link/map/%ED%83%80%EC%9A%94%EC%BA%A0%ED%95%91%EC%9E%A5,37.4210959802,129.1946779535" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">타요 캠핑장은 맹방 해수욕장과 삼척항 사이에 위치한 오분리 해변 펜션마을의 가장 안쪽에 자리 잡고 있다. 이스트오션 펜션과 함께 운영되고 있는 이곳은 단 6대의 카라반이 구비되어 있지만 모든 카라반에서 바다를 조망할 수 있어 인기가 많다. 카라반마다 바비큐 장비가 구비된 테라스가 마련되어 있고 키즈놀이터와 유아풀장, 포토존, 작은 카페를 갖추고 있다.</div>
