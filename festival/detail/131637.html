<p class="detail-row"><strong>주소</strong> 경상북도 봉화군 상운면 하눌리</p>

<a href="https://map.kakao.com/link/map/%ED%95%98%EB%88%8C%EC%A0%80%EC%88%98%EC%A7%80,36.8822499508,128.7857251454" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경상북도 봉화군 상운면에 자리하고 있는 하눌저수지는 1999년도에 준공되었다. 주변에는 공터와 정자가 조성되어 있어 쉬었다 가기 좋다. 또한 데크로 만들어진 산책로도 조성되어 있어 자연을 배경 삼아 한적하게 걷기 좋다. 가을에는 주변 산이 단풍으로 물들어 더욱 아름다운 자연경관을 감상할 수 있다. 하눌저수지로 가는 하눌로변에는 코스모스, 맨드라미, 메리골드 등이 피어있는 모습도 볼 수 있다.</div>
