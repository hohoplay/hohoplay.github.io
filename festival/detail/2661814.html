<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">만인산 자연휴양림</h1>
<p class="detail-row"><strong>주소</strong> 대전광역시 동구 산내로 106</p>

<a href="https://map.kakao.com/link/map/%EB%A7%8C%EC%9D%B8%EC%82%B0%20%EC%9E%90%EC%97%B0%ED%9C%B4%EC%96%91%EB%A6%BC,36.2022976798,127.4547630291" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">조선시대에는 산세가 수려하여 태조대왕과 왕자의 태를 모시기도 했던 만인산, 이곳에 만인산 자연휴양림이 위치해 있다. 만인산자연휴양림은 1997년에 개장하여 활엽수가 울창한 산림을 이루고 있는 도시근교 휴양림으로 도시민들의 쾌적한 휴식처 역할을 한다. 만인산 푸른 학습원 인근에 위치한 자연휴양림 내에는 학습농장과 자연관찰로, 만인루각, 만인산 휴게소 등의 시설이 있다. 또 유형문화재 131호인 이태조태실도 볼 수 있다.</div>
