<p class="detail-row"><strong>주소</strong> 제주특별자치도 제주시 애월읍 평화로 2346</p>

<a href="https://map.kakao.com/link/map/%EC%A0%9C%EC%A3%BC%EB%B6%88%EB%B9%9B%EC%A0%95%EC%9B%90,33.4226259562,126.4089792859" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">제주불빛정원은 2017년 개장한 이래 제주관광공사에서 선정한 제주야간관광 10선에 선정되는 등 아름다운 제주도의 밤을 가족과 친구들과 보낼 수 있는 야간 축제 관광지로써 발전해 왔다. LED조명과 아름다운 조형물을 기획하고 설치하는 기술을 토대로 아름다운 추억과 감성을 느낄 수 있도록 끊임없이 연구하고 있다. 제주도의 야간관광을 활성화하여 제주도를 방문하는 관광객들에게 더욱 알찬 관광의 기회를 제공하고 지역사회에 기여하고 있다.</div>
