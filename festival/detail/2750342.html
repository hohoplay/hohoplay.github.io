<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">배다리 호수를 끼고 공원이 잘 조성된 저수지로 도심 속에 자리 잡고 있어 접근성이 좋다. 저수지 한가운데 분수가 있어 분수 가동 시간에는 분수 쇼도 볼 수 있다. 낮에는 자연과 어우러진 아름다운 풍경을 볼 수 있고, 밤에는 조명과 어우러진 멋진 야경을 볼 수 있다. 주변의 산책길을 걸으며 건강도 챙기며 힐링하기 좋은 곳이다.</div>
