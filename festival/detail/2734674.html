<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">화명오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 부산광역시 북구 낙동강자전거길 1425 (덕천동)</p>

<a href="https://map.kakao.com/link/map/%ED%99%94%EB%AA%85%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,35.2164177357,128.9995730939" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">화명오토캠핑장은 부산광역시 북구 덕천동 인근에 위치한 캠핑장으로 야구장, 축구장, 테니스장, 농구장, 인라인스케이트장 등 11종의 체육시설을 다양하게 갖추고 있다. 자연학습을 할 수 있는 연꽃단지와 수상데크와 수상체험 할 수 있는 수상레포츠시설, 야외수영장에서 자연을 즐길 수 있는 공간이다. 도심에서 벗어나 한적한 자연에서 지친 마음을 달래며 힐링할 수 있다. 또한 화명신도시와 인접해 시민들의 활용도가 높은 곳이기도 하다.</div>
