<p class="detail-row"><strong>주소</strong> 강원특별자치도 횡성군 청일면 속실길 20</p>

<a href="https://map.kakao.com/link/map/%EC%B2%AD%EC%9D%BC%EA%B4%80%EA%B4%91%EB%86%8D%EC%9B%90,37.6411367614,128.1585311570" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 횡성의 조용한 시골마을에 위치한 캠핑장이다. 청일면소재지에서 홍천 서석으로 넘어가는 국도 19호선을 따라가다 국사랑 토마토로 유명한 유리온실을 지나서 운무산 표지판이 보이는 속실리로 조금 들어가면 길목에 위치하고 있다. 계곡에는 다슬기와 물고기들이 헤엄치고 어른 가슴높이부터아이들 놀기좋은 발목 높이까지이며 그리고 실내수영장 밤하늘의 별을 감상할 수 있는 차소리와 불빛 하나 없는 자연친화적 장소이다.</div>
