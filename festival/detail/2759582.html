<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">강촌버즈글램핑</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 춘천시 서면 율장길 122-28</p>

<a href="https://map.kakao.com/link/map/%EA%B0%95%EC%B4%8C%EB%B2%84%EC%A6%88%EA%B8%80%EB%9E%A8%ED%95%91,37.8498628297,127.5804885446" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">아름다운 자연을 만끽하며 힐링할 수 있는 강촌 버즈 글램핑은 강원 춘천시 서면에 위치하고 있다. 가평역에서 자동차로 10분 거리에 있어 접근성이 높고 근처를 흐르는 계곡과 야외 수영장에서 물놀이를 하기에 놓은 곳이다. 가족 단위 여행객에게 최적화된 환경으로, 아이들은 자연 속에서 뛰놀고 부모님은 여유롭게 힐링할 수 있다. 주변 관광지로는 엘리시안강촌, 제이드가든 수목원, 강촌 레일바이크, 남이섬 등이 있다.</div>
