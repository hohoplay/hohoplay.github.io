<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 영월 별마로천문대 근처에 위치한 캠핑장이다. 주변의 다양한 볼거리와 편의 시설을 갖추고 있어 처음 캠핑에 도전하는 캠퍼들도 쉽게 적응할 수 있다. 캠핑장 내의 작은 휴양림을 꾸며놓았다. 캠핑장 안의 연못에는 연꽃과 주변은 꽃으로 둘러싸여 있다. 사륜오토바이(ATV) 체험도 즐길 수 있다.</div>
