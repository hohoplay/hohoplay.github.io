<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 화성에 남양읍에 있는 분지섬저수지는 한적한 시골길을 드라이브 겸 산책하다 보면 만날 수 있는 농업용 저수지이다. 산책을 하거나 자전거 여행으로 발길이 이어지는 곳이다. 종종 낚시를 하고 있는 사람들도 볼 수 있다. 찾아가는 길은 좁은 일차선이라 통행이 원활치 않다.</div>
