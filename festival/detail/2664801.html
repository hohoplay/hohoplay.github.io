<p class="detail-row"><strong>주소</strong> 전북특별자치도 남원시 산내면 지리산로 365</p>

<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">지리산국립공원 덕동자동차야영장은 덕동마을과 달궁마을 사이에 위치해 있다. 도로변에 있어 접근이 용이하며, 맑고 시원하게 흐르는 달궁계곡을 끼고 있어 야영객들에게 큰 인기를 끌고 있다. 
자동차 야영지 18면과 하우스 22동이 있다. 사이트 구획이 나누어져 있고 차량을 바로 옆에 주차할 수 있는 시스템이다. 편의시설로 샤워장을 갖추고 있다.</div>
