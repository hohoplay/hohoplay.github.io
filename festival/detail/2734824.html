<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">씨엘관광농원글램핑</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안산시 단원구 대부황금로 976 (대부동동)</p>

<a href="https://map.kakao.com/link/map/%EC%94%A8%EC%97%98%EA%B4%80%EA%B4%91%EB%86%8D%EC%9B%90%EA%B8%80%EB%9E%A8%ED%95%91,37.2494841986,126.5919650549" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">대부도의 중앙에 위치한 황금산을 병풍삼아 자리잡고 있는 씨엘관광농원글램핑은 경기도 안산시 단원구에 있다. 고객의 이용편의를 위해 개수대, 샤워장, 화장실, 편의점 시설이 마련되어 있으며 물놀이장, 풋살장, 동물농장, 산책로를 설치하여 방문객의 즐거운 시간을 보낼 수 있도록 하였다. 농방부지에 심은 밭작물 수확체험, 특수작물 시설재배 체험을 할 수 있으며, 미래형 첨단 식물 공장도 체험 가능하다.</div>
