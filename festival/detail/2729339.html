<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">밀양강캠프스쿨</h1>
<p class="detail-row"><strong>주소</strong> 경상남도 밀양시 산외면 단산길 2-5</p>

<a href="https://map.kakao.com/link/map/%EB%B0%80%EC%96%91%EA%B0%95%EC%BA%A0%ED%94%84%EC%8A%A4%EC%BF%A8,35.5110539231,128.8406122071" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">캠핑장 한쪽으로는 놀이기구가 있는 모래놀이터가 있어 아이들이 편하게 놀 수 있으며 잔디 운동장이 있어 어린이들이 따뜻한 햇살을 받으며 신나게 공놀이를 하며 뛰어 다닐 수 있다. 여름에는 이동식 수영장과 캠핑장 옆으로 작은 강가가 있어 물고기도 잡으며 시원하게 여름을 보낼 수 있다. 깨끗한 개수대에서는 24시간 온수가 나오며 샤워장과 화장실 역시 관리가 잘되어져 있는 캠핑장이다.</div>
