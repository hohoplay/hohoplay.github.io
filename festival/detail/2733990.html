<p class="detail-row"><strong>주소</strong> 강원특별자치도 평창군 용평면 이승복생가길 160</p>

<a href="https://map.kakao.com/link/map/%EA%B3%84%EB%B0%A9%EC%82%B0%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.7013137118,128.4814446084" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청정지역 평창의 계방산의 자연휴양림 속에 위치한 캠핑장으로 평창군에서 운영하고 있다. 계방산 등산로 자락에 위치하고 있어 등산을 즐기기도 좋다. 오토캠핑뿐 아니라 카라반, 통나무집, 방갈로 등 다양한 사이트를 구비하고 있다. 도심을 벗어나 평창의 맑은 계곡물이 흐르는 깊은 산속에서 풍부하고 아름다운 자연경관을 만끽할 수 있는 캠핑장이다.</div>
