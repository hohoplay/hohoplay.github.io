<p class="detail-row"><strong>주소</strong> 경상남도 창원시 진해구 장복산길 56-42</p>

<a href="https://map.kakao.com/link/map/%EC%A7%84%ED%95%B4%EB%93%9C%EB%A6%BC%EB%A1%9C%EB%93%9C,35.1751494980,128.6610426255" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">창원시의 진해드림로드는 각각 다른 특색을 지닌 네 갈래의 길이다. 드림로드를 걷다 보면 장복하늘마루길, 천자봉 해오름길, 백일아침고요산길, 소사생태길과 한 지점에서 만나게 된다. 군데군데 전망대가 있어 탁 트인 시가지를 내려다볼 수 있으며 다양한 나무들의 군락지를 가까이서 만나는 즐거움도 맛볼 수 있다. 드림로드 구간에는 해군테마공원, 해병대 체험시설, 목재문화체험장 등 드림파크가 있어 가족 나들이에도 안성맞춤이다.</div>
