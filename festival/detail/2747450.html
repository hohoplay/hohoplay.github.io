<p class="detail-row"><strong>주소</strong> 전북특별자치도 무주군 안성면 원통사로 294</p>

<a href="https://map.kakao.com/link/map/%EB%AC%B4%EC%A3%BC%20%EC%86%94%EB%B0%AD%EC%95%BC%EC%98%81%EC%9E%A5,35.8362876634,127.6725257225" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">무주 솔밭야영장은 덕유산 자락의 깊은 계곡을 따라 수십 년 된 소나무가 울창한 솔밭 안에 있다. 소나무 숲에서 나오는 피톤치드를 마시며 캠핑할 수 있는 것이 큰 매력이다. 공기 좋고 물 맑은 완전 힐링 장소다. 데크 외에도 오토야영장으로 이루어진 넓은 사이트는 여유롭게 사용할 수 있어 편안하게 지낼 수 있다. 캠핑장 내 족구장은 공간이 넓어 어린이들이 맘껏 뛰어놀기에 안전하고 좋다.</div>
