<p class="detail-row"><strong>주소</strong> 경기도 파주시 파평면 장승배기로 390-217</p>

<a href="https://map.kakao.com/link/map/%EC%9C%A8%EA%B3%A1%EC%BA%A0%ED%95%91%EC%9E%A5,37.8918247846,126.8288004460" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">율곡캠핑장은 파주시 파평면 율곡수목원 인근에 위치한 캠핑장이다. 시원한 바람 소리와 맑은 계곡물소리가 들리고 밤이면 하늘의 아름다운 별자리를 볼 수 있다. 수도권 북부에서 1시간이면 자연 속에서 힐링을 즐길 수 있는 거리다. 각 사이트의 크기는 7m(폭)*7m(길이)이며, 총 40여 개 정도가 있고 넓은 주차장이 마련되어 있다. 캠핑장에는 화장실, 샤워장, 개수대, 매점 등 편의시설이 잘 갖춰져 있고 온수 사용이 가능하다.</div>
