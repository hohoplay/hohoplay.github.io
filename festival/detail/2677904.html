<p class="detail-row"><strong>주소</strong> 경기도 김포시 하성면 누산봉성로 294</p>

<a href="https://map.kakao.com/link/map/%ED%95%98%EB%8F%99%EC%B2%9C%20%EC%83%9D%ED%83%9C%ED%83%90%EB%B0%A9%EB%A1%9C,37.6916644391,126.6533110760" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">하동천 생태탐방로는 생물의 서식처를 제공하고 종 다양성을 증진시키며, 자연생태계의 생물들을 관찰, 체험할 수 있도록 하여 시민들에게 건강한 생태공간을 제공하고 환경의 중요성을 일깨워 주기 위한 공간으로 조성되었다. 연꽃의 대단위 재배단지가 조성되었으며, 철새의 주요 서식지로 청둥오리, 재두루미, 저어새등 관찰 가능한 곳이기도 하다. 수변을 황토길, 합성목재 데크 및 비포장길 등 다채롭게 꾸며 남녀노소 산책하기에 매우 좋은 곳이다.</div>
