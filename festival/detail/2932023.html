<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">송강리 습곡구조</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 청송군 청송로 5865</p>

<a href="https://map.kakao.com/link/map/%EC%86%A1%EA%B0%95%EB%A6%AC%20%EC%8A%B5%EA%B3%A1%EA%B5%AC%EC%A1%B0,36.4842166583,129.0266154306" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">송강리 습곡구조는 선캄브리아 시대에 만들어진 것으로 청송 유네스코 세계지질공원의 지질명소 중 가장 나이가 많은 암석이다. 이곳에서는 암석의 줄무늬가 구불구불 휘어있는 습곡구조를 관찰할 수 있다. 이러한 습곡구조는 지하 깊은 곳에서 만들어진 암석이 지표로 상승하는 동안 경험한 변동의 기록으로, 이는 청송이 경험한 지각변동의 특성을 학술적으로 이해하고 규명하는데 매우 중요한 의미를 지닌다.
(출처 : 국가지질공원)</div>
