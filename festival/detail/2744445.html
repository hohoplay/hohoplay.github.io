<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">학이 날아와 앉은 모습과 닮았다는 학산공원. 이곳은 공원 전망대에서 일출과 일몰을 감상할 수 있어서 많은 사람이 찾아온다. 전망대로 가장 빨리 오르는 길은 학산공원 공영주차장에서 시작된다. 주차장을 지나면 학 모양의 조형물이 자리 잡은 분수대, 여러 스포츠를 즐길 수 있는 다목적운동장 등이 나온다. 다목적운동장부터 전망대까지는 약 15분가량 소요된다.</div>
