<a href="https://map.kakao.com/link/map/%EB%8F%99%ED%83%84%EC%96%B4%EB%A6%B0%EC%9D%B4%EC%B2%9C%EB%AC%B8%EB%8C%80,37.1788529077,127.0306382787" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">동탄어린이천문대는 경기도 오산시 지곶동에 있다. 2012년 설립되었고 야외 관측소와 야간 관측돔이 있으며 다양한 체험 프로그램을 운영한다. 또한 직접 개발한 천문프로그램을 통해 어린이들에게 우주 속에 숨은 과학적 지식을 알려주고, 만들기 실습을 통해 어린이들의 공간 지각능력과 천문학 지식을 동시에 익힐 수 있도록 한다.</div>
