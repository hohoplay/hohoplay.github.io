<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">진천군의 만뢰산에서 발원한 맑은 물이 이어지는 10km 정도의 계곡이다. 연곡저수지를 지나 맑은 물이 흐르고 숲이 우거져 있는 계곡은 많은 사람들이 찾는 명소이다. 시원한 계곡바람이 불어와 여름에는 진가를 알 수 있는 곳으로 자연의 아름다움을 흠뻑 느끼기에도 좋다. 여름휴가철 가족단위 관광지로 손색없는 곳이다.</div>
