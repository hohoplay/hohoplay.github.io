<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">통제영오토캠핑장은 이순신 장군의 유적이 남아있는 한산도에 위치해 있다. 해변에 자리 잡고 있어 바다를 눈앞에 두고 캠핑을 할 수 있으며 텐트 앞에서 낚시도 가능하다. 통영 여객 터미널에서 배를 이용 한산섬 선착장에 도착하면 바로 캠핑장 이정표가 보인다. 한산도라는 섬의 특성상 조용하고 편안한 캠핑이 가능하고 캠핑장 반대쪽으로 이순신장군 유적지인 제승당이 있다.</div>
