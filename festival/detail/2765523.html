<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">북성포구</h1>
<p class="detail-row"><strong>주소</strong> 인천광역시 제물포구 북성포길 49</p>

<a href="https://map.kakao.com/link/map/%EB%B6%81%EC%84%B1%ED%8F%AC%EA%B5%AC,37.4831408166,126.6154759117" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">일몰과 야경이 아름다운 곳으로 유명한 북성포구는 인천항의 항만 풍광으로 색다른 일몰을 조망할 수 있는 곳이다. 인천항 부두와 어선들이 늘어선 포구와 한편에 자리 잡은 어시장들의 모습은 이미 사진가들에게는 잘 알려진 포토 스폿이다. 배우 황정민과 이정재가 출연한 영화 &lt;다만 악에서 구하소서&gt; 촬영지로 알려져 있다. 인근에 월미도, 개항누리길, 제물포구락부, 송월동 동화마을 등이 위치하여 함께 관광할 수 있다.</div>
