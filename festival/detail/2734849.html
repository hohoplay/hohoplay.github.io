<a href="https://map.kakao.com/link/map/%EC%96%91%ED%8F%89%EB%8B%A4%EB%AA%A9%EC%A0%81%EC%BA%A0%ED%95%91%EC%9E%A5,37.4508491507,127.7914588617" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">양평다목적캠핑장은 도심에서 가까운 여행지로 대표적인 지역 경기도 양평군에 위치한 캠핑장이다. 전나무 숲속에 자리하고 있어 피톤치드로 충분히 힐링할 수 있다. 타프데크, 오토캠핑장, 카라반을 운영하고 있으며 공용 샤워실, 화장실, 매점 등 편의 시설이 잘 갖추어져 있다. 또한 야외 수영장을 비롯해 트램펄린이 있어 아이들과 함께 가족 단위로 즐기기에 좋은 캠핑장이다.</div>
