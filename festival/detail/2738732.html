<p class="detail-row"><strong>주소</strong> 충청남도 공주시 우성면 한천리</p>

<a href="https://map.kakao.com/link/map/%ED%95%9C%EC%B2%9C%EC%A0%80%EC%88%98%EC%A7%80,36.5199464907,127.0870151488" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">한천저수지는 공주 여행 시에 드라이브 삼아 잠시 들러 쉬어가기 좋은 곳이다. 한국농어촌공사 충청남도본부 공주지사에서 관리하고 있는 저수지이다. 
한천저수지는 산 좋고 물 좋은 수심이 깊은 무성산 아래 지역으로 새우와 빙어가 서식하고 있으며, 인근에 공장이나 축산농가도 거의 없어 오래전부터 청정 저수지로 유명했다. 전원적인 배경이 일품으로 자전거 레포츠를 즐기는 사람들도 한천저수지 앞에서 기념사진을 남기기도 한다.</div>
