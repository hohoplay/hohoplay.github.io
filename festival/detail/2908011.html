<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">어썸비치 글램핑</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 삼척시 초곡길 380</p>

<a href="https://map.kakao.com/link/map/%EC%96%B4%EC%8D%B8%EB%B9%84%EC%B9%98%20%EA%B8%80%EB%9E%A8%ED%95%91,37.3094800799,129.2876425220" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">삼척 초곡해변에 위치한 글램핑장이다. 텐트 문을 열면 바로 눈앞에 바다가 펼쳐진 해변에 위치에 있다. 글램핑 4개동과 돔하우스 2개동으로 구성되어 있다. 글램핑장 앞에 수영장과 바로 너머의 해변까지 모두 이용할 수 있다. 인근에 초곡용굴촛대바위가 있고 맹방해수욕장, 삼척해양레일바이크, 이사부사자 공원, 해양레포츠를 즐길 수 있는 장호항, 환선굴 등 관광지를 이용하기에도 편리한 곳이다.
※ 반려동물 동반불가</div>
