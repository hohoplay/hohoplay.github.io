<p class="detail-row"><strong>주소</strong> 경상남도 진주시 내동면 내축로563번길 27-3</p>

<a href="https://map.kakao.com/link/map/%EC%A0%9C%EC%9D%B4%EC%9B%90%EB%B9%8C%EB%A6%AC%EC%A7%80,35.1313817535,128.0172278923" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경남 진주시 내동면에 위치한 제이원 빌리지는 글램핑과 평상, 물놀이장, 대형 야외 바비큐장을 갖춘 종합캠핑장이다. 각 호실마다 나무 테이블이 설치돼 있어 바비큐에 안성맞춤이다. 농·축산물 할인매장이 있어 고기를 준비 못해도 구매 가능하다. 글램핑 내부엔 싱크대, 냉장고, 전자레인지, 밥솥 등 모든 것이 갖춰져 있어 당일 회식 삼아 찾는 손님도 많은 곳이다.</div>
