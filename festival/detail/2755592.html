<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">국립삼봉자연휴양림 야영장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 내면 삼봉휴양길 276</p>

<a href="https://map.kakao.com/link/map/%EA%B5%AD%EB%A6%BD%EC%82%BC%EB%B4%89%EC%9E%90%EC%97%B0%ED%9C%B4%EC%96%91%EB%A6%BC%20%EC%95%BC%EC%98%81%EC%9E%A5,37.8520680925,128.4620695486" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">국립삼봉자연휴양림 야영장은 강원도 홍천군 내면 삼봉휴양길에 위치하고 있다. 울창한 활엽수가 조화를 이룬 숲속에서 야영을 즐길 수 있다. 42개의 야영데크가 설치되어 있고, 면적은 13㎡으로 최대 6인까지 이용 가능하다. 온수 샤워장, 음수대, 취사대, 화장실 등 편의시설이 있다. 휴양림 내에서 진행하는 체험 프로그램을 함께 즐길 수 있다.</div>
