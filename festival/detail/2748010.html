<p class="detail-row"><strong>주소</strong> 경상북도 영주시 풍기읍 삼가로 423</p>

<a href="https://map.kakao.com/link/map/%EB%AC%98%EC%86%94%EC%BA%A0%ED%95%91%EC%9E%A5,36.9210874573,128.5076682616" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">묘솔캠핑장은 소백산으로 향하는 길목인 동시에 영주의 대표 계곡 가운데 하나인 금선계곡에 터를 잡았다. 이 덕택에 소백산 등산객은 물론, 계곡 물놀이를 즐기는 이들이 캠핑을 병행하고자 이곳에 많이 모인다. 캠핑장에는 자동차 야영장 7면을 마련했다. 바닥은 모두 파쇄석으로 이뤄졌다. 개인 트레일러와 카라반 동반 입장이 가능하다. 야영장 외에도 방갈로와 펜션도 준비되어 있다.</div>
