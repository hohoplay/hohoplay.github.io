<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">회암저수지는 경기도 안성시 삼죽면에 위치한 저수지이다. 면적이 약 7,000 m²인 아담한 소류지 크기로, 수심이  2~4m이다. 사면이 산으로 둘러싸여 아늑하며, 봄이면 저수지 주변에 피어난 벚꽃이 저수지와 잘 어울린다. 저수지에는 낚시터가 조성되어 있어 낚시를 위해 방문하는 사람들이 많다.</div>
