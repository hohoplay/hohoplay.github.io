<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">송라저수지</h1>
<p class="detail-row"><strong>주소</strong> 경기도 화성시 매송면 송라리</p>

<a href="https://map.kakao.com/link/map/%EC%86%A1%EB%9D%BC%EC%A0%80%EC%88%98%EC%A7%80,37.2828525011,126.9039135487" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">송라저수지는 제방이 높아 수심이 깊고 물이 맑은 곳이다. 저수지와 어우러진 한가로운 농촌의 봄 정취를 느끼고 싶은 여행자들에게 추천하고 싶은 곳이다. 봄이면 송라저수지 인근에 산벚꽃이 온통 하얗게 피어난다. 인근 송라리 마을에는 벚꽃뿐만 아니라 개나리, 개목련, 명자나무, 매화꽃도 핀다. 송라저수지 주위에는 나무데크로 이루어진 둘레길이 조성되어 있다. 화성시민들의 여유로운 삶과 건강을 위해 시에서 조성한 둘레길이다.</div>
