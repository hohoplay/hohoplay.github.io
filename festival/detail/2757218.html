<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">제부도선착장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 화성시 서신면 해안길 421-12</p>

<a href="https://map.kakao.com/link/map/%EC%A0%9C%EB%B6%80%EB%8F%84%EC%84%A0%EC%B0%A9%EC%9E%A5,37.1778708010,126.6219420666" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">육지에서 선착장까지 자동차도로로 연결되어 있어 24시간 접근할 수 있다. 체험 가능한 요트 클럽이 여럿 있다. 무료 주차장과 공용화장실 등 편의시설이 갖추어져 있다. 빨간 등대와 일몰이 아름다워 산책하기 좋고 인증샷 명소기도 하다. 바다를 바라보며 걸을 수 있는 제비꼬리길 데크가 시작된다. 선착장에서 무료로 바다낚시를 즐길 수 있다. 선착장 인근 펜션이나 음식점 등 편의시설이 있어 당일치기나 숙박 겸한 서해 여행 코스로 들를만한다.</div>
