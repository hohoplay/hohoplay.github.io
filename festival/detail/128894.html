<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">어은돌해수욕장</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 태안군 소원면 모항리</p>

<a href="https://map.kakao.com/link/map/%EC%96%B4%EC%9D%80%EB%8F%8C%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,36.7528475763,126.1294092752" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">어은돌해변은 좁은 모래사장으로 영화 드라마에 나오는 전통적인 해변을 연상시킨다. 특히 낚시를 즐기는 사람들에게는 좋으리라 생각되며 가족단위로 민박을 이용하면서 쉴 수 있는 곳이다. 해변 길이는 1㎞, 폭은 250m 정도이며 해변 형태는 자갈 모래로 되어 있다. 해안의 끝으로 보이는 석양이 그야말로 장관이다. 마을 입구엔 10여 가구의 민박집이 있으며, 물에서 막 끌어올린 어획물을 바로 공급할 수 있는 횟집이 있다.</div>
