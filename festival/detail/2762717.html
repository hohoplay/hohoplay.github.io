<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">앙티브는 프랑스에 있는 유명한 휴양지라고 한다. 1년 내내 자연과 문화 축제가 어우러진 가평에 위치한 앙티브는 휴양지에 온 듯한 느낌을 살린 숙소이다. 펜션 앞 야외 수영장과 바비큐 시설도 마련되어 있다. 픽업 서비스도 운영 중인데 입실할 때와 퇴실할 때 모두 이용이 가능하다. 주변에 남이섬, 자라섬, 쁘티프랑스, 아침고요 수목원 등 유명 관광지도 함께 즐길 수 있다.</div>
