<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">청벽산</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 공주시 반포면 마암리 산 4-4</p>

<a href="https://map.kakao.com/link/map/%EC%B2%AD%EB%B2%BD%EC%82%B0,36.4285676628,127.2209361575" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청벽산은 비교적 낮은 산이지만, 금강 굽이가 한눈에 내려다 보일 뿐만 아니라 금강을 끼고 붉게 물드는 낙조와 청벽대교의 야경 등으로 금강의 아름다운 자연환경을 볼 수 있어 주요 시가지와 멀리 떨어져 있음에도 사람들이 많이 찾는 곳이다. 청벽산 서쪽 사면 말단부에는 충남과학고등학교가 자리 잡고 있으며 그 앞으로 국도 32호선이 달리고 있다. 청벽산의 북동쪽에는 충청남도 산림박물관이 자리 잡고 있다.</div>
