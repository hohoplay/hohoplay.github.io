<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">미평 봉화산 산림욕장</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 여수시 미평동 21-1</p>

<a href="https://map.kakao.com/link/map/%EB%AF%B8%ED%8F%89%20%EB%B4%89%ED%99%94%EC%82%B0%20%EC%82%B0%EB%A6%BC%EC%9A%95%EC%9E%A5,34.7750164603,127.7151941056" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">미평 봉화산 산림욕장은 노약자, 장애인, 임산부, 어린이 등 모든 시민이 편안하고 안전하게 산책을 즐길 수 있는 무장애 산책로와 맨발길, 유아숲 등이 조성되어 있다. 이용하는 시민들이 서로가 배려하는 마음으로 산책하고 휴식하면서 산림욕을 마음껏 즐길 수 있다. 산림욕장 내에는 맨발 걷기를 위한 세족장도 설치되어 있으며, 쉼터와 화장실, 주차장 등의 편의시설은 물론, 목교와 사방댐도 있다.</div>
