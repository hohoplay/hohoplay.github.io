<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">중리해수욕장</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 완도군 보길면 중통리</p>

<a href="https://map.kakao.com/link/map/%EC%A4%91%EB%A6%AC%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,34.1631160324,126.5916046493" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">중리해수욕장은 통리해수욕장 바로 인근에 있는 해수욕장이다. 경사가 완만하고 마을의 방풍림인 송림이 아름다운 곳이다. 비단결 같이 고운 모래가 깔린 백사장이 길게 뻗어 있다. 더욱이 백사장을 따라 늘어선 수백 년 된 소나무 300여 그루가 해수욕장을 감싸 안고 있다. 소나무 숲은 뜨거운 햇살을 피하거나 야영을 즐기기에 좋다. 샤워장과 급수대 등 편의시설을 갖추고 있으며, 인근 마을에 민박집과 음식점이 있어 숙식을 해결하기 편리하다.</div>
