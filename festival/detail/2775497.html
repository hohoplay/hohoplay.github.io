<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강릉 시가지, 경포대 기준으로 약 10분 거리에 있는 해변이다. 모래질이 좋고 수심이 얕아 물놀이하기도 좋고 해변을 따라 늘어선 송림과 한적한 바다를 느낄 수 있는 곳이다. 전용 주차장은 없으나 순포해변과 순긋해변이 이어져 있어 순긋해변쪽 주차장을 이용할 수 있다. 근처 사천항, 순포습지, 순긋해변 등 여러 관광지도 쉽게 이동할 수 있다.</div>
