<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 인제 미시령 계곡이 시작되는 설악산 해발500고지에 위치한 캠핑장이다. 낮에는 동해바다를 즐기고, 밤에는 맑은 계곡과 숲 속에서 힐링을 즐길 수 있는 최적의 캠핑장이다. 매점에서는 캠핑에 필요한 다양한 물품과 미시령의 계절 특산물을 구입할 수 있다. 주변 계곡에서는 낚시를 즐길 수 있고, 주변 해변에서 해양레저를 즐기기에도 가까운 위치에 있다.</div>
