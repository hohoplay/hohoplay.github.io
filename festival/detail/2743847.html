<p class="detail-row"><strong>주소</strong> 인천광역시 강화군 삼산면 삼산남로604번길 37</p>

<a href="https://map.kakao.com/link/map/%EC%9B%90%EC%8A%A4%EC%BA%A0%ED%95%91%EC%9E%A5,37.6769411696,126.3387291872" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">원스 캠핑장은 석모도 해명산 자락에 위치해 있다. 석모대교를 이용하면 바로 진입이 가능하다. 오션뷰로 유명한 원스 캠핑장은 모든 사이트에서 바다와 낙조를 감상할 수 있다. 총 25개의 사이트를 갖추었으며 금, 토, 일요일에만 운영하고 있다. 또한 수영장을 갖추고 있으며 보문사, 민머루해수욕장, 어류정항, 석모도 온천 등과 인접해 있어 연계 관광을 하기에도 좋다.</div>
