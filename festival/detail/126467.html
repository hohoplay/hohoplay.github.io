<p class="detail-row"><strong>주소</strong> 제주특별자치도 제주시 애월읍 무수천길</p>

<a href="https://map.kakao.com/link/map/%EB%AC%B4%EC%88%98%EC%B2%9C,33.4627665614,126.4470472947" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">무수천은 한라산 고지대에서 발원하여 외도 앞바다로 흘러드는 약 25㎞의 긴 하천으로, 경관이 워낙 빼어나 계곡에 들어서면 모든 근심 걱정이 사라진다는 의미를 가지고 있다. 오래된 화산이 분출하면서 용암이 흘러간 자리가 그대로 협곡이 되어버린 무수천은 기묘한 여러 형상들이 눈길을 끈다. 무수천 8경을 선정할 정도로 오랜 세월 비경을 자랑하고 있으며, 계곡을 따라 하류로 내려가면 작은 폭포가 이어진다.</div>
