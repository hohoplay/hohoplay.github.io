<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">삼선암 (울릉도, 독도 국가지질공원)</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 울릉군 북면 천부리</p>

<a href="https://map.kakao.com/link/map/%EC%82%BC%EC%84%A0%EC%95%94%20%28%EC%9A%B8%EB%A6%89%EB%8F%84%2C%20%EB%8F%85%EB%8F%84%20%EA%B5%AD%EA%B0%80%EC%A7%80%EC%A7%88%EA%B3%B5%EC%9B%90%29,37.5495520394,130.9079409556" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">울릉도의 3대 해양절경 중 하나로 손꼽히는 삼선암은 3개의 암석으로 구성되어 있다. 울릉도의 풍경에 반해 하늘로 돌아갈 시간을 놓친 세 명의 선녀가 옥황상제의 노여움으로 바위가 되었고, 특히 늦장을 부린 막내 바위에는 풀조차 자라지 않는다는 이야기가 전해진다. 조면암으로 이루어진 삼선암에서는 절리와 타포니가 잘 관찰된다. 삼선암의 절리들이 암석의 침식을 도왔고, 계속되는 침식에 의해 시스택 지형이 만들어졌다.</div>
