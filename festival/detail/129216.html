<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">모래미 해변</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 영광군 백수읍 구수리</p>

<a href="https://map.kakao.com/link/map/%EB%AA%A8%EB%9E%98%EB%AF%B8%20%ED%95%B4%EB%B3%80,36.3633472744,126.4149103101" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">영광에서 해수욕을 여유롭게 즐길 수 있는 곳이 모래미해수욕장이다. 모래미라는 이름은 구수리의 한 마을 중에 한시마을의 옛날 지명인 ‘모래미’에서 유래되었다. 규모가 작고 해안선도 길지 않으나, 백사장의 모래가 하얗고 고와 여름철이면 이곳에 해수욕을 즐기러 오는 사람들이 많다. 또한 주변의 때 묻지 않은 경치가 아름다운 아늑한 해변이다. 다도해와 함께 영광대교의 풍광이 어우러진 멋진 경치를 감상할 수 있다.</div>
