<p class="detail-row"><strong>주소</strong> 강원특별자치도 정선군 남면 광락로 519</p>

<a href="https://map.kakao.com/link/map/%EB%9F%AC%EB%B8%8C%ED%8C%A9%ED%86%A0%EB%A6%AC%ED%8E%9C%EC%85%98%EC%BA%A0%ED%95%91%EC%9E%A5,37.3196338042,128.6797049479" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">정선시장에서 20분, 화암동굴에서 25분, 짚와이어에서 25분 등 정선 관광지에서 가까운 거리에 있다. 사전에 연락하면 캠핑장에서 무료 픽업도 가능하다. 캠핑장 앞 계곡에서 물놀이, 고기잡이, 다슬기잡이를 할 수 있고, 캠핑장 주변은 자전거(대여)를 타고 하이킹을 즐길 수 있다. 캠핑장 내 작은 수영장에서 아이들 물놀이도 가능하다.</div>
