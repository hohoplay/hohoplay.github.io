<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">동막골캠핑장은 강원도 삼척에 위치한 내평계곡에 있는 캠핑장들 중에 하나다. 내평계곡은 외지인들은 물론 현지인들도 많이 방문하는 물놀이하기 좋은 계곡이다. 이 캠핑장은 계곡과 숲이 잘 어우러진 곳으로 도심을 떠나 자연을 느끼기에 좋은 곳이다. 홈페이지는 운영되지 않아 전화로 문의 후 방문해야 하며 선착순 입장이다.</div>
