<a href="https://map.kakao.com/link/map/%EC%82%AC%EC%A0%95%EC%A0%80%EC%88%98%EC%A7%80,36.9778949243,127.6131190792" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">사정저수지는 충북 음성군 음성읍에 있다. 저수지는 드라이브나 산책 삼아 가볍게 둘러보기 좋다. 저수지는 음성 IC에서 가까운 거리에 있다. 사정저수지는 농업용수 공급을 목적으로 1971년 1월 착공하여 1981년 준공되었다. 무극저수지라고도 불리며 무극저수지, 금석저수지, 용계저수지까지 도수터널로 연결되어 있어 수면의 높이가 서로 같아서 일명 음성군 삼 형제 저수지라고도 불린다.</div>
