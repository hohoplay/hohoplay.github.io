<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">여차울캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 내면 여차동길 745-41</p>

<a href="https://map.kakao.com/link/map/%EC%97%AC%EC%B0%A8%EC%9A%B8%EC%BA%A0%ED%95%91%EC%9E%A5,37.8606080630,128.2800468840" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">여차울캠핑장은 강원도 홍천군 내면에 자리잡고 있다. 최근 캠핑장을 정비하는 공사를 진행하여 이용하기 더욱 편리한 곳으로 탈바꿈하였다. 부대시설로는 공연장, 노래방, 영화관람실이 있다. 근처 계곡에서 민물낚시와 물놀이가 가능하며 온수, 샤워시설, 전기시설, 와이파이 설비를 갖추고 있다. 주변 즐길거리로 알파카월드, 동키 허니랜드, 홍천 가리산 레포츠파크, 원대리 자작나무 숲 등이 있다.</div>
