<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">프라임 캠핑장은 강원도 춘천하고 있다. 용화산 자연휴양림의 맑고 청정한 기운을 느낄 수 있다. 또한 용화산에서 내려오는 계곡물이 흐르는 수영장 시설이 있으며 데크가 설치되어 보다 안전하고 편안한 물놀이를 즐길 수 있다. 넓은 정원, 캠핑장과 계곡 사이에 꾸며진 데크, 곳곳에 아기자기한 포토존 등 즐길 거리가 풍부한 캠핑장이다.</div>
