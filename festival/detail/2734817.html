<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기북부에 위치한 숲속의 쉼터 글램핑은 다양한 놀 거리와 텐트 내 편의시설이 잘 되어 있는 연천 숲속의 쉼터이다. 텐트 옆 주차 가능하며 텐트 내에 화장실, 싱크대, 그늘막, 바비큐 테이블, 그릴을 설치하여 편리하게 캠핑을 즐길 수 있다. 공동 이용 시설로 찜질방, 노래방, 놀이방, 눈썰매, 짚라인, 트램펄린, 탁구장이 있으며 무료로 운영하고 있다.</div>
