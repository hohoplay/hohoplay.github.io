<p class="detail-row"><strong>주소</strong> 경상북도 경주시 산내면 대현길 176-9</p>

<a href="https://map.kakao.com/link/map/%EC%B2%AD%EC%84%9D%EB%93%A4%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91,35.7178376673,129.0702446660" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청석들 오토캠핑은 경상북도 경주시 산내면에 위치한 캠핑장으로 자리 잡고 있다. 경주 시청을 기점으로 약 40㎞가량 떨어진 곳으로 맑은 계곡과 울창한 숲이 공존하는 공간이다. 계곡 물놀이와 숲 속 체험을 함께 할 수 있어 휴가철이면 찾는 이들이 많다. 캠핑장은 자동차 야영장 27면을 갖추고 있는데 이 가운데 25면은 파쇄석, 나머지는 데크로 이뤄졌다. 개인 트레일러와 카라반도 입장이 가능하다.</div>
