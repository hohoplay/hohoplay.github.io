<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">산골캠핑장은 강원도 영월 법흥계곡 상류에 있다. 계곡을 끼고 있고 소나무 숲으로 되어 있어 산골캠핑장 이름답게 숲을 즐길 수 있다. 캠핑장에서 1분 거리의 계곡을 바로 이용할 수 있고 수심은 1m 내외로 어린아이와 어른들이 충분히 함께 물놀이를 즐길 수 있다. 인근에는 법흥사, 법흥계곡, 요선암돌개구멍 등이 있어 연계관광이 가능하다.</div>
