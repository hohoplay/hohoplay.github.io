<p class="detail-row"><strong>주소</strong> 인천광역시 강화군 길상면 보리고개로 187-5</p>

<a href="https://map.kakao.com/link/map/%EB%8D%94%EC%88%B2%EC%BA%A0%ED%95%91%EC%9E%A5,37.6275411986,126.4872280660" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">더숲캠핑장은 인천광역시 강화군 길상면에 위치하고 있다. 사이트 바닥은 잔디 7개, 자갈 3개로 되어 있으며 넓고 깨끗하다. 온수와 냉수 또한 잘 나오는 캠핑장이다. 부대시설로는 전기, 무선인터넷, 장작판매, 마트, 편의점이 마련되어 있다. 주변이용가능시설로 해수욕, 농어촌체험시설, 어린이 놀이시설 등이 있다. 숲과 나무로 둘러싸인 이곳에서 여유를 즐기며 자연에 흠뻑 취해 힐링이 가능하다.</div>
