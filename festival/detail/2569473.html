<a href="https://map.kakao.com/link/map/%ED%8F%AC%EC%B2%9C%20%EC%95%84%EC%9A%B0%EB%9D%BC%EC%A7%80%20%EB%B2%A0%EA%B0%9C%EC%9A%A9%EC%95%94%20%28%ED%95%9C%ED%83%84%EA%B0%95%20%EC%9C%A0%EB%84%A4%EC%8A%A4%EC%BD%94%20%EC%84%B8%EA%B3%84%EC%A7%80%EC%A7%88%EA%B3%B5%EC%9B%90%29,38.0417791684,127.1175224375" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">베개용암은 그 모양이 마치 둥근 베개 모양 같다고 하여 붙여진 이름이며, 아우라지는 두 갈래 이상의 물길이 한데 모이는 어귀를 뜻한다. 아우라지 베개용암은 고온의 용암이 흐르다가 찬물(영평천)을 만나 급속하게 식으면서 굳어진 암석이다. 베개용암은 육지에서 발견되는 경우가 드물며, 대부분 물이 풍부한 바닷속에서 형성된다.</div>
