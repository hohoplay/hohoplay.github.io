<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">블루마운틴은 대구광역시 동구에 자리했다. 대구광역시청을 기점으로 대구국제공항 방면으로 달리다 공산터널을 거치면 나온다. 도착까지 걸리는 시간은 40분가량이다. 이 캠핑장은 영남 지역의 명산이라 부르는 팔공산 인근에 있어서 사계절 언제나 아름다운 풍경을 만날 수 있는 곳이다.</div>
