<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">지구별캠프</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 무릉법흥로 1104</p>

<a href="https://map.kakao.com/link/map/%EC%A7%80%EA%B5%AC%EB%B3%84%EC%BA%A0%ED%94%84,37.3553387385,128.2787565801" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">영월 지구별 캠프는 캠핑의 메카로 불리는 강원도 영월 무릉도원면 법흥리에 위치해 있다. 법흥계곡은 강원도 영월의 신비로운 계곡으로 주목받는 여행지 중의 한 곳이다. 단위면적 당 캠핑장 수가 가장 많은 곳이기도 하다. 지구별 캠프는 이런 법흥계곡 중간에 있다. 총 21개의 파쇄석 사이트와 6개의 방갈로를 함께 운영하고 있다. 바로 옆이 계곡이어서 한여름에도 시원하게 자연과 함께 힐링할 수 있다.</div>
