<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">‘종처럼 생긴 산(지미봉) 밑에 위치한다’라는 뜻을 가진 종달리해변은 넓은 모래 해변이 깔려있다. 비교적 잘 알려지지 않은 종달리해변은 조용하게 여행하고 싶은 사람들에게 추천하는 곳이다. 종달리해변에서는 성산일출봉과 우도가 아름답게 보인다. 특히 종달리해변 옆에 있는 해안도로는 수국이 아름답기로 유명한 길이 형성되어 있다.</div>
