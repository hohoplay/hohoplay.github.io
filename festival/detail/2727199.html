<a href="https://map.kakao.com/link/map/%EA%B4%B4%EA%B0%95%EA%B4%80%EA%B4%91%EB%86%8D%EC%9B%90%20%EC%B9%B4%EB%9D%BC%EB%B0%98%26%EC%BA%A0%ED%95%91%EC%9E%A5,36.7987721531,127.8245107034" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">널찍한 잔디밭으로 이뤄진 캠핑장에는 카라반과 캠핑존이 마련되어 있다. 카라반 내부에는 침대, 식탁, 의자, 에어컨, 취사도구, 식기류, 개수대, 화장실, 샤워장 등을 갖추고 있으며, 외부 전용 데크에는 그늘을 만들어주는 어닝과 바비큐 시설이 구비되어 있다. 또한, 자연과 어우러져 있는 놀이시설과 넓은 잔디밭은 아이들이 뛰어놀기 좋다.</div>
