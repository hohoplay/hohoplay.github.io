<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 양주 하늘캠핑장은 산비탈에 층층이 계단식으로 구성된 넓은 사이트가 특징이다. 전망이 좋은 제일 높은 사이트가 인기가 많다. 계곡이나 나무숲은 없지만 아이들 물놀이하기 좋은 수영장이 있어 여름을 즐기기에 적당하다. 캠핑장에서 20분 내외 거리에 위치한 가나아트파크, 청암민속박물관, 조명박물관이 있어 캠핑 전후로 들러보면 좋다.</div>
