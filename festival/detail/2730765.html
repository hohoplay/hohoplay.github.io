<a href="https://map.kakao.com/link/map/%ED%95%9C%ED%84%B0%ED%8C%9C%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.2608640706,127.2528408456" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 용인시 양지면 한터팜오토캠핑장은 아이들을 위한 농장 체험이 이뤄지는 가족캠핑장으로 유명하다.  캠핑장 내에 화장실, 샤워장, 개수대, 매점 등 편의시설이 마련되어 있다. 시설이 깔끔하고 온수 사용에도 불편함이 없다. 캠핑장은 A, B C, D 구역으로 구분돼 있다. 캠핑장 가운데 아이들이 뛰어놀 수 있는 운동장이 있고 운동장에서 다양한 이벤트가 진행된다.</div>
