<p class="detail-row"><strong>주소</strong> 경기도 화성시 우정읍 매향리</p>

<a href="https://map.kakao.com/link/map/%EB%A7%A4%ED%96%A5%ED%95%AD%EC%84%A0%EC%B0%A9%EC%9E%A5,37.0736431460,126.7330098323" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">서해안의 아름다운 일몰을 감상할 수 있는 매향리 작은 포구이다. 우정읍 매향리와 궁평항을 잇는 화성 방조제의 아름다운 서해를 볼 수 있다. 매향리 선착장 가는 길목에 매향리 역사관이 있다. 1951년부터 2001년 6월까지 주한미군 공군 폭격 훈련장으로 사용되던 농섬(일명 쿠니사격장)과 그 일대의 기록을 남겨놓았다. 폭격으로 섬 자체가 반 정도 남아있는 농섬에는 수많은 철새들이 찾아온다.</div>
