<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">저동항</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 울릉군 울릉읍 저동리</p>

<a href="https://map.kakao.com/link/map/%EC%A0%80%EB%8F%99%ED%95%AD,37.4962526269,130.9100397491" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경상북도 울릉군 저동리에 있는 저동항은 울릉군에서 가장 큰 항구이다. 저동항은 울릉도 오징어 대부분이 취급되는 항구로 1967년 1월 어업전진기지로 지정되었다. 오징어를 잡기 위해 집어등을 밝힌 어선들의 오징어잡이배 불빛으로 유명한 저동어화(苧洞漁火)는 울릉 8경 중에 하나로 유명하다. 또한 항구 방파제 옆에 있는 촛대바위는 홀아버지와 살던 딸이 바다로 나가 돌아오지 않는 아버지를 애타게 기다리다가 바위가 되었다는 전설이 있어 효녀바위라고도 불린다.</div>
