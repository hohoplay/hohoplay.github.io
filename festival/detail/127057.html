<p class="detail-row"><strong>주소</strong> 경기도 가평군 설악면 가일리</p>

<a href="https://map.kakao.com/link/map/%EC%86%8C%EA%B5%AC%EB%8B%88%EC%82%B0,37.5788534511,127.4730173430" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">소구니산(800m)은 경기도 가평군 설악면과 양평군 옥천면에 걸쳐 있는 산이다. 북쪽으로는 중미산, 동쪽으로는 유명산이 위치하고 있어 주변 산과 연계하여 등산하는 이용객이 많은 곳이다. 소구니산 정상을 오르기 위해 선어치고개와 농다치고개를 이용하는 두 가지 방법이 있다. 농다치고개 코스는 오대산 두로봉에서 시작된 한강기맥에 연결되어 옥산~청계산~두물머리로 이어진다.</div>
