<p class="detail-row"><strong>주소</strong> 경기도 안산시 단원구 대부황금로 1567-3</p>

<a href="https://map.kakao.com/link/map/%EB%B0%A9%EC%95%84%EB%A8%B8%EB%A6%AC%EC%84%A0%EC%B0%A9%EC%9E%A5,37.2963978942,126.5744098104" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">방아머리선착장은 경기도 안산시 대부도에 있는 선착장이다. 이곳에서 페리를 타고 대이작도, 자월도 등의 섬에 들어갈 수 있다. 여객터미널이 있고 그 앞으로 낚시도구를 구매할 수 있는 판매점과 수산물 판매장이 있다. 수산물 판매장에서 칼국수나 회를 간단하게 먹을 수 있다. 또한 서울 근교에서 손쉽게 낚시를 할 수 있는 곳으로 바다낚시를 즐길 수 있다.</div>
