<a href="https://map.kakao.com/link/map/%EC%A7%80%EC%98%A4%ED%81%B4%EB%9F%BD,35.2578452406,129.2353514279" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">지오 클럽 카라반은 기장군 일광 해수욕장 앞에 위치해 있다. 바다와 백사장이 바로 앞에 있어 하루 종일 해수욕을 즐길 수 있다. 뷰가 좋아서 바비큐 할 때도 바다 앞에서 파도 소리를 들으며 할 수 있다는 장점이 있다. 카라반 안에 모든 것이 갖춰져 있고 공용 화장실과 샤워실도 있다. 난방 시설도 갖춰져 있으며 수상 레저 시설도 가까이 있어 다양한 체험이 가능하다.</div>
