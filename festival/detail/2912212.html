<a href="https://map.kakao.com/link/map/%EC%A3%BC%EC%95%94%EC%A0%95,36.6427788122,128.2712418495" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">주암정은 경상북도 문경시 산북면 서중리에 있다. 조선시대 유학자였던 주암 채익하 선생을 기리고자 세웠다. 문경에서 아름다움 경치를 지닌 정자 가운데 하나로 작은 연못 위에 배 모양을 띤 바위 위에 정자가 있어 주암정이라 불린다. 연못에는 연꽃이 만개하고 정자 주변에는 능소화가 피어난다. 이 덕분에 여름철이 되면 많은 관광객의 발길이 모인다. 점촌함창 IC에서 가깝고 주변에 문경철로자전거 진남역과 고모산성이 있다.</div>
