<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">도음산산림문화수련장은 넓은 잔디광장과 더불어 다양한 수목들이 식재된 유아숲체험원을 운영하고 있다. 이 밖에 탐방객을 대상으로 숲을 이해하면서 재미있는 나무 이야기를 들을 수 있는 숲해설과 한여름 무더위를 날리기 그만인 야외 물놀이장을 운영하고 있다. 온 가족이 함께 자연 속에서 휴식하기 좋은 힐링 공간이다. 숲 해설은 사전 문의 후 방문하는 것이 좋다.</div>
