<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">영산강</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 담양군 수북면 개동신기길 </p>

<a href="https://map.kakao.com/link/map/%EC%98%81%EC%82%B0%EA%B0%95,35.2772856399,126.9472239597" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">영산강은 전남광주통합특별시 담양군 월산면 용흥리 병풍산 북쪽 용흥사 계곡에서 발원하여 영산강하굿둑을 통해 서해로 흐르는 강으로 길이 138.75km, 유역면적 3,371㎢이다. 우리나라의 국가하천 중 본류 기준으로 다섯 번째로 길고 넓은 강이다. 조석의 영향이 나주 부근까지 미쳐 연안 농경지에 하천 범람, 농토 침식 등의 피해를 주기도 하였으나 1981년 12월에 하굿둑이 축조됨으로써 감조구역[感潮區域]이 크게 줄어들었다.</div>
