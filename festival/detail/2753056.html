<a href="https://map.kakao.com/link/map/%EA%B1%B0%EB%B6%81%EB%B0%94%EC%9C%84%EC%BA%A0%ED%95%91%EC%9E%A5,37.5673956383,127.4288300217" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">거북바위 캠핑장은 서울 동남부 지역 기준으로 1시간 이내에 위치한 캠핑장으로 서후리 숲 수목원 옆에 위치하고 있다. 사이트는 파쇄석과 데크석이 있고, 차를 주차하고도 넓이가 여유 있어 편리하다. 길게 늘어선 사이트들 중에서도 양 끝에 사이트들이 한적하여 소위 명당자리로 인기다. 바로 옆 서 후리 숲의 산림욕은 물론 수련으로 유명한 세미원, 두물머리 등 가까이에 볼거리가 많다.</div>
