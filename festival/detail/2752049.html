<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">북극곰 캠핑장은 흥정계곡에서도 가장 아름답다는 중류, 허브나라농원 가까이 자리하고 있다. 계곡 옆으로 울창한 숲이 조성되어 있어 힐링의 명소로 꼽히며 숲속에 데크 사이트가 놓여있어 야영을 위한 최상의 조건을 제공하고 있다. 주차장과 계곡 사이 계단식으로 사이트가 배치돼 있어 한 계단 내려가야 하는 불편도 있지만 오히려 호젓한 야영을 즐길 수 있는 장점이 있다.</div>
