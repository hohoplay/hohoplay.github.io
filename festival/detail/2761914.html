<a href="https://map.kakao.com/link/map/%EC%8A%A4%ED%86%A4%ED%9E%90,34.8925588254,128.6555728903" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">바다가 아름다운 거제에서 숲을 즐길 수 있는 글램핑장이다. 독채로 되어 있고, 숙소마다 간격이 있어 조용하고 독립적인 느낌을 준다. 펜션도 함께 운영하고 있어 주변 경관을 잘 꾸며놓았고, 곳곳의 포토존과 카페도 이용할 수 있다. 다양한 컨셉의 클램핑장과 체험공간이 있어, 온 가족이 편하게 즐길 수 있다. 오랜만에 도심에서 벗어나, 피어오르는 모닥불 앞에서 자연의 정취와 분위기를 즐길 수 있다.</div>
