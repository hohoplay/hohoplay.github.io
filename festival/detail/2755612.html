<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 두촌면 황병고개길 25-10</p>

<a href="https://map.kakao.com/link/map/%EB%8A%98%ED%8E%B8%ED%95%9C%EC%BA%A0%ED%95%91%EC%9E%A5,37.8631655464,128.1047543705" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">늘편한캠핑장은 강원도 홍천군에 위치한 소규모 캠핑장이다. 조용하고 한적한 분위기 속에서 캠핑을 즐길 수 있는 공간이다. 용소계곡 최상류에 위치하여 1년 365일 맑은 계곡물을 자랑한다. 한 여름에도 시원하고, 시원한 계곡 물소리를 들으며 바비큐를 이용할 수 있다. 밤이면 쏟아질 듯한 별들도 함께 즐길 수 있다.</div>
