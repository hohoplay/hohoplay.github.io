<a href="https://map.kakao.com/link/map/%EC%97%B0%ED%99%94%EB%AA%BB%28%ED%95%98%EA%B0%80%EB%AA%BB%29,33.4547464297,126.3475200185" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">연꽃이 많은 연못이라는 뜻으로 지어진 연화못은 제주 유명한 명소인 더럭분교 인근에 있다. 넓이가 3,780여 평으로 봉천수에 의한 연못으로는 제주도에서 가장 넓으며 마을 안에 위치하고 있어 농업용수로 이용할 뿐만 아니라 연꽃, 수련, 소리쟁이, 쇠무릎 등과 각종 수생 식물을 비롯하여 어류 등 다양한 종이 서식하고 있다.</div>
