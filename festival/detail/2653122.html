<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">용담저수지</h1>
<p class="detail-row"><strong>주소</strong> 경기도 용인시 처인구 원삼면 사암리</p>

<a href="https://map.kakao.com/link/map/%EC%9A%A9%EB%8B%B4%EC%A0%80%EC%88%98%EC%A7%80,37.1883512177,127.3074157277" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">용담저수지는 경기도 용인시 처인구 원삼면 사암리에 위치한 저수지이다. 저수지 주변으로 용인시민들에게 휴식 공간 제공과 건강증진을 도모하고자 둘레길을 조성했다. 둘레길은 4.1㎞이며, 도보로 약 1시간 내외 정도 소요가 된다. 곳곳에는 포토존도 마련되어 있어 산책하며 사진을 찍기 좋다. 또한 둘레길이 평지길로 걷기 쉽게 조성되어 있어 누구나 큰 어려움 없이 다닐 수 있으며, 반려견들과 산책하기에도 좋다.</div>
