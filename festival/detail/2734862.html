<p class="detail-row"><strong>주소</strong> 전북특별자치도 고창군 상하면 구시포안길 38</p>

<a href="https://map.kakao.com/link/map/%EA%B5%AC%EC%8B%9C%ED%8F%AC%EB%85%B8%EC%9D%84%EC%BA%A0%ED%95%91%EC%9E%A5,35.4422916659,126.4353847013" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">가족 및 연인들을 위한 구시포노을캠핑장은 전북 고창군 상하면 구시포안길 38에 위치하고 있다. 정해진 사이트는 없으며 예약 후 선착순 입장이다. 총 45면으로 운영하고 있다. 바닷가 바로 옆에 위치하고 있어 해수욕, 갯벌체험, 바다낚시가 가능하다. 주변 관광지로는 명사십리, 구시포해수욕장, 계마항, 법성포 등이 있다.</div>
