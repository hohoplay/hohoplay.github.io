<p class="detail-row"><strong>주소</strong> 강원특별자치도 정선군 정선읍 가리왕산로 570-5</p>

<a href="https://map.kakao.com/link/map/%ED%9A%8C%EB%8F%99%EC%86%94%ED%96%A5%EC%BA%A0%ED%95%91%EC%9E%A5,37.4131184174,128.5837885319" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 정선에 위치한 회동 솔향캠핑장은 솔숲이 우거진 산자락에 자리잡고 있어 조용하고 운치있는 캠핑장이다. 52면의 캠핑 데크와 3개 동의 취사장, 그리고 샤워실과 화장실이 각각 2동씩 갖추어져 있다. 캠핑장 내에 족구장과 농구장 등의 체육시설과 쉼터를 이용할 수 있어 이용자들의 편의성이 높다.</div>
