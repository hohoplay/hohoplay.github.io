<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">속초 국민여가캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 속초시 해오름로 177 (조양동)</p>

<a href="https://map.kakao.com/link/map/%EC%86%8D%EC%B4%88%20%EA%B5%AD%EB%AF%BC%EC%97%AC%EA%B0%80%EC%BA%A0%ED%95%91%EC%9E%A5,38.1896204795,128.6025630534" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">속초시가 속초 해변에 조성한 국민여가 캠핑장이다. 제 1캠핑장은 잔디밭 위에 데크 사이트가 마련되어 있고 제 2캠핑장은 해수욕장 모래사장과 주차장이 인접한 곳에 데크 사이트가 마련되어 있다. 주변에 대포항을 비롯하여 설악산, 척산온천, 영랑호 등 천혜의 자연환경을 자랑하는 여행지와 함께 청호동 아바이마을, 재래식 관광수산시장 등이 근접하여 사계절 내내 오감만족을 할 수 있는 힐링캠핑장이다.</div>
