<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">진동리 국민여가캠핑장은 강원도 인제군 기린면에 자리 잡고 있다. 캠핑장에는 파쇄석으로 이루어진 일반 캠핑 사이트 44면이 3개 구역에 걸쳐 마련되어 있다. 1구역은 각종 수목이 우거져 있으며, 가운데로 계곡이 형성되어 있다. 2구역은 계곡과 편의 시설에서 가장 가까운 곳에 있다. 3구역은 하늘을 감상하기 좋은 사이트다.</div>
