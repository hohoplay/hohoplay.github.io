<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">평화의 댐(남한)과 임남댐(북한) 건설로 인한 수량번화로 인해 형성된 습지로 극류화천이 습지로 변한 곳으로 인위적인 영향을 받은 지형이다. 휴전 이후 민간인의 출입이 엄격히 통제되어 왓기 때문에 하천습지의 보존상태가 매우 우수한 것으로 알려져 있다. 또한 하천과 습지, 야산 등 다양한 서식처가 유기적으로 연결되어 있어 동식물의 서식처로서의 생태적 역할이 중요한 지형을 이루고 있다.&lt;br&gt;</div>
