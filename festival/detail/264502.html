<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">죽암몽돌해안 (울릉도, 독도 국가지질공원)</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 울릉군 북면 천부리</p>

<a href="https://map.kakao.com/link/map/%EC%A3%BD%EC%95%94%EB%AA%BD%EB%8F%8C%ED%95%B4%EC%95%88%20%28%EC%9A%B8%EB%A6%89%EB%8F%84%2C%20%EB%8F%85%EB%8F%84%20%EA%B5%AD%EA%B0%80%EC%A7%80%EC%A7%88%EA%B3%B5%EC%9B%90%29,37.5408526568,130.8898400649" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">죽암몽돌해안은 울릉도의 거센 파도에 의해 만들어진 몽돌해안이다. 해안지형이 지속적으로 파도의 침식작용을 받게 되면 약한 부분은 깎여 만이 되고, 이곳에 퇴적작용이 일어나면서 해변이 발달한 것이다. 죽암몽돌해안에는 주변의 조면암, 현무암 등의 구성 암석들이 거센 파도에 의해 이리저리 휩쓸려 모서리가 마모되면서 만들어진 둥글둥글한 몽돌이 퇴적되어 해안을 이루고 있다.</div>
