<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">동산계곡펜션</h1>
<p class="detail-row"><strong>주소</strong> 대구광역시 군위군 부계면 원효길 129-9</p>

<a href="https://map.kakao.com/link/map/%EB%8F%99%EC%82%B0%EA%B3%84%EA%B3%A1%ED%8E%9C%EC%85%98,36.0465290598,128.6657182027" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">동산계곡펜션은 대구 인근, 경북 군위의 팔공산 자락에 위치한 펜션 겸 캠핑장이다. 오토캠핑 사이트 4개와 카라반 4개, 펜션이 함께 있다. 바닥은 파쇄석이고, 사이트는 데크가 갖춰져 있다. 캠핑장 옆으로 흐르는 동산계곡은 팔공산의 수려한 산세와 풍부한 수량을 자랑하며, 20여 개의 크고 작은 폭포가 펼쳐져 있어 물놀이하기 좋다. 물놀이 이외에도 봄이면 벚꽃, 가을이면 단풍놀이 등 즐길 거리가 있다.</div>
