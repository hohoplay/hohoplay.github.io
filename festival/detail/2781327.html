<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">운진항</h1>
<p class="detail-row"><strong>주소</strong> 제주특별자치도 서귀포시 대정읍 하모리</p>

<a href="https://map.kakao.com/link/map/%EC%9A%B4%EC%A7%84%ED%95%AD,33.2095276929,126.2583110141" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">운진항은 대한민국 최남단 섬인 마라도와 청보리 축제로 유명한 가파도로 가는 여객선이 드나드는 항구다. 운진항에서 출발한 여객선은 10분이면 가파도, 25분이면 마라도에 도착한다. 크기는 작으나, 매년 60만 명 이상의 관광객이 제주의 아름다운 부속 섬을 방문하기 위해 이곳 운진항을 찾는다. 평소에도 관광객으로 활기찬 항구지만, 특히 가파도 청보리 축제가 열리는 봄이면 배편이 자주 매진되니 사전에 예약하는 것을 추천한다.</div>
