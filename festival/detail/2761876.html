<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">방태산 자연휴양림 캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 기린면 방태산길 377</p>

<a href="https://map.kakao.com/link/map/%EB%B0%A9%ED%83%9C%EC%82%B0%20%EC%9E%90%EC%97%B0%ED%9C%B4%EC%96%91%EB%A6%BC%20%EC%BA%A0%ED%95%91%EC%9E%A5,37.9223698456,128.3995675048" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">방태산자연휴양림은 인제와 홍천의 경계를 이루는 해발 1433m의 방태산에 있는데 주변에 1000m가 넘는 고봉들이 즐비해 진입하는 길이 만만치 않다. 그만큼 아름다운 계곡과 능선을 자랑한다. 오토캠프장엔 아름드리나무 사이로 야영데크까지 갖추고 있다. 50개의 야영데크가 있고 별도 야영장이 2곳 있다. 야외화장실과 음수대 야외 샤워장 등을 갖추고 있으며 생태관찰로와 10.2km의 등산로도 있다.</div>
