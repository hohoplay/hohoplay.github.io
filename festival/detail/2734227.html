<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">덕유대자동차야영장은 우리나라 최대 규모의 덕유대 야영장에 각종 부대시설을 마련하여 1993년에 조성되었다. 야영장 바로 옆에 구천동 계곡이 흐르는 자연관찰로가 위치하고 있으며 샤워장, 취사장, 화장실 등 각종편의시설이 준비되어 있다.</div>
