<a href="https://map.kakao.com/link/map/%EB%B3%84%EC%9D%84%EB%8B%A4%EB%8A%94%EC%95%84%EC%9D%B4,37.7437887071,126.9522044934" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">숲 뷰가 아름다운 별을다는아이 캠핑장은 전체 사이트가 파쇄석으로 구성되어 있다. 캠핑장 주변 곳곳에 숨겨진 산책로를 따라 걷다 보면 아름다운 비경을 만나게 된다. 특히 숲 쪽 사이트는 간격이 더 여유로워 독립적인 개별 공간의 자유로움을 느낄 수 있다. 캠핑장 내에 부대시설로는 화장실, 샤워실, 개수대, 와이파이, 매점이 있다.</div>
