<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">밧지름해변</h1>
<p class="detail-row"><strong>주소</strong> 인천광역시 옹진군 덕적면 덕적남로 209-1</p>

<a href="https://map.kakao.com/link/map/%EB%B0%A7%EC%A7%80%EB%A6%84%ED%95%B4%EB%B3%80,37.2152442140,126.1393794447" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">밧지름 해변은 인천에서 남서쪽으로 약 75km 떨어진 덕적도 진 1리에 위치한 천연해수욕장으로 고운 백사장과 수 백 년 묵은 노송숲, 해당화가 절경을 이루고, 수심이 1.5m 내외로 가족단위 피서지로 좋다. 또한, 덕적도 최고봉인 비조봉(292m) 등산코스가 잘 정비되어 있어 해수욕뿐만 아니라 가벼운 등산도 즐길 수 있으며 인근 해안에서의 바다낚시도 가능하고 주변의 갯바위에서 소라, 굴, 게 등을 잡는 즐거움도 맛볼 수 있다.</div>
