<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">천보산 휴양림 내에 위치한 오토캠핑장으로 총 9개의 야영 데크와 1개의 스페셜 데크로 구성돼 있다. 야영 데크 스페셜은 2개의 데크를 함께 사용할 수 있어 여유로운 캠핑이 가능하다. 바닥에 초록 매트가 깔려 있어 안전하고 주변의 나무들과 어우러져 보는 것 만으로도 힐링할 수 있다.</div>
