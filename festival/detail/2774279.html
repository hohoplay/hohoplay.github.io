<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">분황사 청보리밭</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 경주시 분황로 94-11</p>

<a href="https://map.kakao.com/link/map/%EB%B6%84%ED%99%A9%EC%82%AC%20%EC%B2%AD%EB%B3%B4%EB%A6%AC%EB%B0%AD,35.8404657892,129.2334241180" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경주의 분황사 주변에는 매년 봄 싱그러운 청보리밭이 펼쳐진다. 추석 직후에 파종한 보리가 이듬해 봄부터 초여름까지 색다른 볼거리를 제공하는 것으로 분황사 주차장에서 황룡사지 방향을 바라보면 황룡사 역사문화관을 배경으로 짙푸른 청보리밭이 끝도 없이 펼쳐진다. 파란 하늘과 따스한 햇살, 봄바람에 일렁이는 청보리가 보는 이들의 마음을 설레게 한다. 해 질 무렵에는 노을에 물든 청보리가 황금빛으로 반짝이며 천년 경주의 매력을 더한다.</div>
