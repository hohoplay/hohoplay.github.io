<p class="detail-row"><strong>주소</strong> 경상북도 경주시 산내면 대현길 250-13</p>

<a href="https://map.kakao.com/link/map/%EB%B0%98%EB%94%A7%EB%B6%88%EC%9D%B4%EC%BA%A0%ED%95%91%EC%9E%A5,35.7126910994,129.0741722450" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경주시 산내면에 위치한 반딧불이캠핑장은 자연을 벗 삼아 캠핑을 즐길 수 있는 곳이다. 봄엔 벚꽃, 여름엔 푸르게 우거진 나무 그늘, 가을엔 형형색색 물든 낙엽, 겨울엔 운치 있는 눈까지 모두 감상할 수 있는 캠핑장이다. 캠핑장은 일반야영장과 방갈로가 준비되어 있다. 사이트의 크기는 구역 별로 조금씩 다르기 때문에 방문 전에 확인하는 것이 좋다.</div>
