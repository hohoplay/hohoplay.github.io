<p class="detail-row"><strong>주소</strong> 충청북도 충주시 앙성면 둔터로 625-31</p>

<a href="https://map.kakao.com/link/map/%ED%8E%AB%20%ED%8A%B8%EB%A6%AC%ED%8C%8C%ED%81%AC,37.1028989597,127.7102706696" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">천연잔디 운동장이 있는 펫트리파크는 충청북도 충주시 앙성면에 위치한 애견 동반 글램핑장이다. 천연잔디 운동장이 있어 반려견이 마음껏 뛰며 즐길 수 있는 공간과 반려견 수영장, 반려견 샤워장, 개별 울타리 등의 시설을 갖추었다. 또한 카페와 매점을 이용할 수 있고 반려견 셀프 목욕이 가능하며 15Kg 이하인 중소형견만 입장이 가능하다. 다양한 시설을 즐기며 견주와 반려견 모두 행복한 추억을 만들 수 있다.</div>
