<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">설레미해수욕장은 증도의 끝자락에 위치한 작은 해변이다. 해수욕장 주변으로 엘도라도 리조트와 캠핑장, 펜션, 민박집들이 즐비해있다. 해변 모래사장 쪽에는 캠핑데크가 있어 바다를 바라보며 캠핑을 즐길 수 있다. 가볍게 해변을 따라 산책을 하기에도 좋고, 일몰을 감상하기에도 좋다.</div>
