<p class="detail-row"><strong>주소</strong> 충청남도 태안군 소원면 모항리 1097-21</p>

<a href="https://map.kakao.com/link/map/%EC%96%B4%EC%9D%80%EB%8F%8C%ED%95%AD,36.7506394505,126.1266262520" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">어은돌항은 어은돌해수욕장과 맞닿아 있다. 둘 사이의 거리가 100m도 되지 않아서 여름철이면 해수욕과 낚시를 함께 즐기려는 사람들이 많이 찾는다. 
어은돌항에는 정기적으로 출조하는 낚싯배가 있다. 낚시 초보자를 위한 체험 낚시 어선도 있어 경험 삼아 낚싯배에 오르는 사람들도 많다. 노래미, 광어, 볼락 등 다양한 어종을 낚을 수 있다. 구태여 출조 어선을 타지 않더라도 항구 주변에도 낚시를 즐길 수 있는 포인트가 많다.</div>
