<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">개똥이네 캠핑장은 강원 홍천군 북방면에 위치하고 있다. 캠핑장 바로 앞을 흐르는 계곡에서 물놀이를 하기에 좋은 곳이다. 야외수영장, 잔디광장, 매점, 화장실, 샤워시설, 개수대, 전기, 온수를 제공하고 있다. 동계 캠핑이 가능하며 반려동물을 동반할 수 있다. 캠핑장을 둘러싸고 있는 산으로 등산을 할 수 있다.</div>
