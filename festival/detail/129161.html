<p class="detail-row"><strong>주소</strong> 경상북도 경주시 감포읍 오류리</p>

<a href="https://map.kakao.com/link/map/%EC%98%A4%EB%A5%98%EA%B3%A0%EC%95%84%EB%9D%BC%ED%95%B4%EB%B3%80,35.8223425217,129.5095310271" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경주 감포읍에 있는 오류고아라해변은 1㎞의 백사장과 1.5m 안팎의 수심에 소나무 숲이 우거진 해변으로, 모래가 부드러워 모래찜질로 유명한 곳이다. 소나무숲에는 오류캠핑장이 조성되어 있어 텐트, 카라반캠핑이 가능하고, 여름철에는 바나나보트, 모터보트와 같은 수상레저를 즐길 수 있다. 주변 관광지로는 감포항, 감포공설시장 등이 있다.</div>
