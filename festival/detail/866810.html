<p class="detail-row"><strong>주소</strong> 경기도 광주시 퇴촌면 광동리</p>

<a href="https://map.kakao.com/link/map/%ED%8C%94%EB%8B%B9%ED%98%B8,37.5084528395,127.2963159763" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">팔당호는 경기도 광주시 퇴촌면과 남종면에 걸쳐져 있는 호수이다. 남한강과 북한강, 경안천이 모여서 이루어지는 호소로서 1973년 댐의 설치로 형성되었다. 과거에는 물류 교역의 중심지였으며, 수도권 2천7백만 주민에게 물을 공급해 주는 곳으로, 현재는 산과 물이 어우러진 아름다운 자연경관으로 수도권 주민들이 즐겨 찾는 휴식공간으로의 역할을 하는 곳이다.

(출처 : 경기도청)</div>
