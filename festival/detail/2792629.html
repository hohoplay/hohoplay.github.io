<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">어반캠핑 마장호수</h1>
<p class="detail-row"><strong>주소</strong> 경기도 파주시 광탄면 기산로 367</p>

<a href="https://map.kakao.com/link/map/%EC%96%B4%EB%B0%98%EC%BA%A0%ED%95%91%20%EB%A7%88%EC%9E%A5%ED%98%B8%EC%88%98,37.7745708786,126.9325443006" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">파주시 광탄면에 위치한 캠핑장이다. 호수 뷰로 전망이 좋고 즐길거리가 풍부하다. 마장호수 전경을 만끽하며 셀프 바베큐장을 대여해서 당일캠핑을 할 수 있으며 추가 요금 지불 및 텐트 지참 시 숙박도 가능하다. 또한 캠핑장 내에 카페 이용할 경우 알파카 먹이체험, 콜덕오리 먹이체험, 닥터피쉬 체험을 무료로 즐길 수 있다. 인근에 마장호수, 양주골 한우마을, 보광사계곡 등이 있어 연계 관광하기에 좋다.</div>
