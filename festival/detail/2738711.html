<a href="https://map.kakao.com/link/map/%EC%84%9D%EB%82%A8%EC%82%AC%EA%B3%84%EA%B3%A1,36.9392410718,127.3070755134" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">석남사계곡은 안성 서운산 자락에 위치한 석남사 위쪽에서 흐르고 있는 계곡이다. 석남사는 통일신라 고승 석선이 세웠다. 대웅전과 영산전 두 불전을 중심으로 요사채, 누각, 탑, 부도, 마애불이 있다. 최근 드라마 &lt;도깨비&gt; 촬영지로 알려져 있어 많은 사람들이 방문한다. 특히 한 여름에 산에서 흐르는 석남사계곡에서 피서를 즐기기 좋다.</div>
