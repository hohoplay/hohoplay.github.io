<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">반딧불이 천문대</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 영양군 수비면 반딧불이로 129</p>

<a href="https://map.kakao.com/link/map/%EB%B0%98%EB%94%A7%EB%B6%88%EC%9D%B4%20%EC%B2%9C%EB%AC%B8%EB%8C%80,36.8305012719,129.2696336559" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">영양군이 운영하는 영양반딧불이천문대는 일반인을 대상으로 하는 시민천문대이다. 반딧불이생태체험마을 특구 내에 위치한 영양반딧불이천문대는 여름철 밤하늘의 별과 함께 자연에 서식하고 있는 반딧불이를 동시에 관찰할 수 있는 국내 유일의 천체관측장소이다. 주간에는 태양망원경을 이용하여 흑점과 홍염을 관측할 수 있으며 야간에는 행성, 성운, 성단, 은하, 달 관측이 가능하다.

(출처 : 영양군 생태공원사업소)</div>
