<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">더불어사는터</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 두산길 199-8</p>

<a href="https://map.kakao.com/link/map/%EB%8D%94%EB%B6%88%EC%96%B4%EC%82%AC%EB%8A%94%ED%84%B0,37.3104391681,128.1737895766" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">더불어사는터는 치악산 끝자락에 위치한 영월 수주면에 위치한 캠핑장으로 29개의 캠핑 사이트와 3개의 펜션 동으로 되어 있는 캠핑장이다. 바로 옆에는 민물가재가 사는 맑고 넓은 계곡이 있고, 나무가 많아 시원하다. 트레일러나 카라반도 추가 비용을 내면 입영이 가능하다. 애견의 경우 5kg 이하 소형견은 동반 가능하다. 사이트는 지정제가 아니라 선착순 배정이며, 바닥은 파쇄석으로 되어 있다.</div>
