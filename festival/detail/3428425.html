<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">‘정읍 허브원’은 라벤더 개화상태에 따라 라벤더 축제가 열린다. 정읍 칠보산 구룡동에 조성된 ‘정읍 허브원’에서 라벤더 30만 주와 라반딘 4만 주가 선사하는 보랏빛 힐링을 느낄 수 있으며 해바라기와 코스모스의 다채로운 매력도 함께 즐길 수 있다. ‘정읍 허브원’에는 대형카페도 위치해 있는데 축제 기간 동안에는 입장객에 한하여 카페 이용이 가능하다.</div>
