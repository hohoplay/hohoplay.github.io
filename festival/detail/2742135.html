<p class="detail-row"><strong>주소</strong> 경기도 의왕시 학의동 474-1</p>

<a href="https://map.kakao.com/link/map/%EB%BF%8C%EB%A6%AC%EA%B9%8A%EC%9D%80%EB%82%98%EB%AC%B4%EC%88%B2,37.3844648924,127.0131257831" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">뿌리깊은나무숲은 경기도 의왕시 학의동에 있는 어린이를 위한 자연학습장이다. 동물 먹이 주기, 어린이 미로공원, 계절별 수확 활동(감자, 고구마 캐기 등) 같은 체험 활동이 가능하다. 여름에는 미니풀장이 마련되고, 그 외 계절에는 피크닉&amp;캠핑존 등으로 꾸며 다양한 체험이 가능하다. 자연을 자주 접하지 못하는 어른과 아이들에게 그 자체로 또 하나의 놀이동산이 되어준다.</div>
