<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">진달래 관광농원 캠핑장은 충청남도 부여군 옥산면에 자리 잡고 있다. 펜션과 카페도 함께 운영하고 있으며 옥산 저수지와 가까이 있어 풍경이 일품이다. 포토존이 따로 없어도 사진 찍기 좋은 곳이다. 캠핑장은 일반 야영장 12면을 갖추고 있는데 바닥은 모두 데크로 되어 있고 사이트 크기는 가로 3m 세로 4m다.</div>
