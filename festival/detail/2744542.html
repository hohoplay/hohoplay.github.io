<p class="detail-row"><strong>주소</strong> 경기도 양주시 광적면 부흥로34번길 17</p>

<a href="https://map.kakao.com/link/map/%EB%B2%94%EC%82%B0%EA%B3%A8%EC%BA%A0%ED%95%91%EC%9E%A5,37.8043281894,126.9140756949" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 양주시 광적면의 범산골캠핑장은 한적한 분위기에서 자녀와 함께 즐길 수 있는 가족단위 캠핑장이다.  아이들이 즐길 수 있는 수영장과 트램펄린이 준비되어 있고 깨끗한 시설, 상쾌한 자연과 함께 즐거운 추억을 선사하는 캠핑장이다. 범산골캠핑장은 파쇄석 사이트 오토캠핑존과 데크사이트, 단독형 잔디사이트 등으로 구분되어 있다. 파쇄석 사이트는 주위가 개방되어 있는 편인데 반해 데크사이트는 숲속에 위해 그늘이 많다.</div>
