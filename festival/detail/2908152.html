<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">갈천힐링캠프</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 양양군 구룡령로 1103-41</p>

<a href="https://map.kakao.com/link/map/%EA%B0%88%EC%B2%9C%ED%9E%90%EB%A7%81%EC%BA%A0%ED%94%84,37.9073458372,128.5049306436" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">양양에서 홍천으로 넘어가는 구룡령 초입에 위치하고 있다. 고개 오르막길 시작 지점에서 갈천약수 이정표를 따라 갈천약수교를 건너고 바로 좌회전해 마을 안쪽으로 들어가면된다. 길 끝지점에 제법 큰 한옥이 한채 있고 그 뒤로 서 있는 울창한 소나무숲이 캠핑장이다.  작은 개울이 빙둘러 흐르고 위쪽에 있는 작은 사방댐에서는 마치 폭포처럼 물줄기가 흘러내려 풍광이 훌륭하다. 여름에는 이곳이 물놀이장으로 사용된다.</div>
