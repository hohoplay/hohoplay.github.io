<p class="detail-row"><strong>주소</strong> 인천광역시 강화군 양도면 해안서로 695</p>

<a href="https://map.kakao.com/link/map/%EB%85%B8%EC%9D%84%EC%BA%A0%ED%95%91%EC%9E%A5,37.6893628284,126.3892880966" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강화도 외포리에서 5분 거리에 있는 이곳은 바다에 인접한 작은 캠핑장이다. 개수대, 전기, 가스, 상수도, 무선인터넷 등이 설치되어있다. 캠핑장에 연결된 계단을 통해 바다로 나갈수 있으며, 낚시와 해루질이 가능하다. 캠핑장 운영자가 직접 상주하며 깨끗하게 관리하고 있다. 공장같이 보이는 건물에 샤워장과 화장실, 식당 겸 카페, 쉼터 등 편의시설이 배치되어 있다. 캠핑장 내에 나무가 없어 그늘이 없는 점이 아쉽다.</div>
