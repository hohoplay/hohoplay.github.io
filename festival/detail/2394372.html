<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">서울에서 접근성이 좋은 경기도 가평군 설악면에 위치하는 소풍캠핑장은 눈썰매장이 있는 캠핑장으로 사계절 가족과 즐거운 시간을 보낼 수 있는 조용한 캠핑장이다. 캠핑장을 둘러싸고 있는 유명산, 어비계곡은 천혜의 자연환경과 수려한 경관을 갖고 있어 지친 몸과 마음을 정화시키고 힐링할 수 있도록 도와준다. 캠핑장의 현대적인 시설과 서비스는 넓은 공간에서 편안하고 쾌적하게 지낼 수 있도록 한다.</div>
