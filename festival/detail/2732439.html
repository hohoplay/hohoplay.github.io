<p class="detail-row"><strong>주소</strong> 경기도 연천군 미산면 어삼로 415-17</p>

<a href="https://map.kakao.com/link/map/%ED%8F%89%ED%99%94%EA%B0%95%EB%B3%80%EC%88%98%EB%AA%A9%EC%BA%A0%ED%95%91%EC%9E%A5,38.0194486815,126.9778358906" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">평화 강변 수목원은 경기도 연천에 위치한 캠핑장이다. 철쭉 산책길과 강변 가는 산책을 하기에 좋다. 그늘이 많은 편이다. 캠핑장 이용 후, 쓰레기를 다시 집으로 가져가야 하는 규칙이 있다. 캠핑장에서 지켜야 할 규율이 조금 복잡하지만, 그만큼 쾌적한 환경에서 모두가 캠핑을 즐길 수 있다. 캠핑장과 방갈로를 함께 운영 중이라, 가족들이 함께 이용하기 좋다. 주변 관광지로는 숭의전, 연천 당포성 등이 있다.</div>
