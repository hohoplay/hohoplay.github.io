<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">내리금봉캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 김삿갓면 내리계곡로 1146</p>

<a href="https://map.kakao.com/link/map/%EB%82%B4%EB%A6%AC%EA%B8%88%EB%B4%89%EC%BA%A0%ED%95%91%EC%9E%A5,37.1087134739,128.6719258283" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">내리금봉캠핑장은 강원도 영월에 있는 사이트 10개의 소규모 캠핑장이다. 규모가 작아서 조용하고 한적한 캠핑이 가능하다. 파쇄석 바닥에 나무그늘이 많다. 캠핑장 옆에 내리 계곡은 울창한 숲속에 기암괴석과 함께 시원한 계곡물이 흐르고, 아이들이 물놀이하기 좋다. 인근에는 청령포, 선암마을 한반도 지형, 고씨동굴,별마로 천문재, 동강 사진 박물관, 단종 역사관 등의 볼거리가 있어, 가족과 함께 관광하기 좋다.</div>
