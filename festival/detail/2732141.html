<p class="detail-row"><strong>주소</strong> 경기도 양평군 옥천면 사기점길 53</p>

<a href="https://map.kakao.com/link/map/%EC%86%94%EB%9C%B0%EC%BA%A0%ED%95%91%EC%9E%A5,37.5407050275,127.4691493524" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">솔뜰캠핑장은 경기도 양평군에 위치하고 있다. 텐트와 카라반으로 나누어 이용할 수 있으며 당일 선착순 입장제로 운영하고 있다. 주말(금, 토)만 운영하고 있으며 금요일 오전 6시부터 입장이 가능하다. 반려동물 동반 존은 2인 1견 기준으로 운영된다. 매달 다양한 이벤트와 행사를 진행하고 있어 가족들과 함께 더욱 알차고 즐거운 캠핑을 할 수 있는 곳이다.</div>
