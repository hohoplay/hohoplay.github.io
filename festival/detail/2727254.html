<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">별아래캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 용인시 처인구 양지면 한터로662번길 34-34</p>

<a href="https://map.kakao.com/link/map/%EB%B3%84%EC%95%84%EB%9E%98%EC%BA%A0%ED%95%91%EC%9E%A5,37.2561650326,127.2760360991" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 용인시 양지면 별아래캠핑장은 수도권 남부 어디에서나 가깝고 교통이 편리한 것이 장점이다. 초입에 대대저수지와 낚시터가 마련돼 있고 조금 더 직진하면 별아래캠핑장이다. 캠핑장은 산기슭에 마련돼 있어 주위가 조용하다. 한적한 분위기에서 캠핑을 즐길 수 있다. 캠핑장에는 잔디밭과 파쇄석에 60개 정도의 텐트를 펼칠 수 있다. 캠핑장 내에 컨테이너를 이용한 화장실, 샤워실, 개수대가 마련되어 있다.</div>
