<p class="detail-row"><strong>주소</strong> 경기도 포천시 창수면 포천로2811번길 194</p>

<a href="https://map.kakao.com/link/map/%EC%B6%94%EB%8F%99%EC%BA%A0%ED%94%84,37.9916523853,127.1557453979" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">추동캠프는 서울에서 멀지 않은 포천시 창수면에 위치해 있다. 곧게 뻗은 잣나무와 낙엽송이 가득해  자연 그늘이 많은 곳으로도 유명하다. 캠핑장은 계단식 사이트로 되어 있어 물 빠짐이 용이하고, 사이트 간 거리가 있어 이웃 간의 불편함 없이 편안하게 보낼 수 있다. 사이트 사이에 배전함과 소화기가 설치되어 있고 배전함이 없는 밤나무골 사이트는 릴선을 연결해서 사용할 수 있다. 캠핑장 내에 토끼, 닭 등을 키우는 미니 농장도 있다.</div>
