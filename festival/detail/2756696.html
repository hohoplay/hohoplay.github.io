<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">화명수목원은 금정산 자락에 위치한 부산 최초 공립수목원으로, 수목유전자원의 보존과 증식 및 전시를 통해 지역 생태계를 보전하고 있다. 계절의 변화에 따라 다채롭고 매력적인 자연경관과 생물다양성 관찰 기회를 제공하고 있으며, 숲에 대한 올바른 가치관 확립을 위해 다양한 체험 프로그램 운영되고 있다. 9개의 주제원과 숲전시실, 전시온실, 숲속쉼터 등 관람시설이 조성되어 있으며, 화장실, 주차장 등 편의시설이 설치되어 있다.</div>
