<a href="https://map.kakao.com/link/map/%EC%95%8C%ED%94%84%EC%8A%A4%EA%B8%80%EB%9E%A8%ED%95%91,36.3717270446,126.7490189207" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">시원한 자연을 관망하고 넓은 자연경관이 그대로 살아있는 글램핑이다. 하루 종일 물소리, 새소리, 풀벌레 소리가 속삭이듯 자연을 품은 글램핑장은 밤이면 머리 위로 별들이 쏟아질 듯 보이며 밤의 숲에서는 이름 모를 풀벌레의 노래와 반딧불이 빛나는 곳이다. 부대시설로 대형수영장과 워터슬라이드가 있어 여름철 물놀이가 가능하며 조식 제공과 바비큐 무한리필 서비스가 있다.</div>
