<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 신안군 흑산면 진리 586-18</p>

<a href="https://map.kakao.com/link/map/%EB%B0%B0%EB%82%AD%EA%B8%B0%EB%AF%B8%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5,34.6891078527,125.4265562784" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">배낭기미해수욕장은 흑산도에 위치한 해수욕장으로 흑산도항에서 가장 가까운 곳에 자리하여 많은 피서객들이 찾는다. 배낭기미는 큰 바다라는 의미를 담고 있는데 이름처럼 탁 트인 바다 전경을 볼 수 있다. 또한 호수처럼 잔잔한 분위기에 주위가 몽돌 자갈밭으로 이루어져 있고 드넓은 해송이 천연 파라솔 역할을 해주어 여름철 피서를 시원하게 즐길 수 있다.
인근에 해상관광유람선, 깃대봉, 영산도 등의 관광지가 있다.</div>
