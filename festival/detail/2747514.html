<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">제주도파인비치 펜션</h1>
<p class="detail-row"><strong>주소</strong> 제주특별자치도 서귀포시 남원읍 태위로 976-10</p>

<a href="https://map.kakao.com/link/map/%EC%A0%9C%EC%A3%BC%EB%8F%84%ED%8C%8C%EC%9D%B8%EB%B9%84%EC%B9%98%20%ED%8E%9C%EC%85%98,33.2875796161,126.7488667422" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">제주파인비치 펜션은 서귀포시 남원읍에 있다. 제주 올레길 4코스 중간 지점에 있는 바닷가 근처에 펜션과 카라반이 함께 있는 캠핑장이다. 제주 남쪽 푸른 바다를 마음껏 감상하며 캠핑을 할 수 있는 곳으로, 바다가 보이는 오션뷰가 멋있는 캠핑장이다. 넓고 깨끗한 주차장과 제주 느낌이 물씬 나는 야자수, 잘 가꿔진 잔디 정원이 있다. 차로 20분 거리에 올레시장이 있다.</div>
