<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">운천저수지</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 서구 운천로 165</p>

<a href="https://map.kakao.com/link/map/%EC%9A%B4%EC%B2%9C%EC%A0%80%EC%88%98%EC%A7%80,35.1471654718,126.8562352777" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">운천저수지는 1951년 마륵동 농경지에 용수를 공급하기 위해 길이 420m의 제방을 쌓았고 금호, 상무지구의 대규모 택지개발 후 악취와 해충 문제로 매립될 위기에 처했으나 1995년부터 오, 폐수를 차단하고 맑은 물을 공급하여 저수지와 주변 공간을 자연생태공원으로 조성하였다. 저수지를 두른 산책로와 조형물, 분수, 지압로, 정자 등을 이용할 수 있다. 자연을 만끽할 수 있는 공간으로 재탄생한 이곳은 현재 시민들의 산책 명소로 알려져 있다.</div>
