<a href="https://map.kakao.com/link/map/%EA%B3%A0%EB%8C%80%EC%82%B0%EC%BA%A0%ED%95%91%EB%A6%AC%EC%A1%B0%ED%8A%B8,38.2136373284,127.1434289136" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">고대산캠핑리조트는 경기도 연천 고대산 자락에 자리하며 수려한 풍경과 오염되지 않은 자연 그대로의 휴식을 제공한다. 캐라반, 글램핑, 오토캠핑, 컨벤션센터, 베이스볼파크 등 캠핑, 야구, 등산, 레저 등을 한 공간에서 모두 즐길 수 있다. 아름답고 깨끗한 자연, 편리하고 안락한 시설을 자랑한다.</div>
