<p class="detail-row"><strong>주소</strong> 경기도 가평군 북면 가화로 2389-38</p>

<a href="https://map.kakao.com/link/map/%EA%B3%84%EA%B3%A1%ED%92%8D%EA%B2%BD%ED%8E%9C%EC%85%98,37.9531016383,127.4752256561" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평군에 위치한 계곡풍경은 캠핑장과 함께 펜션도 운영하고 있다. 캠핑장 앞 쪽으로 계곡이 흐르고 있어 물놀이를 즐길 수 있을 뿐 아니라 주변이 산으로 둘러싸여 있어 신선하고 쾌적한 공기 속에서 캠핑을 즐길 수 있다. 또한 마당에 천연잔디구장이 조성되어 있어, 족구, 배드민턴 등도 즐길 수 있다. 인근에 남이섬, 용추계곡과 폭포, 연인산등산, 명지산, 쁘띠 프랑스 등의 관광지가 있어 연계 관광이 용이하다.</div>
