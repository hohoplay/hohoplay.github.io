<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">샛별글램핑캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 태안군 안면읍 샛별길 238-10</p>

<a href="https://map.kakao.com/link/map/%EC%83%9B%EB%B3%84%EA%B8%80%EB%9E%A8%ED%95%91%EC%BA%A0%ED%95%91%EC%9E%A5,36.4525940078,126.3357512327" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">샛별글램핑캠핑장은 안면도 바닷가 바로 앞에 위치한 곳이다. 아기자기하게 잘 꾸며진 정원과 가족적인 분위기의 글램핑장이다. 글램핑 4동, 카라반 2동, 펜션 1동, 오토캠핑 3동으로 구성되어 있다. 글램핑에도 겨울엔 전기장판과 히터, 여름엔 에어컨이 준비되어 있고 개별바베큐, 샤워장, 화장실 등 편의시설이 잘 갖추어져 있다. 안면도 앞바다에서는 계절에 따라 게, 낙지, 소라, 개불, 조개 등 다양한 갯벌체험을 즐길 수 있다.</div>
