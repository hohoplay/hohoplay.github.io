<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">더포레스트는 영화마을로 유명했던 구둔역 뒤편에 있다. 일신역과도 가깝고 동여주 나들목에서도 가깝다. 이곳은 캠핑을 많이 다닌 주인의 철학이 묻어 있는 캠핑장이다. 평소 캠핑을 많이 다니면서 느꼈던 불편한 점, 아쉬운 점을 고려해 사이트마다 마치 정원 안에서 캠핑을 하고 있다는 느낌을 받을 수 있도록 설계하였다.</div>
