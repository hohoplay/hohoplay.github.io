<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">에스글램핑</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 천안시 동남구 풍세면 호정1길 28-17</p>

<a href="https://map.kakao.com/link/map/%EC%97%90%EC%8A%A4%EA%B8%80%EB%9E%A8%ED%95%91,36.7175300953,127.1293865269" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">에스글램핑은 충남 천안시 동남구에 자리했다. 천안시청을 기점으로 17Km가량 떨어졌다. 자동차를 타고 시청로, 온천대로, 세종평택로를 차례로 거치면 닿는다. 도착까지 걸리는 시간은 30분 안팎이다. 캠핑장에는 글램핑 27개 동을 마련했다. 네 가지 형태로 나뉘는데 객실 내부 시설은 같다. 냉장고, 에어컨, 히터, 침대, 테이블, 의자, 취사도구, 화장실, 샤워실, 개수대가 있어 일상생활이 가능할 정도다.</div>
