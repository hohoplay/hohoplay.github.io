<a href="https://map.kakao.com/link/map/%EC%9E%A5%EC%95%88%EC%BA%A0%ED%94%84,35.3418805818,129.2524031670" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">부산 기장에 위치한 숲 속 캠핑장으로 송림 사이로 아이들을 위한 트램펄린과 작은 물놀이장도 운영한다. 넓은 텐트와 캠프 내에는 바비큐 시설, 샤워실, 화장실 등 기본적인 시설들이 잘 갖춰져 있어 편리하게 이용할 수 있다. 가족 단위 방문객에게 안성맞춤이며, 퇴장 시간이 13시로 여유로운 휴식을 취할 수 있다. 일상에서 벗어나 자연 속에서 여유로운 시간을 보내고 싶은 이들에게 추천하는 캠핑지이다.</div>
