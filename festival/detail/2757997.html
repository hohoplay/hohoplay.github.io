<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 백년계곡길 88-3</p>

<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">소나무와 계곡 캠핑장은 강원도 영월 법흥 계곡의 상류에 자리 잡은 펜션 겸 캠핑장이다. 캠핑장은 크게 5개의 동으로 나눠져서 총 79개의 사이트가 있는 대형 캠핑장이다. 파쇄석 바닥에 사이사이로 소나무 그늘이 많아 시원하다. 넓은 잔디구장에서 족구나 축구를 할 수 있고, 트램펄린은 물론 옆에 계곡도 아이들이 물놀이하기 좋게 얕고 깨끗하다. 인근에 법흥사, 선암마을, 요선정 등의 관광지가 다수 있다.</div>
