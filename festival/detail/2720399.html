<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">칠갑산오토캠핑장은 충남의 알프스 칠갑산 자락을 휘감고 흐르는 맑고 깨끗한 지천구곡과 둘러앉은 기암절벽이 아름다운 곳이다. 산, 물을 벗 삼고 신선한 공기를 마시며, 삶의 힐링을 누릴 수 있다. 시설은 캐라반사이트와 텐트사이트, 다목적운동장, 족구장이 있으며 부대시설로는 어린이놀이터, 취사장, 화장실, 샤워실등이 있다. 캠핑장 이용 시, 오후 9시부터 오전 7시까지는 정숙시간으로 소음에 유의해야 한다.</div>
