<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">두밀숲캠핑장은 경기도 가평에 위치한 자연을 그대로 느낄 수 있고 깨끗한 시설을 갖춘 힐링형 캠핑장이다. 캠핑장 주변에 작은 계곡도 있어 아이들이 놀기에도 안전하고 좋다. 사이트에는 조경이 예쁘게 잘 관리되어 있어 눈을 즐겁게한다. 사람이 많지 않아 조용한 캠핑을 원하는 사람에게 적합하다.</div>
