<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 평창 송어회로 유명한 용골캠핑장은 계곡과 나무 그늘이 좋은 캠핑장이다. 아이와 함께 방문한 가족 캠핑객들을 위한 피자 만들기, 송어 잡기 체험, 영화 상영 등과 같은 이벤트가 있다. 캠핑, 카라반, 펜션 모두 이용 가능하다. 인근에는 허브나라, 월정사, 용평스키장, 양떼목장 등 다양한 즐길거리와 관광명소가 있어 연계관광이 가능하다.</div>
