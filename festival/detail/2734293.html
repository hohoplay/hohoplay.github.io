<a href="https://map.kakao.com/link/map/%ED%95%A8%EC%96%91%EC%9A%A9%EC%B6%94%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,35.6748688834,127.7739238337" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">함양용추오토캠핑장은 경남 함양군 안의면에 위치한 오토캠핑장으로 용추계곡이 흐르는 곳에 자리하였다. 이곳은 30여 개 정도 사이트를 구비하여 많은 인원이 넉넉하게 이용할 수 있다. 사이트 자리마다 나무를 한 그루씩 심어놓아  나무 그늘 아래에서 시원하게 캠핑을 할 수 있다. 특히 무더운 여름철에 캠핑장 인근 용추계곡에서 더위를 피해 물놀이를 함께 즐길 수 있다.</div>
