<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">워렉스 캠핑랜드</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 화순군 한천면 죽헌로 376-37</p>

<a href="https://map.kakao.com/link/map/%EC%9B%8C%EB%A0%89%EC%8A%A4%20%EC%BA%A0%ED%95%91%EB%9E%9C%EB%93%9C,34.9736515299,127.0103037842" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">워렉스 캠핑 랜드는 전남광주통합특별시에서 30분 거리인 화순군 한천면에 있다. 금자라가 살았다는 금오산 자락에 약 25000㎡ 넓은 대지에 자리 잡고 있어 깨끗하고 맑은 공기를 마시며 온 가족이 여유롭게 힐링할 수 있다. 사찰 금오사를 둘러볼 수 있고 금오산 산성이 가까이 있어 산책하기 좋다. 화장실, 샤워장, 개수대, 매점, 족구장 등 각종 편의 시설과 놀이시설을 갖추고 있으며 전기 사용과 온수 사용이 가능하다.</div>
