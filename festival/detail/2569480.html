<p class="detail-row"><strong>주소</strong> 강원특별자치도 철원군 근남면 잠곡리</p>

<a href="https://map.kakao.com/link/map/%EC%9E%A0%EA%B3%A1%EC%A0%80%EC%88%98%EC%A7%80,38.1585329671,127.4612930669" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">잠곡저수지는 1992년 착공하여 2003년도에 완공된 농업용 저수지이다. 
저수량 437만 톤, 수혜면적 824㏊이며 철원군 잠곡리, 사곡리, 육단리, 와수리, 운장리, 용양리 지역에 용수를 공급하고 있다. 대성산과 광덕산 사이에 위치하고 있으며, 마을 초입에 위치한 산이 누에를 닮아 붙여진 지명인 ‘잠곡’ 외에 누에호수라고도 불린다.</div>
