<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">불바라기약수터</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 양양군 서면 미천리</p>

<a href="https://map.kakao.com/link/map/%EB%B6%88%EB%B0%94%EB%9D%BC%EA%B8%B0%EC%95%BD%EC%88%98%ED%84%B0,37.9227559600,128.5464264142" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">불바라기 약수터는 폭포 길이 30m에 달하는 청룡, 황룡폭포 두 폭포가 있는 아름답고 인적이 드문 청정지역이다. 폭포 중간에서 샘솟는 신비스러운 약수로서 철분 등 몸에 좋은 물질을 많이 함유한 탄산수로서 위장병, 피부병에 효험이 있다고 한다.
과거 양양지방은 철이 풍부한 고장으로 유명했으며, 이곳 미천 계곡 곳곳에서 철을 이용하여 농기구 등을 제작하던 대장간이 많아 불바닥을 이루었다 하며, 불바닥이 변천하여 불바라기로 전해진다.</div>
