<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">동강아름캠프</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 김삿갓면 영월동로 2435</p>

<a href="https://map.kakao.com/link/map/%EB%8F%99%EA%B0%95%EC%95%84%EB%A6%84%EC%BA%A0%ED%94%84,37.1152232583,128.6415116902" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">동강아름캠프는 영월 외룡리에 있는 캠핑장으로 캠핑장 앞으로 옥동천이 흐르고 있어, 물놀이를 하기도 좋고 물멍 하면서 쉬기도 좋다. 물이 맑고 유속이 세지 않고 너른 천이라서, 낚시나 다슬기 잡기를 많이 한다. 사이트는 총 26개가 있고, 파쇄석 바닥이다. 물가를 따라 오래된 비슬나무 아래로 평상과 캐노피 천막이 설치되어 있어 물놀이하기 편하고, 캠핑을 하지 않더라도 당일치기로 피크닉을 즐길 수도 있다.</div>
