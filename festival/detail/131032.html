<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">덕우저수지는 기천저수지의 물이 흘러들어 이루어진 저수지이다. 산책로도 잘 조성되어 있어 도심 속에서도 자연을 느끼며 여유롭게 시간을 보낼 수 있는 곳이다. 계절에 따라 물안개를 볼 수도 있고, 저녁 무렵 노을을 감상하기에도 좋다. 또한 깔끔한 낚시터도 있어 배스 낚시를 하기에 좋다.</div>
