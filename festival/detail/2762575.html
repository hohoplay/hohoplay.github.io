<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">여주산촌관광농원은 젊은 농부가 운영하는 소규모 캠핑장이다. 수도권과 거리도 가까워 접근성이 좋으며 한적한 곳에 자리하여 조용한 캠핑을 즐길 수 있다. 계곡물이 맑아 아이들과 물놀이하기에도 좋고, 각 계절마다 농촌체험이 다양하게 준비되어 있다. 또한 젊은 농부가 직접 생산한 농산물을 직거래 판매하여 싱싱한 농산물을 직접 보고 구매할 수 있다.</div>
