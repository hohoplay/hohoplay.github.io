<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">블랙트리 캠핑장은 인천의 아름다운 섬 영흥도의 나무 가득한 산속에 자리잡고  있다. 영흥대교를 건너 육로로 쉽게 이동할 수 있다. 노을이 아름다운 장경리 해수욕장에서 물놀이를, 블랙트리 산책로에서 소나무 산림욕을 즐길 수 있다. 다양한 방송 촬영지로도 유명하다.</div>
