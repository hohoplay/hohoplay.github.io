<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">오캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안산시 단원구 대남로 642 (대부남동)</p>

<a href="https://map.kakao.com/link/map/%EC%98%A4%EC%BA%A0%ED%95%91%EC%9E%A5,37.2071994130,126.5462870346" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">오캠핑장은 대부도 맨 아래쪽 메추리 섬 앞쪽에 위치하며, 관광농원으로 지정된 넓은 평야지대에 캠핑장을 조성되어 있다. 바다 바로 옆에 위치한 조용한 캠핑장으로, 시원한 바닷바람과 함께 캠핑을 하시기에도 좋고 아름다운 낙조 감상도 일품이다. 양쪽으로 바다가 보이고 홀곳갯벌체험장이 가까이 있어 갯벌체험을 할 수있다. 이 외에도 넓은 수영장과 과수원, 영농체험장 등 다양하게 즐길 거리가 많다.</div>
