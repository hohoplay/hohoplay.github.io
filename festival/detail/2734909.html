<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">귤빛캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 제주특별자치도 제주시 조천읍 함와로 428</p>

<a href="https://map.kakao.com/link/map/%EA%B7%A4%EB%B9%9B%EC%BA%A0%ED%95%91%EC%9E%A5,33.5039628424,126.6738044342" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">귤빛캠핑장은 제주 제주시 조천읍 대흘리에 위치하고 있으며 파쇄석 사이트가 총 35개로 구성되어 있고, 전기, 온수, 화장실, 샤워실, 취사장 등의 편의시설을 이용할 수 있다. 텐트가 없을 시에는 4인용 작은 텐트와 카라반, 내추럴하우스, 독채펜션을 예약하여 이용하면 된다. 텐트를 소지하고 있다면 사이트만 대여하여 캠핑을 즐길 수 있다. 인근에 가볼 만한 관광지는 펀테마파크, 선녀와 나무꾼 테마공원, 다희연이 있다.</div>
