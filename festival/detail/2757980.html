<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">아빠가 만든 캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 북면 덕전길 240</p>

<a href="https://map.kakao.com/link/map/%EC%95%84%EB%B9%A0%EA%B0%80%20%EB%A7%8C%EB%93%A0%20%EC%BA%A0%ED%95%91%EC%9E%A5,37.2556551671,128.3930464738" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 영월의 조용한 산골짜기에 위치한 아빠가 만든 캠핑장은 자작나무 숲과 느티나무숲으로 둘러싸여 있고, 작은 개울이 캠핑장 가운데를 지나는 캠핑장이다. 편백나무로 마감한 목조펜션과 캠핑장을 함께 운영하고 있다. 캠핑장은 39개의 사이트가 있고, A 구역은 수영장과 잔디마당이 있어 아이와 동반 시 좋고, D 구역은 애견 동반 사이트들이다. B와 E 구역은 개울 건너편에 있는 사이트들로 좀 더 조용하고 프라이빗하다.</div>
