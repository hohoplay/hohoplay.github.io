<p class="detail-row"><strong>주소</strong> 경상북도 예천군 용문면 내지리</p>

<a href="https://map.kakao.com/link/map/%EC%86%8C%EB%B0%B1%EC%82%B0%ED%95%98%EB%8A%98%EC%9E%90%EB%9D%BD%EA%B3%B5%EC%9B%90,36.7448470265,128.3852231981" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">소백산 하늘자락공원은 용문면 매봉 자락 해발 730m에 위치한 공원이다. 공원 내에는 전망대, 산책로, 휴게공간, 다양한 조형물, 포토존 등이 있다. 전망대까지는 오르는 길은 데크길로 이루어져 있어 누구나 쉽게 오를 수 있게 했다. 
하늘공원의 전망대는 밤하늘의 은하수를 모티브로 하여 별빛이 소백산으로 흘러내리는 형상을 디자인했다. 나선형 된 전망대 계단을 따라 올라가면 소백산 자락이 360도 파노라마처럼 펼쳐진다.</div>
