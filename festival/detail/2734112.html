<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">더세븐글램핑카라반은 경기도 포천시 이동면에 위치한 캠핑장이다. 캠핑용품이 없어도 캠핑의 낭만을 즐길 수 있는 카라반, 글램핑장이다. 캠핑장 옆 계곡이 있어 물소리도 좋고, 계곡물놀이도 가능하고, 아이들이 좋아하는 물미끄럼틀, 물놀이장, 인공잔디밭 놀이터가 있어 안심하고 즐길 수 있다.</div>
