<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">춘천캠핑월드는 삼면에 계곡물이 흐르는 강원도 춘천시 서면에 위치하고 있다. 2곳의 수영장과 캠핑장 내 불한증막을 갖추고 있다. 앞쪽 호수에는 원앙이 날아들 정도로 조용하고 깨끗한 곳이다. 아이들을 위한 넓은 잔디광장과 놀이시설을 갖추고 있다. 가족 또는 아이와 함께 추억을 쌓기 좋은 곳이다.</div>
