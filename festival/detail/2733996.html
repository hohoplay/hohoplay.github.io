<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">별마로빌리지캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 김삿갓면 영월동로 1954-40</p>

<a href="https://map.kakao.com/link/map/%EB%B3%84%EB%A7%88%EB%A1%9C%EB%B9%8C%EB%A6%AC%EC%A7%80%EC%BA%A0%ED%95%91%EC%9E%A5,37.1256682095,128.5851886440" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">맑은 공기와 청정계곡으로 유명한 별마로캠핑장은 캠핑장과 펜션을 함께 운영하고 있다. 캠핑장 앞의 물놀이하기 좋은 계곡은 수심이 깊지 않아 어린이들이 안전하게 물놀이를 즐길 수 있다. 다양한 어종을 만나는 민물낚시를 즐길 수도 있다. 네비게이션으로 별마로빌리지를 검색할 때 경유지로 와석재 터널을 검색하고 오면 굽이진 산길을 피해 올 수 있다고 공식 홈페이지에서 말하고 있으니 참고해야 한다.</div>
