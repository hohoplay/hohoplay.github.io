<p class="detail-row"><strong>주소</strong> 경상북도 의성군 점곡면 사촌리</p>

<a href="https://map.kakao.com/link/map/%EC%9D%98%EC%84%B1%20%EC%A0%90%EA%B3%A1%EA%B3%84%EA%B3%A1,36.4212463644,128.7494251338" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">의성 점곡계곡은 의성군민들이 여름철 즐겨 찾는 계곡 명소이다. 이곳은 물놀이와 캠핑을 한 번에 즐길 수 있다. 암석 절벽 앞으로 계곡물이 흐르고 계곡 앞에는 캠핑을 할 수 있는 넓은 공터가 있다. 사촌1빙벽은 텐트전용존이며, 사촌2빙벽은 캠핑카 전용존이라는 표지판을 보고 알맞게 찾아가면 된다. 수심이 그리 깊지 않고 수온도 적당하여 물놀이하기에 안성맞춤이다. 다만, 깊은 곳도 있으니 안전에 주의해야 한다.</div>
