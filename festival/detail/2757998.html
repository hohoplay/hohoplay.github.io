<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">여울소리</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 중방길 2-45</p>

<a href="https://map.kakao.com/link/map/%EC%97%AC%EC%9A%B8%EC%86%8C%EB%A6%AC,37.2934068064,128.2688009715" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 영월 무릉도원면에 위치한 여울소리 캠핑장은 펜션 겸 카라반 2개, 캠핑 사이트 10개가 있다. 트램펄린과 수영장이 있고, 바로 앞 주천강에서 물놀이도 가능해 아이를 동반하고 가족단위로 여름 휴가를 즐기는 캠핑객이 많이 찾는다. 사이트 간격이 넓은 편이고 배치가 지그재그로 되어 있어서 시야가 답답하지 않고 시원하다. 카라반은 개별 화장실과 테라스를 갖추고 있어 프라이빗한 이용이 가능하다.</div>
