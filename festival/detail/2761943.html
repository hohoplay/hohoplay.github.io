<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">초리 포레스트는 경기 파주시 초리골에 위치한 야영장이다. 초리 포레스트는 숲으로 둘러싸인 곳에 자리하였고 한편에 계곡을 끼고 있다. 숙박시설이 다양한데 카라반과 글램핑, 펜션이 있고 또한 데크가 설치되어 있어  텐트 사용이 가능하다. 화장실, 개수대, 미니 찜질방 등 편의시설이 잘 되어있고 개별 바베큐와 취사가 가능하다. 정원과 모래놀이터 등 아이들을 위한 공간이 있어, 가족 단위로 여행하기 좋다.</div>
