<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">농어바위캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 인천광역시 옹진군 영흥면 영흥서로 420-19</p>

<a href="https://map.kakao.com/link/map/%EB%86%8D%EC%96%B4%EB%B0%94%EC%9C%84%EC%BA%A0%ED%95%91%EC%9E%A5,37.2818503398,126.4587846299" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">인천 옹진군에 위치한 농어 바위 캠핑장은 바다 향기 물씬 풍기는 오션뷰 캠핑장이다.  전 사이트가 파쇄석이고 사이트는 넓은 편이다. 캠핑장과 바다가 연결되어 있어 바다 물 빠지는 시간에 맞춰 나가면 아이들이 좋아하는 바다 갯벌체험을 즐길 수 있다. 캠핑장 이용 시 23시 이후부터는 매너타임이라 소음발생에 신경 써야 하며 애완동물은 입장이 불가하지만 동절기 때는 한시적으로 가능하다.</div>
