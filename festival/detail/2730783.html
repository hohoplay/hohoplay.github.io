<p class="detail-row"><strong>주소</strong> 충청북도 청주시 상당구 낭성면 갈산1길 19</p>

<a href="https://map.kakao.com/link/map/%EC%B2%AD%EC%A3%BC%ED%82%A4%EC%A6%88%EC%BA%A0%ED%95%91%EC%9E%A5,36.6552202336,127.5760453354" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청주시 상당구 낭성면에 위치한 청주키즈캠핑장은 폐교를 리모델링한 곳으로 어른들은 추억을 어린이들은 호기심을 자극하는 곳이다. 캠핑장은 파쇄석 43면을 갖추고 있으며 크기는 가로 7m 세로 11m로 사이트가 여유있고 간격도 넓은 편이다. 추가 이용료 없이 개인 카라반과 트레일러 출입을 허용하고 있다. 어린이 전용 부대시설로 수영장, 놀이방, 오락실을 갖추고 있어 가족단위 캠퍼들에게 인기 많은 곳이다.</div>
