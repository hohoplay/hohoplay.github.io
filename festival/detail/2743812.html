<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">운악승마캠핑은 산 좋고 인심 좋은 포천 운악산 자락에 자리를 잡고 있으며, 내 집같이 편안한 글램핑장과 깨끗하고 럭셔리한 카라반으로 구성되어 있는 캠핑장이다. 운악승마캠프의 특징은 온 가족이 함께 할 수 있는 다양한 테마를 주제로 여러 가지 체험을 할 수 있는 테마파크형 캠핑장이다. 주변 관광지로는 화강암을 채석하던 곳을 문화예술 공간으로 재탄생시킨 포천 아트밸리와 멋진 억새꽃을 볼 수 있는 명성산 등이 있다.</div>
