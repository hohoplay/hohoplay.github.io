<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">장터캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 원주시 지정면 월송석화로 396-1</p>

<a href="https://map.kakao.com/link/map/%EC%9E%A5%ED%84%B0%EC%BA%A0%ED%95%91%EC%9E%A5,37.3997143876,127.8447360892" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">서울에서 40분이면 도착하는 수도권과 가까운 강원도 원주 장터캠핑장이다. 캠핑장 내에 작은 계곡이 있고 5분 거리 섬강의 큰 강이 흐르는 곳에 위치해 있어 여름 물놀이하기 좋다. 숲이 우거진 곳에 위치한 캠핑장이라 물놀이와 더불어 자연과 더불어 뛰어놀 수 있는 점이 장점이다. 정해진 구획 없이 원하는 위치에 텐트를 펴고 캠핑을 즐길 수 있다. 추어탕을 주메뉴로 하는 식당을 운영하고 있다.</div>
