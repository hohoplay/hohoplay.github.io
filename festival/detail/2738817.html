<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 용인시 처인구 이동면 목신리 비교적 높은 위치에 자리한 용인단풍숲캠핑장은 왕 단풍나무가 사이트 전체를 두르고 있어 이국적인 정취 속에 캠핑을 즐길 수 있는 곳이다. 동물 이름의 사이트(호랑이, 토끼, 곰, 돼지, 기린, 사자, 코알라, 펭귄, 악어) 내에 약 100여 동의 텐트를 설치할 수 있으며, 바닥은 파쇄석을 기본으로 하고 있다. 전기, 와이파이, 샤워실, 매점, 수영장 등을 갖추고 있다.</div>
