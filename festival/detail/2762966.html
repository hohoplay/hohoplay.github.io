<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">백운산아래 주포천 상류인 황학동계곡을 끼고 있는 황학동캠핑장은 강원도 원주시 신림면에 위치하고 있다. 오토캠핑장 20면으로 운영하고 있다. 사이트의 크기는 8m x 8m으로 큰 편이며, 잔디 사이트 10개, 파쇄석 사이트 10개로 구성되어 있다. 부대시설로 화장실, 샤워실, 개수대, 정자 연못, 분수대 등이 있다.</div>
