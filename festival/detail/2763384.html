<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">산사랑글램핑</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 원주시 소초면 구룡사로 127-1</p>

<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%82%AC%EB%9E%91%EA%B8%80%EB%9E%A8%ED%95%91,37.4271068511,128.0575660673" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 원주시에 위치한 산사랑글램핑은 자연과 계곡이 함께하는 힐링 공간이자 치악산국립공원 1급수 계곡에 위치한 글램핑장이다. 푸른 자연이 주는 아름다운 풍경 속에서 글램핑을 즐길 수 있다. 새말IC에서 5분 거리로 접근성도 좋다. 인근관광지로 치악산, 간현관광지, 구룡사, 박경리 문학공원 등 강원도 명소 여행도 즐기기 용이하다.</div>
