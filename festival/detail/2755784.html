<a href="https://map.kakao.com/link/map/%EA%B0%80%EC%98%A8%ED%9C%B4%EC%96%91%EB%B9%8C%EB%A6%AC%EC%A7%80,37.6437041869,127.6201076548" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">대명비발디파크에서 10분 떨어진 휴양빌리지 가온은 강원도 홍천군 서면에 위치하고 있다. 서울에서 차로 한시간 안에 도착할 수 있는 편리한 교통을 갖추고 있다. 넓은 야외수영장이 있어 아이들과 함께 가족이 즐기기에 좋다. 오토캠핑장 외에 글램핑 19동을 함께 운영하고 있어 단체기업 워크샵과 야유회도 가능하다.</div>
