<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">지친 일상을 떠나 30년 이상 된 시원한 느티나무 그늘과 깨끗한 계곡에서의 힐링, 복계산 등산까지 다양한 캠핑의 즐거움을 느낄 수 있는 곳이다. 4면이 산으로 둘러싸여 있고 시원한 계곡물이 휘감고 도는 지역에 계곡에서 물놀이 및 다슬기, 고기잡이도 가능하다. 또한 대형견, 맹견을 제외한 반려견 2마리까지 입장 가능하다.</div>
