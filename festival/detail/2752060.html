<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">산아래글램핑</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 장성군 북하면 월성안길 16-33</p>

<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%95%84%EB%9E%98%EA%B8%80%EB%9E%A8%ED%95%91,35.3501037416,126.8625212910" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">산아래 글램핑은 장성 병풍산 편백숲길에 위치한 곳으로 전남광주통합특별시에서 차로 20분 정도 소요된다. 20000㎡의 면적에 글램핑 시설 7동으로 구성돼 있어 캠핑 초보자들도 쉽게 이용이 가능하다. 편의 시설이 마련되어 있다. 또한 각 동마다 화장실 및 바비큐장과 같은 편의 시설이 잘 준비돼 있어 독립 캠핑을 즐길 수 있다.</div>
