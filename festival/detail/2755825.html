<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">느티나무 캠핑장은 강원도 영월군 김삿갓면에 위치하고 있다. 사이트 지정 예약제로 운영하고 있으며 계곡 물놀이, 깡통열차, 방방이, 영화상영 등 다양한 놀이 공간을 제공한다. 캠핑장 주변 즐길거리로 동강카누, 고씨동굴 등이 있다.</div>
