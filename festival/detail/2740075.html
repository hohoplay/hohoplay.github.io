<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">플로렌스 글램핑</h1>
<p class="detail-row"><strong>주소</strong> 경기도 가평군 북면 보안벚꽃길 54</p>

<a href="https://map.kakao.com/link/map/%ED%94%8C%EB%A1%9C%EB%A0%8C%EC%8A%A4%20%EA%B8%80%EB%9E%A8%ED%95%91,37.8928794879,127.5503789093" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평군 북면에 위치한 플로렌스 글램핑은 약 13,200 ㎡(4천 평) 대지 위에 2가지 형태의 글램핑 시설이 들어선 대단위 글램핑장이다. 전나무가 병풍처럼 둘러싸고 있어 아늑한 느낌을 준다. 가족글램핑과 커플글램핑으로 나누어져 있으며 야외 수영장 시설도 완비되어 있다. 또한 전 객실 바닥난방이 가능하고 24시간 샤워장 온수 사용이 가능하다. 텐트 간 간격이 넓어 쾌적하고 편리한 이용이 가능한 것이 장점이다.</div>
