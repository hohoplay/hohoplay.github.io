<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">인천 강화군 선원면에 있는 프랭클리 글램핑은 카페와 펜션, 가족 전용 글램핑을 함께 운영하고 있다. 부대시설로 야외수영장, 샤워 시설, 개수대, 전기, 온수 등을 갖추고 있으며 동계 캠핑이 가능하다. 글램핑장에도 에어컨이 설치되어 있고 무료 와이파이를 사용할 수 있다. 네이버 예약 사이트에서 실시간으로 예약 가능하다.</div>
