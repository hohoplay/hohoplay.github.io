<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">당평오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 횡성군 갑천면 외갑천로 301</p>

<a href="https://map.kakao.com/link/map/%EB%8B%B9%ED%8F%89%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.5657016002,128.0400441159" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 횡성군 갑천면에 자리 잡은 당평오토캠핑장은 갑천면의 옛 당평초교를 오토캠핑장으로 조성하였다. 초등학교 부지를 활용한 덕분에 운동장, 체육관, 식수대 등 시설이 잘 완비되어 있다. 캠핑장 주변에 계곡이 있어서 시원한 물놀이도 가능하다. 내부에 식사 가능한 테이블, 수납장, 내부 휴식공간도 구비되어 있는 것도 특징이다.</div>
