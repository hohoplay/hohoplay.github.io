<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">수타사계곡</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 영귀미면 덕치리</p>

<a href="https://map.kakao.com/link/map/%EC%88%98%ED%83%80%EC%82%AC%EA%B3%84%EA%B3%A1,37.6989540548,127.9575198584" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">수타사계곡은 홍천읍에서 동쪽으로 10km쯤 떨어진 곳에 있는 공작산에서부터 내려오는 덕지천의 상류가 계곡을 이루고 있는데, 계곡 안에 수타사가 있어 수타사계곡이라 불린다. 수타사에서 동면 노천리까지 약 12km에 이르는 수타사계곡에는 넓은 암반과 큼직큼직한 소(沼)들이 비경을 이루고 있어 휴식을 취하며 주변경관을 감상할 수 있다. 계곡 양쪽으로는 기암절벽과 빽빽이 우거진 숲이 호위하고 있는 풍경을 볼 수 있다.</div>
