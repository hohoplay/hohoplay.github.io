<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">마둔저수지</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안성시 금광면 장죽리</p>

<a href="https://map.kakao.com/link/map/%EB%A7%88%EB%91%94%EC%A0%80%EC%88%98%EC%A7%80,36.9705486434,127.3109159620" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 안성시 금광면에 위치한 저수지이다. 1975년부터 조성된 저수지이며 서운산 북동 자락에 위치해 있다. 경치가 좋고  다듬어지지 않은 자연미가 있는 곳이다. 저수지 외곽을 따라 둘레길이 조성되어 있어 산책하기 좋다. 한눈에 들어오는 서운산 자락들과 호수의 경치가 멋진 뷰를 자랑한다. 사랑하는 사람들과 함께 걸으며 멋진 추억과 힐링의 시간을 만들 수 있는 좋은 장소이다.</div>
