<p class="detail-row"><strong>주소</strong> 전북특별자치도 부안군 변산면 궁항로 178</p>

<a href="https://map.kakao.com/link/map/%EC%9D%B4%EC%88%9C%EC%8B%A0%20%EA%B8%80%EB%9E%A8%ED%95%91,35.6065208041,126.4699552913" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">이순신 글램핑은 전라북도 부안의 궁항 인근의 약 1000㎡ 대지 위에 글램핑과 펜션을 같이 운영하고 있는 아담한 캠핑장이다. 글램핑 시설은 5개 동으로 이용객들은 아무 준비 없이 몸만 와도 좋을 만큼 캠핑에 필요한 침구류와 식기류 등 기본시설이 잘 구비되어 있다. 각 글램핑 텐트엔 개인 화장실과 욕실이 있고 냉, 난방도 완벽하다. 바람막이와 천장 테크 시설이 탄탄해 강한 비바람에도 끄떡없이 캠핑을 즐길 수 있다.</div>
