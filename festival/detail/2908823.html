<p class="detail-row"><strong>주소</strong> 충청남도 공주시 정안면 어물길 395</p>

<a href="https://map.kakao.com/link/map/%EA%B7%B8%EB%A6%AC%EC%8B%AC%20%EA%B8%80%EB%9E%A8%ED%95%91%EC%9E%A5,36.5891979467,127.1478078106" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">그리심 글램핑장은 충남 공주시 정안면 어물리에 자리 잡았다. 캠핑장에는 파쇄석으로 이뤄진 일반캠핑 사이트 6면과 데크 5면이 마련돼 있다. 대형 카라반 5대와 소형 카라반 7대도 갖추어져 있다. 대형 카라반 내부에는 침대, TV, 테이블, 개수대, 취사도구, 조리도구, 화장실, 샤워실 등 일상생활이 가능할 정도의 시설이 완비돼 있다. 유선으로만 예약이 가능하다.</div>
