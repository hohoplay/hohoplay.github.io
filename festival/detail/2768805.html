<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">끝없이 솟은 메타세쿼이아가 맞아주는 곳, 화인산림욕장은 40여 년 전 이곳 부지를 산 정홍용 대표가 홀로 나무를 심고 가꾸어 온 거대한 숲이다. 치유의 숲, 화인산림욕장에 들어서면 인공시설이 전혀 가미되지 않은 자연 그대로의 모습을 만날 수 있으며, 길이 험하지 않아 가벼운 마음으로 오를 수 있다.  숲 곳곳에 나무가 살아간 흔적이 그대로 남아있고 숲이 주는 상쾌한 공기에 마음까지 시원해지는 기분이 좋아지는 곳이다.</div>
