<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">용트림 바위</h1>
<p class="detail-row"><strong>주소</strong> 인천광역시 옹진군 백령면 남포리</p>

<a href="https://map.kakao.com/link/map/%EC%9A%A9%ED%8A%B8%EB%A6%BC%20%EB%B0%94%EC%9C%84,37.9216565355,124.6685990704" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">끊임없이 몰아치는 파도와 바닷바람을 이겨낸 해안절벽의 극히 일부가 살아남아 마치 몸을 뒤틀며 승천하는 용과 같은 형상을 보여준다. 용트림바위가 보이는 절벽의 우측으로 돌아가면 천연기념물 507호인 남포리 습곡이 나타난다. 이 남포리 습곡은 지층이 구부러지거나(습곡), 끊어진 곳(단층)이 있는데, 이 현상은 강한 힘이 이 지층에 작용하여 지층이 변형된 것이다. 이 남포리 습곡은 그 규모와 특이성으로 인하여 천연기념물로 지정되었다.</div>
