<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">여울지숲속캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 김포시 하성면 오정동로 121-15</p>

<a href="https://map.kakao.com/link/map/%EC%97%AC%EC%9A%B8%EC%A7%80%EC%88%B2%EC%86%8D%EC%BA%A0%ED%95%91%EC%9E%A5,37.7255966223,126.6548072071" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">여울지숲속캠핑장은 경기 김포시 하성면 오정동로에 위치하고 있어 서울 근교에서 가기 좋은 캠핑장으로 알려져 있다. 반려동물을 동반할 수 있는 곳으로 관광객들에게 인기가 많다. 부대시설로는 야외수영장, 매점, 샤워시설, 전기, 온수 제공이 있으며 캠핑 용품을 대여할 수 있다. 근처 등반로를 통해 등산이 가능하다. 주변 관광지로 태산가족공원, 김포에코센터, 하동천 생태탐방고, 애기봉, 김포 국제조각종원, 김포함상공원이 있다.</div>
