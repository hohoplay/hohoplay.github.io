<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">문수산캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 용인시 처인구 이동읍 이원로 637-3</p>

<a href="https://map.kakao.com/link/map/%EB%AC%B8%EC%88%98%EC%82%B0%EC%BA%A0%ED%95%91%EC%9E%A5,37.1623532510,127.2534991148" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">서울과 가까운 경기도 용인시 처인구에 자리한 문수산캠핑장은 울창한 산림과 2개의 인공호수 주변에서 조용한 힐링의 시간을 즐기기 좋은 캠핑장이다. 캠핑장에는 넓은 호수가 2개 있는데 예전에 양어장을 운영하던 곳으로 지금은 아름다운 자연경관과 어울려 캠핑장을 빛내고 있는 주인공이다. 바닥은 파쇄석과 나무 데크로 구성되어 있으며 각각 크기는 7m×8m, 6m×8m 총 20면을 운영 중이며 나무데크에서 호수를 바라볼 수 있다.</div>
