<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">갈천 오토캠핑장은 양양 갈천리에 위치한 역사가 깊은 캠핑장이다. 개장한 지는 오래되었지만 꾸준히 개보수를 하면서 자연과 어울려 잘 유지되고 있어 재방문이 많은 인기 있는 캠핑장이다. 동해 바다와 가까워 해산물과 회를 구입하여 캠핑 오기 편리하다. 사이트들은 소나무 숲 속에서 인위적이지 않게 나무들과 어울려 배치되어 그늘이 많고 정취가 있는 곳이다.</div>
