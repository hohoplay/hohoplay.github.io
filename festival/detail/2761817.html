<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">시원한 계곡을 즐기며 자연속에서 캠핑 할 수 있는 곳이다. 강원도 인제 십이선녀탕 계곡 근처에 있는 곳으로 캠핑장, 매점, 식당을 모두 운영하고 있다. 일반오토캠핑장과는 다르게 고객님들이 사용하는 텐트를 직접 가져와서 설치 하는 것이 아니라 탠트를 대여하고 있다. 백담사, 십이선녀탕, 설악산, 속초 등 둘러볼 주변관광지가 많다.</div>
