<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">모도</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 진도군 의신면 모도길 12-3</p>

<a href="https://map.kakao.com/link/map/%EB%AA%A8%EB%8F%84,34.4075626367,126.3556307120" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">1929년경 김해김 씨가 제주도를 가는데 띠풀이 많아 띠섬이라고 불렀다. 띠풀을 이용하여 지붕을 덮은 집이 많이 있다고 하여 띠섬이라고도 불렀으며, 한자로 표기하여 모도라 하였다. 섬의 모양은 북동에서 남서 방향으로 긴 타원형이다. 최고높이는 48m이며, 경사가 완만한 구릉지로 이루어져 있다. 해안은 대부분 사질해안이나 남쪽에는 암석해안이 발달하였고, 취락은 서쪽 해안에 밀집돼 있다.</div>
