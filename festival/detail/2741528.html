<p class="detail-row"><strong>주소</strong> 강원특별자치도 춘천시 남산면 풀무골1길 71</p>

<a href="https://map.kakao.com/link/map/%EA%B0%95%EC%B4%8C%ED%95%98%EB%8A%98%EC%95%84%EB%9E%98%EA%B8%80%EB%9E%A8%ED%95%91,37.8006419094,127.6415538795" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강촌하늘아래은 강원도 춘천시 남산면에 위치한 캠핑장이다. 춘천의 초입 강촌, 글램핑, 오토캠핑, 텐트대여, 당일 피크닉 모두 가능한 곳이다. 수영장, 방방이, 작은 도서관, 동계시즌 얼음썰매장이 있어 사계절 다양한 체험이 가능하다. 도심에서의 지친 일상으로부터 벗어나 자연 속에서 새로운 삶의 에너지를 채워간다.</div>
