<p class="detail-row"><strong>주소</strong> 강원특별자치도 철원군 김화읍 생창길 479</p>

<a href="https://map.kakao.com/link/map/%EC%9A%A9%EC%96%91%EB%8A%AA,38.2811240075,127.4513680948" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">철원의 DMZ 생태평화공원 내에 있는 용양늪은 전쟁과 평화와 더불어 생태가 잘 보존되어 있는 철원 9경 중 하나다.  전쟁 후 DMZ를 지키는 군인들이 다녔던 출렁다리가 낡아서 지지대는 남아 있지만 60년간 평화의 시기에는 사람들의 손길이 닿지 않은 곳이라 아름다운 자연의 절경이 그대로 남아 있는 늪지가 되었다.  각 계절이면 가마우지, 두루미, 고니 등의  철새들이 찾아오고 무수한 동물들의 안식처가 되고 있다.</div>
