<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">배너미오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 청도군 운문면 운문로 1051</p>

<a href="https://map.kakao.com/link/map/%EB%B0%B0%EB%84%88%EB%AF%B8%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,35.6657033960,129.0027020463" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경북 청도에 있는 오토캠핑장으로 청도의 대표 관광지인 삼계리 계곡과 가깝다. 부산, 울산, 대구 등 근교의 도심에서 1~2시간 이내 거리로 접근성이 좋다. 캠핑장 가까운 곳에 운문사, 국립 운문산자연휴양림 등이 있어 연계 관광도 쉽다. 50여 개의 사이트는 나무 그늘에 들어와 한여름에도 쾌적한 환경에서 캠핑을 즐길 수 있다.</div>
