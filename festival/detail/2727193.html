<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">북한산 농바위 캠핑장은 서울 근교 고양시 덕양구에 있는 캠핑장이다. 아름다운 북한산의 뷰를 즐기며 캠핑할 수 있는 곳이다. 북한산 전망대 사이트와 파쇄석 사이트로 나뉘어 있는데 북한산 전망대 사이트에서는 장작 사용이 불가능하다. 화장실과 샤워실 시설이 있고 매점에서 간단한 물품들을 구매할 수 있다. 예약은 전화로만 받고 있다.</div>
