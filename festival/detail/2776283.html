<p class="detail-row"><strong>주소</strong> 경상남도 통영시 욕지면 욕지일주로 352</p>

<a href="https://map.kakao.com/link/map/%ED%9D%B0%EC%9E%91%EC%82%B4%ED%95%B4%EB%B3%80,34.6444934659,128.2658271909" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">통영의 흰작살해변의 흰작살이란 해안가에 흰자갈이 많아 생긴 지명이다. 한국에서 푸른 바다를 가진 섬으로 알려진 통영의 욕지도에서 차로 약 5분 정도 이동하면 나타나는 작은 해변으로, 한편에 탁 트인 남태평양 바다를 바라보며 몽돌 자갈 해변을 즐길 수 있다. 흰작살해변은 밤자갈이 하얗다 하여 이러한 이름이 붙여졌다고도 하며 규모는 작지만 바닷물이 깨끗하다. 근처에 소나무 숲이 있어 여름철 연인 및 가족단위의 피서지로 안성맞춤이다.</div>
