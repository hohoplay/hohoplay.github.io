<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">방태산 솔마루 오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 기린면 방태산길 122-6</p>

<a href="https://map.kakao.com/link/map/%EB%B0%A9%ED%83%9C%EC%82%B0%20%EC%86%94%EB%A7%88%EB%A3%A8%20%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.9393980753,128.3814075191" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">방태산자연휴양림 입구 마을에 위치한 펜션&amp;오토캠핑장이다. 양양 낙산, 속초, 주문진 등 동해안이 인접해 30~40분대 소요시간으로 접할 수 있어 낮에는 시원한 동해바다에서 즐기고 밤에는 방태산의 신선한 계곡의 울창한 산림에서 산림욕을 접할 수 있는 곳이다. 매너타임은 오후 10시부터 오전 8시까지 이며 주변 이용객의 민원 발생 시 강제 퇴출 조치 또는 불이익을 받을 수 있으므로 주의해야 한다.</div>
