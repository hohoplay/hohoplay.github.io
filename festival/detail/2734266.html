<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">숲속에 위치한 캠핑장으로 사이트는 잔디밭으로 되어 있다. 사이트별로 계단을 올라야하는 곳도 있지만 비교적 넓고 사이트 구획이 명확하지 않아 텐트 설치 전에 확인이 필요하다. 아이들을 위한 모래놀이터가 있다. 초보 캠핑러들을 위한 캠프닉 체험도 있다. 오전 11시부터 오후 3시까지 총 4시간 이용하며 가볍게 즐길 수 있게 준비되어 있다.</div>
