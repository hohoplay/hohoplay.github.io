<p class="detail-row"><strong>주소</strong> 경기도 광주시 초월읍 무갑리</p>

<a href="https://map.kakao.com/link/map/%EB%AC%B4%EA%B0%91%EB%A6%AC%EA%B3%84%EA%B3%A1,37.4162532334,127.3412173132" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 광주시 초월읍 무갑리에 있는 계곡이다. 왼쪽으로는 관산, 오른쪽으로는 무갑산이 있다. 약 1㎞ 정도 시원한 물줄기가 이어진다. 강수량에 따라 차이가 있지만 어른 무릎 높이의 물이 흐르고 있어 아이들과 물놀이하기에 좋은 곳이다. 계곡 중앙부 쪽으로는 자연 물놀이장도 형성되어 있다. 자연 속에서 시원한 여름을 보내고 싶다면 무갑리계곡을 추천한다.</div>
