<p class="detail-row"><strong>주소</strong> 경기도 가평군 설악면 유명산길</p>

<a href="https://map.kakao.com/link/map/%EC%9C%A0%EB%AA%85%EC%82%B0%EA%B3%84%EA%B3%A1,37.5826895318,127.4956679529" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">유명산은 설악면 가일리에 위치한 해발 864m의 산으로 기암괴석의 계곡에 끊임없이 흐르는 물로 등산객의 애호를 받고 있다. 이곳의 계곡은 박쥐소, 용소, 마당소 등 유리알 같은 맑은 소와 이어져 장관을 이룬다. 주변에 산림청에서 직영하는 유명산자연휴양림은 통나무집, 야영장, 산책로 등이 갖추어져 있으며 사계절 등산코스로 적당하다. 주변에는 문화마을이 조성되어 있다.</div>
