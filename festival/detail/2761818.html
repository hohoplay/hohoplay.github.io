<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">돌배야영장(제2야영장)</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 북면 만해로 149</p>

<a href="https://map.kakao.com/link/map/%EB%8F%8C%EB%B0%B0%EC%95%BC%EC%98%81%EC%9E%A5%28%EC%A0%9C2%EC%95%BC%EC%98%81%EC%9E%A5%29,38.1901454889,128.3190554773" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">설악산 기슭 구만동 계곡에 위치한 캠핑장이다. 산과 숲과 계곡이 함께 어우러지는 캠핑장으로 주변 유명한 볼거리와 먹거리가 풍부한 곳이다. 캠핑장 앞으로 흐르는 계곡은 아이들과 물놀이 즐기기에도 좋다. 사이트 전체적으로 나무 그늘에 아래에 있어 쾌적한 환경에서 캠핑을 즐길 수 있다. 가까운 거리에 백담사, 만해마을, 산촌민속박물관 등이 있어 가족여행으로 아이들과 함께 가볼만하다.</div>
