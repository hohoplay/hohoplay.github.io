<p class="detail-row"><strong>주소</strong> 경기도 포천시 영중면 성장로179번길 32</p>

<a href="https://map.kakao.com/link/map/%ED%8C%8C%ED%94%BC%EB%A3%A8%EC%8A%A4%EC%BA%A0%ED%95%91%EC%9E%A5,38.0272283274,127.2822799989" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">파피루스 캠핑장은 경기도 포천시 영중면에 자리했다. 포천 시청을 기점으로 영중면사무소 방면으로 달리다 보면 약 30분 만에 닿는다. 캠핑장에 들어서면 잘 정비된 평지에 수목을 식재해 싱그러운 느낌을 선사한다. 이곳은 오토캠핑과 글램핑이 공존하는 공간이다. 오토캠핑 사이트 15면이 있고, 전기와 화로 사용을 허용한다. 산책로를 비롯해 여름철 물놀이를 즐길 수 있는 수영장 등의 부대시설을 갖췄다.</div>
