<p class="detail-row"><strong>주소</strong> 경상북도 문경시 가은읍 대야로 1290</p>

<a href="https://map.kakao.com/link/map/%EC%A0%A4%EB%A3%A8%EB%8A%90%EB%A6%B0%20%EB%8B%AC%ED%8C%BD%EC%9D%B4,36.6766136409,127.9597159345" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">젤루느린 달팽이는 경북 문경시 가은읍에 위치하고 있다. 예쁜 개울과 백두대간 대야산이 보이는 펜션으로 레고 전시관이 있는 카페도 함께 운영하고 있다. 썬배드와 방갈로가 있는 수영장이 있으며 비누 만들기 체험. 핸드드립 커피 체험도 할 수 있다. 사계절의 아름다운 경치와 깨끗한 자연을 느낄 수 있다. 1급수에서 사는 가재와 다슬기도 볼 수 있다. 도심에서 벗어나 조용한 사위와 자연에서 힐링할 수 있다.</div>
