<a href="https://map.kakao.com/link/map/%EC%96%B4%EC%B2%9C%EC%A0%80%EC%88%98%EC%A7%80,37.2553503648,126.9170131241" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 화성시 매송면에 위치한 어천저수지는 1956년에 준공되었다. 수심이 낮은 저수지로 화성에서 관리 중에 있다. 함박산과 칠보산이 저수지를 둘러싸고 있어 아름다운 자연경관을 볼 수 있다. 저수지 주변의 자연경관을 즐기며 가볍게 걸어도 좋고, 낚시터 이용을 위해 방문해도 좋은 곳이다.</div>
