<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">마천산산림욕장</h1>
<p class="detail-row"><strong>주소</strong> 대구광역시 달성군 다사읍 이천리</p>

<a href="https://map.kakao.com/link/map/%EB%A7%88%EC%B2%9C%EC%82%B0%EC%82%B0%EB%A6%BC%EC%9A%95%EC%9E%A5,35.8894429892,128.4556244600" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">마천산산림욕장은 마천산, 성산 일대 숲길을 걸으며 산림욕을 즐길 수 있도록 조성되어 있다. 숲 속 쉼터, 체력단련장, 전망대, 숲 해설판 등의 편의시설이 잘 갖춰져 있다. 그 외에도 걷다가 마주하는 마천산 산림욕장 야생화 생태원 안내판 뒤쪽으로는 20여 종의 야생화가 있어 자연 학습에도 도움이 된다. 곳곳에 있는 안내판을 읽으며 산책하는 재미가 있다. 인근 지역에 사는 사람들뿐만 아니라 타 지역에서 찾아오는 관광객들도 많다.</div>
