<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">덕풍계곡캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 삼척시 가곡면 덕풍길 44</p>

<a href="https://map.kakao.com/link/map/%EB%8D%95%ED%92%8D%EA%B3%84%EA%B3%A1%EC%BA%A0%ED%95%91%EC%9E%A5,37.1224518086,129.1585152983" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">덕풍계곡솔밭야영장은 기암괴석과 용소로 유명한 덕풍계곡에 위치한 캠핑장이다. 총 92개의 사이트가 있는데 10개의 데크를 제외하면 모두 파쇄석으로 여름철에만 운영된다. 사이트 간격이 넓은 편은 아니지만, 마을에서 운영하는 캠핑장과 달리 전기와 샤워시설이 기본 제공되며, 계곡이 가까워서 덕풍계곡에 물놀이를 위한 가족단위 캠핑족들이 즐겨 방문한다. 계곡 수심이 깊은 곳은 다이빙이 가능하며, 낚시를 즐기기도 좋은 청정 계곡이다.</div>
