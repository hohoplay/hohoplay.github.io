<p class="detail-row"><strong>주소</strong> 경기도 포천시 이동면 화동로 2236-25</p>

<a href="https://map.kakao.com/link/map/%EB%A9%94%EC%9D%B4%ED%94%8C%EA%B8%80%EB%9E%A8%ED%95%91,38.0441530565,127.3748821408" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">메이플 글램핑&amp;카라반은 포천 이동갈비촌 외곽에 위치한 프라이빗 한 캠핑장이다. 글램핑 7동, 카라반 5대로 큰 규모는 아니지만, 두 개의 실외 수영장과 잔디광장, 분수연못, 트램펄린, 블루베리 농원과 단풍나무숲까지 있다. 인조잔디가 깔린 반려견 운동장 규모도 상당히 크다. 시설마다 개별 가림막이 설치되어 있어 조용하고 독립된 캠핑을 즐기기 좋다. 인근에 백운계곡, 산정호수, 평강식물원 등이 있다.</div>
