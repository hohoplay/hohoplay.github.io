<p class="detail-row"><strong>주소</strong> 경기도 평택시 홍원길 14</p>

<a href="https://map.kakao.com/link/map/%EB%AC%B4%EC%88%98%EC%BA%A0%ED%95%91%EC%9E%A5,37.0181297237,126.8684851865" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">평택에서 가까운 무수캠핑장은 다양한 문화예술 시설을 향유할 수 있는 차별화된 캠핑장이다. 전통 찜질 가마, 루프탑 존, 산책로, 문화카페, 작은 도서관, 공연 강좌 시설을 갖추고 있다. 캠핑장 이용객은 캠핑장 내의 찜질 가마도 무료로 이용 가능하다. 규모가 크지는 않지만, 아기자기한 매력이 있다. 캠핑장 입구에는 24시 편의점이 있어 필요한 물건을 구매하기 용이하다.</div>
