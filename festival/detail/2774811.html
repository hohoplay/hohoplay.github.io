<p class="detail-row"><strong>주소</strong> 경상남도 창녕군 창녕읍 계성화왕산로 638</p>

<a href="https://map.kakao.com/link/map/%EC%98%A5%EC%B2%9C%EA%B3%84%EA%B3%A1,35.5188893927,128.5511151405" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">창녕의 대표 계곡인 옥천계곡은 화왕산 정상(해발 757m)에서 골짜기마다 굽이굽이 흘러내린 물길로 형성된 계곡이다. 시원하고 장쾌한 물줄기와 화왕산 숲에서 불어오는 청량한 바람으로 여름철 피서객들의 최적의 휴양지로서 각광을 받고 있다. 주차장에서 등산로를 따라가다 보면 숲과 바위가 어우러진 계곡이 나온다. 아무 곳에나 자리를 잡고 발을 담그면 그곳이 절로 피서지가 된다.</div>
