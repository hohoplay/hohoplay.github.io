<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">수주팔봉 야영지</h1>
<p class="detail-row"><strong>주소</strong> 충청북도 충주시 대소원면 문주리 산 1-1</p>

<a href="https://map.kakao.com/link/map/%EC%88%98%EC%A3%BC%ED%8C%94%EB%B4%89%20%EC%95%BC%EC%98%81%EC%A7%80,36.8995207136,127.9227184801" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">수주팔봉 야영장이 자리한 달천은 전 구간이 상수원 보호구역으로 지정되어 취사나 야영이 불가능하다. 그러나 유일하게 팔봉교 아래 일부 구간이 개방되어 수주팔봉의 운치와 달천의 시원한 물줄기를 즐길 수 있다. 팔봉마을에서 여름철 캠핑장으로 꾸미고 관리한다. 다른 캠핑장과는 달리 물가의 백사장과 자갈밭이 그대로 캠핑장이 되고, 사이트 구분이 없어 마음에 드는 자리를 골라 텐트를 치면 된다.</div>
