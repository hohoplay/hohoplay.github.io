<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">목계솔밭(청송)</h1>
<p class="detail-row"><strong>주소</strong> 경상북도 청송군 파천면 청송로 6070</p>

<a href="https://map.kakao.com/link/map/%EB%AA%A9%EA%B3%84%EC%86%94%EB%B0%AD%28%EC%B2%AD%EC%86%A1%29,36.5000454718,129.0298285728" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청송군 소재지에서 진보면으로 이어지는 국도 31호 선상에 위치한 9,917m²의 솔밭에는 높이 15~20m의 소나무들이 군락을 이루고 있다. 도로를 따라 200여 그루의 소나무가 숲을 이루는  목계 솔밭은 드라이브를 하는 관광객들에게 시원한 그늘을 마련해 주고 있다. 최근에는 소나무 숲에서 피크닉을 즐기려는 사람들이 많이 방문하고 있다.</div>
