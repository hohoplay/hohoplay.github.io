<p class="detail-row"><strong>주소</strong> 경기도 양평군 용문면 용문산로 684</p>

<a href="https://map.kakao.com/link/map/%EC%9A%A9%EB%AC%B8%EC%82%B0%EC%95%84%EC%98%81%EC%9E%A5,37.5473451784,127.5798446697" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">넓은 잔디밭 광장이 있는 용문산관광지 야영장은 경기도 양평군에 위치하고 있다. 14개 노지 사이트를 운영하고 있으며 일부는 노키즈존으로 운영하고 있다. 가족과 커플 중심의 캠핑장으로 자연 속에서 힐링을 할 수 있는 곳이다. 주변 관광지로 용문사, 청춘 뮤지엄, 용문산계곡 등이 있어 가족들과 함께 체험 관광도 연계하여 진행할 수 있다.</div>
