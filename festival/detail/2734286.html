<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">백제캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 전북특별자치도 익산시 금마면 도천길 131-20</p>

<a href="https://map.kakao.com/link/map/%EB%B0%B1%EC%A0%9C%EC%BA%A0%ED%95%91%EC%9E%A5,36.0125594777,127.0515818454" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">백제캠핑장은 전북 익산시 금마면에 위치한 자연친화적인 캠핑장이다. 이곳은 좌측으로 미륵산, 우측으로 용화산을 끼고 있으며 3500평 규모의 폐교를 리모델링하여 조성되었다. 텐트 사이트는 50개 이상이며 6개의 펜션 객실이 마련되어 있다. 화장실과 샤워장은 새로 지어져 깨끗한 상태를 유지하고 있다. 부대시설로는 야외 물놀이장, 실내 트램펄린과 놀이방, 야외 족구장이 있으며 장박 캠퍼들도 많이 찾는다.</div>
