<a href="https://map.kakao.com/link/map/%EC%95%84%EB%8D%B8%EB%A6%AC%EC%95%84,35.8065182051,129.3054882190" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경주 보문단지에 위치한 글램핑장이다. 넓고 푸른 잔디정원이 있는 풍경으로 자연 속에서 힐링할 수 있다. 또한 워터슬라이드 수영장, 키즈테마 등 다양한 시설을 갖추어 가족, 연인이 함께 즐기기에도 좋다. 가까운 거리에 경주월드, 불국사, 첨성대, 황리단 길 등이 있어 주변 경주 유명 관광도 즐길 수 있다.</div>
