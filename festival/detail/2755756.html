<p class="detail-row"><strong>주소</strong> 인천광역시 옹진군 영흥면 영흥로722번길 43</p>

<a href="https://map.kakao.com/link/map/%EB%AA%85%EC%84%B1%EA%B0%80%EC%A1%B1%EC%BA%A0%ED%95%91%EC%B4%8C,37.2730957580,126.4563739778" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">국사봉 오르는 곳에 위치한 명성가족캠핑촌은 인천 옹진군 영흥면에 위치하고 있다. 데크사이트 10개와 블록사이트 8개를 운영하고 있다. 명성캠프 데크사이트 10개와 블록사이트 8개이다. ​한 사이트에 2동의 텐트를 사용할 수 있는 더블사이트 4개도 있다. 자리를 직접 지정해서 이용할 수 있는 것이 장점이다. 영흥도는 차로 다닐 수 있는 섬으로 서울 강남역과 수원에서 대중교통으로 이동 가능하다.</div>
