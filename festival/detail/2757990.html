<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 새막골길 72-115</p>

<a href="https://map.kakao.com/link/map/%EC%83%88%EB%A7%89%EA%B3%A8%EC%BA%A0%ED%94%84%EC%9E%A5,37.3236627316,128.1785554253" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 영월에 위치한 새막골 캠핑장은 산과 강, 계곡으로 둘러싸인 조용한 캠핑장이다. 파쇄석 바닥에 나무 그늘이 많다. 일반 오토캠핑 사이트와 별도로, 이지 사이트라고 해서 타프, 텐트, 냉난방 용품이 포함된 사이트도 준비되어 있어, 텐트가 없거나, 초보들이 편하게 이용할 수 있다. 주변에 과실수들이 많아 제철 과일 따기를 해볼 수 있고, 옆에 계곡에서 물놀이나 낚시를 할 수 있다</div>
