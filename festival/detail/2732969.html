<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">둥지캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 가평군 설악면 묵안로 976-62</p>

<a href="https://map.kakao.com/link/map/%EB%91%A5%EC%A7%80%EC%BA%A0%ED%95%91%EC%9E%A5,37.6011769317,127.5313780623" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평 둥지캠핑장은 침엽수 20만 평 속 둥지처럼 편안한 장소에 자리하고 있다. 서울에서는 약 40분~1시간 이면 편하게 올 수 있는 거리이다. 깔끔한 화장실, 개수대, 샤워실, 어린이 풀장, 성인 풀장, 축구장 만한 천연잔디 운동장, 어린이들이 좋아하는 토끼장, 예쁜 연못 등 깨끗하고 상쾌한 공기 부담 없이 휴식을 취할 수 있는 공간이다. 캠핑장에서 운영하는 텃밭에서 쌈채소를 직접 재배하고, 캠퍼들이 자유롭게 이용할 수 있다.</div>
