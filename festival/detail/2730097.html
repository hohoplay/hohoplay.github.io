<p class="detail-row"><strong>주소</strong> 경기도 양평군 개군면 추읍로 268-37</p>

<a href="https://map.kakao.com/link/map/%ED%81%B4%EB%9D%BC%EC%9D%B8%EC%BA%A0%ED%94%84%EB%B9%8C%EB%A6%AC%EC%A7%80,37.4279699077,127.5682186216" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">클라인캠프빌리지는 8팀만 이용 가능한 별장형 소규모 캠핑장이다. 단체 이용객이 없어 조용한 캠핑을 원하는 솔캠이나 커플캠퍼들이 자주 찾는다. 캠핑장비대여가 가능하고 캠핑 체험 교육 등 캠핑 초보를 위한 다양한 커리큘럼으로 도움 받을 수 있다. 월~목 평일에는 반려견 동반이 가능하며 주말에는 안 짖는 소형견의 경우 선택적으로 동반이 가능하다.</div>
