<a href="https://map.kakao.com/link/map/%ED%81%B0%EB%A7%88%EB%8B%B9%EC%BA%A0%ED%95%91%EC%9E%A5,38.0678976415,127.3821224442" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">큰마당 캠핑장은 40년 이상 된 나무들이 많아 타프 없이도 모든 사이트가 따가운 햇볕을 피해 야영할 수 있으며 ​캠핑장 한 가운데 계곡이 흐르고 있어 물놀이가 가능하다. 물은 청정 1급수라 맑고 깨끗하며 의자를 가져다 놓고 앉아 발을 담글 수도 있다. 화장실과 샤워장은 넉넉하게 준비돼 있어 주말에도 여유있게 사용할 수 있다. 개수대 역시 편한 구조로 되어 있어 이용객에 대한 배려가 돋보인다, 온수 사용이 가능하고 수압도 세다.</div>
