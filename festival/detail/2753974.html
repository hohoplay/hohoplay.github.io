<p class="detail-row"><strong>주소</strong> 경상북도 울진군 기성면 사동항길 352</p>

<a href="https://map.kakao.com/link/map/%EC%82%AC%EB%8F%99%ED%95%AD,36.8261107654,129.4465042185" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">사동항은 1971년 국가 어항으로 지정됐다. 사동항은 울진군 기성면에 위치해 있는 항구이다.  1971년 12월 21일 국가어항으로 지정되었다. 사동항은 어항의 기본적 역할뿐만 아니라 바다낚시꾼들과 스킨스쿠버 동호인들에게 널리 알려져 있다. 또한 사동항 인근에 있는 사동항 등대는 드라마  &lt;폭풍속으로&gt;의 촬영지로 관광객들에게 인기를 얻고 있다.</div>
