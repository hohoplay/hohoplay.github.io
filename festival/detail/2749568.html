<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">밀모빨강치마캠핑리조트</h1>
<p class="detail-row"><strong>주소</strong> 전북특별자치도 무주군 적상면 밀모길 79-30</p>

<a href="https://map.kakao.com/link/map/%EB%B0%80%EB%AA%A8%EB%B9%A8%EA%B0%95%EC%B9%98%EB%A7%88%EC%BA%A0%ED%95%91%EB%A6%AC%EC%A1%B0%ED%8A%B8,35.9302908394,127.6707344707" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">밀모빨강치마캠핑리조트는 각 계절마다 운치있는 풍경을 자랑한다. 오른쪽으로는 무주리조트의 설원을 감상할 수 있고, 정면으로는 적상산의 멋진 풍경을 감상할 수 있다.  야영장의 명칭은 지역 이름인 ‘밀모’에, 적상산을 상징하는  ‘빨강치마’의 뜻을 품고 있다. 적상산은 ‘가을에 단풍이 들면 그 형상이 빨간치마 같다’ 하여 붙여진 이름이라고 한다.  야영장은 글램핑과 카라반 캠핑장, 오토캠핑장, 가족호텔 등으로 구성되어 있다.</div>
