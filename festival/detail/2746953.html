<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">문앤스타 오토캠핑장은 양평군 용문면 중원계곡에 있는 오토캠핑장이다. 전원 공급 시설을 비롯한 화장실, 샤워실, 공동 취사장이 별도의 시설로 되어 있다. 주변에 축구장, 산책로와 중원계곡이 있으며, 특히 어린이들이 자연에서 맘껏 뛰어놀 수 있는 환경으로 조성되어 있다. 이곳은 캠핑카 및 카라반 진입이 가능한 캠핑장이다.</div>
