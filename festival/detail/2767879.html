<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">신항 바다쉼터</h1>
<p class="detail-row"><strong>주소</strong> 인천광역시 연수구 송도동</p>

<a href="https://map.kakao.com/link/map/%EC%8B%A0%ED%95%AD%20%EB%B0%94%EB%8B%A4%EC%89%BC%ED%84%B0,37.3470982744,126.6147547408" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">인천해양수산청이 송도동 일원에 신항 바다쉼터를 조성하여 2011년 6월부터 현재까지 시민들에게 개방하고 있다. 군사보호 구역임에도 인천 신항 건설과 함께 개장한 바다쉼터는 시민들이 인천항의 발전 모습과 서해의 아름다움을 보고 휴식을 취할 수 있도록 제공한 것이다. 방파제와 그 위로 조성된 산책로와 전망대가 있으며 쉼터가 마련되어 있고, 해안가 주변으로 지압판이 깔린 산책길이 조성되어 있다.</div>
