<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경주 더숲캠핑장은  물놀이가 가능한 계곡이 가까이에 있고 넓은 잔디광장과 트램펄린, 야외 수영장, 모래 놀이터를 갖춰 어린이들이 즐길 수 있는 캠핑장이다. 사이트 사이 간격이 넓어 쾌적하다. 실시간 인터넷 예약이나 전화로 예약해야 한다. 사이트 예약 후에는 선착순으로 자리 지정이 가능하다.</div>
