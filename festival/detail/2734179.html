<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">도심에서 조금만 벗어나면 캠핑장비 없이도 캠핑을 즐길 수 있는 다인캠핑장이 있다. 버너와 불판, 컵과 식기들, 선풍기, 침대, 의자 등 캠핑에 필요한 물품은 모두 준비되어 있다. 아이들을 위한 트램펄린 등 온 가족이 즐길 수 있는 캠핑장이다. 넓은 사이트로 개편되어 더욱 편안한 캠핑이 가능해졌으며 조용하게 휴식할 수 있는 캠핑장으로 2 사이트 이상의 팀 예약은 불가능하다.</div>
