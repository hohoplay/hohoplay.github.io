<a href="https://map.kakao.com/link/map/%ED%8A%B8%EB%A6%AC%EC%BA%A0%ED%95%91%EC%9E%A5,37.2568736623,126.5150051912" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">트리캠핑장은 대부도와 선재도, 영흥도를 잇는 바닷길에 위치해 있다. 캠핑장에서 선재대교와 영흥도가 보이고 캠핑장에서 조금만 이동하면 바다에 발을 담그고 즐길 수 있다. 특히 선재대교 너머로 지는 일몰이 유명하다. 캠핑장은 모두 데크로 구성되어 있고 소나무 숲 속에서 바다를 내려다볼 수 있는 조망권이 좋다. 각 사이트마다 크기와 요금이 달라 예약 시 미리 확인이 필요하다.</div>
