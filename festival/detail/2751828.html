<a href="https://map.kakao.com/link/map/%EC%9A%A9%EB%8D%95%EC%A0%80%EC%88%98%EC%A7%80,37.1848501404,127.2251177180" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">용덕저수지는 용인시 처인구 이동읍에 위치한 저수지이다. 저수지 주변으로 산책데크가 조성되어 있어 가볍게 걷기 좋다. 산책로는 전망데크를 포함하여 목교, 수변쉼터, 안젤리 미술관 등을 포함하고 있다. 원점회귀 코스가 아닌 직선 코스라 시작점으로 다시 되돌아와야 한다. 또한 저수지에 낚시터가 조성되어 있어 낚시를 즐기기에도 좋다.</div>
