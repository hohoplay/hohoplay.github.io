<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">대부도아라뜰캠핑장은 경기도 안산시 대부도 아래쪽 해변에 있다. 캠핑장은 해송 숲이 빼곡한 언덕배기에 조성되어 있어 유리섬 미술관과 좁은 바닷길을 사이에 두고 서로 마주 보는 형태이다. 사이트까지 차량 진입이 쉽고 수월해 초보 캠퍼들도 좋아하는 곳이다. 캠핑장 바로 앞에는 작은 염전도 있고, 갯벌도 바로 아래쪽에 있다.</div>
