<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 홍천에 위치한 예담숲 캠핑장은 잔디존, 데크존, 인조잔디존  등 다양한 스타일로 사이트가 구성되어 있다. 대규모 인원이 참여할 수 있는 세미나실과 다목적 잔디구장이 있다. 아이들이 좋아하는 놀이시설로 약200m 길이의 짚라인, 범퍼카, 물놀이수영장, 트램펄린과 정글짐 등이 준비되어 있다.</div>
