<p class="detail-row"><strong>주소</strong> 경기도 포천시 창수면 전영로1023번길 115</p>

<a href="https://map.kakao.com/link/map/%EC%86%A1%EA%B0%80%EB%84%A4%EC%98%A4%EA%B0%80%EB%A6%AC%EC%BA%A0%ED%95%91%EC%9E%A5,38.0226628276,127.1652464013" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">오가리 캠핑장은 한탄강 줄기가 흐르는 곳에 있는 펜션과 야영장이 함께 있는 캠핑장이다. 캠핑장 안으로 들어오면 우측으로는 나무 그늘이 있는 강변 사이트, 좌측으로는 운동장 사이트가 있다. 강변 사이트는 영평천이 한눈에 들어오는 자리로 시원한 절경에 기암괴석을 덤으로 볼 수 있다. 캠핑장은 파쇄석 사이트로 되어 있으며, 사이트 공간이 널찍해 텐트를 여유롭게 설치할 수 있어 캠핑하는 동안 편안하게 생활할 수 있다.</div>
