<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">옥화자연휴양림</h1>
<p class="detail-row"><strong>주소</strong> 충청북도 청주시 상당구 미원면 운암옥화길 140</p>

<a href="https://map.kakao.com/link/map/%EC%98%A5%ED%99%94%EC%9E%90%EC%97%B0%ED%9C%B4%EC%96%91%EB%A6%BC,36.5980511753,127.6958861872" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">옥화자연휴양림은 충청북도 청주시 상당구 미원면에 위치한 자연휴양림으로, 청주시시설관리공단에서 운영하고 있다. 1999년 8월 2일에 개장하였으며, 136㏊의 면적을 자랑하는 대규모 휴양림이다. 숲속의 집, 산림휴양관, 오토캠핑장, 캠핑하우스 등 다양한 숙박시설과 더불어 다목적실, 물놀이장, 등산로, 유아숲놀이터 등 가족 단위 방문객을 위한 부대시설이 잘 갖추어져 있다.</div>
