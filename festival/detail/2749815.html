<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 김삿갓면 내리계곡로 1116-4</p>

<a href="https://map.kakao.com/link/map/%EB%8A%98%ED%91%B8%EB%A5%B8%ED%8E%9C%EC%85%98%EC%BA%A0%ED%95%91%EC%9E%A5,37.1079608529,128.6756310753" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">늘푸른펜션 캠핑장은 앞에 산과 계곡이 있는 자연친화 캠핑장이다. 여름에는 시원한 계곡물에서 물놀이가 가능하다. 부대시설로는 어린이를 위한 트램펄린과 화장실, 샤워장, 개수대의 편의시설이 있으며 나무마다 전기배전반이 설치되어 있다. 캠핑장 이용 시 밤 11시 이후부터는 소음에 유의해야 한다. 주변 관광지로는 동강 래프팅, 한반도지형, 솔고개 소나무가 있다.</div>
