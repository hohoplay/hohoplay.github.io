<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">뱀사골자동차야영장</h1>
<p class="detail-row"><strong>주소</strong> 전북특별자치도 남원시 산내면 와운길 10</p>

<a href="https://map.kakao.com/link/map/%EB%B1%80%EC%82%AC%EA%B3%A8%EC%9E%90%EB%8F%99%EC%B0%A8%EC%95%BC%EC%98%81%EC%9E%A5,35.3718691713,127.5791129155" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">뱀사골자동차야영장은 지리산 인근에 위치한 캠핑장으로 뱀사골 계곡 초입에 인접해 있어 접근성이 좋다. 국립공원에서 운영하는 시설로 가격이 저렴하여 인기가 많다. 캠핑 사이트는 총 30개가 있고, 바닥은 데크석이고, 전기와 온수는 지원되지 않고, 주차는 주차장에 따로 해야 한다. 캠핑장 옆으로 달궁 계곡이 흐르고 있고, 등산과 산림욕을 하며 자연을 만끽할 수 있다. 또한 가을 단풍 구경 명소로 알려져 있다.</div>
