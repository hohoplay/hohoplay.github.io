<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">대덕힐링캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 영광군 법성면 대덕길2길 105</p>

<a href="https://map.kakao.com/link/map/%EB%8C%80%EB%8D%95%ED%9E%90%EB%A7%81%EC%BA%A0%ED%95%91%EC%9E%A5,35.3499357301,126.4505884209" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">초창기 대덕산 농원캠핑장이었으나 대덕힐링캠핑장으로 이름이 변경되어 운영 중이다. 주요 시설로 일반 야영장 3면과 글램핑시설 11면이 있다. 이곳은 산을 깎아 만든 부지에 층층이 위치하여 캠핑장 내 이동이 다소 불편하지만, 전망이 좋다는 장점이 있다. 영광 바다와 대교를 볼 수 있고 계절별 경치를 즐길 수 있다. 등산로가 바로 옆에 있고, 아침 산책하기 좋은 산책로도 있다.</div>
