<a href="https://map.kakao.com/link/map/%EC%9D%BC%EC%98%81%EB%AA%A8%EC%9E%90%EB%86%8D%EC%9B%90%EC%BA%A0%ED%95%91%EC%9E%A5,37.7082261966,126.9530582070" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 양주 일영모자농원캠핑장은 일영유원지 계곡 옆에 위치해 있다. 공간이 넓어 여유 있게 텐트를 설치할 수 있고 인조 잔디가 깔린 대운동장과 소운동장이 있어 기업체 행사나 야유회, 친목회, 워크숍, 체육대회를 하기에 적합하다. 펜션과 식당, 매점을 함께 운영하고 있어 불편이 없고 여름철엔 수영장을 개장한다. 반려견과 동반 입장이 가능하다.</div>
