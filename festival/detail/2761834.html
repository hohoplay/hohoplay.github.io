<p class="detail-row"><strong>주소</strong> 강원특별자치도 춘천시 동산면 종자리로 224-104</p>

<a href="https://map.kakao.com/link/map/%EC%B6%98%EC%B2%9C%EC%88%B2%EC%9E%90%EC%97%B0%ED%9C%B4%EC%96%91%EB%A6%BC%EC%97%94%EA%B8%80%EB%9E%A8%ED%95%91,37.7477277543,127.7448071635" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">아름다운 자연과 밤하늘에 가득 수놓인 별들을 볼 수 있는 춘천 숲자연휴양림은 강원도 춘천시 동산면에 위치하고 있다. 서울 춘천간 고속도로 남춘천 IC에서 서울에서 약 40분 거리에 규모 82㏊의 물맑고 공기좋은 잣나무 및 참나무 숲속에 조용하고 아늑한 자연휴양림이다. 부대시설로 공용화장실, 공용샤워실, 개수대, 매점, 안내매표소 등이 있다.</div>
