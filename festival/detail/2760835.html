<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 담양군 대전면 병풍로 483</p>

<a href="https://map.kakao.com/link/map/%ED%95%9C%EC%9E%AC%EA%B3%A8%20%EA%B3%84%EA%B3%A1,35.3019927631,126.8768795651" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">전남광주통합특별시에서 가까운 거리에 위치한 한재골 계곡은 관광객이 많이 찾는 곳이다. 계곡의 물이 매우 맑고 깨끗하며, 수심이 얕고 물살이 약해서 아이들이 놀기에 안성맞춤이다. 한재골 계곡은 상류 쪽에 설치한 사방댐에서 물놀이하기 좋다. 들어서는 입구부터 나무가 그늘을 만들어주어 시원함을 느낄 수 있고, 계곡의 청아한 물소리와 삼나무 아래 상쾌한 바람을 맞으며 가족과 함께하는 시간은 아이들과 어른들 모두에게도 힐링을 준다.</div>
