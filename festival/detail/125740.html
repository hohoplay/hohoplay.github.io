<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">황지연못</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 태백시 황지연못길 12 (황지동)</p>

<a href="https://map.kakao.com/link/map/%ED%99%A9%EC%A7%80%EC%97%B0%EB%AA%BB,37.1727622365,128.9910509427" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">낙동강의 발원지로 시내 중심부에 위치하며 이 못에서 솟아나는 물이 드넓은 영남평야를 도도히 흘러가게 된다. 연못의 둘레가 100m인 상지와 중지, 하지로 구분되며 1일 약 5,000톤의 물이 용출되어 상수도 취수원으로 이용되기도 하였다. 이곳에 살던 황부자가 시주를 요하는 노승에게 시주 대신 두엄을 퍼주어 이에 천지가 진동하면서 집터가 연못으로 변했다는 전설이 깃들어 있는 이곳은 한국명수 100선 중의 한 곳이기도 하다.</div>
