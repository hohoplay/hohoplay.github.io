<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">동강오토캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 영월읍 둥글바위길 33</p>

<a href="https://map.kakao.com/link/map/%EB%8F%99%EA%B0%95%EC%98%A4%ED%86%A0%EC%BA%A0%ED%95%91%EC%9E%A5,37.2022773020,128.5039908739" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">영월에 위치한 동강오토캠핑장은 시원한 동강을 바로 조망할 수 있는 펜션 겸 캠핑장이다. 캠핑장은 크게 3개의 구역으로 나눠져 있고, A는 족구장이 있고, B는 편의시설이 가깝고, C는 2팀 이상의 단체가 이용하게 편리하다. A와 B가 뷰가 좋다는 평이 많다. 바닥은 파쇄석과 보도블록이 잘 정비되어 있다. 동강에서 물놀이나 낚시, 래프팅을 하기 좋고, 흐르는 강물과 산을 바라보면서 물멍 하기 좋은 풍경이다.</div>
