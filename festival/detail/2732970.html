<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">어반슬로우시티</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 춘천시 남면 가옹개길 108</p>

<a href="https://map.kakao.com/link/map/%EC%96%B4%EB%B0%98%EC%8A%AC%EB%A1%9C%EC%9A%B0%EC%8B%9C%ED%8B%B0,37.7326918503,127.5116454712" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">춘천 남면에 위치한 어반 슬로우시티는 3면이 산이며 앞은 강이 있어 캠핑장 자체가 프라이빗하며 힐링 가득한 감성 캠핑과 수상 레저를 동시에 즐길 수 있는 캠핑장이다. 감성 카라반 4동, 리얼 감성 글램핑 12동, 풀옵션 글램핑 2동, 오토캠핑 23 사이트와 카페, 마켓, 럭셔리하고 감각적인 공용 샤워실 및 화장실, 수영장, 잔디 구장, 모래놀이를 갖추고 있다. 5㎏ 이하 반려견 1마리는 입장 가능하다.</div>
