<p class="detail-row"><strong>주소</strong> 경기도 가평군 청평면 호반로 886</p>

<a href="https://map.kakao.com/link/map/%EC%B2%AD%ED%8F%89%EB%8B%A4%EA%B0%90%EC%BA%A0%ED%95%91%EC%9E%A5,37.7106188683,127.4819015987" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">청평 다감 캠핑장은 경기도 가평군 청평면 청평호 앞에 위치해 있어 조망권이 좋다. 펜션, 유람선, 수상레저, 카페, 매점이 함께 있으며 모든 사이트는 호수 뷰로 데크이다. 잔디 정원과 야외 테라스를 갖추고 있어 분위기가 좋으나 데크 당 2명만 입장이 가능해 커플 위주의 캠핑이라고 할 수 있다. 차량 진입이 데크 50미터 이전까지만 허용되어 50미터 밖에서 수레를 이용 장비를 이동해야 한다.</div>
