<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">소양강 하안단구 (강원평화지역 국가지질공원)</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 북면 둔지말길 43-6</p>

<a href="https://map.kakao.com/link/map/%EC%86%8C%EC%96%91%EA%B0%95%20%ED%95%98%EC%95%88%EB%8B%A8%EA%B5%AC%20%28%EA%B0%95%EC%9B%90%ED%8F%89%ED%99%94%EC%A7%80%EC%97%AD%20%EA%B5%AD%EA%B0%80%EC%A7%80%EC%A7%88%EA%B3%B5%EC%9B%90%29,38.1314085900,128.2109560114" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">하안단구는 경동성 요곡운동 (동족이 높고, 서쪽이 낮은 한반도의 기본 골격을 형성한 대규모의 융기현상) 이전에 홍수에 의해 하천 주변에 쌓였던 자갈과 모래가 지반이 융기된 후, 강물에 의해 깎이면서  강 주변에 계단모양으로 나타나는 지형을 말한다. 이 하안단구는 오랜 기간 농경지와 주거 지역 등 태백산맥 주변 지역에서는 주요 생활터전으로 활용되었다.</div>
