<a href="https://map.kakao.com/link/map/%EB%B4%89%EC%A6%88%EC%82%B4%EB%A1%B1,37.4807129884,127.8253049285" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">베어커리 카페를 겸하고 있는 작은 캠핑장으로 회원제로 운영된다. 카페 바로 옆의 잔디밭과 마당에 있는 나무숲이 야영장으로 사용된다. 또한 카페 바로 옆으로 주변에서 소문난 식당이 함께 있고 작은 수영장도 운영한다. 야영장 앞에는 약사천이 흘러 개울에서 물놀이도 할 수 있다. 부대시설로는 화장실, 샤워실, 개수대 등이 준비되어 있다.</div>
