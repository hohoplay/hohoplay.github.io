<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">진동계곡</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 인제군 기린면 진동리</p>

<a href="https://map.kakao.com/link/map/%EC%A7%84%EB%8F%99%EA%B3%84%EA%B3%A1,37.9633541354,128.4079238261" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원특별자치도 인제군 진동1리 추대에서 설피밭에 이르는 장장 20㎞의 발달한 계곡이다. 진동계곡은 희귀 동·식물들이 많이 서식하고 있는 자연 생태계의 보고이다. 봄철이 되면 진달래와 철쭉이 온산을 덮어서 천자만홍의 경색을 보여준다. 여름철에는 수많은 진한 향기가 탐스러운 꽃들이 자생하고 있어 아름다움의 극치는 더할 것이 없다. 또한 가을철이면 단풍이 온산을 금수로 장식하고 있어 오는 이의 마음을 설레게 하며 피서지로 적격이다.</div>
