<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">성호호수연꽃단지</h1>
<p class="detail-row"><strong>주소</strong> 경기도 이천시 설성면 장천리</p>

<a href="https://map.kakao.com/link/map/%EC%84%B1%ED%98%B8%ED%98%B8%EC%88%98%EC%97%B0%EA%BD%83%EB%8B%A8%EC%A7%80,37.1394497035,127.5254196330" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 이천시 설성면 장천리 성호호수에 있는 연꽃단지이다. 2008년부터 2009년까지 이천시에서 연꽃단지를 조성하였으며, 백련과 홍련, 적련, 황련 네 가지 종류의 연꽃이 핀다. 
매년 연꽃 만개 절정의 시기가 되면 많은 사람들이 이곳을 찾는다. 파란 하늘과 흰 구름, 분홍색 연꽃이 어우러져 사진작가들을 부르는 사진 명소이다. 파란 연잎 사이로 핀 연꽃을 보며 힐링하기 좋은 곳이다.</div>
