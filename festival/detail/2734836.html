<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">고래숲캠핑장</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안산시 단원구 장불길 14 (대부남동)</p>

<a href="https://map.kakao.com/link/map/%EA%B3%A0%EB%9E%98%EC%88%B2%EC%BA%A0%ED%95%91%EC%9E%A5,37.2003865846,126.5618080302" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">대부도 둘레길에 접한 체험형 관광농원이다. 밤나무숲에 둘러싸인 이곳은 갯벌체험, 농장체험, 숲 체험, 바다낚시 체험이 가능하다. 아이들이 즐길 수 있는 농구장, 물놀이장, 모래놀이터, 어린이 놀이터가 있다. 농장에서 직접 재배하는 농작물을 수확할 수 있다. 주변 관광지로는 영흥대교, 수협 수산물직판장, 고래 뿔 선착장 등이 있다.</div>
