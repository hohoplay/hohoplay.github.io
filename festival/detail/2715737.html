<p class="detail-row"><strong>주소</strong> 경상남도 남해군 이동면 신전리 1138-10</p>

<a href="https://map.kakao.com/link/map/%EC%9B%90%EC%B2%9C%ED%95%AD,34.7630385142,127.9476879781" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">지방어항으로 지정된 원천항은 남해군 대표 관광지인 금산 자락 아래 위치한 항구이다. 남해바래길 본선 10코스 앵강다숲길의 시작점으로 길 항내 원천 방파제는 유명한 낚시 포인트 중 하나이다. 파도치는 소리가 앵무새 소리와 닮았다고 하여 ‘앵강만’이라고 불리는 만곡진 바다를 한눈에 바라볼 수 있는 항구이다. 주변 명소로는 남해 가천 다랭이 논과 금산 보리암 등이 있으며 항구에는 횟집과 멸치쌈밥을 맛볼 수 있는 음식점들이 있다.</div>
