<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">JB캠핑하우스는 경기도 파주시 적성면에 자리 잡고 있다. 캠핑장에는 데크, 파쇄석, 잔디로 이루어진 오토캠핑 사이트가 마련되어 있다. 이 밖에 펜션과 카페도 함께 운영 중이다. 캠핑장은 사계절 내내 주중, 주말 모두 문을 연다. 주변에는 감악산, 타이거 CC 등이 있어 연계 관광에 나서기 수월하다.</div>
