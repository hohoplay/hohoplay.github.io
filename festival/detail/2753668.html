<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">학암포선착장이 위치한 학암포항은 1972년 지방어항으로 지정됐다. 이곳은 항구에서 여유롭게 산책을 가지며 풍경을 감상하기 위해 찾는 사람이 많다. 아울러 선착장이나 낚시 어선을 타고 나가 연해에서 낚시를 하기 위해 방문하는 낚시객도 많다. 대상 어종은 우럭, 광어, 농어, 노래미 등이다.</div>
