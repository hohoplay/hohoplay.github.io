<a href="https://map.kakao.com/link/map/%EA%B8%80%EB%9E%A8%EB%B9%84%20%EA%B8%80%EB%9E%A8%ED%95%91,37.1697662943,126.6282250513" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">제부도에 위치하고 있는 글램비그램핑은 바다 바로 앞에서 편안한 캠핑을 즐길 수 있는 캠핑장이다. 야외수영장, 각종 물놀이 시설이 있어 아이들이 놀기에 좋은 곳이다. 제부도 입구에서 캠핑장 픽업 서비스를 제공하고 있다. 근처 둘러볼만한 곳으로는 전곡항, 전곡마리나항, 궁평항, 제부도 해수욕장, 해안 산책로 등이 있다.</div>
