<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">신도선착장</h1>
<p class="detail-row"><strong>주소</strong> 인천광역시 옹진군 북도면 신도리 523-58</p>

<a href="https://map.kakao.com/link/map/%EC%8B%A0%EB%8F%84%EC%84%A0%EC%B0%A9%EC%9E%A5,37.5152478762,126.4392855613" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">영종도와 마주하고 있는 신도는 영종도의 삼목선착장에서 신도바다역 여객터미널까지 바다로 오간다. 장봉도와는 신도선착장에서는 바닷길을 통해 배를 타고 오간다. 삼형제섬이라 하여 신도와 그 옆에 있는 작은 섬 시도와 모도는 다리로 연결되어 있는데 신도선착장은 이들 섬으로 가기 위해 드나드는 관문이다. 선착장 주변에는 바다를 바라보며 여유로운 시간을 보낼 수 있는 공간이 마련되어 있으며, 여객선 탑승 전 후에 휴식을 취할 수 있다.</div>
