<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">파주시 문산읍 이천리의 지내울 캠핑장은 도시를 떠나 자연 속에서 힐링을 즐길 수 있는 캠핑장이다. 규모는 그다지 크지 않지만 자연 훼손하지 않은 그대로의 모습을 간직한 주위 경관이 일품이다. 캠핑 사이트는 20개 정도의 파쇄석으로 물 빠짐이 좋다. 몽골텐트도 갖춰져 있어 텐트를 준비하지 않아도 캠핑을 즐길 수 있다.</div>
