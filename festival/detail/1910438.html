<a href="https://map.kakao.com/link/map/%EC%8B%A0%EB%9D%BC%EC%8B%9D%EB%AC%BC%EC%9B%90,36.7483329465,128.5446311043" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">봄, 여름, 가을 그리고 겨울 사계절마다 그 모습을 달리하는 신라식물원은 접 재료를 채취해 씻고 다듬어서 요리를 만드는 체험활동이 가능하며, 직접 만든 요리를 이용해서 ‘숲속에서 만나는 행복한 팜파티’를 열 수도 있다. 신라식물원을 방문하면 식물원 관람과 다양한 식물에 대한 설명을 들을 수 있다. 원예체험을 별도로 할 수도 있고, 카페에서 전통차를 마실 수도 있으며 선물용 포장으로 구매도 할 수 있다.</div>
