<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%9D%8C%EC%BA%A0%ED%95%91,37.5999532825,127.5970499128" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">산음캠핑은 경기도 양평군 단월면에 자리 잡고 있다. 양평군청을 기점으로 25분가량 거리에 있다. 상평교차로에서 우회전한 후 용문터널과 단월교차로를 거치면 된다. 도착 전 50여 미터의 언덕을 넘을 뿐인데 마치 깊은 산속에 온 듯한 공간이 펼쳐진다. 사람을 두려워하지 않는 토끼가 자유롭게 노니는 이곳은 글램핑 15면이 있다. 주변에 용문산, 국립산음자연휴양림, 중원계곡, 비발디파크가 있다.</div>
