<p class="detail-row"><strong>주소</strong> 강원특별자치도 영월군 무릉도원면 백년계곡길 142</p>

<a href="https://map.kakao.com/link/map/%EC%82%B0%EC%97%AC%EC%9A%B8%EC%BA%A0%ED%94%84%EC%9E%A5,37.3771444237,128.2717787855" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">법흥계곡 최상류에 위치한 산여울캠핑장은 계곡을 따라 계곡사이트와 평지 사이트로 나눠져 있다. 법흥계곡 상류라 물이 깊지 않고 무척 깨끗하다. 나무들이 크고 숲을 이뤄 그늘이 좋고 숲 한가운데서 캠핑을 즐길 수 있다. 바비큐장과 매점이 있고 5㎏ 미만에 한해서 객실당 1~2마리까지 반려동물 출입이 가능하다.</div>
