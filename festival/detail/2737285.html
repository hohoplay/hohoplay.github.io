<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">덕산저수지는 안성시 삼죽면에 위치한 저수지이다. 저수지에는 산책로와 벤치 등 휴게시설이 조성되어 있어 안성시민들이 자연 속 힐링을 위해 찾는 곳이다. 산책로는 완만하고 턱이 없어서 누구나 이용하기 좋다. 또한 순환산책로가 조성되어 단절된 구간 없이 저수지를 따라 한 바퀴 돌 수 있다.</div>
