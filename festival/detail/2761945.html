<p class="detail-row"><strong>주소</strong> 경기도 포천시 창수면 창동로 497</p>

<a href="https://map.kakao.com/link/map/%EC%9A%B4%EC%82%B0%EB%A6%AC%EA%B5%AC%EB%9D%BC%EC%9D%B4%EA%B3%A8%EC%BA%A0%ED%95%91%EC%9E%A5,38.0587926672,127.2048889363" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">한탄강 옆 운산리 구라이골 캠핑장은 경기도 포천시 창수면에 위치하고 있다. 맑고 시원한 계곡과 빼어난 자연경관을 그대로 간직한 휴식공간이다. 구라이골은 굴+아위의 합성어로 굴바위라고도 불리며 수풀이 우거지는 여름철에는 협곡이 굴처럼 생겼다하여 붙여진 이름이다. 캠핑장은 한탄강 댐 일대를 친환경적으로 개발해 조성했으며 한탄강 일대에서 다목적 광장, 저류 연못, 생태습지, 둘레길 등의 최고의 시설을 최대로 이용 가능하다.</div>
