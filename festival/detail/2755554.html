<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">강원도 홍천군에 위치한 검산 별빛 캠핑장은 캠핑 사이트 22동(데크 13동, 파쇄석 9동), 글램핑 2동, 카라반 사이트 5동(주차장) 등과 신축 개수대와 화장실이 구비되어 있다. 계곡과 인접하여 여름철에는 물놀이하며 가족과 즐거운 시간을 보내기 좋다.</div>
