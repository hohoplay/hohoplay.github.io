<p class="detail-row"><strong>주소</strong> 경기도 양평군 용문면 중원리</p>

<a href="https://map.kakao.com/link/map/%EC%A4%91%EC%9B%90%EC%82%B0,37.5595525041,127.6020200818" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">해발 800m의 중원산은 양평의 진산인 용문산 동쪽에 솟아 있다. 웅장한 용문산의 명성에 가려 덜 알려졌지만 용문산 못지않게 장엄한 바위산이다. 중원산, 백운봉, 도일봉은 용문산을 주봉으로 한 지봉들로 네 산이 연봉으로 우뚝 솟아 절경을 이룬다. 경기도의 금강이라 불리는 이유다. 중원산의 서쪽으로는 조계골, 용계계곡 동쪽으로는 중원계곡, 중원폭포 등 수려한 계곡을 끼고 있어 자연경관이 아름답다.</div>
