<a href="https://map.kakao.com/link/map/%ED%9C%B4%ED%8C%8C%ED%81%AC%20%EA%B4%91%EC%82%B0%EC%A0%90,35.1953634646,126.7303952125" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">전남광주통합특별시 광산구 용진산 아래 지산저수지가 내려다 보이는 곳에 위치한 휴파크 광산점은 국민여가 친환경 오토캠핑장이다. 도심 속 작은 힐링 장소로 일상에 지친 사람들이 아름다운 환경에서 휴식을 즐길 수 있도록 카라반 4인용과 6인용이 준비되어 있다. 1인 기준은 만 5세 이상부터이며 숙박료는 선결제로 이뤄지고 그 외에 바비큐나 장작 등 이용은 현장 결제로 이루어진다.</div>
