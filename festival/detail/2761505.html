<a href="https://map.kakao.com/link/map/%EC%84%B1%EC%95%94%EC%A0%80%EC%88%98%EC%A7%80,36.8045486785,126.5420121925" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">성암저수지는 충남 서산시 음암면에 있다. 농업 관개용 저수지로 1966년 준공됐다. 한적한 농촌의 정취를 느낄 수 있는 이곳은 붕어와 배스가 서식하고 있다. 저수지는 서산 IC와 가까운 거리에 있다. 서쪽에는 만리포해수욕장 등 태안의 관광지가 많고, 북쪽에는 왜목마을 등 당진의 관광지가 있다.</div>
