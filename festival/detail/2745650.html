<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">정화네 불한증막 힐링캠프는 동학 농민 혁명으로 유서 깊은 전라북도 정읍시 고부면에 위치한 조용하고 아담한 캠핑장이다. 캠핑을 즐기실 수 있는 기본 장비가 모두 준비돼 있으며 바비큐 테이블과 화로대, 의자가 포함되어 있다. 또 전통 소나무를 사용하는 불한증막과 물놀이장, 노천 족욕탕도 무료 이용이 가능하다.</div>
