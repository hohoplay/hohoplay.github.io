<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">만대항</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 태안군 이원면 내리 41-10</p>

<a href="https://map.kakao.com/link/map/%EB%A7%8C%EB%8C%80%ED%95%AD,36.9669647157,126.3048571329" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">태안 최북단의 항구로 알려진 만대항은 충남 태안군 이원면에 자리 잡고 있다. 비교적 조용하고 한적한 바다여행을 할 수 있다. 2004년 어촌정주어항으로 지정됐으며, 2010년에 지방 어항으로 지정됐다. 만대항에는 많은 낚시객들이 방문한다. 선착장에서 미끼를 던지면 망둑어를 비롯해 우럭, 노래미 등이 올라온다. 항에서 남쪽에는 사목 공원캠핑장, 학암포해수욕장, 구례포해수욕장이 있다. 인근에 회센터에서 맛있는 음식을 즐길 수 있다.</div>
