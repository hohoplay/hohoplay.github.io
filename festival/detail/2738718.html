<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 남양주의 몽골문화촌 가족쉼터 캠핑장은 남양주시에서 운영하는 캠핑장이다. 수동면에 위치한 수동천 좌우에 형성되었으며, 일반 야영장과 오토 캠핑장으로 구성되어 있다. 당일 이용과 숙박이 가능한 야영장이며 전기 이용이 가능하다. 수동계곡 바로 옆에 위치해 울창한 숲속에서 대자연의 신비로움을 만끽할 수 있다.</div>
