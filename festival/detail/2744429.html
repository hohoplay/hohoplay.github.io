<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">자연에 머물다는 화악산 기슭에 자리한 글램핑장으로 바로 앞 화악산 청수담계곡이 흐르고 있다. 여름철에는 계곡물놀이 및 가족휴양을 즐기고 가을철에는 형형색색의 오색단풍과 낙엽이 떨어지는 추경을 즐길 수 있는 곳이기도 하다. 겨울철에는 춘천호 인근에서 빙어낚시와 화천 산천어 축제를 즐길 수도 있는 곳이다.</div>
