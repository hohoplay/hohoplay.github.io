<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">침실습지</h1>
<p class="detail-row"><strong>주소</strong> 전남광주통합특별시 곡성군 오곡면 오지3길 5-1</p>

<a href="https://map.kakao.com/link/map/%EC%B9%A8%EC%8B%A4%EC%8A%B5%EC%A7%80,35.2696455752,127.3150333068" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">섬진강은 곡성천, 금천천, 고달천과 만나면서 거대한 습지를 이루는데 이것이 침실습지이다. 침실습지의 규모는 203만㎡에 이르며, 멸종 위기 야생동물 1급 수달, 2급 삵, 남생이, 흰꼬리수리 등 665종의 생물이 서식하는 것이 확인되었다. 이에 침실습지는 그 가치를 인정받아 제22호 국가습지 보호구역으로 지정되었다. 침실습지는 일교차가 큰 가을부터 봄까지 물안개가 피어올라 환성적인 분위기를 연출하여 출사지 명소로도 유명하다.</div>
