<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">오로저수지는 경북 구미시 장천면에 자리 잡고 있다. 여러 어종이 서식하고 있어 많은 낚시객이 방문했지만, 2021년 10월 낚시 금지 구역으로 지정됐다. 이 때문에 드라이브를 하거나 자전거를 타며 풍경을 감상하는 사람이 많다. 오로저수지는 군위 IC와 가깝고, 주변에 구미 CC, 문수 산림욕장이 위치해 있어 연계 관광에 나서기 수월하다.</div>
