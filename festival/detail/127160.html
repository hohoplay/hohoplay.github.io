<a href="https://map.kakao.com/link/map/%ED%95%98%EC%A0%80%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5%20%28%ED%95%98%EC%A0%80%EB%A6%AC%20%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5%29,36.3898346941,129.4079234165" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">하저해수욕장은 1㎞의 부드러운 백사장이 해안선을 따라 길게 이어져 있는 비교적 작은 동해안 해수욕장이다. 수심은 1.3m 안팎이고 경사가 완만하여 가족휴양지로서 아주 좋다. 가자미, 보리멸, 우럭 등이 잘 낚여서 바다낚시터로도 인기가 있으며 주변 펜션과 민박, 카페 등 편의시설이 갖추어져 있다. 주변 대게로 유명한 강구항과 어촌마을이 있어 해수욕 이외의 관광을 즐길 수 있다.</div>
