<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">별빛야영장</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 삼척시 가곡면 덕풍길 918</p>

<a href="https://map.kakao.com/link/map/%EB%B3%84%EB%B9%9B%EC%95%BC%EC%98%81%EC%9E%A5,37.1021462086,129.1793807210" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">별빛야영장은 삼척의 유명한 덕풍계곡에 위치한 캠핑장이다. 계곡은 물놀이는 물론 트레킹을 하기도 좋아 산악인들도 즐겨 찾는 명소이다. 태풍 피해 이후에 바닥 개선 작업 및 재배치로 한결 깔끔해진 모습이다. 총 34개의 사이트가 있고 대분은 파쇄석이고, 6개만 데크석이다. 계곡이 가깝고, 인근의 마을에서 운영하는 캠핑장과 달리 전기, 온수, 기본적인 샤워장이 제공되어서 자녀를 동반한 가족단위 캠핑장들이 선호한다.</div>
