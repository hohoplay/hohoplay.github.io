<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 가평군 설악면 방일리 지지밸리 캠핑장은 울창한 숲과 맑은 계곡이 흐르는 곳에 위치해 있다. 접근성이 좋아 사시사철 인기 있는 곳으로 캠핑장 뿐 아니라 펜션, 방갈로 같은 평상, 음식점, 매점까지 운영하고 있다. 단체 모임이나 워크숍이 가능하고 카라반도 진입할 수 있다. 사이트는 파쇄석이고 어린이 트램펄린도 갖춰 놓았다.</div>
