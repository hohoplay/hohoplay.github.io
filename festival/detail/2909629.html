<p class="detail-row"><strong>주소</strong> 경기도 가평군 장수로 156-20</p>

<a href="https://map.kakao.com/link/map/%EA%B0%80%ED%8F%89%20%EB%84%A4%EC%9E%8E%ED%81%B4%EB%A1%9C%EB%B2%84%20%EC%B9%B4%EB%9D%BC%EB%B0%98%20%EA%B8%80%EB%9E%A8%ED%95%91,37.6176301595,127.5086546484" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">가평 유명산 아래 방일리 설곡에 있다. 카라반과 글램핑 시설로만 구성되어 있는 리조트형 캠핑장이다. 카라반과 글램핑 모두 주방용품과 침대까지 갖춰져있어 캠핑 용품이 없어도 캠핑 분위기를 편하게 즐길 수 있다. 숙소 앞에는 얕은 계곡이 있어 아이들과 함께한 가족들은 물놀이를 하기에도 좋고, 가볍게 낚시를 즐기는 사람들도 만날 수 있다. 가까운 거리에 양떼목장 등 여행지가 있어 가족단위로 즐기기에 좋다.
