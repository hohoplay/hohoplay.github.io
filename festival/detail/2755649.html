<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">바누 글램핑</h1>
<p class="detail-row"><strong>주소</strong> 강원특별자치도 홍천군 북방면 노일로 30-2</p>

<a href="https://map.kakao.com/link/map/%EB%B0%94%EB%88%84%20%EA%B8%80%EB%9E%A8%ED%95%91,37.6745695617,127.7437760784" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">대명비발디파크에서 15분 떨어진 바누글램핑은 강원도 홍천군 북방면에 위치하고 있다. 아름다운 모양의 텐트를 단독으로 사용할 수 있다. 북유럽 감성의 아기자기한 건축작품인 텐트에 개별 바닥난방, 냉난방기, 실내화장실, 개별 마당과 바베큐장이 완비되어 있다. 단지 전체가 자연친화적으로 잔디로 조경되어 있어서 아이들이 맨발로도 뛰어놀수 있고, 바로 앞에는 노일강이 흐르고있어서 물놀이와 낚시가 가능하다.</div>
