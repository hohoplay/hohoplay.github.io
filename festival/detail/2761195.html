<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">바다의 별 관광농원</h1>
<p class="detail-row"><strong>주소</strong> 경기도 안산시 단원구 부흥로 359-43 (대부남동)</p>

<a href="https://map.kakao.com/link/map/%EB%B0%94%EB%8B%A4%EC%9D%98%20%EB%B3%84%20%EA%B4%80%EA%B4%91%EB%86%8D%EC%9B%90,37.2145358134,126.6114725710" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">바다의 별 관광농원은 안산 대부도에 위치한 캠핑장 겸 펜션이다. 관광농원과 곤충 체험관을 비롯 대형 수영장 2개와 바닷가 갯벌체험장까지 갖추고 있어 가족, 커플, 단체 등이 이용 가능하다. 캠핑장은 모두 40여 개이고, 파쇄석, 타프석, 데크석 종류가 다양하고 일부 구역은 바다 뷰로 인기가 높다. 다양한 체험 시설이 있어서 아이를 동반하고 방문하는 가족단위가 많고, 일몰, 해돋이 모두 감상 가능한 캠핑장이다.</div>
