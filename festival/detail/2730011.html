<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">캠프레이크</h1>
<p class="detail-row"><strong>주소</strong> 경기도 용인시 기흥구 동탄기흥로785번길 21-5 (고매동)</p>

<a href="https://map.kakao.com/link/map/%EC%BA%A0%ED%94%84%EB%A0%88%EC%9D%B4%ED%81%AC,37.2274096419,127.1000861837" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">경기도 용인 캠프레이크는 신갈저수지 변에 위치해 있는 전망 좋은 글램핑장이다. 기흥 IC, 한국민속촌에서 3분 거리에 있다. 캠핑장 어디에서나 저수지 전망을 즐길 수 있으며 패밀리 글램핑과 커플 글램핑, 글램하우스를 갖추고 있다. 패밀리글램핑과 글램하우스에는 에어컨이 설치되어 있지만 커플 글램핑에는 냉풍기가 있다. 캠핑장 내에 화장실, 샤워실, 개수대, 매점 등 편의시설이 잘 갖춰져 있어 이용에 불편이 없다.</div>
