<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">하솜캠프장은 경기도 일동 둔지저수지 안쪽 산속에 있다. 계단식으로 정리된 3개의 구역에 각각 사이트가 구성되어 있는데, 사이트 간 간격도 넓고 사이트 크기도 큰 편이다. 맨 아래 관리사무소 옆에 작은 매점과 화장실, 개수대가 있고 건물 옆에는 간이 수영장이 있다. A 구역은 소나무 아래 사이트가 있지만, B와 C 구역은 그늘이 적어 땡볕 사이트가 많다.</div>
