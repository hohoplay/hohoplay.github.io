<p class="detail-row"><strong>주소</strong> 전북특별자치도 정읍시 칠보면 수청리</p>

<a href="https://map.kakao.com/link/map/%EC%88%98%EC%B2%AD%EC%A0%80%EC%88%98%EC%A7%80,35.5546348479,126.9512887698" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">1986년에 저수지로 준공되어 저수지 바닥이 깨끗하고 상류에는 산림으로 조성되어 오염원이 전혀 없다. 깨끗한 공기, 물이 항상 풍부하게 있으며 짙푸른 아름다운 색깔의 저수지라 경치가 좋으며 길이 평탄하여 다니기가 좋은 곳이다. 이곳에서는 오염 없는 민물고기를 낚을 수 있다. 별도로 입장료는 없으며 자리를 잡아 편안하게 낚시를 즐길 수 있는 곳이다.</div>
