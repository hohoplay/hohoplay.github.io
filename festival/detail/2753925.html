<h1 style="font-size:1.4rem;font-weight:900;margin-bottom:6px">만리포항</h1>
<p class="detail-row"><strong>주소</strong> 충청남도 태안군 소원면 모항리</p>

<a href="https://map.kakao.com/link/map/%EB%A7%8C%EB%A6%AC%ED%8F%AC%ED%95%AD,36.7861493646,126.1340079849" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">만리포항은 태안군 만리포해수욕장 바로 옆에 위치해 있다. 만리포 해수욕장은 고운 모래로 질이 양호하고 경사가 완만하고 수심이 얕아 가족단위의 해수욕장으로 사랑받아 많은 관광객이 찾아오는 곳으로 만리포항도 명소가 되었다. 이곳은 1972년 지방어항으로 지정되었으며 항구에서는 빨간 등대를 배경으로 사진을 찍는 사람이 많다. 또한, 만리포항에서 낚시객들을 볼 수 있다. 대개 붕장어를 비롯해 광어, 도다리, 볼락, 노래미가 올라온다.</div>
