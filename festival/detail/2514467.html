<a href="https://map.kakao.com/link/map/%EC%8B%AD%EB%A6%AC%EB%B2%9A%EA%BD%83%EA%B8%B8,35.2000061238,127.6304656321" target="_blank" rel="noopener" class="detail-link">지도에서 보기 →</a>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">화개에서 쌍계사에 이르는 십리벚꽃길은 흐드러진 벚꽃을 감상하기 위해 많은 이들이 찾는 하동의 명소이다. 
이 길을 사랑하는 청춘 남녀가 두 손을 꼭 잡고 걸으면 백년해로한다고 하여 ‘혼례길’이라고도 한다. 데크구간에는 고보조명이 설치되어 있어 색다른 재미를 더하고 벚꽃과 하동 야생차밭이 만나면 누가 찍어도 인생 샷을 건질 수 있다.</div>
