<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#334155">쇠꼴마을고고펜션은 파주시 법원읍 금곡리에 있다. 펜션뿐만 아니라 캠핑장도 함께 운영하고 있다. 다양한 레저 활동을 즐길 수 있는 종합 시설이다. 잘 관리된 수영장을 보유하고 있다. 규모는 크지 않지만, 깔끔하고 안전하게 관리되어 있어 가족들이 즐기기에 좋다. 옆으로는 평상과 테이블 등 여러 시설이 잘 갖추어져 있다.</div>
