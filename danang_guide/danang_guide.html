<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리치 부티크 호텔 다낭 - 주변 맛집 & 명소 가이드 지도</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js Map CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Map Marker Pulsing Animation for Hotel */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .hotel-pulse {
            position: absolute;
            width: 44px;
            height: 44px;
            background-color: rgba(245, 158, 11, 0.4);
            border-radius: 50%;
            animation: pulse-ring 2s infinite ease-in-out;
            top: -2px;
            left: -2px;
            z-index: -1;
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 12px 14px;
            line-height: 1.5;
        }

        .map-container-transition {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- OFFLINE STATUS BANNER -->
    <div id="offlineBanner" class="hidden fixed top-0 inset-x-0 z-[3000] bg-amber-500 text-white text-[11px] sm:text-xs font-bold text-center py-1.5 shadow-md">
        <i class="fa-solid fa-wifi"></i> 오프라인 상태입니다 — 이전에 불러온 지역의 지도/이미지만 표시될 수 있어요.
    </div>

    <!-- SIDEBAR PANEL -->
    <aside id="sidebarPanel" class="w-full md:w-[420px] lg:w-[460px] h-full bg-white flex flex-col z-20 shadow-xl border-r border-slate-200 min-h-0 flex-1 md:flex-initial">
        
        <!-- Header -->
        <header class="p-3.5 bg-gradient-to-r from-indigo-700 to-blue-600 text-white shadow-md flex-shrink-0">
            <div class="flex items-center justify-between mb-1">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/20 text-white backdrop-blur-sm">
                    <i class="fa-solid fa-hotel text-amber-300"></i> 기준점: 리치 부티크 호텔
                </span>
                
                <!-- Registration Button (+ 장소 등록) -->
                <button onclick="openAddModal()" class="px-2.5 py-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-plus text-xs"></i> 장소 등록
                </button>
            </div>
            
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-bold tracking-tight">다낭 여행 맞춤 가이드 지도</h1>
                    <p class="text-[11px] text-blue-100">호텔 주변 맛집, 야시장, 용다리, ATM 위치 모음</p>
                </div>
            </div>
            
            <!-- Major Zone Navigation Tabs -->
            <div class="mt-3">
                <p class="text-[10px] font-semibold text-blue-200 mb-1.5 flex items-center gap-1">
                    <i class="fa-solid fa-map-location-dot text-amber-300"></i> 주요 관광 구역 Quick 탭
                </p>
                <div class="grid grid-cols-4 gap-1 bg-blue-900/40 p-1 rounded-xl backdrop-blur-xs text-xs font-bold text-center">
                    <button id="tab-all" onclick="setZoneTab('all')" class="zone-tab-btn active py-1.5 px-1 rounded-lg transition bg-white text-indigo-900 shadow-sm">
                        전체/호텔
                    </button>
                    <button id="tab-bana" onclick="setZoneTab('bana')" class="zone-tab-btn py-1.5 px-1 rounded-lg transition text-white hover:bg-white/10 flex flex-col sm:flex-row items-center justify-center gap-0.5">
                        <span>🏰</span><span>바나힐</span>
                    </button>
                    <button id="tab-marble" onclick="setZoneTab('marble')" class="zone-tab-btn py-1.5 px-1 rounded-lg transition text-white hover:bg-white/10 flex flex-col sm:flex-row items-center justify-center gap-0.5">
                        <span>⛰️</span><span>오행산</span>
                    </button>
                    <button id="tab-dragon" onclick="setZoneTab('dragon')" class="zone-tab-btn py-1.5 px-1 rounded-lg transition text-white hover:bg-white/10 flex flex-col sm:flex-row items-center justify-center gap-0.5">
                        <span>🐉</span><span>용다리</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Zone Info Banner (Dynamic per Tab) -->
        <div id="zoneInfoBanner" class="hidden px-3 py-2 bg-indigo-50 border-b border-indigo-100 text-xs text-indigo-900 flex items-start gap-2">
            <i id="zoneBannerIcon" class="fa-solid fa-circle-info text-indigo-600 mt-0.5 text-sm"></i>
            <div id="zoneBannerText" class="flex-1 text-[11px] leading-tight">
                <!-- Dynamic text populated by JS -->
            </div>
        </div>

        <!-- Search & Filter Area -->
        <div class="p-2.5 bg-slate-50 border-b border-slate-200 flex-shrink-0 space-y-2">
            <!-- Search Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="filterPlaces()" placeholder="장소명, 음식, 키워드 검색 (예: 불쇼, BBQ, ATM)..." 
                       class="w-full pl-8 pr-8 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                <button onclick="clearSearch()" id="clearBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Category Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                <button onclick="setCategory('all')" class="cat-btn active px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-slate-800 text-white shadow-xs transition" data-cat="all">전체</button>
                <button onclick="setCategory('food')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="food"><i class="fa-solid fa-utensils text-rose-500 mr-1"></i>맛집</button>
                <button onclick="setCategory('spot')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="spot"><i class="fa-solid fa-camera text-indigo-500 mr-1"></i>명소/밤문화</button>
                <button onclick="setCategory('spa')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="spa"><i class="fa-solid fa-spa text-emerald-500 mr-1"></i>스파/마사지</button>
                <button onclick="setCategory('atm')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="atm"><i class="fa-solid fa-credit-card text-blue-500 mr-1"></i>ATM/은행</button>
            </div>
        </div>

        <!-- Place List Container -->
        <div id="placeList" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- Places loaded via JavaScript -->
        </div>

        <!-- Footer Info -->
        <footer class="p-2.5 bg-slate-100 text-slate-500 text-[11px] border-t border-slate-200 flex-shrink-0 flex justify-between items-center px-4">
            <button onclick="toggleMap(true)" class="md:hidden text-indigo-600 font-bold bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-200 flex items-center gap-1">
                <i class="fa-solid fa-map-location-dot"></i> 지도 펼치기
            </button>
            <span class="hidden sm:inline"><i class="fa-solid fa-map text-indigo-500"></i> 장소 클릭 시 경로 표시</span>
            <button onclick="resetMapView()" class="text-indigo-600 font-semibold hover:underline ml-auto">
                <i class="fa-solid fa-rotate-left"></i> 전체보기
            </button>
        </footer>
    </aside>

    <!-- MAP CONTAINER -->
    <main id="mapContainer" class="map-container-transition fixed md:relative inset-0 md:inset-auto w-full md:w-auto flex-1 h-full z-10 bg-slate-200 block">
        <div id="map" class="w-full h-full"></div>

        <!-- FLOATING CLOSE / MINIMIZE BUTTON FOR MAP (Mobile) -->
        <button onclick="toggleMap(false)" id="closeMapBtn" 
                class="md:hidden absolute top-4 right-4 z-[600] bg-slate-900/90 hover:bg-slate-900 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xl border border-white/20 flex items-center gap-2 transition transform active:scale-95">
            <i class="fa-solid fa-xmark text-sm text-rose-400"></i>
            <span>지도 닫기</span>
        </button>

        <!-- Map Floating Legend -->
        <div class="absolute bottom-4 right-4 z-[500] bg-white/90 backdrop-blur-md px-3 py-2.5 rounded-xl shadow-lg border border-slate-200 text-xs hidden sm:block">
            <div class="font-bold text-slate-700 mb-1.5 flex items-center gap-1">
                <i class="fa-solid fa-layer-group text-indigo-600"></i> 범례 안내
            </div>
            <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-[11px] text-slate-600">
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 숙소 (리치부티크)</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> 맛집/식당</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span> 명소/볼거리</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 스파/마사지</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 수수료 무료/ATM</span>
            </div>
        </div>
    </main>

    <!-- ADD PLACE MODAL -->
    <div id="addPlaceModal" class="hidden fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[92vh]">
            <div class="bg-indigo-600 text-white px-5 py-3.5 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-amber-300"></i> 나만의 장소 추가 등록
                </h3>
                <button onclick="closeAddModal()" class="text-white/80 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="addPlaceForm" onsubmit="handleSavePlace(event)" class="p-4 space-y-3 overflow-y-auto flex-1 text-xs">
                
                <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-indigo-900 flex items-center gap-1">
                            <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> 간편 위치 입력 도구
                        </span>
                        <a href="https://maps.google.com" target="_blank" class="text-[10px] text-slate-500 hover:text-indigo-600 underline flex items-center gap-0.5">
                            <i class="fa-solid fa-up-right-from-square"></i> 구글 지도 열기
                        </a>
                    </div>

                    <!-- GPS Fetch Button -->
                    <button type="button" id="gpsFetchBtn" onclick="fetchCurrentLocation()" 
                            class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-xs transition flex items-center justify-center gap-1.5 active:scale-98">
                        <i class="fa-solid fa-location-crosshairs text-sm"></i>
                        <span>📍 내 현재 위치(GPS) 좌표 자동 등록</span>
                    </button>

                    <!-- Address/Keyword Search Input -->
                    <div class="flex gap-1.5 pt-1">
                        <input type="text" id="newPlaceAddressInput" placeholder="주소 또는 장소명 입력 (예: 미케비치, Nguyen Van Thoai)" 
                               class="flex-1 px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <button type="button" id="addrSearchBtn" onclick="searchAddressGeocode()" 
                                class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition shrink-0">
                            <i class="fa-solid fa-magnifying-glass"></i> 검색
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">장소명 *</label>
                    <input type="text" id="newPlaceName" required placeholder="예: 다낭 로컬 쌀국수, 추천 카페..." 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">카테고리 *</label>
                        <select id="newPlaceCat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="food">🍽️ 맛집/식당</option>
                            <option value="spot">📸 명소/밤문화</option>
                            <option value="spa">🌿 스파/마사지</option>
                            <option value="atm">💳 ATM/은행</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">거리 / 이동시간</label>
                        <input type="text" id="newPlaceDist" placeholder="예: 도보 5분, 차량 10분" 
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Coordinates Picker Block -->
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label class="font-semibold text-slate-700">위치 좌표 (위도/경도) *</label>
                        <button type="button" onclick="setPickerMode()" class="text-[11px] text-indigo-600 font-bold hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-hand-pointer"></i> 지도에서 직접 선택
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="any" id="newPlaceLat" required placeholder="위도 (Lat)" 
                               class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-[11px]">
                        <input type="number" step="any" id="newPlaceLng" required placeholder="경도 (Lng)" 
                               class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-[11px]">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">간단한 설명 / 주소 메모</label>
                    <input type="text" id="newPlaceDesc" placeholder="예: 현지인 추천 쌀국수 전문점" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">추천 팁 & 메모</label>
                    <textarea id="newPlaceTips" rows="2" placeholder="예: 소고기 쌀국수 추천, 에어컨 없음..." 
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">태그 (쉼표로 구분)</label>
                    <input type="text" id="newPlaceTags" placeholder="쌀국수, 가성비, 로컬" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="pt-2 flex items-center gap-2">
                    <button type="button" onclick="closeAddModal()" class="w-1/3 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition">
                        취소
                    </button>
                    <button type="submit" class="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-1 active:scale-98">
                        <i class="fa-solid fa-check"></i> 장소 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>

        function updateOnlineStatus() {
            const banner = document.getElementById('offlineBanner');
            if (!banner) return;
            if (navigator.onLine) {
                banner.classList.add('hidden');
            } else {
                banner.classList.remove('hidden');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        if ('serviceWorker' in navigator) {

                        <div class="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center shadow-lg border-2 border-white text-base">
                            <i class="fa-solid fa-hotel"></i>
                        </div>
                    </div>
                `,
                className: 'hotel-pin',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            const hotelMarker = L.marker([HOTEL.lat, HOTEL.lng], { icon: hotelIcon }).addTo(map);
            hotelMarker.bindPopup(`
                <div class="text-xs">
                    <b class="text-amber-600 text-sm flex items-center gap-1"><i class="fa-solid fa-hotel"></i> ${HOTEL.name}</b>
                    <p class="text-slate-600 mt-1 font-medium">${HOTEL.desc}</p>
                    <p class="text-slate-500 text-[11px] mt-0.5">${HOTEL.details}</p>
                </div>
            `);

            // Map Click event for Coordinate Picker
            map.on('click', function(e) {
                if (pickerModeActive) {
                    const lat = e.latlng.lat.toFixed(6);
                    const lng = e.latlng.lng.toFixed(6);

                    document.getElementById('newPlaceLat').value = lat;
                    document.getElementById('newPlaceLng').value = lng;

                    pickerModeActive = false;
                    map.getContainer().style.cursor = '';
                    openAddModal();
                    showToast(`📍 지도 클릭 위치 좌표 (${lat}, ${lng})가 자동 입력되었습니다.`);
                }
            });

            // Load Places and Render
            loadPlaces();
            renderPlaces();

            // Resize map tile fix
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }

        function loadPlaces() {
            let saved = localStorage.getItem('danang_custom_places');
            let customPlaces = [];
            if (saved) {
                try {
                    customPlaces = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to parse custom places from LocalStorage", e);
                }
            }
            PLACES = [...INITIAL_PLACES, ...customPlaces];
        }

        function saveCustomPlacesToStorage(customPlaces) {
            localStorage.setItem('danang_custom_places', JSON.stringify(customPlaces));
        }

        function setZoneTab(zone) {
            activeZone = zone;

            // Update Tab UI
            document.querySelectorAll('.zone-tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
                btn.classList.add('text-white', 'hover:bg-white/10');
            });
            const activeBtn = document.getElementById(`tab-${zone}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
                activeBtn.classList.remove('text-white', 'hover:bg-white/10');
            }

            // Update Banner Info
            const banner = document.getElementById('zoneInfoBanner');
            const bannerIcon = document.getElementById('zoneBannerIcon');
            const bannerText = document.getElementById('zoneBannerText');

            if (zone === 'bana') {
                banner.classList.remove('hidden');
                bannerIcon.className = 'fa-solid fa-mountain-sun text-indigo-600 mt-0.5 text-sm';
                bannerText.innerHTML = '<b>🏰 바나힐 코스:</b> 숙소에서 차량 45분 (약 25km). 아침 8시 이전 출발 추천! <br><b>추천 순서:</b> 케이블카 ➔ 골든브릿지 ➔ 프렌치빌리지 ➔ 아라팡 뷔페';
            } else if (zone === 'marble') {
                banner.classList.remove('hidden');
                bannerIcon.className = 'fa-solid fa-gopuram text-indigo-600 mt-0.5 text-sm';
                bannerText.innerHTML = '<b>⛰️ 오행산 코스:</b> 숙소에서 차량 15분 (약 8.5km). 편한 신발 준비!<br><b>추천 순서:</b> 오행산 엘리베이터 ➔ 음부동 동굴 ➔ LÁ 레스토랑 식사';
            } else if (zone === 'dragon') {
                banner.classList.remove('hidden');
                bannerIcon.className = 'fa-solid fa-dragon text-amber-600 mt-0.5 text-sm';
                bannerText.innerHTML = '<b>🐉 용다리/야시장 코스:</b> 숙소에서 차량 6분 (약 2.5km).<br><b>금·토·일 야간:</b> VPBank 수수료 무료 출금 ➔ 손짜 야시장 ➔ 밤 9시 용다리 불쇼';
            } else {
                banner.classList.add('hidden');
            }

            renderPlaces();

            // Zoom map to fit zone items
            if (activePolyline) {
                map.removeLayer(activePolyline);
                activePolyline = null;
            }

            const visibleCoords = [];
            if (zone === 'all') {
                // "전체/호텔" 탭은 리스트는 전체를 다 보여주되, 지도는 기준점인 호텔 위치로 되돌림
                // (손짜반도/하이반 관문처럼 멀리 있는 곳까지 다 맞추려고 지도를 확 줄여버리지 않도록)
                if (map) {
                    map.flyTo([HOTEL.lat, HOTEL.lng], 14, { duration: 1.2 });
                }
                return;
            } else if (zone === 'hotel') {
                visibleCoords.push([HOTEL.lat, HOTEL.lng]);
                PLACES.filter(p => (p.zone === 'hotel' || !p.zone)).forEach(p => visibleCoords.push([p.lat, p.lng]));
            } else {
                visibleCoords.push([HOTEL.lat, HOTEL.lng]);
                PLACES.filter(p => p.zone === zone).forEach(p => visibleCoords.push([p.lat, p.lng]));
            }

            if (visibleCoords.length > 0 && map) {
                map.flyToBounds(visibleCoords, { padding: [50, 50], maxZoom: zone === 'bana' ? 12 : 14, duration: 1.2 });
            }
        }

        function renderPlaces() {
            const listEl = document.getElementById('placeList');
            listEl.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

            PLACES.forEach(place => {
                const matchesZone = (activeZone === 'all') || 
                                    (activeZone === 'hotel' && (place.zone === 'hotel' || !place.zone)) ||
                                    (place.zone === activeZone);

                const matchesCat = (activeCategory === 'all' || place.category === activeCategory);
                const matchesSearch = !searchTerm || 
                    place.name.toLowerCase().includes(searchTerm) || 
                    place.desc.toLowerCase().includes(searchTerm) ||
                    (place.tips && place.tips.toLowerCase().includes(searchTerm)) ||
                    (place.tags && place.tags.some(t => t.toLowerCase().includes(searchTerm)));

                if (matchesZone && matchesCat && matchesSearch) {
                    if (!markers[place.id]) {
                        const iconHtml = `
                            <div class="flex items-center justify-center w-8 h-8 rounded-full shadow-md border-2 border-white text-white font-bold text-xs transform hover:scale-110 transition" style="background-color: ${place.color}">
                                <i class="fa-solid ${place.icon}"></i>
                            </div>
                        `;
                        const customIcon = L.divIcon({
                            html: iconHtml,
                            className: 'custom-place-pin',
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(map);
                        
                        const popupHtml = `
                            <div class="text-xs min-w-[200px]">
                                <div class="font-bold text-slate-800 text-sm flex items-center gap-1.5" style="color: ${place.color}">
                                    <i class="fa-solid ${place.icon}"></i> ${place.name}
                                </div>
                                <div class="text-[11px] text-slate-500 font-semibold mt-0.5">
                                    <i class="fa-solid fa-person-walking text-slate-400"></i> ${place.distanceText || '호텔 근처'}
                                </div>
                                <p class="text-slate-600 mt-1.5 leading-tight">${place.desc || ''}</p>
                                ${place.tips ? `<div class="mt-2 p-1.5 bg-slate-50 text-slate-700 text-[11px] rounded border border-slate-200"><b>💡 팁:</b> ${place.tips}</div>` : ''}
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.googleQuery || place.name)}" target="_blank" 
                                   class="mt-2.5 block text-center py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded text-[11px]">
                                   <i class="fa-solid fa-arrow-up-right-from-square"></i> 구글 지도에서 열기
                                </a>
                            </div>
                        `;
                        marker.bindPopup(popupHtml);
                        
                        marker.on('click', () => {
                            selectPlace(place.id, false);
                        });

                        markers[place.id] = marker;
                    } else {
                        if (!map.hasLayer(markers[place.id])) {
                            map.addLayer(markers[place.id]);
                        }
                    }

                    listEl.appendChild(createPlaceCard(place));
                } else {
                    if (markers[place.id] && map.hasLayer(markers[place.id])) {
                        map.removeLayer(markers[place.id]);
                    }
                }
            });

            if (listEl.children.length === 0) {
                listEl.innerHTML = `
                    <div class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2"></i>
                        <p class="text-xs font-medium">선택한 탭/검색 조건에 맞는 장소가 없습니다.</p>
                    </div>
                `;
            }
        }

        function createPlaceCard(place) {
            const card = document.createElement('div');
            card.id = `card_${place.id}`;
            card.className = "p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl shadow-xs transition cursor-pointer group hover:border-indigo-300 relative";
            card.onclick = () => {
                selectPlace(place.id, true);
                if (window.innerWidth < 768) {
                    toggleMap(true);
                }
            };

            const tagsHtml = (place.tags || []).map(tag => 
                `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-medium">#${tag}</span>`
            ).join(' ');

            const isCustom = place.isCustom;

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-xs font-bold shrink-0" style="background-color: ${place.color}">
                            <i class="fa-solid ${place.icon}"></i>
                        </span>
                        <div>
                            <h3 class="font-bold text-xs text-slate-800 group-hover:text-indigo-600 transition flex items-center gap-1">
                                ${place.name}
                                ${isCustom ? '<span class="text-[9px] bg-emerald-100 text-emerald-700 px-1 rounded font-normal">직접 추가</span>' : ''}
                            </h3>
                            <span class="text-[11px] text-slate-500 font-medium"><i class="fa-solid fa-route text-slate-400"></i> ${place.distanceText || '거리 정보 없음'}</span>
                        </div>
                    </div>
                    ${isCustom ? `
                        <button onclick="deleteCustomPlace('${place.id}', event)" class="text-slate-300 hover:text-rose-500 p-1" title="삭제">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    ` : ''}
                </div>
                ${place.desc ? `<p class="text-xs text-slate-600 mt-1.5 line-clamp-2 leading-relaxed">${place.desc}</p>` : ''}
                ${place.tips ? `
                    <div class="mt-2 text-[11px] text-amber-800 bg-amber-50/70 p-1.5 rounded border border-amber-200/60">
                        <i class="fa-solid fa-lightbulb text-amber-500"></i> ${place.tips}
                    </div>
                ` : ''}
                <div class="mt-2 flex items-center justify-between pt-1 border-t border-slate-100">
                    <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.googleQuery || place.name)}" target="_blank" onclick="event.stopPropagation()"
                       class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                        구글지도 길찾기 <i class="fa-solid fa-chevron-right text-[9px]"></i>
                    </a>
                </div>
            `;
            return card;
        }

        function selectPlace(placeId, zoomTo = true) {
            const place = PLACES.find(p => p.id === placeId);
            if (!place) return;

            document.querySelectorAll('#placeList > div').forEach(c => {
                c.classList.remove('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
            });
            const activeCard = document.getElementById(`card_${placeId}`);
            if (activeCard) {
                activeCard.classList.add('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (activePolyline) {
                map.removeLayer(activePolyline);
            }
            activePolyline = L.polyline([
                [HOTEL.lat, HOTEL.lng],
                [place.lat, place.lng]
            ], {
                color: '#6366f1',
                weight: 4,
                opacity: 0.8,
                dashArray: '8, 8'
            }).addTo(map);

            if (markers[placeId]) {
                const marker = markers[placeId];
                if (zoomTo) {
                    map.flyToBounds([
                        [HOTEL.lat, HOTEL.lng],
                        [place.lat, place.lng]
                    ], { padding: [50, 50], maxZoom: 16, duration: 1 });
                }
                setTimeout(() => {
                    marker.openPopup();
                }, 400);
            }
        }

        function fetchCurrentLocation() {
            if (!navigator.geolocation) {
                showToast('⚠️ 이 브라우저는 GPS 위치 정보를 지원하지 않습니다.');
                return;
            }

            const btn = document.getElementById('gpsFetchBtn');
            const origContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 위치 탐색 중...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);

                    document.getElementById('newPlaceLat').value = lat;
                    document.getElementById('newPlaceLng').value = lng;

                    btn.innerHTML = origContent;
                    btn.disabled = false;
                    showToast('📍 현재 위치 좌표가 자동으로 입력되었습니다!');
                },
                (error) => {
                    btn.innerHTML = origContent;
                    btn.disabled = false;
                    showToast('⚠️ 위치 권한이 거부되었거나 GPS 정보를 가져오지 못했습니다.');
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        async function searchAddressGeocode() {
            const query = document.getElementById('newPlaceAddressInput').value.trim();
            if (!query) {
                showToast('⚠️ 검색할 주소나 장소명을 입력해주세요.');
                return;
            }

            // 짧은 시간 내 연속 요청 방지 (Nominatim 무료 API 요청 제한 대응)
            const now = Date.now();
            const elapsed = now - lastGeocodeRequestTime;
            if (elapsed < GEOCODE_COOLDOWN_MS) {
                showToast(`⏳ 잠시만요! ${Math.ceil((GEOCODE_COOLDOWN_MS - elapsed) / 1000)}초 후 다시 검색해주세요.`);
                return;
            }
            lastGeocodeRequestTime = now;

            const searchBtn = document.getElementById('addrSearchBtn');
            const origContent = searchBtn.innerHTML;
            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            searchBtn.disabled = true;

            try {
                const searchQuery = query.toLowerCase().includes('danang') || query.toLowerCase().includes('da nang') 
                    ? query 
                    : `${query}, Da Nang, Vietnam`;

                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1`);

                if (response.status === 429) {
                    showToast('⚠️ 검색 요청이 너무 많습니다. 잠시 후(약 10~20초) 다시 시도해주세요.');
                    return;
                }
                if (!response.ok) {
                    showToast('⚠️ 주소 검색 서비스에 일시적인 문제가 있습니다. 잠시 후 다시 시도해주세요.');
                    return;
                }

                const results = await response.json();

                if (results && results.length > 0) {
                    const place = results[0];
                    const lat = parseFloat(place.lat).toFixed(6);
                    const lng = parseFloat(place.lon).toFixed(6);

                    document.getElementById('newPlaceLat').value = lat;
                    document.getElementById('newPlaceLng').value = lng;

                    const nameInput = document.getElementById('newPlaceName');
                    if (!nameInput.value) {
                        nameInput.value = query;
                    }

                    const descInput = document.getElementById('newPlaceDesc');
                    if (!descInput.value) {
                        descInput.value = place.display_name.split(',').slice(0, 3).join(',');
                    }

                    showToast('✅ 주소 검색 성공! 좌표가 자동으로 설정되었습니다.');
                } else {
                    showToast('⚠️ 주소를 찾을 수 없습니다. 다낭 현지 주소나 장소명으로 시도해보세요.');
                }
            } catch (err) {
                if (!navigator.onLine) {
                    showToast('⚠️ 오프라인 상태에서는 주소 검색을 사용할 수 없어요. GPS 버튼이나 지도 클릭으로 좌표를 입력해주세요.');
                } else {
                    showToast('⚠️ 주소 검색 중 네트워크 오류가 발생했습니다.');
                }
            } finally {
                searchBtn.innerHTML = origContent;
                searchBtn.disabled = false;
            }
        }

        function openAddModal() {
            document.getElementById('addPlaceModal').classList.remove('hidden');
            if (!document.getElementById('newPlaceLat').value) {
                document.getElementById('newPlaceLat').value = 16.0520;
                document.getElementById('newPlaceLng').value = 108.2430;
            }
        }

        function closeAddModal() {
            document.getElementById('addPlaceModal').classList.add('hidden');
        }

        function setPickerMode() {
            pickerModeActive = true;
            closeAddModal();
            toggleMap(true);
            map.getContainer().style.cursor = 'crosshair';
            
            showToast('📌 지도의 원하는 위치를 클릭하면 좌표가 자동 선택됩니다!');
        }

        function handleSavePlace(e) {
            e.preventDefault();

            const name = document.getElementById('newPlaceName').value.trim();
            const cat = document.getElementById('newPlaceCat').value;
            const dist = document.getElementById('newPlaceDist').value.trim();
            const lat = parseFloat(document.getElementById('newPlaceLat').value);
            const lng = parseFloat(document.getElementById('newPlaceLng').value);
            const desc = document.getElementById('newPlaceDesc').value.trim();
            const tips = document.getElementById('newPlaceTips').value.trim();
            const tagsRaw = document.getElementById('newPlaceTags').value.trim();

            if (!name || isNaN(lat) || isNaN(lng)) {
                showToast('⚠️ 장소명과 유효한 좌표(위도/경도)를 입력해주세요.');
                return;
            }

            const catConfig = {
                food: { icon: 'fa-utensils', color: '#f43f5e' },
                spot: { icon: 'fa-camera', color: '#4f46e5' },
                spa: { icon: 'fa-spa', color: '#10b981' },
                atm: { icon: 'fa-credit-card', color: '#2563eb' }
            };

            const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()) : ['나의추가장소'];

            const newPlace = {
                id: 'custom_' + Date.now(),
                name: name,
                category: cat,
                lat: lat,
                lng: lng,
                distanceText: dist || '직접 지정 위치',
                icon: catConfig[cat].icon,
                color: catConfig[cat].color,
                tags: tags,
                desc: desc || '사용자가 직접 등록한 장소입니다.',
                tips: tips || '',
                googleQuery: `${name} Danang`,
                isCustom: true
            };

            PLACES.push(newPlace);

            const customPlacesOnly = PLACES.filter(p => p.isCustom);
            saveCustomPlacesToStorage(customPlacesOnly);

            renderPlaces();
            closeAddModal();
            document.getElementById('addPlaceForm').reset();

            showToast(`🎉 "${name}" 장소가 성공적으로 추가되었습니다!`);

            selectPlace(newPlace.id, true);
        }

        function deleteCustomPlace(id, event) {
            event.stopPropagation();
            if (confirm('이 추가 장소를 삭제하시겠습니까?')) {
                if (markers[id] && map.hasLayer(markers[id])) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
                PLACES = PLACES.filter(p => p.id !== id);
                const customPlacesOnly = PLACES.filter(p => p.isCustom);
                saveCustomPlacesToStorage(customPlacesOnly);
                renderPlaces();
                showToast('🗑️ 장소가 삭제되었습니다.');
            }
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.classList.add('bg-slate-800', 'text-white');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border');
                } else {
                    btn.classList.remove('bg-slate-800', 'text-white');
                    btn.classList.add('bg-white', 'text-slate-600', 'border');
                }
            });
            renderPlaces();
        }

        function filterPlaces() {
            const val = document.getElementById('searchInput').value;
            const clearBtn = document.getElementById('clearBtn');
            if (val) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            // 디바운스: 타이핑이 멈춘 뒤 250ms 후에만 실제 필터링/렌더링 실행
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                renderPlaces();
            }, 250);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            clearTimeout(searchDebounceTimer);
            document.getElementById('clearBtn').classList.add('hidden');
            renderPlaces();
        }

        function toggleMap(show) {
            const mapContainer = document.getElementById('mapContainer');
            const sidebarPanel = document.getElementById('sidebarPanel');
            const isMobile = window.innerWidth < 768;

            if (show) {
                mapContainer.classList.remove('hidden');
                mapContainer.classList.add('block');
                // 좁은 화면(모바일)에서는 지도가 사이드바 뒤에 깔려 안 보이므로,
                // 지도를 펼칠 때 리스트를 실제로 숨겨서 지도가 화면에 드러나게 함
                if (isMobile && sidebarPanel) {
                    sidebarPanel.style.display = 'none';
                }
            } else {
                mapContainer.classList.add('hidden');
                mapContainer.classList.remove('block');
                if (sidebarPanel) {
                    sidebarPanel.style.display = '';
                }
            }
            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 200);
        }

        // 좁은 화면에서 지도를 보다가 창 크기가 데스크톱 폭으로 바뀌면
        // 숨겨뒀던 리스트를 강제로 복원(양쪽 다 보이는 원래 레이아웃으로)
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                const sidebarPanel = document.getElementById('sidebarPanel');
                if (sidebarPanel) sidebarPanel.style.display = '';
            }
        });

        function resetMapView() {
            activeZone = 'all';

            // 탭 UI를 "전체/호텔"로 되돌림
            document.querySelectorAll('.zone-tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
                btn.classList.add('text-white', 'hover:bg-white/10');
            });
            const activeTabBtn = document.getElementById('tab-all');
            if (activeTabBtn) {
                activeTabBtn.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
                activeTabBtn.classList.remove('text-white', 'hover:bg-white/10');
            }
            const banner = document.getElementById('zoneInfoBanner');
            if (banner) banner.classList.add('hidden');

            renderPlaces();

            if (activePolyline) {
                map.removeLayer(activePolyline);
                activePolyline = null;
            }
            document.querySelectorAll('#placeList > div').forEach(c => {
                c.classList.remove('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
            });

            // "전체보기"는 탭과 달리, 문자 그대로 등록된 모든 장소(멀리 있는 손짜반도/하이반 관문 포함)가
            // 화면 안에 다 들어오도록 범위를 맞춤
            if (map) {
                const allCoords = [[HOTEL.lat, HOTEL.lng], ...PLACES.map(p => [p.lat, p.lng])];
                map.flyToBounds(allCoords, { padding: [50, 50], duration: 1.2 });
            }

            // 모바일 화면에서는 지도가 리스트 뒤에 가려져 있으므로, 전체보기를 누르면 지도를 바로 펼쳐서 보여줌
            if (window.innerWidth < 768) {
                toggleMap(true);
            }
        }

        function showToast(msg) {
            const existing = document.getElementById('appToast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'appToast';
            toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-[2000] bg-slate-900/90 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl flex items-center gap-2 border border-white/20 transition backdrop-blur-md';
            toast.innerHTML = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast) toast.remove();
            }, 3500);
        }
    </script>
</body>
</html>
