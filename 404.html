<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 - hohoplay</title>
<script>
// 404 리디렉션 맵
const REDIRECT_MAP = {
  '/guides/dice-roll-guide.html':        '/guides/minigames-guide.html',
  '/guides/card-matching-guide.html':    '/guides/hoho-tile-match-guide.html'
};

(function() {
  var path = window.location.pathname;
  // hohoplaylab.com 기준 경로 정규화
  var target = REDIRECT_MAP[path];
  if (target) {
    window.location.replace(target);
  }
})();
</script>

  body { background:#0f172a; color:#94a3b8; font-family:sans-serif;
         display:flex; align-items:center; justify-content:center;

</style>
</head>

  </div>
</body>
</html>
