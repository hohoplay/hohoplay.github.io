name: Add TOC Remote

# 상세페이지·코스 글에 '목차 리모컨' 스크립트 태그를 넣는 1회성 작업입니다(festival/toc-remote.js 가 먼저 올라가 있어야 함).
# 여러 번 실행해도 결과는 같습니다. 수동 실행(workflow_dispatch)만 가능합니다.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  add-toc-remote:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 목차 리모컨 태그 추가
        run: python3 scripts/add_toc_remote.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add festival/detail/ blog/kids-course/
          if git diff --cached --quiet; then
            echo "변경된 내용이 없습니다 — 커밋하지 않습니다."
          else
            git commit -m "feat: 상세페이지·코스 글에 목차 리모컨 추가"
            git pull --rebase
            git push
          fi
