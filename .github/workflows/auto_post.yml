name: 🌟 Daily Fortune Posts

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 KST 00:00 (UTC 15:00) — 메인
    - cron: '0 16 * * *'   # 매일 KST 01:00 (UTC 16:00) — 백업 (메인 스킵 시)
  workflow_dispatch:        # 수동 실행 (아래 칸은 테스트·수동 발행용)
    inputs:
      draft_only:
        description: '📝 [테스트] 공개하지 않고 Blogger "초안"으로만 저장 (아래 선택과 함께 쓰세요. 아무것도 안 고르고 true만 주면 오늘 정규 구성을 초안으로 미리보기)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_omnibus:
        description: '🌙 별과띠가만나는시간 주간판 1개 (요일 상관없이)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_weekly:
        description: '📅 별자리주간 통합 1개 (12별자리)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_monthly:
        description: '🌙 띠별월간 통합 1개 (12띠, 다음 달 운세)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_quote:
        description: '💬 오늘의 명언 1개'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_date:
        description: '📅 발행 기준 날짜 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24 강제 적용

# 메인(00:00 KST)과 백업(01:00 KST) cron이 겹쳐서 동시에 도는 것을 방지.
# 메인이 아직 실행 중일 때 백업이 발동하면, 취소하지 않고 메인이 끝날 때까지 대기(큐잉)했다가 실행됩니다.
concurrency:
  group: daily-fortune-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 오늘의명언 슬러그 순차번호(data/quote_state.json) 커밋·푸시를 위해 필요

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v5

      - name: 🐍 Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 패키지 설치
        run: pip install pandas requests

      # ─────────────────────────────────────────────────────────
      # 중복 체크: 스케줄 실행에서만 동작. 수동 실행에서 단독 발행/초안 옵션이
      # 하나라도 켜져 있으면 건너뜀(그 경우는 의도적으로 실행하는 것이므로).
      # ─────────────────────────────────────────────────────────
      - name: 🔍 오늘 이미 포스팅했는지 확인 (중복 방지)
        id: check
        if: github.event_name != 'workflow_dispatch' || (github.event.inputs.draft_only != 'true' && github.event.inputs.force_omnibus != 'true' && github.event.inputs.force_weekly != 'true' && github.event.inputs.force_monthly != 'true' && github.event.inputs.force_quote != 'true')
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python - <<'PYEOF'
          import os, requests
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          today = datetime.now(KST).strftime("%Y년 %m월 %d일")

          # Access Token 갱신
          resp = requests.post("https://oauth2.googleapis.com/token", data={
              "grant_type": "refresh_token",
              "refresh_token": os.environ["BLOGGER_REFRESH_TOKEN"],
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
          })
          token = resp.json().get("access_token", "")

          # 오늘 날짜 포스트 검색
          blog_id = os.environ["BLOG_ID"]
          url = f"https://www.googleapis.com/blogger/v3/blogs/{blog_id}/posts"
          r = requests.get(url, headers={"Authorization": f"Bearer {token}"},
                           params={"maxResults": 30, "fetchBodies": "false"})
          posts = r.json().get("items", [])
          already = any(today in p.get("title", "") for p in posts)

          if already:
              print(f"이미 완료 — 중복 실행 스킵")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
          else:
              print(f"포스팅 없음 — 실행 진행")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=false\n")
          PYEOF

      # ─────────────────────────────────────────────────────────
      # 수동 단독 발행 / 테스트 (선택한 글만 발행하고 종료)
      #  - 단독 발행 칸 중 하나라도 true면 그 글만 발행
      #  - draft_only=true면 공개하지 않고 Blogger 초안으로만 저장
      #  - 정규 구성이나 fortune_feed.json은 건드리지 않음
      # ─────────────────────────────────────────────────────────
      - name: 🎯 수동 단독 발행 / 테스트
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.force_omnibus == 'true' || github.event.inputs.force_weekly == 'true' || github.event.inputs.force_monthly == 'true' || github.event.inputs.force_quote == 'true')
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATA_DIR: ${{ github.workspace }}/data
          FORCE_OMNIBUS_ONLY: ${{ github.event.inputs.force_omnibus }}
          FORCE_WEEKLY: ${{ github.event.inputs.force_weekly }}
          FORCE_MONTHLY: ${{ github.event.inputs.force_monthly }}
          FORCE_QUOTE_ONLY: ${{ github.event.inputs.force_quote }}
          DRAFT_ONLY: ${{ github.event.inputs.draft_only }}
          FORCE_DATE: ${{ github.event.inputs.force_date }}
        run: python scripts/create_post.py

      # ─────────────────────────────────────────────────────────
      # 정규 포스팅 (스케줄 / 단독 발행 칸을 고르지 않은 수동 실행)
      # 2026-10-04부터 띠운세/별자리운세 개별 12개씩은 Blogger에 발행하지 않음
      # (fortune_feed.json 계산만 수행 — 샵콜 전용). 매일 오늘의명언 1(별자리통합/띠통합은
      # 10/21부터 일시 중단), 일요일엔 +별과띠가만나는시간 주간판 1(다음 주 별자리×띠 12쌍),
      # 월요일엔 +별자리주간 1(12별자리 통합), 매달 마지막 월요일엔 +띠별월간 1(12띠 통합)이
      # 추가됨 — create_post.py 참고. 수동 실행 + draft_only=true면 이 정규 구성을 초안으로 미리보기.
      # ─────────────────────────────────────────────────────────
      - name: 🌟 운세 포스팅 실행
        if: steps.check.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || (github.event.inputs.force_omnibus != 'true' && github.event.inputs.force_weekly != 'true' && github.event.inputs.force_monthly != 'true' && github.event.inputs.force_quote != 'true'))
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATA_DIR: ${{ github.workspace }}/data
          DRAFT_ONLY: ${{ github.event.inputs.draft_only }}
          FORCE_DATE: ${{ github.event.inputs.force_date }}
        run: python scripts/create_post.py

      # ─────────────────────────────────────────────────────────
      # 오늘의명언 URL 슬러그 순차번호(data/quote_state.json) 커밋.
      # 오늘의명언은 2026-10-21부터 매일 발행되므로 quote_state.json이 매일
      # 변경되어 매일 커밋된다(정상). 초안 모드에서는 번호가 바뀌지 않는다.
      #
      # data/fortune_feed.json은 create_post.py가 매 실행마다 오늘의 운세
      # 요약(핵심메시지/섹션/명언)을 기록하는 파일로, [[salon-system]](샵콜)이
      # raw.githubusercontent.com으로 가져다 씁니다. 커밋해서 push하지 않으면
      # 이 러너가 끝날 때 같이 사라져서 샵콜 쪽에서는 파일이 영영 안 보이게
      # 되므로, quote_state.json과 함께 반드시 커밋합니다.
      # ─────────────────────────────────────────────────────────
      - name: 💾 명언 슬러그 번호 · 운세 피드 저장
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/quote_state.json ] && git add data/quote_state.json
          [ -f data/fortune_feed.json ] && git add data/fortune_feed.json
          git diff --staged --quiet || git commit -m "🔢 슬러그 번호 · 운세 피드 갱신 $(date -u +'%Y-%m-%d')"
          git push
