name: 🧭 돌봄 이럴땐이렇게 자동 발행

on:
  schedule:
    - cron: '30 0 * * 3'   # 매주 수요일 KST 09:30 (UTC 00:30) — 돌봄상식(일요일)과 요일을 분리해 동시 커밋 충돌 방지
  workflow_dispatch:        # 수동 실행
    inputs:
      count:
        description: '이번 실행에서 발행할 글 개수 (평소엔 1, 미리 보기일 때는 무시됨)'
        required: false
        default: '1'
      dry_run:
        description: '미리 보기만 (체크하면 블로그에 발행하지 않고, 글 파일만 만들어 실행 결과 화면의 Artifacts 에 올림)'
        type: boolean
        required: false
        default: false
      card_id:
        description: '카드 id (미리 보기 때만 사용, 필수 — draft 카드도 가능. 예: discharge-no-grade-01 / 평소 발행 땐 반드시 비워 둠)'
        required: false
        default: ''

jobs:
  publish_dolbom_when:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # dolbom_when_state.json 커밋·푸시를 위해 필요 (기본은 읽기 전용)

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v5

      - name: 🐍 Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 패키지 설치
        run: pip install requests google-genai

      - name: 🧭 이럴땐이렇게 생성 및 발행
        env:
          BLOG_ID: ${{ secrets.DOLBOM_BLOG_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data
          INPUT_COUNT: ${{ github.event.inputs.count }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_CARD_ID: ${{ github.event.inputs.card_id }}
        run: |
          COUNT="${INPUT_COUNT:-1}"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            if [ -z "$INPUT_CARD_ID" ]; then
              echo "❌ 미리 보기는 카드 id 가 필요합니다. 실행 화면의 card_id 칸에 카드 id 를 넣어 주세요."
              exit 1
            fi
            echo "📝 미리 보기 모드 — 블로그에 발행하지 않습니다."
            python scripts/create_dolbom_when.py --dry-run --card "$INPUT_CARD_ID"
          elif [ -n "$INPUT_CARD_ID" ]; then
            echo "❌ card_id 는 미리 보기(dry_run 체크)일 때만 쓸 수 있습니다. 평소 발행은 카드 id 를 비워 두세요 (이미 발행한 카드 중복 발행 방지)."
            exit 1
          else
            python scripts/create_dolbom_when.py --count "$COUNT"
          fi

      # 미리 보기 결과(HTML)를 실행 결과 화면의 Artifacts 로 올립니다. 저장소에는 커밋하지 않습니다.
      - name: 📎 미리 보기 파일 올리기
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dolbom-when-preview
          path: data/preview/*.html
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────
      # dolbom_when_state.json(발행한 카드 기록)만 커밋합니다.
      # 카드 파일(dolbom_when_cards.json)과 사실표(dolbom_fact_sheet.json)는
      # 사람이 수정하는 파일이라 이 워크플로우에서는 읽기만 하고 커밋하지 않습니다.
      # 돌봄상식의 dolbom_knowledge_state.json 도 건드리지 않습니다.
      # 미리 보기 실행에서는 커밋 단계를 건너뜁니다.
      # ─────────────────────────────────────────────────────────
      - name: 💾 진행 상태 커밋
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/dolbom_when_state.json ]; then
            git add data/dolbom_when_state.json
            git diff --staged --quiet || git commit -m "🧭 이럴땐이렇게 발행 기록 업데이트 $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          else
            echo "ℹ️ dolbom_when_state.json 없음 — 이번 실행에서 발행 성공이 없었던 것으로 보입니다. 커밋 생략."
          fi
