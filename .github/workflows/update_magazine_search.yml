name: Update magazine search index

# 호호 매거진 글 목록(Cloudflare Worker+D1 API, old-rain-16f7.lyh0929mm.workers.dev)을
# 주기적으로 읽어와 data/encyclopedia_index.json 안의 검색용 엔트리를 다시 만들어 커밋한다.
#
# [중요] 매거진 글은 GitHub Issues가 아니라 저 Worker API에 저장되기 때문에,
# "글이 올라오면 즉시" 실행되는 GitHub 이벤트(issues 등)를 걸 수가 없다 —
# 글쓰기 관리자 페이지(writer.html)가 Worker에 직접 쓰는 거라 이 저장소 쪽으로
# 아무 신호도 안 온다. 그래서 schedule(주기 재생성)로만 돈다. 글 쓰자마자 바로
# 반영하고 싶으면 Actions 탭에서 workflow_dispatch로 수동 실행하면 된다.
# (참고: 더 즉시 반영을 원하면, Worker 쪽 코드에 글 등록/수정 성공 시 GitHub의
# repository_dispatch API를 호출하는 한 줄을 추가하는 방법도 있다 — 그건 이
# 저장소가 아니라 Worker 코드 쪽을 고쳐야 해서 별도 작업으로 필요하면 요청.)

on:
  schedule:
    - cron: '0 * * * *'  # 매시 정각마다 재생성
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-magazine-search
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild magazine-* entries in encyclopedia_index.json
        run: python scripts/update_magazine_search.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/encyclopedia_index.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
          else
            git commit -m "chore: 호호 매거진 검색 색인 자동 갱신"
            git push
          fi
