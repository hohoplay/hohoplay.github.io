name: Update magazine search index

# 호호 매거진(GitHub Issues, label="호호 매거진") 글이 추가/수정/삭제될 때마다
# data/encyclopedia_index.json 안의 검색용 엔트리를 자동으로 다시 만들어 커밋한다.
# - issues 이벤트: 글 쓰고/고치고/라벨 바꾸는 즉시 반영
# - schedule: 혹시 이벤트를 놓쳤을 때를 위한 안전망(매일 새벽 자동 재생성)
# - workflow_dispatch: 필요하면 Actions 탭에서 수동으로도 바로 실행 가능

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  schedule:
    - cron: '0 18 * * *'  # 매일 UTC 18:00 = KST 03:00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

concurrency:
  group: update-magazine-search
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild magazine-* entries in encyclopedia_index.json
        # MAGAZINE_REPO_TOKEN은 선택사항: 이슈가 있는 저장소가 공개(public)라면
        # 없어도 동작한다. 레포 Secrets에 MAGAZINE_REPO_TOKEN을 안 만들어뒀으면
        # 아래 값은 그냥 빈 문자열이 되고, 스크립트는 그걸 "토큰 없음"으로 처리한다.
        env:
          MAGAZINE_REPO_TOKEN: ${{ secrets.MAGAZINE_REPO_TOKEN }}
        run: python scripts/update_magazine_search.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/encyclopedia_index.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
          else
            git commit -m "chore: 호호 매거진 검색 색인 자동 갱신"
            git push
          fi
