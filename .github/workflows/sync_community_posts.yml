name: Sync Community Posts

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 실행 (UTC 기준)
  workflow_dispatch:         # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌지 않게 줄 세움 (먼저 도는 실행이 끝나면 다음 실행 시작)
concurrency:
  group: sync-community-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 커뮤니티 게시글 동기화 실행
        run: python generate_community_posts.py

      - name: 홈 최신 소식 갱신 (실패해도 동기화는 계속)
        continue-on-error: true
        run: python scripts/update_home_latest.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "🔄 커뮤니티 게시글 정적 페이지 자동 동기화"
            # 실행 중 다른 작업이 먼저 push 했을 때(rejected: fetch first)를 대비해
            # 최신 main 위로 다시 얹고(rebase) 최대 5번까지 재시도
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공 (시도 $i회)"
                exit 0
              fi
              echo "푸시 거절 — 최신 main을 가져와 다시 시도합니다 (시도 $i/5)"
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || {
                echo "rebase 충돌 — 중단 후 재시도"
                git rebase --abort || true
              }
              sleep $((i * 3))
            done
            echo "5번 시도했지만 푸시에 실패했습니다"
            exit 1
          fi
