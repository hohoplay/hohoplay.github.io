name: Sync Community Posts

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 실행 (UTC 기준)
  workflow_dispatch:         # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 커뮤니티 게시글 동기화 실행
        run: python generate_community_posts.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "🔄 커뮤니티 게시글 정적 페이지 자동 동기화"
            git push
          fi
