# 이 파일은 리포지토리의 .github/workflows/update_festivals.yml 경로에 넣어야 합니다.
name: Update Festival Data

on:
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 = KST 다음날 05:00
  workflow_dispatch:      # 필요할 때 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  update-festivals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch festival data
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/festivals.json festival/map.html
          git diff --staged --quiet || git commit -m "chore: 축제 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
