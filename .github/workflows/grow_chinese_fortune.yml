name: 📈 Monthly Chinese Fortune CSV Grow

on:
  schedule:
    - cron: '5 2 1 * *'   # 매월 1일 KST 11:05 (UTC 02:05) — grow_fortune.yml(별자리, 02:00)과 5분 텀을 둬서 동시 push 충돌 가능성을 줄임
  workflow_dispatch:        # 수동 실행 (최초 시드 배치 등)
    inputs:
      chinese:
        description: '특정 띠만 (비워두면 전체)'
        required: false
        default: ''
      count:
        description: '띠×타입당 추가 문장 수 (평소엔 5, 최초 시드 배치 때는 크게 예: 20)'
        required: false
        default: '5'

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v5

      - name: 🐍 Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 패키지 설치
        run: pip install pandas anthropic

      - name: 📈 CSV 확장 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data
        run: |
          CHINESE="${{ github.event.inputs.chinese }}"
          COUNT="${{ github.event.inputs.count }}"
          COUNT="${COUNT:-5}"

          if [ -n "$CHINESE" ]; then
            python scripts/grow_chinese_csv.py --chinese "$CHINESE" --count "$COUNT"
          else
            python scripts/grow_chinese_csv.py --count "$COUNT"
          fi

      - name: 💾 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chinese_fortune_1000.csv
          git diff --staged --quiet || git commit -m "📈 띠운세 CSV 자동 확장 $(date +'%Y-%m')"
          git pull --rebase origin main
          git push
