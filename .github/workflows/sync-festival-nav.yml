name: Sync Festival Nav

# 나들이 도구 5개 페이지(festival/worldcup·camping-worldcup·pick·roulette·poster)의 상단 메뉴를
# 호호 매거진(커뮤니티) 페이지의 메뉴와 똑같이 맞춰 주는 '메뉴 동기화' 작업입니다.
#   - 헤더(HOHO PLAY · 플레이하기 · 소통·정보 · 약관·정책), 도구 탭, 우하단 리모콘 버튼을 한꺼번에 맞춥니다.
#   - 여러 번 실행해도 결과는 같습니다.
#
# 실행 방법
#   1) 수동: Actions 탭 → "Sync Festival Nav" → Run workflow
#   2) 자동: 메뉴를 바꾸는 작업(Add ... Menu / Update Nav Menu / Rename Festival Nav Label)이 성공으로 끝나면
#      이어서 자동으로 실행되어, 메뉴 항목을 추가·변경해도 이 5개 페이지가 같이 따라갑니다.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Add Worldcup Menu"
      - "Add Camping Menu"
      - "Add Roulette Menu"
      - "Add Poster Menu"
      - "Add Pick Menu"
      - "Update Nav Menu (one-time)"
      - "Rename Festival Nav Label"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sync-festival-nav
  cancel-in-progress: false

jobs:
  sync-nav:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 메뉴 동기화
        run: python3 scripts/sync_festival_nav.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경된 내용이 없습니다 — 커밋하지 않습니다."
          else
            git commit -m "chore: 나들이 도구 페이지 상단 메뉴 동기화"
            git pull --rebase
            git push
          fi
