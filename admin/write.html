<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 글쓰기</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1e293b; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  h2 { font-size: 16px; margin: 40px 0 12px; padding-top: 24px; border-top: 1px solid #e2e8f0; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; font-family: inherit; box-sizing: border-box;
  }
  textarea { min-height: 200px; resize: vertical; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: #64748b; }
  .btn-group { display: flex; gap: 8px; margin-top: 20px; }
  button {
    padding: 12px; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #submitBtn { flex: 1; background: #1e293b; color: #fff; }
  #submitBtn:disabled { background: #94a3b8; cursor: not-allowed; }
  #cancelBtn { background: #e2e8f0; color: #1e293b; display: none; }
  #msg { margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
  #msg.ok { color: #16a34a; }
  #msg.err { color: #dc2626; }

  #postList { display: flex; flex-direction: column; gap: 8px; }
  .post-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px;
  }
  .post-item .cat {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: #f1f5f9; color: #64748b; white-space: nowrap;
  }
  .post-item .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post-item .date { color: #94a3b8; font-size: 12px; white-space: nowrap; }
  .post-item button { padding: 6px 10px; font-size: 12px; font-weight: 600; border-radius: 6px; }
  .post-item .editBtn { background: #e0e7ff; color: #3730a3; }
  .post-item .deleteBtn { background: #fee2e2; color: #b91c1c; }
  #listMsg { font-size: 13px; color: #94a3b8; }
  #refreshBtn { background: #f1f5f9; color: #1e293b; font-size: 13px; padding: 8px 12px; margin-bottom: 12px; }
</style>
</head>
<body>

<h1>💬 커뮤니티 글쓰기</h1>

<label>관리자 키</label>
<input type="password" id="adminKey" placeholder="관리자 키 입력">
<div class="row">
  <input type="checkbox" id="rememberKey" style="width:auto;">
  <label style="margin:0;" for="rememberKey">이 브라우저에 키 기억하기</label>
</div>

<label>카테고리</label>
<select id="category">
  <option value="공지사항">공지사항</option>
  <option value="업데이트">업데이트</option>
  <option value="게임소개">게임소개</option>
</select>

<label>작성자</label>
<input type="text" id="author" placeholder="예: HOHO PLAY" value="HOHO PLAY">

<label>제목</label>
<input type="text" id="title" placeholder="글 제목 (특수문자·이모지 모두 가능)">

<label>내용</label>
<textarea id="content" placeholder="글 내용을 입력하세요 (특수문자·이모지 모두 가능)"></textarea>

<div class="btn-group">
  <button id="submitBtn" onclick="submitPost()">등록하기</button>
  <button id="cancelBtn" onclick="cancelEdit()">취소</button>
</div>
<div id="msg"></div>

<h2>📋 게시글 목록</h2>
<button id="refreshBtn" onclick="loadPosts()">↻ 새로고침</button>
<div id="postList"></div>
<div id="listMsg"></div>

<script>
const WORKER_API = "https://old-rain-16f7.lyh0929mm.workers.dev";
let editingId = null;

// ── 관리자 키 기억하기 ──
window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('hohoplay_admin_key');
  if (savedKey) {
    document.getElementById('adminKey').value = savedKey;
    document.getElementById('rememberKey').checked = true;
  }
  loadPosts();
});

function getAdminKey() {
  const key = document.getElementById('adminKey').value.trim();
  if (document.getElementById('rememberKey').checked && key) {
    localStorage.setItem('hohoplay_admin_key', key);
  } else {
    localStorage.removeItem('hohoplay_admin_key');
  }
  return key;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}

// ── 등록 / 수정 ──
async function submitPost() {
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className = '';
  msg.textContent = '';

  const adminKey = getAdminKey();
  const category = document.getElementById('category').value;
  const author = document.getElementById('author').value.trim();
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();

  if (!adminKey || !author || !title || !content) {
    msg.className = 'err';
    msg.textContent = '관리자 키, 작성자, 제목, 내용을 모두 입력해주세요.';
    return;
  }

  btn.disabled = true;
  btn.textContent = editingId ? '수정 중...' : '등록 중...';

  try {
    const isEdit = editingId !== null;
    const url = `${WORKER_API}/admin/posts?key=${encodeURIComponent(adminKey)}`;
    const payload = isEdit
      ? { id: editingId, category, author, title, content }
      : { category, author, title, content };

    const res = await fetch(url, {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!res.ok) {
      msg.className = 'err';
      msg.textContent = `${isEdit ? '수정' : '등록'} 실패: ${data.error || res.status}`;
    } else {
      msg.className = 'ok';
      msg.textContent = isEdit ? '수정 완료!' : `등록 완료! (글 ID: ${data.id})`;
      cancelEdit();
      loadPosts();
    }
  } catch (e) {
    msg.className = 'err';
    msg.textContent = `네트워크 오류: ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? '수정 완료' : '등록하기';
  }
}

function cancelEdit() {
  editingId = null;
  document.getElementById('category').value = '공지사항';
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  document.getElementById('submitBtn').textContent = '등록하기';
  document.getElementById('cancelBtn').style.display = 'none';
}

// ── 목록 ──
async function loadPosts() {
  const listEl = document.getElementById('postList');
  const listMsg = document.getElementById('listMsg');
  listMsg.textContent = '불러오는 중...';
  listEl.innerHTML = '';

  try {
    const res = await fetch(`${WORKER_API}/posts`);
    const data = await res.json();
    const posts = data.posts || [];

    if (posts.length === 0) {
      listMsg.textContent = '등록된 게시글이 없습니다.';
      return;
    }
    listMsg.textContent = '';

    listEl.innerHTML = posts.map(p => `
      <div class="post-item">
        <span class="cat">${escapeHtml(p.category)}</span>
        <span class="title">${escapeHtml(p.title)}</span>
        <span class="date">${formatDate(p.created_at)}</span>
        <button class="editBtn" onclick="editPost(${p.id})">수정</button>
        <button class="deleteBtn" onclick="deletePost(${p.id})">삭제</button>
      </div>
    `).join('');
  } catch (e) {
    listMsg.textContent = `목록을 불러오지 못했습니다: ${e.message}`;
  }
}

// ── 수정 시작 (폼에 기존 내용 채우기) ──
async function editPost(id) {
  const msg = document.getElementById('msg');
  msg.className = '';
  msg.textContent = '불러오는 중...';

  try {
    const res = await fetch(`${WORKER_API}/posts/${id}`);
    const data = await res.json();
    if (!res.ok || !data.post) {
      msg.className = 'err';
      msg.textContent = '게시글을 불러오지 못했습니다.';
      return;
    }
    const post = data.post;
    editingId = post.id;
    document.getElementById('category').value = post.category;
    document.getElementById('author').value = post.author;
    document.getElementById('title').value = post.title;
    document.getElementById('content').value = post.content;
    document.getElementById('submitBtn').textContent = '수정 완료';
    document.getElementById('cancelBtn').style.display = 'block';
    msg.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    msg.className = 'err';
    msg.textContent = `네트워크 오류: ${e.message}`;
  }
}

// ── 삭제 ──
async function deletePost(id) {
  if (!confirm('이 게시글을 삭제할까요? 되돌릴 수 없습니다.')) return;

  const adminKey = getAdminKey();
  if (!adminKey) {
    alert('관리자 키를 먼저 입력해주세요.');
    return;
  }

  try {
    const res = await fetch(`${WORKER_API}/admin/posts?key=${encodeURIComponent(adminKey)}&id=${id}`, {
      method: 'DELETE',
    });
    const data = await res.json();
    if (!res.ok) {
      alert(`삭제 실패: ${data.error || res.status}`);
      return;
    }
    if (editingId === id) cancelEdit();
    loadPosts();
  } catch (e) {
    alert(`네트워크 오류: ${e.message}`);
  }
}
</script>

</body>
</html>
