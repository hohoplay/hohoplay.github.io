<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 글쓰기</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1e293b; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; font-family: inherit; box-sizing: border-box;
  }
  textarea { min-height: 200px; resize: vertical; }
  button {
    margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #1e293b; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
  #msg.ok { color: #16a34a; }
  #msg.err { color: #dc2626; }
</style>
</head>
<body>

<h1>💬 커뮤니티 글쓰기</h1>

<label>관리자 키</label>
<input type="password" id="adminKey" placeholder="관리자 키 입력">

<label>카테고리</label>
<select id="category">
  <option value="공지사항">공지사항</option>
  <option value="업데이트">업데이트</option>
  <option value="게임소개">게임소개</option>
</select>

<label>작성자</label>
<input type="text" id="author" placeholder="예: HOHO PLAY" value="HOHO PLAY">

<label>제목</label>
<input type="text" id="title" placeholder="글 제목">

<label>내용</label>
<textarea id="content" placeholder="글 내용을 입력하세요"></textarea>

<button id="submitBtn" onclick="submitPost()">등록하기</button>
<div id="msg"></div>

<script>
const WORKER_API = "https://old-rain-16f7.lyh0929mm.workers.dev";

async function submitPost() {
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className = '';
  msg.textContent = '';

  const adminKey = document.getElementById('adminKey').value.trim();
  const category = document.getElementById('category').value;
  const author = document.getElementById('author').value.trim();
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();

  if (!adminKey || !author || !title || !content) {
    msg.className = 'err';
    msg.textContent = '관리자 키, 작성자, 제목, 내용을 모두 입력해주세요.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '등록 중...';

  try {
    const res = await fetch(`${WORKER_API}/admin/posts?key=${encodeURIComponent(adminKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, author, title, content }),
    });
    const data = await res.json();

    if (!res.ok) {
      msg.className = 'err';
      msg.textContent = `등록 실패: ${data.error || res.status}`;
    } else {
      msg.className = 'ok';
      msg.textContent = `등록 완료! (글 ID: ${data.id})`;
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
    }
  } catch (e) {
    msg.className = 'err';
    msg.textContent = `네트워크 오류: ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = '등록하기';
  }
}
</script>

</body>
</html>
