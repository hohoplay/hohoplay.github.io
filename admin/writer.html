<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 글쓰기</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1e293b; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  h2 { font-size: 16px; margin: 40px 0 12px; padding-top: 24px; border-top: 1px solid #e2e8f0; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; font-family: inherit; box-sizing: border-box;
  }
  textarea { min-height: 200px; resize: vertical; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: #64748b; }
  .btn-group { display: flex; gap: 8px; margin-top: 20px; }
  button {
    padding: 12px; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #submitBtn { flex: 1; background: #1e293b; color: #fff; }
  #submitBtn:disabled { background: #94a3b8; cursor: not-allowed; }
  #cancelBtn { background: #e2e8f0; color: #1e293b; display: none; }
  #msg { margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
  #msg.ok { color: #16a34a; }
  #msg.err { color: #dc2626; }

  #postList { display: flex; flex-direction: column; gap: 8px; }
  .post-item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px;
  }
  .post-item .cat {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: #f1f5f9; color: #64748b; white-space: nowrap;
  }
  .post-item .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post-item .date { color: #94a3b8; font-size: 12px; white-space: nowrap; }
  .post-item button { padding: 6px 10px; font-size: 12px; font-weight: 600; border-radius: 6px; }
  .post-item .editBtn { background: #e0e7ff; color: #3730a3; }
  .post-item .deleteBtn { background: #fee2e2; color: #b91c1c; }
  #listMsg { font-size: 13px; color: #94a3b8; }
  #refreshBtn { background: #f1f5f9; color: #1e293b; font-size: 13px; padding: 8px 12px; margin-bottom: 12px; }
  #searchRow { display: flex; gap: 8px; margin-bottom: 12px; }
  #searchInput { flex: 1; margin-bottom: 0; }
  #searchBtn { background: #4f46e5; color: #fff; font-size: 13px; padding: 8px 14px; white-space: nowrap; }
  #searchHint { font-size: 12px; color: #94a3b8; margin: -6px 0 12px; }
  mark { background: #fef08a; padding: 0 1px; border-radius: 2px; }
</style>
</head>
<body>

<h1>💬 커뮤니티 글쓰기</h1>

<label>관리자 키</label>
<input type="password" id="adminKey" placeholder="관리자 키 입력">
<div class="row">
  <input type="checkbox" id="rememberKey" style="width:auto;">
  <label style="margin:0;" for="rememberKey">이 브라우저에 키 기억하기</label>
</div>

<label>카테고리</label>
<select id="category">
  <option value="공지사항">공지사항</option>
  <option value="업데이트">업데이트</option>
  <option value="게임소개">게임소개</option>
</select>

<label>작성자</label>
<input type="text" id="author" placeholder="예: HOHO PLAY" value="HOHO PLAY">

<label>제목</label>
<input type="text" id="title" placeholder="글 제목 (특수문자·이모지 모두 가능)">

<label>내용</label>
<textarea id="content" placeholder="글 내용을 입력하세요 (특수문자·이모지 모두 가능)"></textarea>

<div class="btn-group">
  <button id="submitBtn" onclick="submitPost()">등록하기</button>
  <button id="cancelBtn" onclick="cancelEdit()">취소</button>
</div>
<div id="msg"></div>

<h2>📋 게시글 목록</h2>
<div id="searchRow">
  <input type="text" id="searchInput" placeholder="제목·내용·작성자로 검색 (예: github.io)">
  <button id="searchBtn" onclick="searchPosts()">🔍 내용 검색</button>
</div>
<p id="searchHint">제목만 훑어봐선 안 보이는 것(예: 본문에 박힌 옛날 링크)을 찾을 때 씁니다. 검색엔 관리자 키가 필요합니다.</p>
<button id="refreshBtn" onclick="loadPosts()">↻ 새로고침</button>
<div id="postList"></div>
<div id="listMsg"></div>

<script>
const WORKER_API = "https://old-rain-16f7.lyh0929mm.workers.dev";
let editingId = null;
// [ADD] 내용 검색용 캐시 — 검색을 누를 때마다 매번 전체 목록(본문 포함)을 다시
// 받아오지 않도록, 한 번 받은 뒤 그 안에서 로컬로 필터링한다. 관리자 키를 바꾸거나
// "새로고침"을 누르면 다시 받아오도록 null로 리셋한다.
let fullPostsCache = null;

// ── 관리자 키 기억하기 ──
window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('hohoplay_admin_key');
  if (savedKey) {
    document.getElementById('adminKey').value = savedKey;
    document.getElementById('rememberKey').checked = true;
  }
  loadPosts();
  // [ADD] 검색창에서 Enter로도 검색되게
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchPosts();
  });
});

function getAdminKey() {
  const key = document.getElementById('adminKey').value.trim();
  if (document.getElementById('rememberKey').checked && key) {
    localStorage.setItem('hohoplay_admin_key', key);
  } else {
    localStorage.removeItem('hohoplay_admin_key');
  }
  return key;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}

// [ADD] 검색어가 포함된 부분을 <mark>로 감싸서 눈에 띄게 표시.
// escapeHtml()로 먼저 이스케이프한 뒤에 그 결과 문자열 안에서 치환하므로, 검색어에
// HTML 특수문자가 섞여 있어도 원본 텍스트가 그대로 안전하게 표시된다(정규식
// 메타문자만 별도로 이스케이프해서 검색 자체가 깨지지 않게 처리).
function highlightMatch(text, term) {
  const escaped = escapeHtml(text == null ? '' : String(text));
  if (!term) return escaped;
  const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + escapedTerm + ')', 'ig');
  return escaped.replace(re, '<mark>$1</mark>');
}

// [ADD] 목록 렌더링을 공통 함수로 뺐다 — 평소 목록(loadPosts)과 검색 결과
// (searchPosts)가 같은 카드 모양을 쓰되, 검색 결과에는 매칭된 본문 일부를
// 강조해서 미리보기로 보여준다는 점만 다르다.
function renderPostItems(posts, term) {
  return posts.map(p => {
    let snippet = '';
    if (term && p.content) {
      const idx = p.content.toLowerCase().indexOf(term.toLowerCase());
      if (idx !== -1) {
        const start = Math.max(0, idx - 25);
        const end = Math.min(p.content.length, idx + term.length + 40);
        const raw = (start > 0 ? '…' : '') + p.content.slice(start, end) + (end < p.content.length ? '…' : '');
        snippet = `<div style="flex-basis:100%;font-size:12px;color:#64748b;margin-top:2px;padding-top:6px;border-top:1px dashed #e2e8f0">${highlightMatch(raw, term)}</div>`;
      }
    }
    return `
      <div class="post-item">
        <span class="cat">${escapeHtml(p.category)}</span>
        <span class="title">${highlightMatch(p.title, term)}</span>
        <span class="date">${formatDate(p.created_at)}</span>
        <button class="editBtn" onclick="editPost(${p.id})">수정</button>
        <button class="deleteBtn" onclick="deletePost(${p.id})">삭제</button>
        ${snippet}
      </div>
    `;
  }).join('');
}

// ── 등록 / 수정 ──
async function submitPost() {
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className = '';
  msg.textContent = '';

  const adminKey = getAdminKey();
  const category = document.getElementById('category').value;
  const author = document.getElementById('author').value.trim();
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();

  if (!adminKey || !author || !title || !content) {
    msg.className = 'err';
    msg.textContent = '관리자 키, 작성자, 제목, 내용을 모두 입력해주세요.';
    return;
  }

  btn.disabled = true;
  btn.textContent = editingId ? '수정 중...' : '등록 중...';

  try {
    const isEdit = editingId !== null;
    const url = `${WORKER_API}/admin/posts?key=${encodeURIComponent(adminKey)}`;
    const payload = isEdit
      ? { id: editingId, category, author, title, content }
      : { category, author, title, content };

    const res = await fetch(url, {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!res.ok) {
      msg.className = 'err';
      msg.textContent = `${isEdit ? '수정' : '등록'} 실패: ${data.error || res.status}`;
    } else {
      msg.className = 'ok';
      msg.textContent = isEdit ? '수정 완료!' : `등록 완료! (글 ID: ${data.id})`;
      cancelEdit();
      loadPosts();
    }
  } catch (e) {
    msg.className = 'err';
    msg.textContent = `네트워크 오류: ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? '수정 완료' : '등록하기';
  }
}

function cancelEdit() {
  editingId = null;
  document.getElementById('category').value = '공지사항';
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  document.getElementById('submitBtn').textContent = '등록하기';
  document.getElementById('cancelBtn').style.display = 'none';
}

// ── 목록 ──
// [FIX] 캐시 우회 없이 그냥 fetch만 하면, 방금 삭제·수정한 직후에도 브라우저나
// Cloudflare 쪽에 남은 예전 응답이 그대로 보일 수 있음(blog/index.html에서 실제로
// 확인된 문제와 동일한 성격). 타임스탬프 쿼리 + no-store로 항상 최신 상태를 받아온다.
async function loadPosts() {
  const listEl = document.getElementById('postList');
  const listMsg = document.getElementById('listMsg');
  listMsg.textContent = '불러오는 중...';
  listEl.innerHTML = '';
  fullPostsCache = null; // 새로고침하면 검색용 캐시도 다시 받아오도록 초기화
  document.getElementById('searchInput').value = '';

  try {
    const res = await fetch(`${WORKER_API}/posts?_=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    const posts = data.posts || [];

    if (posts.length === 0) {
      listMsg.textContent = '등록된 게시글이 없습니다.';
      return;
    }
    listMsg.textContent = '';
    listEl.innerHTML = renderPostItems(posts, '');
  } catch (e) {
    listMsg.textContent = `목록을 불러오지 못했습니다: ${e.message}`;
  }
}

// ── 내용 검색 ──
// [ADD] 제목만 봐선 못 찾는 것(본문에 박힌 옛날 링크 등)을 찾기 위한 기능.
// 공개용 /posts는 본문을 안 내려주므로, 검색 시에만 관리자 키로 /admin/posts를
// 한 번 불러와 캐시해두고 그 안에서 로컬로 필터링한다(검색어 바뀔 때마다 매번
// 서버에 다시 묻지 않음 — "새로고침"을 누르면 캐시가 비워져 다음 검색 때 새로 받음).
async function searchPosts() {
  const term = document.getElementById('searchInput').value.trim();
  const listEl = document.getElementById('postList');
  const listMsg = document.getElementById('listMsg');

  if (!term) {
    loadPosts();
    return;
  }

  const adminKey = getAdminKey();
  if (!adminKey) {
    listMsg.textContent = '검색하려면 관리자 키를 먼저 입력해주세요.';
    return;
  }

  listMsg.textContent = '검색 중...';
  listEl.innerHTML = '';

  try {
    if (!fullPostsCache) {
      const res = await fetch(`${WORKER_API}/admin/posts?key=${encodeURIComponent(adminKey)}&_=${Date.now()}`, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) {
        listMsg.textContent = `검색 실패: ${data.error || res.status}`;
        return;
      }
      fullPostsCache = data.posts || [];
    }

    const lower = term.toLowerCase();
    const matched = fullPostsCache.filter(p =>
      (p.title || '').toLowerCase().includes(lower) ||
      (p.content || '').toLowerCase().includes(lower) ||
      (p.author || '').toLowerCase().includes(lower)
    );

    if (matched.length === 0) {
      listMsg.textContent = `"${term}"이(가) 포함된 게시글이 없습니다.`;
      return;
    }
    listMsg.textContent = `${matched.length}건 찾음`;
    listEl.innerHTML = renderPostItems(matched, term);
  } catch (e) {
    listMsg.textContent = `네트워크 오류: ${e.message}`;
  }
}

// ── 수정 시작 (폼에 기존 내용 채우기) ──
async function editPost(id) {
  const msg = document.getElementById('msg');
  msg.className = '';
  msg.textContent = '불러오는 중...';

  try {
    const res = await fetch(`${WORKER_API}/posts/${id}?_=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok || !data.post) {
      msg.className = 'err';
      msg.textContent = '게시글을 불러오지 못했습니다.';
      return;
    }
    const post = data.post;
    editingId = post.id;
    document.getElementById('category').value = post.category;
    document.getElementById('author').value = post.author;
    document.getElementById('title').value = post.title;
    document.getElementById('content').value = post.content;
    document.getElementById('submitBtn').textContent = '수정 완료';
    document.getElementById('cancelBtn').style.display = 'block';
    msg.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    msg.className = 'err';
    msg.textContent = `네트워크 오류: ${e.message}`;
  }
}

// ── 삭제 ──
async function deletePost(id) {
  if (!confirm('이 게시글을 삭제할까요? 되돌릴 수 없습니다.')) return;

  const adminKey = getAdminKey();
  if (!adminKey) {
    alert('관리자 키를 먼저 입력해주세요.');
    return;
  }

  try {
    const res = await fetch(`${WORKER_API}/admin/posts?key=${encodeURIComponent(adminKey)}&id=${id}`, {
      method: 'DELETE',
    });
    const data = await res.json();
    if (!res.ok) {
      alert(`삭제 실패: ${data.error || res.status}`);
      return;
    }
    if (editingId === id) cancelEdit();
    loadPosts();
  } catch (e) {
    alert(`네트워크 오류: ${e.message}`);
  }
}
</script>

</body>
</html>
