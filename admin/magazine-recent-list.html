<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>직전 글 목록 뽑기 (프롬프트용)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Noto Sans KR', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px 16px 80px; line-height: 1.6; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #64748b; margin: 0 0 16px; }
  .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  label { font-size: 13px; font-weight: 700; margin-right: 6px; }
  select, input[type=number] { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; }
  input[type=number] { width: 72px; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 700; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-main { background: #4f46e5; color: #fff; }
  .btn-sub { background: #e0e7ff; color: #3730a3; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  textarea { width: 100%; min-height: 360px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; line-height: 1.55; font-family: ui-monospace, 'Noto Sans KR', monospace; resize: vertical; }
  #msg { font-size: 13px; margin-top: 10px; }
  .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }
  .note { font-size: 12px; color: #64748b; }
  .warn { font-size: 12px; color: #92400e; background: #fef3c7; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>직전 글 목록 뽑기 (프롬프트용)</h1>
  <p class="sub">새 글을 쓰기 전에 AI에게 붙여 넣을 "이미 발행한 글 목록"을 만들어 줍니다. 각 글의 제목, H2 소제목, FAQ 질문, 첫 문장 앞 12어절을 한 줄씩 정리해요. (MULTI_PLATFORM_SEO_MASTER v9.1 · 23.6장)</p>

  <div class="box">
    <div class="row">
      <label for="cat">카테고리</label>
      <select id="cat"><option value="호호 매거진" selected>호호 매거진</option><option value="">전체 글</option></select>
      <label for="cnt">최근</label><input type="number" id="cnt" value="10" min="1" max="40"><span class="note">개</span>
      <button class="btn-main" id="btnLoad">목록 뽑기</button>
      <button class="btn-sub" id="btnCopy" disabled>복사하기</button>
      <button class="btn-sub" id="btnMemo">경험 메모 양식 복사</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="box">
    <textarea id="out" spellcheck="false" placeholder="'목록 뽑기'를 누르면 여기에 결과가 나옵니다. 그대로 복사해서 AI에게 붙여 넣으세요."></textarea>
    <div class="warn">서버에 저장된 글 기준입니다. 방금 올린 글은 바로 보이지만, 사이트 페이지에는 Sync가 돌고 나서 나타납니다. FAQ를 찾지 못한 글은 "FAQ 없음/확인 필요"로 표시돼요.</div>
  </div>
</div>

<script>
const WORKER = 'https://old-rain-16f7.lyh0929mm.workers.dev';
function $(id) { return document.getElementById(id); }
function say(t, cls) { const m = $('msg'); m.className = cls || ''; m.textContent = t; }
function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }

async function getJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  const data = await res.json().catch(function () { return {}; });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return data;
}

// 본문 HTML에서 H2 / FAQ 질문 / 첫 문장 앞 12어절을 뽑는다.
function analyze(html) {
  const doc = new DOMParser().parseFromString('<div id="r">' + (html || '') + '</div>', 'text/html');
  const root = doc.getElementById('r');
  const h2 = [], faq = [];
  let inFaq = false, firstP = '';
  const nodes = root.querySelectorAll('h2, h3, p');
  nodes.forEach(function (el) {
    const tag = el.tagName;
    const text = clean(el.textContent);
    if (!text) return;
    if (tag === 'H2') {
      inFaq = /FAQ|자주\s*묻는/i.test(text);
      h2.push(text);
      return;
    }
    if (tag === 'P' && !firstP && !/^[-–—=_*\s]+$/.test(text) && !/^HOHO\s*PLAY\s*[·|]/i.test(text) && text.length > 30) {
      firstP = text;
    }
    if (!inFaq) return;
    if (tag === 'H3') { faq.push(text); return; }
    if (tag === 'P') {
      const st = el.querySelector('strong');
      if (st) {
        const q = clean(st.textContent);
        if (/^Q[\s.\d)]*/i.test(q) || /[?？]$/.test(q)) faq.push(q);
      }
    }
  });
  const words = firstP.split(' ').slice(0, 12).join(' ');
  return { h2: h2, faq: faq, first: words };
}

function lineOf(p) {
  const a = analyze(p.content);
  const faqText = a.faq.length ? a.faq.map(function (q) { return q.replace(/^Q[\s.\d)]*\s*/i, '').replace(/^\d+\.\s*/, ''); }).join(' / ') : 'FAQ 없음/확인 필요';
  return p.id + ' | ' + clean(p.title) + ' | ' + (a.h2.length ? a.h2.join(' / ') : 'H2 없음') + ' | ' + faqText + ' | ' + (a.first || '확인 필요');
}

async function load() {
  const cat = $('cat').value;
  let n = parseInt($('cnt').value, 10);
  if (!(n >= 1)) n = 10;
  if (n > 40) n = 40;
  $('btnLoad').disabled = true; $('btnCopy').disabled = true; $('out').value = '';
  say('서버에서 글 목록을 가져오는 중…');
  try {
    const list = await getJson(WORKER + '/posts?_=' + Date.now());
    let posts = (list.posts || []).filter(function (p) { return !cat || (p.category || '') === cat; });
    posts.sort(function (a, b) { return (b.created_at || 0) - (a.created_at || 0) || (b.id - a.id); });
    posts = posts.slice(0, n);
    if (!posts.length) { say('조건에 맞는 글이 없어요.', 'bad'); return; }
    const lines = [];
    let fail = 0;
    for (let i = 0; i < posts.length; i++) {
      say('본문을 읽는 중… ' + (i + 1) + '/' + posts.length);
      let full = posts[i];
      try { full = (await getJson(WORKER + '/posts/' + posts[i].id + '?_=' + Date.now())).post || posts[i]; }
      catch (e) { fail++; }
      lines.push(lineOf(full));
    }
    const head = '[직전 ' + posts.length + '개 글 목록]  (' + new Date().toISOString().slice(0, 10) + ' 기준)\n번호 | 제목 | H2 목록 | FAQ 질문 | 첫 문장 앞 12어절';
    $('out').value = head + '\n' + lines.join('\n');
    $('btnCopy').disabled = false;
    say(posts.length + '개 글을 정리했어요.' + (fail ? ' (본문을 못 읽은 글 ' + fail + '개는 제목만 표시)' : '') + ' "복사하기"를 누르세요.', 'ok');
  } catch (e) {
    say('목록을 가져오지 못했어요: ' + e.message + ' — 이 페이지는 hohoplaylab.com 주소로 열어야 합니다.', 'bad');
  } finally {
    $('btnLoad').disabled = false;
  }
}

async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); say(okMsg, 'ok'); }
  catch (e) {
    const t = $('out'); const keep = t.value; t.value = text; t.select();
    try { document.execCommand('copy'); say(okMsg, 'ok'); } catch (e2) { say('복사에 실패했어요. 직접 선택해서 복사해 주세요.', 'bad'); }
    t.value = keep;
  }
}

$('btnLoad').onclick = load;
$('btnCopy').onclick = function () { copyText($('out').value, '복사했어요. AI 프롬프트 맨 앞에 붙여 넣으세요.'); };
$('btnMemo').onclick = function () {
  copyText('[운영자 경험 메모]\n방문/이용 날짜 | 장소·대상 | 직접 확인한 것(시간·요금·대기·동선·불편한 점) | 사진 설명(몇 장, 무엇이 찍혔는지)\n(없으면 "경험 메모 없음"이라고 적기)\n\n[주제·독자 문제 한 줄]\n', '경험 메모 양식을 복사했어요. 목록 아래에 붙여 넣고 빈칸을 채우세요.');
};
</script>
</body>
</html>
