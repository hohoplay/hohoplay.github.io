    <script>
        function applyGameNavResponsive(){
            var isWide = window.innerWidth >= 768;
            var d1 = document.getElementById('g-nav-desktop');
            var d2 = document.getElementById('g-nav-cta');
            var m1 = document.getElementById('g-nav-cta-m');
            var m2 = document.getElementById('g-nav-hamburger');
            if(d1) d1.style.display = isWide ? 'flex' : 'none';
            if(d2) d2.style.display = isWide ? 'flex' : 'none';
            if(m1) m1.style.display = isWide ? 'none' : 'flex';
            if(m2) m2.style.display = isWide ? 'none' : 'flex';
            if(isWide){
                var mm = document.getElementById('game-mobile-menu');
                if(mm) mm.style.display = 'none';
            }
        }
        applyGameNavResponsive();
        window.addEventListener('resize', applyGameNavResponsive);
        function toggleGameMenu(){
            var m = document.getElementById('game-mobile-menu');
            var b1 = document.getElementById('gbar1'), b2 = document.getElementById('gbar2'), b3 = document.getElementById('gbar3');
            var isOpen = m.style.display === 'block';
            if(!isOpen){
                m.style.display = 'block';
                b1.style.transform = 'translateY(6px) rotate(45deg)';
                b2.style.opacity = '0';
                b3.style.transform = 'translateY(-6px) rotate(-45deg)';
            } else {
                m.style.display = 'none';
                b1.style.transform = '';
                b2.style.opacity = '1';
                b3.style.transform = '';
            }
        }
    </script>

    <script>
        // ⚠️ 문제은행 — 이 배열만 고치면 문항을 늘리거나 바꿀 수 있습니다. 매 판마다 이 중 5개를 무작위로 뽑습니다.
        const QUESTION_BANK = [
            { q: '대한민국의 수도는 어디일까요?', options: ['서울', '부산', '인천', '대전'], answer: 0 },
            { q: '물의 화학식은 무엇일까요?', options: ['CO2', 'H2O', 'O2', 'NaCl'], answer: 1 },
            { q: '세계에서 가장 긴 강은?', options: ['한강', '나일강', '낙동강', '두만강'], answer: 1 },
            { q: '1년은 며칠일까요? (평년 기준)', options: ['364일', '365일', '366일', '360일'], answer: 1 },
            { q: '태양계에서 가장 큰 행성은?', options: ['지구', '토성', '목성', '화성'], answer: 2 },
            { q: '한글을 창제한 왕은?', options: ['태종', '세종대왕', '정조', '영조'], answer: 1 },
            { q: '무지개는 몇 가지 색으로 이루어져 있을까요?', options: ['5가지', '6가지', '7가지', '8가지'], answer: 2 },
            { q: '피아노 건반은 총 몇 개일까요?', options: ['76개', '88개', '92개', '100개'], answer: 1 },
            { q: '사람의 뼈는 총 몇 개일까요? (성인 기준)', options: ['186개', '206개', '226개', '246개'], answer: 1 },
            { q: '올림픽은 몇 년마다 열릴까요?', options: ['2년', '3년', '4년', '5년'], answer: 2 },
            { q: '커피의 원료가 되는 식물은?', options: ['카카오', '커피나무', '녹차나무', '보리'], answer: 1 },
            { q: '지구에서 가장 큰 대륙은?', options: ['아프리카', '유럽', '아시아', '북아메리카'], answer: 2 },
            { q: '벌집의 방은 보통 어떤 모양일까요?', options: ['사각형', '원형', '삼각형', '육각형'], answer: 3 },
            { q: '우리나라의 화폐 단위는?', options: ['엔', '위안', '원', '달러'], answer: 2 },
            { q: '거미는 다리가 몇 개일까요?', options: ['6개', '8개', '10개', '4개'], answer: 1 },
            { q: '세계에서 인구가 가장 많은 나라는?', options: ['미국', '인도', '중국', '인도네시아'], answer: 1 },
            { q: '1킬로그램은 몇 그램일까요?', options: ['100g', '1000g', '10000g', '10g'], answer: 1 },
            { q: '광복절은 몇 월 며칠일까요?', options: ['3월 1일', '6월 6일', '8월 15일', '10월 3일'], answer: 2 },
            { q: '사람 몸에서 가장 큰 장기는?', options: ['간', '심장', '피부', '폐'], answer: 2 },
            { q: '눈의 결정은 보통 몇 각형일까요?', options: ['4각형', '5각형', '6각형', '8각형'], answer: 2 },
        ];

        const QUESTIONS_PER_WEEK = 5;

        function getWeekIndex() {
            const d = new Date();
            const start = new Date(d.getFullYear(), 0, 1);
            const days = Math.floor((d - start) / 86400000);
            const week = Math.ceil((days + start.getDay() + 1) / 7);
            return d.getFullYear() * 100 + week;
        }

        const totalSets = Math.max(1, Math.floor(QUESTION_BANK.length / QUESTIONS_PER_WEEK));
        const weekIdx = getWeekIndex() % totalSets;
        const thisWeekQuestions = QUESTION_BANK.slice(weekIdx * QUESTIONS_PER_WEEK, weekIdx * QUESTIONS_PER_WEEK + QUESTIONS_PER_WEEK);

        const TIME_PER_Q = 12000; // 12초
        let quizQuestions = [];
        let currentIndex = 0;
        let timerInterval = null;
        let answered = false;

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startQuiz() {
            quizQuestions = shuffle(thisWeekQuestions);
            currentIndex = 0;
            document.getElementById('q-start').classList.add('hidden');
            document.getElementById('q-end').classList.add('hidden');
            document.getElementById('q-play').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const q = quizQuestions[currentIndex];
            document.getElementById('q-progress').textContent = (currentIndex + 1) + ' / ' + quizQuestions.length;
            document.getElementById('q-text').textContent = q.q;

            const optsWrap = document.getElementById('q-options');
            optsWrap.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(i);
                optsWrap.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            const bar = document.getElementById('timer-progress');
            let remaining = TIME_PER_Q;
            bar.style.width = '100%';
            bar.style.background = '#3b82f6';

            timerInterval = setInterval(() => {
                remaining -= 100;
                const pct = remaining / TIME_PER_Q;
                bar.style.width = (pct * 100) + '%';
                if (pct > 0.6) bar.style.background = '#3b82f6';
                else if (pct > 0.3) bar.style.background = '#fbbf24';
                else bar.style.background = '#ef4444';

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    if (!answered) revealAnswer(-1);
                }
            }, 100);
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            clearInterval(timerInterval);
            revealAnswer(i);
        }

        function revealAnswer(selectedIndex) {
            const q = quizQuestions[currentIndex];
            const buttons = document.querySelectorAll('#q-options .quiz-option');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.answer) btn.classList.add('correct');
                else if (i === selectedIndex) btn.classList.add('wrong');
            });

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < quizQuestions.length) {
                    renderQuestion();
                } else {
                    document.getElementById('q-play').classList.add('hidden');
                    document.getElementById('q-end').classList.remove('hidden');
                }
            }, 1100);
        }
    </script>
