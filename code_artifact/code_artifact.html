<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리치 부티크 호텔 다낭 - 주변 맛집 & 명소 가이드 지도</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Map Marker Pulsing Animation for Hotel */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .hotel-pulse {
            position: absolute;
            width: 44px;
            height: 44px;
            background-color: rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            animation: pulse-ring 2s infinite ease-in-out;
            top: -6px;
            left: -6px;
            z-index: -1;
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 12px 14px;
            line-height: 1.5;
        }

        /* Smooth transition for map collapse on mobile */
        .map-container-transition {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- SIDEBAR PANEL -->
    <aside id="sidebarPanel" class="w-full md:w-[420px] lg:w-[460px] h-full bg-white flex flex-col z-20 shadow-xl border-r border-slate-200 min-h-0 flex-1 md:flex-initial">
        
        <!-- Header -->
        <header class="p-3.5 bg-gradient-to-r from-indigo-700 to-blue-600 text-white shadow-md flex-shrink-0">
            <div class="flex items-center justify-between mb-1">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/20 text-white backdrop-blur-sm">
                    <i class="fa-solid fa-hotel text-amber-300"></i> 기준점: 리치 부티크 호텔
                </span>
                
                <!-- Registration Button (+ 장소 등록) -->
                <button onclick="openAddModal()" class="px-2.5 py-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-plus text-xs"></i> 장소 등록
                </button>
            </div>
            
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-bold tracking-tight">다낭 여행 맞춤 가이드 지도</h1>
                    <p class="text-[11px] text-blue-100">호텔 주변 맛집, 야시장, 용다리, ATM 위치 모음</p>
                </div>
            </div>
            
            <!-- Quick Course Banner Button -->
            <div class="flex items-center gap-1.5 mt-2.5">
                <button onclick="highlightNightCourse()" class="flex-1 py-1.5 px-3 bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-lg text-xs font-bold transition flex items-center justify-between shadow-sm">
                    <span><i class="fa-solid fa-wand-magic-sparkles text-amber-800 mr-1"></i> 추천 야간 코스 (ATM ➔ 야시장 ➔ 불쇼)</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </header>

        <!-- Search & Filter Area -->
        <div class="p-2.5 bg-slate-50 border-b border-slate-200 flex-shrink-0 space-y-2">
            <!-- Search Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="filterPlaces()" placeholder="장소명, 음식, 키워드 검색 (예: 불쇼, BBQ, ATM)..." 
                       class="w-full pl-8 pr-8 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                <button onclick="clearSearch()" id="clearBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Category Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                <button onclick="setCategory('all')" class="cat-btn active px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-slate-800 text-white shadow-xs transition" data-cat="all">전체</button>
                <button onclick="setCategory('food')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="food"><i class="fa-solid fa-utensils text-rose-500 mr-1"></i>맛집</button>
                <button onclick="setCategory('spot')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="spot"><i class="fa-solid fa-camera text-indigo-500 mr-1"></i>명소/밤문화</button>
                <button onclick="setCategory('spa')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="spa"><i class="fa-solid fa-spa text-emerald-500 mr-1"></i>스파/마사지</button>
                <button onclick="setCategory('atm')" class="cat-btn px-2.5 py-1 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition" data-cat="atm"><i class="fa-solid fa-credit-card text-blue-500 mr-1"></i>ATM/은행</button>
            </div>
        </div>

        <!-- Place List Container -->
        <div id="placeList" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- Places loaded via JavaScript -->
        </div>

        <!-- Footer Info -->
        <footer class="p-2.5 bg-slate-100 text-slate-500 text-[11px] border-t border-slate-200 flex-shrink-0 flex justify-between items-center px-4">
            <button onclick="toggleMap(true)" class="md:hidden text-indigo-600 font-bold bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-200 flex items-center gap-1">
                <i class="fa-solid fa-map-location-dot"></i> 지도 펼치기
            </button>
            <span class="hidden sm:inline"><i class="fa-solid fa-map text-indigo-500"></i> 장소 클릭 시 경로 표시</span>
            <button onclick="resetMapView()" class="text-indigo-600 font-semibold hover:underline ml-auto">
                <i class="fa-solid fa-rotate-left"></i> 전체보기
            </button>
        </footer>
    </aside>

    <!-- MAP CONTAINER -->
    <main id="mapContainer" class="map-container-transition fixed md:relative inset-0 md:inset-auto w-full md:w-auto flex-1 h-full z-30 md:z-10 bg-slate-200 hidden md:block">
        <div id="map" class="w-full h-full"></div>

        <!-- FLOATING CLOSE / MINIMIZE BUTTON FOR MAP (Top Right) -->
        <button onclick="toggleMap(false)" id="closeMapBtn" 
                class="absolute top-4 right-4 z-[600] bg-slate-900/90 hover:bg-slate-900 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xl border border-white/20 flex items-center gap-2 transition transform active:scale-95">
            <i class="fa-solid fa-xmark text-sm text-rose-400"></i>
            <span>지도 축소/닫기</span>
        </button>

        <!-- Map Floating Legend -->
        <div class="absolute bottom-4 right-4 z-[500] bg-white/90 backdrop-blur-md px-3 py-2.5 rounded-xl shadow-lg border border-slate-200 text-xs hidden sm:block">
            <div class="font-bold text-slate-700 mb-1.5 flex items-center gap-1">
                <i class="fa-solid fa-layer-group text-indigo-600"></i> 범례 안내
            </div>
            <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-[11px] text-slate-600">
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 숙소 (리치부티크)</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> 맛집/식당</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span> 명소/볼거리</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 스파/마사지</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 수수료 무료/ATM</span>
            </div>
        </div>
    </main>

    <!-- MOBILE FLOATING MAP TOGGLE BUTTON (When map is collapsed) -->
    <button onclick="toggleMap(true)" id="floatingMapToggle" 
            class="md:hidden fixed bottom-5 right-5 z-20 bg-indigo-600 text-white font-bold px-4 py-3 rounded-full shadow-2xl flex items-center gap-2 border-2 border-white text-xs active:scale-95 transition">
        <i class="fa-solid fa-map"></i>
        <span>지도 크게 보기</span>
    </button>

    <!-- ADD PLACE MODAL -->
    <div id="addPlaceModal" class="hidden fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[92vh]">
            <div class="bg-indigo-600 text-white px-5 py-3.5 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-amber-300"></i> 나만의 장소 추가 등록
                </h3>
                <button onclick="closeAddModal()" class="text-white/80 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="addPlaceForm" onsubmit="handleSavePlace(event)" class="p-4 space-y-3 overflow-y-auto flex-1 text-xs">
                
                <!-- Quick Location Options (Current GPS / Address Search / Google Maps) -->
                <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-indigo-900 flex items-center gap-1">
                            <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> 간편 위치 입력 도구
                        </span>
                        <a href="https://maps.google.com" target="_blank" class="text-[10px] text-slate-500 hover:text-indigo-600 underline flex items-center gap-0.5">
                            <i class="fa-solid fa-up-right-from-square"></i> 구글 지도 열기
                        </a>
                    </div>

                    <!-- GPS Fetch Button -->
                    <button type="button" id="gpsFetchBtn" onclick="fetchCurrentLocation()" 
                            class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-xs transition flex items-center justify-center gap-1.5 active:scale-98">
                        <i class="fa-solid fa-location-crosshairs text-sm"></i>
                        <span>📍 내 현재 위치(GPS) 좌표 자동 등록</span>
                    </button>

                    <!-- Address/Keyword Search Input -->
                    <div class="flex gap-1.5 pt-1">
                        <input type="text" id="newPlaceAddressInput" placeholder="주소 또는 장소명 입력 (예: 미케비치, Nguyen Van Thoai)" 
                               class="flex-1 px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <button type="button" id="addrSearchBtn" onclick="searchAddressGeocode()" 
                                class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition shrink-0">
                            <i class="fa-solid fa-magnifying-glass"></i> 검색
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">장소명 *</label>
                    <input type="text" id="newPlaceName" required placeholder="예: 다낭 로컬 쌀국수, 추천 카페..." 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">카테고리 *</label>
                        <select id="newPlaceCat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="food">🍽️ 맛집/식당</option>
                            <option value="spot">📸 명소/밤문화</option>
                            <option value="spa">🌿 스파/마사지</option>
                            <option value="atm">💳 ATM/은행</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">거리 / 이동시간</label>
                        <input type="text" id="newPlaceDist" placeholder="예: 도보 5분, 차량 10분" 
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Coordinates Picker Block -->
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label class="font-semibold text-slate-700">위치 좌표 (위도/경도) *</label>
                        <button type="button" onclick="setPickerMode()" class="text-[11px] text-indigo-600 font-bold hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-hand-pointer"></i> 지도에서 직접 선택
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="any" id="newPlaceLat" required placeholder="위도 (Lat)" 
                               class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-[11px]">
                        <input type="number" step="any" id="newPlaceLng" required placeholder="경도 (Lng)" 
                               class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-mono text-[11px]">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">간단한 설명 / 주소 메모</label>
                    <input type="text" id="newPlaceDesc" placeholder="예: 현지인 추천 쌀국수 전문점" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">추천 팁 & 메모</label>
                    <textarea id="newPlaceTips" rows="2" placeholder="예: 소고기 쌀국수 추천, 에어컨 없음..." 
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">태그 (쉼표로 구분)</label>
                    <input type="text" id="newPlaceTags" placeholder="쌀국수, 가성비, 로컬" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="pt-2 flex items-center gap-2">
                    <button type="button" onclick="closeAddModal()" class="w-1/3 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition">
                        취소
                    </button>
                    <button type="submit" class="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-1 active:scale-98">
                        <i class="fa-solid fa-check"></i> 장소 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

            loadPlacesData();

                    document.getElementById('newPlaceLat').value = e.latlng.lat.toFixed(6);
                    document.getElementById('newPlaceLng').value = e.latlng.lng.toFixed(6);
                    pickerModeActive = false;
                    map.getContainer().style.cursor = '';
                    
                    showToast('📍 지도 클릭 위치의 좌표가 선택되었습니다!');

                    document.getElementById('addPlaceModal').classList.remove('hidden');

            });

            renderHotelMarker();
            renderPlaces();

        function loadPlacesData() {
            const saved = localStorage.getItem('rich_hotel_custom_places');
            if (saved) {
                try {
                    const customList = JSON.parse(saved);
                    PLACES = [...INITIAL_PLACES, ...customList];
                } catch (e) {
                    PLACES = [...INITIAL_PLACES];
                }
            } else {
                PLACES = [...INITIAL_PLACES];
            }
        }

        function saveCustomPlacesToStorage(customPlacesArr) {
            localStorage.setItem('rich_hotel_custom_places', JSON.stringify(customPlacesArr));
        }

        // --- 3. MAP COLLAPSE & TOGGLE LOGIC ---
        function toggleMap(show) {
            const container = document.getElementById('mapContainer');
            const floatingBtn = document.getElementById('floatingMapToggle');

            if (show) {
                container.classList.remove('hidden');
                floatingBtn.classList.add('hidden');
                setTimeout(() => {
                    map.invalidateSize();
                }, 150);
            } else {
                container.classList.add('hidden');
                floatingBtn.classList.remove('hidden');
            }
        }

        function renderPlaces() {
            const listEl = document.getElementById('placeList');
            listEl.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

            PLACES.forEach(place => {
                const matchesCat = (activeCategory === 'all' || place.category === activeCategory);
                const matchesSearch = !searchTerm || 
                    place.name.toLowerCase().includes(searchTerm) || 
                    place.desc.toLowerCase().includes(searchTerm) ||
                    (place.tips && place.tips.toLowerCase().includes(searchTerm)) ||
                    (place.tags && place.tags.some(t => t.toLowerCase().includes(searchTerm)));

                if (matchesCat && matchesSearch) {
                    if (!markers[place.id]) {
                        const iconHtml = `
                            <div class="flex items-center justify-center w-8 h-8 rounded-full shadow-md border-2 border-white text-white font-bold text-xs transform hover:scale-110 transition" style="background-color: ${place.color}">

                        const customIcon = L.divIcon({
                            html: iconHtml,
                            className: 'custom-place-pin',
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(map);
                        
                        const popupHtml = `
                            <div class="text-xs min-w-[200px]">
                                <div class="font-bold text-slate-800 text-sm flex items-center gap-1.5" style="color: ${place.color}">
                                    <i class="fa-solid ${place.icon}"></i> ${place.name}

                                <p class="text-slate-600 mt-1.5 leading-tight">${place.desc || ''}</p>
                                ${place.tips ? `<div class="mt-2 p-1.5 bg-slate-50 text-slate-700 text-[11px] rounded border border-slate-200"><b>💡 팁:</b> ${place.tips}</div>` : ''}
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.googleQuery || place.name)}" target="_blank" 
                                   class="mt-2.5 block text-center py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded text-[11px]">
                                   <i class="fa-solid fa-arrow-up-right-from-square"></i> 구글지도에서 열기
                                </a>
                            </div>
                        `;
                        marker.bindPopup(popupHtml);
                        
                        marker.on('click', () => {
                            selectPlace(place.id, false);
                        });

                        markers[place.id] = marker;
                    } else {
                        if (!map.hasLayer(markers[place.id])) {
                            map.addLayer(markers[place.id]);
                        }
                    }

                    listEl.appendChild(createPlaceCard(place));
                } else {
                    if (markers[place.id] && map.hasLayer(markers[place.id])) {
                        map.removeLayer(markers[place.id]);
                    }
                }
            });

            if (listEl.children.length === 0) {
                listEl.innerHTML = `
                    <div class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2"></i>
                        <p class="text-xs font-medium">검색 결과가 없습니다.</p>
                    </div>
                `;
            }
        }

        function createPlaceCard(place) {
            const card = document.createElement('div');

            card.className = "p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl shadow-xs transition cursor-pointer group hover:border-indigo-300 relative";

        function selectPlace(placeId, zoomTo = true) {
            const place = PLACES.find(p => p.id === placeId);
            if (!place) return;

            document.querySelectorAll('#placeList > div').forEach(c => {
                c.classList.remove('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
            });
            const activeCard = document.getElementById(`card_${placeId}`);
            if (activeCard) {
                activeCard.classList.add('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (activePolyline) {
                map.removeLayer(activePolyline);
            }
            activePolyline = L.polyline([
                [HOTEL.lat, HOTEL.lng],
                [place.lat, place.lng]
            ], {
                color: '#6366f1',
                weight: 4,
                opacity: 0.8,
                dashArray: '8, 8'
            }).addTo(map);

            if (markers[placeId]) {
                const marker = markers[placeId];
                if (zoomTo) {
                    map.flyToBounds([
                        [HOTEL.lat, HOTEL.lng],
                        [place.lat, place.lng]
                    ], { padding: [50, 50], maxZoom: 16, duration: 1 });
                }
                setTimeout(() => {
                    marker.openPopup();
                }, 400);
            }
        }

        // --- 5. GPS LOCATION & ADDRESS SEARCH HELPER FUNCTIONS ---
        
        // 5-1. Fetch Current GPS Location
        function fetchCurrentLocation() {
            if (!navigator.geolocation) {
                showToast('⚠️ 이 브라우저는 GPS 위치 정보를 지원하지 않습니다.');
                return;
            }

            const btn = document.getElementById('gpsFetchBtn');
            const origContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 위치 탐색 중...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);

                    document.getElementById('newPlaceLat').value = lat;
                    document.getElementById('newPlaceLng').value = lng;

                    btn.innerHTML = origContent;
                    btn.disabled = false;
                    showToast('📍 현재 위치 좌표가 자동으로 입력되었습니다!');
                },
                (error) => {
                    btn.innerHTML = origContent;
                    btn.disabled = false;
                    showToast('⚠️ 위치 권한이 거부되었거나 GPS 정보를 가져오지 못했습니다.');
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        // 5-2. Search Address & Auto Geocode with OpenStreetMap Nominatim
        async function searchAddressGeocode() {
            const query = document.getElementById('newPlaceAddressInput').value.trim();
            if (!query) {
                showToast('⚠️ 검색할 주소나 장소명을 입력해주세요.');
                return;
            }

            const searchBtn = document.getElementById('addrSearchBtn');
            const origContent = searchBtn.innerHTML;
            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            searchBtn.disabled = true;

            try {
                // Prepend Da Nang to query to focus results locally
                const searchQuery = query.toLowerCase().includes('danang') || query.toLowerCase().includes('da nang') 
                    ? query 
                    : `${query}, Da Nang, Vietnam`;

                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1`);
                const results = await response.json();

                if (results && results.length > 0) {
                    const place = results[0];
                    const lat = parseFloat(place.lat).toFixed(6);
                    const lng = parseFloat(place.lon).toFixed(6);

                    document.getElementById('newPlaceLat').value = lat;
                    document.getElementById('newPlaceLng').value = lng;

                    // Fill name if empty
                    const nameInput = document.getElementById('newPlaceName');
                    if (!nameInput.value) {
                        nameInput.value = query;
                    }

                    // Fill description/address if empty
                    const descInput = document.getElementById('newPlaceDesc');
                    if (!descInput.value) {
                        descInput.value = place.display_name.split(',').slice(0, 3).join(',');
                    }

                    showToast('✅ 주소 검색 성공! 좌표가 자동으로 설정되었습니다.');
                } else {
                    showToast('⚠️ 주소를 찾을 수 없습니다. 다낭 현지 주소나 장소명으로 시도해보세요.');
                }
            } catch (err) {
                showToast('⚠️ 주소 검색 중 네트워크 오류가 발생했습니다.');
            } finally {
                searchBtn.innerHTML = origContent;
                searchBtn.disabled = false;
            }
        }

                lat: lat,
                lng: lng,
                distanceText: dist || '직접 지정 위치',
                icon: catConfig[cat].icon,
                color: catConfig[cat].color,
                tags: tags,
                desc: desc || '사용자가 직접 등록한 장소입니다.',
                tips: tips || '',
                googleQuery: `${name} Danang`,
                isCustom: true
            };

            PLACES.push(newPlace);

            // Save to localStorage
            const customPlacesOnly = PLACES.filter(p => p.isCustom);
            saveCustomPlacesToStorage(customPlacesOnly);

            // Re-render
            renderPlaces();
            closeAddModal();
            document.getElementById('addPlaceForm').reset();

            showToast(`🎉 "${name}" 장소가 성공적으로 추가되었습니다!`);

            // Select newly added place
            selectPlace(newPlace.id, true);
        }

        function deleteCustomPlace(id, event) {
            event.stopPropagation();
            if (confirm('이 추가 장소를 삭제하시겠습니까?')) {
                if (markers[id] && map.hasLayer(markers[id])) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
                PLACES = PLACES.filter(p => p.id !== id);
                const customPlacesOnly = PLACES.filter(p => p.isCustom);
                saveCustomPlacesToStorage(customPlacesOnly);
                renderPlaces();
                showToast('🗑️ 장소가 삭제되었습니다.');
            }
        }

        // --- 7. FILTERING & UTILS ---
        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.classList.add('bg-slate-800', 'text-white');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border');
                } else {
                    btn.classList.remove('bg-slate-800', 'text-white');
                    btn.classList.add('bg-white', 'text-slate-600', 'border');
                }
            });
            renderPlaces();
        }

        function filterPlaces() {
            const val = document.getElementById('searchInput').value;
            const clearBtn = document.getElementById('clearBtn');
            if (val) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderPlaces();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterPlaces();
        }

        function resetMapView() {
            if (activePolyline) {
                map.removeLayer(activePolyline);
                activePolyline = null;
            }
            document.querySelectorAll('#placeList > div').forEach(c => {
                c.classList.remove('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
            });
            map.flyTo([16.053, 108.240], 14);
        }

        function showToast(msg) {
            const existing = document.getElementById('appToast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'appToast';
            toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-[2000] bg-slate-900/90 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl flex items-center gap-2 border border-white/20 transition backdrop-blur-md';
            toast.innerHTML = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast) toast.remove();
            }, 3500);
        }

        // --- 8. SPECIAL NIGHT COURSE HIGHLIGHT ---
        function highlightNightCourse() {
            setCategory('all');
            toggleMap(true);

            if (activePolyline) {
                map.removeLayer(activePolyline);
            }

            const vpbank = PLACES.find(p => p.id === 'p_vpbank_atm');
            const market = PLACES.find(p => p.id === 'p_sontra_market');
            const dragon = PLACES.find(p => p.id === 'p_dragon_bridge');

            const courseCoords = [
                [HOTEL.lat, HOTEL.lng],
                [vpbank.lat, vpbank.lng],
                [market.lat, market.lng],
                [dragon.lat, dragon.lng]
            ];

            activePolyline = L.polyline(courseCoords, {
                color: '#f59e0b',
                weight: 5,
                opacity: 0.9,
                dashArray: '6, 10'
            }).addTo(map);

            map.flyToBounds(courseCoords, { padding: [40, 40], duration: 1.2 });

            const alertMsg = `
                <div style="font-size: 12px; line-height: 1.5;">
                    <b style="color: #d97706;">✨ 추천 야간 풀코스 (금·토·일 강력추천)</b><br>
                    1. <b>VPBank:</b> 현금 무수수료 출금<br>
                    2. <b>손짜 야시장:</b> 해산물 야식 & 쇼핑<br>
                    3. <b>용다리:</b> 밤 9시 불쇼/물쇼 관람
                </div>
            `;
            L.popup()
                .setLatLng([market.lat, market.lng])
                .setContent(alertMsg)
                .openOn(map);
        }
    </script>
</body>
</html>
