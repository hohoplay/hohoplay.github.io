        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Map Marker Pulsing Animation for Hotel */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .hotel-pulse {
            position: absolute;
            width: 44px;
            height: 44px;
            background-color: rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            animation: pulse-ring 2s infinite ease-in-out;
            top: -6px;
            left: -6px;
            z-index: -1;
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 12px 14px;
            line-height: 1.5;
        }

        // --- 2. MAP INITIALIZATION ---
        let map;
        let markers = {};
        let activePolyline = null;
        let activeCategory = 'all';

        window.onload = function() {
            // Initialize Leaflet Map centered between hotel & Dragon Bridge
            map = L.map('map', {
                zoomControl: false
            }).setView([16.055, 108.238], 14);

            // Add Custom CartoDB Voyager Tile Layer (Clean & clear, works reliably without API keys)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>'
            }).addTo(map);

            // Add Zoom Control at top right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Render Hotel Marker
            renderHotelMarker();

            // Render Places Markers & Sidebar List
            renderPlaces();
        };

        // --- 3. MARKER GENERATORS ---
        function renderHotelMarker() {
            const hotelHtml = `
                <div class="relative flex items-center justify-center w-10 h-10 bg-amber-500 text-white rounded-full shadow-lg border-2 border-white font-bold text-base cursor-pointer">
                    <div class="hotel-pulse"></div>
                    <i class="fa-solid ${HOTEL.icon}"></i>
                </div>
            `;
            const hotelIcon = L.divIcon({
                html: hotelHtml,
                className: 'custom-hotel-pin',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            const marker = L.marker([HOTEL.lat, HOTEL.lng], { icon: hotelIcon }).addTo(map);
            
            const popupContent = `
                <div class="text-xs">
                    <div class="font-bold text-sm text-amber-600 flex items-center gap-1">
                        <i class="fa-solid fa-hotel"></i> ${HOTEL.name}
                    </div>
                    <p class="text-slate-600 mt-1 font-medium">${HOTEL.desc}</p>
                    <div class="mt-2 text-[11px] bg-amber-50 text-amber-800 p-1.5 rounded border border-amber-200">
                        💡 <b>숙소 팁:</b> ${HOTEL.details}
                    </div>
                </div>
            `;
            marker.bindPopup(popupContent);
            markers[HOTEL.id] = marker;
        }

            const listEl = document.getElementById('placeList');
            listEl.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

            PLACES.forEach(place => {
                // Category & Search filter logic
                const matchesCat = (activeCategory === 'all' || place.category === activeCategory);
                const matchesSearch = !searchTerm || 
                    place.name.toLowerCase().includes(searchTerm) || 
                    place.desc.toLowerCase().includes(searchTerm) ||
                    place.tips.toLowerCase().includes(searchTerm) ||
                    place.tags.some(t => t.toLowerCase().includes(searchTerm));

                if (matchesCat && matchesSearch) {
                    // Create Marker if not exists
                    if (!markers[place.id]) {
                        const iconHtml = `
                            <div class="flex items-center justify-center w-8 h-8 rounded-full shadow-md border-2 border-white text-white font-bold text-xs transform hover:scale-110 transition" style="background-color: ${place.color}">
                                <i class="fa-solid ${place.icon}"></i>
                            </div>
                        `;
                        const customIcon = L.divIcon({
                            html: iconHtml,
                            className: 'custom-place-pin',
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(map);
                        
                        // Popup HTML
                        const popupHtml = `
                            <div class="text-xs min-w-[200px]">
                                <div class="font-bold text-slate-800 text-sm flex items-center gap-1.5" style="color: ${place.color}">
                                    <i class="fa-solid ${place.icon}"></i> ${place.name}
                                </div>
                                <div class="text-[11px] text-slate-500 font-semibold mt-0.5">
                                    <i class="fa-solid fa-person-walking text-slate-400"></i> ${place.distanceText}
                                </div>
                                <p class="text-slate-600 mt-1.5 leading-tight">${place.desc}</p>
                                <div class="mt-2 p-1.5 bg-slate-50 text-slate-700 text-[11px] rounded border border-slate-200">
                                    <b>💡 팁:</b> ${place.tips}
                                </div>
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.googleQuery)}" target="_blank" 
                                   class="mt-2.5 block text-center py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded text-[11px]">
                                   <i class="fa-solid fa-arrow-up-right-from-square"></i> 구글지도에서 열기
                                </a>
                            </div>
                        `;
                        marker.bindPopup(popupHtml);
                        
                        marker.on('click', () => {
                            selectPlace(place.id, false);
                        });

                        markers[place.id] = marker;
                    } else {
                        // Ensure marker is visible on map
                        if (!map.hasLayer(markers[place.id])) {
                            map.addLayer(markers[place.id]);
                        }
                    }

                    // Append Sidebar Card
                    listEl.appendChild(createPlaceCard(place));
                } else {
                    // Remove marker from map if filtered out
                    if (markers[place.id] && map.hasLayer(markers[place.id])) {
                        map.removeLayer(markers[place.id]);
                    }
                }
            });

            if (listEl.children.length === 0) {
                listEl.innerHTML = `
                    <div class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2"></i>
                        <p class="text-xs font-medium">검색 결과가 없습니다.</p>
                    </div>
                `;
            }
        }

        function createPlaceCard(place) {
            const card = document.createElement('div');
            card.id = `card_${place.id}`;
            card.className = "p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl shadow-xs transition cursor-pointer group hover:border-indigo-300";
            card.onclick = () => selectPlace(place.id, true);

            const tagsHtml = place.tags.map(tag => 
                `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-medium">#${tag}</span>`
            ).join(' ');

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-xs font-bold shrink-0" style="background-color: ${place.color}">
                            <i class="fa-solid ${place.icon}"></i>
                        </span>
                        <div>
                            <h3 class="font-bold text-xs text-slate-800 group-hover:text-indigo-600 transition">${place.name}</h3>
                            <span class="text-[11px] text-slate-500 font-medium"><i class="fa-solid fa-route text-slate-400"></i> ${place.distanceText}</span>
                        </div>
                    </div>
                </div>
                <p class="text-xs text-slate-600 mt-1.5 line-clamp-2 leading-relaxed">${place.desc}</p>
                <div class="mt-2 text-[11px] text-amber-800 bg-amber-50/70 p-1.5 rounded border border-amber-200/60">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i> ${place.tips}
                </div>
                <div class="mt-2 flex items-center justify-between pt-1 border-t border-slate-100">
                    <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.googleQuery)}" target="_blank" onclick="event.stopPropagation()"
                       class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                        길찾기 <i class="fa-solid fa-chevron-right text-[9px]"></i>
                    </a>
                </div>
            `;
            return card;
        }

        function selectPlace(placeId, zoomTo = true) {
            const place = PLACES.find(p => p.id === placeId);
            if (!place) return;

            // Highlight Sidebar card
            document.querySelectorAll('#placeList > div').forEach(c => {
                c.classList.remove('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
            });
            const activeCard = document.getElementById(`card_${placeId}`);
            if (activeCard) {
                activeCard.classList.add('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Draw Dashed Route Line from Hotel to Place
            if (activePolyline) {
                map.removeLayer(activePolyline);
            }
            activePolyline = L.polyline([
                [HOTEL.lat, HOTEL.lng],
                [place.lat, place.lng]
            ], {
                color: '#6366f1',
                weight: 4,
                opacity: 0.8,
                dashArray: '8, 8'
            }).addTo(map);

            // Zoom & Open Marker Popup
            if (markers[placeId]) {
                const marker = markers[placeId];
                if (zoomTo) {
                    map.flyToBounds([
                        [HOTEL.lat, HOTEL.lng],
                        [place.lat, place.lng]
                    ], { padding: [50, 50], maxZoom: 16, duration: 1 });
                }
                setTimeout(() => {
                    marker.openPopup();
                }, 400);
            }
        }

        // --- 4. FILTERING & SEARCH CONTROL ---
        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.classList.add('bg-slate-800', 'text-white');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border');
                } else {
                    btn.classList.remove('bg-slate-800', 'text-white');
                    btn.classList.add('bg-white', 'text-slate-600', 'border');
                }
            });
            renderPlaces();
        }

        function filterPlaces() {
            const val = document.getElementById('searchInput').value;
            const clearBtn = document.getElementById('clearBtn');
            if (val) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderPlaces();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterPlaces();
        }

        function resetMapView() {
            if (activePolyline) {
                map.removeLayer(activePolyline);
                activePolyline = null;
            }
            document.querySelectorAll('#placeList > div').forEach(c => {
                c.classList.remove('border-indigo-500', 'bg-indigo-50/30', 'ring-1', 'ring-indigo-500');
            });
            map.flyTo([16.055, 108.238], 14);
        }

        // --- 5. SPECIAL NIGHT COURSE HIGHLIGHT ---
        function highlightNightCourse() {
            setCategory('all');
            
            // Draw multi-point course: Hotel -> VPBank -> Son Tra Night Market -> Dragon Bridge
            if (activePolyline) {
                map.removeLayer(activePolyline);
            }

            const vpbank = PLACES.find(p => p.id === 'p_vpbank_atm');
            const market = PLACES.find(p => p.id === 'p_sontra_market');
            const dragon = PLACES.find(p => p.id === 'p_dragon_bridge');

            const courseCoords = [
                [HOTEL.lat, HOTEL.lng],
                [vpbank.lat, vpbank.lng],
                [market.lat, market.lng],
                [dragon.lat, dragon.lng]
            ];

            activePolyline = L.polyline(courseCoords, {
                color: '#f59e0b',
                weight: 5,
                opacity: 0.9,
                dashArray: '6, 10'
            }).addTo(map);

            map.flyToBounds(courseCoords, { padding: [40, 40], duration: 1.2 });

            // Popup Info Alert
            const alertMsg = `
                <div style="font-size: 12px; line-height: 1.5;">
                    <b style="color: #d97706;">✨ 추천 야간 풀코스 (금·토·일 강력추천)</b><br>
                    1. <b>VPBank:</b> 현금 무수수료 출금<br>
                    2. <b>손짜 야시장:</b> 해산물 야식 & 쇼핑<br>
                    3. <b>용다리:</b> 밤 9시 불쇼/물쇼 관람
                </div>
            `;
            L.popup()
                .setLatLng([market.lat, market.lng])
                .setContent(alertMsg)
                .openOn(map);
        }
    </script>
</body>
</html>
