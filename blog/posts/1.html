        function applyGameNavResponsive(){
            var isWide = window.innerWidth >= 768;
            var d1 = document.getElementById('g-nav-desktop');
            var d2 = document.getElementById('g-nav-cta');
            var m1 = document.getElementById('g-nav-cta-m');
            var m2 = document.getElementById('g-nav-hamburger');
            if(d1) d1.style.display = isWide ? 'flex' : 'none';
            if(d2) d2.style.display = isWide ? 'flex' : 'none';
            if(m1) m1.style.display = isWide ? 'none' : 'flex';
            if(m2) m2.style.display = isWide ? 'none' : 'flex';
            if(isWide){
                var mm = document.getElementById('game-mobile-menu');
                if(mm) mm.style.display = 'none';
            }
        }
        applyGameNavResponsive();
        window.addEventListener('resize', applyGameNavResponsive);
        function toggleGameMenu(){
            var m = document.getElementById('game-mobile-menu');
            var b1 = document.getElementById('gbar1'), b2 = document.getElementById('gbar2'), b3 = document.getElementById('gbar3');
            var isOpen = m.style.display === 'block';
            if(!isOpen){
                m.style.display = 'block';
                b1.style.transform = 'translateY(6px) rotate(45deg)';
                b2.style.opacity = '0';
                b3.style.transform = 'translateY(-6px) rotate(-45deg)';
            } else {
                m.style.display = 'none';
                b1.style.transform = '';
                b2.style.opacity = '1';
                b3.style.transform = '';
            }
        }
    </script>

    <script>
        const COMMENTS_API = 'https://old-rain-16f7.lyh0929mm.workers.dev/comments';
        const CMT_GAME_ID = 'post-1';
        const INQUIRY_GAME_NAME = '커뮤니티 게시글';

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.innerText = str;
            return d.innerHTML;
        }
        function formatCmtTime(ts) {
            const diff = Date.now() - ts;
            const min = Math.floor(diff / 60000);
            if (min < 1) return '방금 전';
            if (min < 60) return min + '분 전';
            const hr = Math.floor(min / 60);
            if (hr < 24) return hr + '시간 전';
            const day = Math.floor(hr / 24);
            if (day < 7) return day + '일 전';
            return new Date(ts).toLocaleDateString('ko-KR');
        }
        async function loadComments() {
            const list = document.getElementById('cmt-list');
            try {
                const res = await fetch(COMMENTS_API + '?game_id=' + CMT_GAME_ID);
                const data = await res.json();
                if (!data.comments || data.comments.length === 0) {
                    list.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:20px 0">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</div>';
                    return;
                }
                list.innerHTML = data.comments.map(c => `
                    <div style="padding:12px 14px;background:#f8fafc;border-radius:12px">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                            <span style="font-weight:800;font-size:13px;color:#334155">${escapeHtml(c.nickname)}</span>
                            <span style="font-size:11px;color:#94a3b8">${formatCmtTime(c.created_at)}</span>
                        </div>
                        <div style="font-size:13px;color:#475569;line-height:1.6;white-space:pre-wrap">${escapeHtml(c.content)}</div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:20px 0">댓글을 불러오지 못했습니다.</div>';
            }
        }
        async function submitComment() {
            const nickname = document.getElementById('cmt-nickname').value.trim();
            const content = document.getElementById('cmt-content').value.trim();
            const status = document.getElementById('cmt-status');
            const btn = document.getElementById('cmt-submit');
            if (!nickname || !content) { status.textContent = '닉네임과 내용을 입력해주세요.'; return; }
            btn.disabled = true;
            status.textContent = '등록 중...';
            try {
                const res = await fetch(COMMENTS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game_id: CMT_GAME_ID, nickname, content })
                });
                const data = await res.json();
                if (!res.ok) {
                    status.textContent = data.error || '등록에 실패했습니다.';
                    btn.disabled = false;
                    return;
                }
                document.getElementById('cmt-content').value = '';
                status.textContent = '';
                btn.disabled = false;
                loadComments();
            } catch (e) {
                status.textContent = '네트워크 오류가 발생했습니다.';
                btn.disabled = false;
            }
        }
        loadComments();

        function snsShare(type) {
            const url = encodeURIComponent(location.href);
            const title = encodeURIComponent(document.title);
            const map = {
                facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + url,
                x: 'https://twitter.com/intent/tweet?url=' + url + '&text=' + title,
                naver: 'https://share.naver.com/web/shareView?url=' + url + '&title=' + title,
                band: 'https://band.us/plugin/share?body=' + title + '&route=' + url,
                line: 'https://social-plugins.line.me/lineit/share?url=' + url,
            };
            if (type === 'kakaot') {
                if (window.Kakao && Kakao.isInitialized()) {
                    Kakao.Share.sendDefault({
                        objectType: 'feed',
                        content: {
                            title: document.title,
                            description: 'ㅁ',
                            imageUrl: 'https://hohoplaylab.com/data/banner.png',
                            link: { mobileWebUrl: location.href, webUrl: location.href }
                        }
                    });
                } else {
                    navigator.clipboard.writeText(location.href);
                    alert('링크가 복사되었습니다.');
                }
                return;
            }
            window.open(map[type], '_blank', 'width=600,height=500');
        }
    </script>
